# Publishes a tagged release to GitHub Packages: Maven artifacts (pl.aiwcorpo.mcp) and the npm package
# (@aiwcorpo/mcp-contracts). Runs only on a vX.Y.Z tag; nothing is published from branches.
#
# Two jobs. build has contents: read only and runs everything that executes repository code or dependency code
# (verify-all.sh, npm ci with its install scripts, mvnw, SBOMs); it hands over finished files as an artifact. publish has
# packages: write, no checkout, no cache and no build tool on the repository: it uploads the npm tarball with
# `npm publish <tarball> --ignore-scripts` and the jars with the maven-deploy-plugin goal deploy:deploy-file (plugin from
# Maven Central, run from a directory without a pom). The mvn deploy lifecycle was rejected: it would have to run the
# build (and the plugins of the repository pom) in the job that holds the write token. The write token is in the
# environment of the publishing steps only. The artifact is data from a job that ran repository code, so publish checks its
# exact file list first, and runs mvn and npm from an empty directory with absolute paths, so that no .mvn, .npmrc or
# pom of the artifact is ever read.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tag matches versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -q "<version>$version</version>" pom.xml
      - run: ./scripts/verify-all.sh
      - name: Build the npm package and its SBOM
        run: |
          npm ci
          npm run build
          npm sbom --sbom-format cyclonedx --omit dev > sbom-npm.cdx.json
          mkdir -p out/npm
          npm pack --pack-destination out/npm
      - name: Build the Maven artifacts and their SBOM
        run: |
          ./mvnw -B -DskipTests package org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          mkdir -p out/maven
          cp pom.xml out/maven/parent.pom.xml
          for dir in java/*/; do
            module="$(basename "$dir")"
            mkdir -p "out/maven/$module"
            cp "$dir/pom.xml" "out/maven/$module/pom.xml"
            find "$dir/target" -maxdepth 1 -name "$module-*.jar" ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} "out/maven/$module/" \;
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: out
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom-npm.cdx.json
            target/bom.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      packages: write
    env:
      ARTIFACT_DIR: ${{ runner.temp }}/packages
      EMPTY_DIR: ${{ runner.temp }}/empty
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Check the artifact file list
        run: |
          version="${GITHUB_REF_NAME#v}"
          modules='mcp-contracts|mcp-cedar-entities|mcp-policy-bundle|mcp-manifest'
          cd "$ARTIFACT_DIR"
          if find . -mindepth 1 ! -type f ! -type d | grep -q .; then echo "artifact holds a non-regular file" >&2; exit 1; fi
          unexpected="$(find . -type f | sed 's|^\./||' | grep -Evx "npm/aiwcorpo-mcp-contracts-${version//./\\.}\.tgz|parent\.pom\.xml|($modules)/(pom\.xml|($modules)-${version//./\\.}\.jar|($modules)-${version//./\\.}-test-vectors\.jar)" || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f "npm/aiwcorpo-mcp-contracts-$version.tgz" -a -f parent.pom.xml
          for module in mcp-contracts mcp-cedar-entities mcp-policy-bundle mcp-manifest; do
            test -f "$module/pom.xml" -a -f "$module/$module-$version.jar"
          done
          mkdir -p "$EMPTY_DIR"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@aiwcorpo'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish npm package
        working-directory: ${{ runner.temp }}/empty
        run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com "$ARTIFACT_DIR"/npm/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Maven artifacts
        working-directory: ${{ runner.temp }}/empty
        run: |
          repo="https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
          plugin=org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file
          deploy() {
            mvn -B -s "$HOME/.m2/settings.xml" -Dmaven.multiModuleProjectDirectory="$EMPTY_DIR" "$plugin" \
              -Durl="$repo" -DrepositoryId=github "$@"
          }
          deploy -Dfile="$ARTIFACT_DIR/parent.pom.xml" -DpomFile="$ARTIFACT_DIR/parent.pom.xml"
          for dir in "$ARTIFACT_DIR"/*/; do
            module="$(basename "$dir")"
            [ "$module" = npm ] && continue
            main="$(ls "$dir$module"-[0-9]*.jar | grep -v -- '-test-vectors\.jar$')"
            vectors="$dir$module-${GITHUB_REF_NAME#v}-test-vectors.jar"
            if [ -f "$vectors" ]; then
              deploy -Dfile="$main" -DpomFile="${dir}pom.xml" -Dfiles="$vectors" -Dclassifiers=test-vectors -Dtypes=jar
            else
              deploy -Dfile="$main" -DpomFile="${dir}pom.xml"
            fi
          done
        env:
          MAVEN_OPTS: ''
          MAVEN_ARGS: ''
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
