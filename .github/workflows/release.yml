# Publishes a tagged release: the Maven artifacts (pl.aiwcorpo.mcp) to Maven Central and the npm package
# (@aiwcorpo/mcp-contracts) to npmjs.org. Runs only on a vX.Y.Z tag; nothing is published from branches.
#
# Three jobs after the build. build has contents: read only and runs everything that executes repository code or dependency
# code (verify-all.sh, npm ci with its install scripts, mvnw, SBOMs); it hands over finished files as an artifact, built without
# any cache. publish-maven (environment release) and publish-npm (environment release-npm) have no checkout, no cache, no build
# tool on the repository and no token to write to GitHub. The artifact is data from a job that ran repository code, so both check
# it first (exact file list, package.json of the tarball) and run npm from an empty directory with absolute paths, so that no
# .npmrc of the artifact is ever read. publish-maven checks everything, npm included, before it uploads anything: it signs the
# jars with gpg, verifies every signature against vars.GPG_FINGERPRINT and uploads them to the Portal with curl. Its secrets are
# in the environment of that one step.
#
# Central: the bundle is uploaded as USER_MANAGED. The Portal validates it and waits; a person looks at the deployment on
# https://central.sonatype.com/publishing/deployments and presses Publish (or Drop). Released versions are immutable, so the
# last look is deliberate. The reviewer of publish-npm approves it only after that. The Maven profile `release` does the same
# from a developer machine (README, "Releasing").
#
# Re-runs: publish-maven skips the upload when the version is already on Central (repo1.maven.org), publish-npm skips when
# `npm view` finds the version. A deployment that is VALIDATED but not yet published is invisible to the first check: drop it in
# the Portal before re-running.
#
# npm: trusted publishing (OIDC, id-token: write), no long-lived token. npmjs.org lets the trusted publisher be configured only
# for a package that already exists, so the first version needs the secret NPM_TOKEN in the environment release-npm (granular,
# publish only, scope @aiwcorpo, bypass 2FA for publishing); delete the secret once the trusted publisher is set up. Provenance
# needs a public repository. See README, "Releasing".
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: The repository must be public
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" = true ]; then
            echo "npm provenance needs a public repository: make mcp-contracts public before the first release (README, Releasing)." >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Tag matches versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -q "<version>$version</version>" pom.xml
      - run: ./scripts/verify-all.sh
      - name: Build the npm package and its SBOM
        run: |
          npm ci
          npm run build
          npm run check:package
          npm sbom --sbom-format cyclonedx --omit dev > sbom-npm.cdx.json
          mkdir -p out/npm
          npm pack --pack-destination out/npm
      - name: Build the Maven artifacts and their SBOM
        run: |
          ./mvnw -B -DskipTests -Prelease -Dgpg.skip package org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          mkdir -p out/maven
          cp pom.xml out/maven/parent.pom.xml
          for dir in java/*/; do
            module="$(basename "$dir")"
            mkdir -p "out/maven/$module"
            cp "$dir/pom.xml" "out/maven/$module/pom.xml"
            find "$dir/target" -maxdepth 1 -name "$module-*.jar" -exec cp {} "out/maven/$module/" \;
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: out
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom-npm.cdx.json
            target/bom.*
          if-no-files-found: error

  publish-maven:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Every check, npm included, runs here, before anything is sent to the Central Portal: a bad tarball must not be found
      # only after the Maven files are in a deployment that cannot be undone.
      - name: Check the artifact, the npm tarball and the npm client
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          v="${version//./\\.}"
          modules='mcp-contracts|mcp-cedar-entities|mcp-manifest'
          cd "$RUNNER_TEMP/packages"
          if find . -mindepth 1 ! -type f ! -type d | grep -q .; then echo "artifact holds a non-regular file" >&2; exit 1; fi
          unexpected="$(find . -type f | sed 's|^\./||' | grep -Evx "npm/aiwcorpo-mcp-contracts-$v\.tgz|maven/parent\.pom\.xml|maven/($modules)/(pom\.xml|($modules)-$v(-sources|-javadoc)?\.jar)|maven/mcp-contracts/mcp-contracts-$v-test-vectors\.jar" || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f "npm/aiwcorpo-mcp-contracts-$version.tgz" -a -f maven/parent.pom.xml
          for module in mcp-contracts mcp-cedar-entities mcp-manifest; do
            for file in pom.xml "$module-$version.jar" "$module-$version-sources.jar" "$module-$version-javadoc.jar"; do
              test -f "maven/$module/$file"
            done
          done
          test -f "maven/mcp-contracts/mcp-contracts-$version-test-vectors.jar"
          tar -xzOf "npm/aiwcorpo-mcp-contracts-$version.tgz" package/package.json \
            | jq -e --arg v "$version" '
                .name == "@aiwcorpo/mcp-contracts" and .version == $v
                and .publishConfig.registry == "https://registry.npmjs.org/"
                and ([(.scripts // {}) | keys[] | select(test("^(preinstall|install|postinstall|prepublish|preprepare|prepare|postprepare|prepublishOnly|prepack|postpack|publish|postpublish)$"))] | length == 0)' > /dev/null \
            || { echo "package.json in the tarball does not match the tag, the registry or the lifecycle rules" >&2; exit 1; }
          # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships 11.x.
          npm_version="$(npm --version)"
          test "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n 1)" = 11.5.1
      # The Portal API has no lookup by coordinates, so a re-run asks Central itself.
      - name: Is this version already on Central
        id: central
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://repo1.maven.org/maven2/pl/aiwcorpo/mcp/mcp-contracts-parent/$version/mcp-contracts-parent-$version.pom"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "$url")"
          case "$code" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "$version is already on Central, the upload is skipped" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected HTTP $code from $url" >&2; exit 1 ;;
          esac
      - name: Upload the Maven artifacts to the Central Portal
        if: steps.central.outputs.published != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifacts="$RUNNER_TEMP/packages/maven"
          group_path=pl/aiwcorpo/mcp
          bundle="$RUNNER_TEMP/bundle"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          # Imported into a private home of this job; the passphrase goes to gpg through a file, never through argv.
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          # The key that signs must be the one whose fingerprint is published in SECURITY.md and kept in the repository variable.
          expected="$(printf '%s' "$GPG_FINGERPRINT" | tr -d ' ' | tr '[:lower:]' '[:upper:]')"
          test -n "$expected"
          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          if [ "$fingerprint" != "$expected" ]; then
            echo "the imported signing key ($fingerprint) is not the key in vars.GPG_FINGERPRINT" >&2
            exit 1
          fi

          # Central wants, for every file: .asc (signature), .md5 and .sha1 (hex digest only).
          add() {
            local source="$1" artifact="$2" name="$3" dir="$bundle/$group_path/$2/$version"
            mkdir -p "$dir"
            cp "$source" "$dir/$name"
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
              --local-user "$fingerprint" --armor --detach-sign --output "$dir/$name.asc" "$dir/$name"
            gpg --batch --status-fd 1 --verify "$dir/$name.asc" "$dir/$name" 2>/dev/null \
              | awk -v fp="$fingerprint" '$2 == "VALIDSIG" && ($3 == fp || $NF == fp) { ok = 1 } END { exit !ok }' \
              || { echo "signature of $name does not verify against $fingerprint" >&2; exit 1; }
            md5sum "$dir/$name" | cut -d' ' -f1 > "$dir/$name.md5"
            sha1sum "$dir/$name" | cut -d' ' -f1 > "$dir/$name.sha1"
            sha256sum "$dir/$name" | cut -d' ' -f1 > "$dir/$name.sha256"
          }
          add "$artifacts/parent.pom.xml" mcp-contracts-parent "mcp-contracts-parent-$version.pom"
          for module in mcp-contracts mcp-cedar-entities mcp-manifest; do
            add "$artifacts/$module/pom.xml" "$module" "$module-$version.pom"
            for suffix in '' -sources -javadoc; do
              add "$artifacts/$module/$module-$version$suffix.jar" "$module" "$module-$version$suffix.jar"
            done
          done
          add "$artifacts/mcp-contracts/mcp-contracts-$version-test-vectors.jar" mcp-contracts "mcp-contracts-$version-test-vectors.jar"
          rm -f "$GNUPGHOME/passphrase"
          (cd "$bundle" && zip -qr "$RUNNER_TEMP/central-bundle.zip" pl)

          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_TOKEN" | base64 -w0)"
          echo "::add-mask::$token"
          portal=https://central.sonatype.com/api/v1/publisher
          # The curl configuration comes from stdin, so the token is not in the argument list. On an HTTP error the body of the
          # answer is printed: it says what the Portal rejected and holds no credential.
          portal_call() {
            local code
            code="$(printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl -sS -K - -o "$RUNNER_TEMP/portal.out" -w '%{http_code}' "$@")" || { echo "curl failed" >&2; return 1; }
            case "$code" in
              2??) cat "$RUNNER_TEMP/portal.out" ;;
              *) echo "Central answered HTTP $code:" >&2; cat "$RUNNER_TEMP/portal.out" >&2; echo >&2; return 1 ;;
            esac
          }
          id="$(portal_call -X POST -F "bundle=@$RUNNER_TEMP/central-bundle.zip" \
                "$portal/upload?name=mcp-contracts-$version&publishingType=USER_MANAGED")"
          echo "Central deployment id: $id"
          state=""
          for attempt in $(seq 1 40); do
            status="$(portal_call -X POST "$portal/status?id=$id")"
            state="$(printf '%s' "$status" | jq -r '.deploymentState')"
            echo "deployment state: $state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) break ;;
              FAILED) printf '%s\n' "$status" | jq '.errors' >&2; exit 1 ;;
            esac
            sleep 15
          done
          case "$state" in
            VALIDATED|PUBLISHING|PUBLISHED) ;;
            *) echo "deployment $id is still $state after waiting; check https://central.sonatype.com/publishing/deployments" >&2; exit 1 ;;
          esac
          if [ "$state" = VALIDATED ]; then
            echo "Validated. Publish or drop the deployment at https://central.sonatype.com/publishing/deployments"
            echo "Approve the publish-npm job only after the deployment shows as published."
          fi

  # Own job and own environment: its reviewer approves it after pressing Publish in the Central Portal, so the npm package
  # never appears for a Maven release that was dropped.
  publish-npm:
    needs: publish-maven
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check the tarball
        id: tarball
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="$RUNNER_TEMP/packages/npm/aiwcorpo-mcp-contracts-$version.tgz"
          test -f "$tarball"
          test "$(find "$RUNNER_TEMP/packages/npm" -type f | wc -l)" = 1
          tar -xzOf "$tarball" package/package.json \
            | jq -e --arg v "$version" '
                .name == "@aiwcorpo/mcp-contracts" and .version == $v
                and .publishConfig.registry == "https://registry.npmjs.org/"
                and ([(.scripts // {}) | keys[] | select(test("^(preinstall|install|postinstall|prepublish|preprepare|prepare|postprepare|prepublishOnly|prepack|postpack|publish|postpublish)$"))] | length == 0)' > /dev/null \
            || { echo "package.json in the tarball does not match the tag, the registry or the lifecycle rules" >&2; exit 1; }
          npm_version="$(npm --version)"
          test "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n 1)" = 11.5.1
          echo "path=$tarball" >> "$GITHUB_OUTPUT"
      - name: Is this version already on npm
        id: npm
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p empty
          cd empty
          version="${GITHUB_REF_NAME#v}"
          if out="$(npm view "@aiwcorpo/mcp-contracts@$version" version --registry https://registry.npmjs.org/ 2>&1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$version is already on npm ($out), the publish is skipped"
          elif printf '%s' "$out" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
      - name: Publish the npm package
        if: steps.npm.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/empty
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Only for the first version: a granular token (publish, @aiwcorpo, bypass 2FA). The .npmrc is written here, in the
          # empty directory, and reads the token from the environment; without NPM_TOKEN npm uses the OIDC identity of the job.
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          fi
          npm publish --ignore-scripts --provenance --access public "$TARBALL"
