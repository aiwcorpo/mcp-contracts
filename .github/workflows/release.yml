# Publishes a tagged release: the Maven artifacts (pl.aiwcorpo.mcp) to Maven Central and the npm package
# (@aiwcorpo/mcp-contracts) to npmjs.org. Runs only on a vX.Y.Z tag; nothing is published from branches.
#
# Two jobs. build has contents: read only and runs everything that executes repository code or dependency code
# (verify-all.sh, npm ci with its install scripts, mvnw, SBOMs); it hands over finished files as an artifact. publish has
# no checkout, no cache and no build tool on the repository, and no token to write to GitHub: it signs the jars with gpg,
# uploads them to the Central Portal with curl, and runs `npm publish <tarball> --ignore-scripts --provenance`. The
# artifact is data from a job that ran repository code, so publish checks its exact file list first, and runs npm from an
# empty directory with absolute paths, so that no .npmrc of the artifact is ever read. The signing key, the Portal token and
# the optional npm token are in the environment of the steps that use them only.
#
# Central: the bundle is uploaded as USER_MANAGED. The Portal validates it and waits; a person looks at the deployment on
# https://central.sonatype.com/publishing/deployments and presses Publish (or Drop). Released versions are immutable, so the
# last look is deliberate. The Maven profile `release` does the same from a developer machine (README, "Releasing").
#
# npm: trusted publishing (OIDC, id-token: write), no long-lived token. npmjs.org lets the trusted publisher be configured only
# for a package that already exists, so the first version needs the secret NPM_TOKEN (granular, publish only, scope
# @aiwcorpo); delete the secret once the trusted publisher is set up. See README, "Releasing".
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tag matches versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -q "<version>$version</version>" pom.xml
      - run: ./scripts/verify-all.sh
      - name: Build the npm package and its SBOM
        run: |
          npm ci
          npm run build
          npm run check:package
          npm sbom --sbom-format cyclonedx --omit dev > sbom-npm.cdx.json
          mkdir -p out/npm
          npm pack --pack-destination out/npm
      - name: Build the Maven artifacts and their SBOM
        run: |
          ./mvnw -B -DskipTests -Prelease -Dgpg.skip package org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          mkdir -p out/maven
          cp pom.xml out/maven/parent.pom.xml
          for dir in java/*/; do
            module="$(basename "$dir")"
            mkdir -p "out/maven/$module"
            cp "$dir/pom.xml" "out/maven/$module/pom.xml"
            find "$dir/target" -maxdepth 1 -name "$module-*.jar" -exec cp {} "out/maven/$module/" \;
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: out
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom-npm.cdx.json
            target/bom.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write
    env:
      ARTIFACT_DIR: ${{ runner.temp }}/packages
      EMPTY_DIR: ${{ runner.temp }}/empty
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Check the artifact file list
        run: |
          version="${GITHUB_REF_NAME#v}"
          v="${version//./\\.}"
          modules='mcp-contracts|mcp-cedar-entities|mcp-policy-bundle|mcp-manifest'
          cd "$ARTIFACT_DIR"
          if find . -mindepth 1 ! -type f ! -type d | grep -q .; then echo "artifact holds a non-regular file" >&2; exit 1; fi
          unexpected="$(find . -type f | sed 's|^\./||' | grep -Evx "npm/aiwcorpo-mcp-contracts-$v\.tgz|parent\.pom\.xml|($modules)/(pom\.xml|($modules)-$v(-sources|-javadoc)?\.jar)|mcp-contracts/mcp-contracts-$v-test-vectors\.jar" || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f "npm/aiwcorpo-mcp-contracts-$version.tgz" -a -f parent.pom.xml
          for module in mcp-contracts mcp-cedar-entities mcp-policy-bundle mcp-manifest; do
            for file in pom.xml "$module-$version.jar" "$module-$version-sources.jar" "$module-$version-javadoc.jar"; do
              test -f "$module/$file"
            done
          done
          test -f "mcp-contracts/mcp-contracts-$version-test-vectors.jar"
          mkdir -p "$EMPTY_DIR"
      - name: Upload the Maven artifacts to the Central Portal
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          group_path=pl/aiwcorpo/mcp
          bundle="$RUNNER_TEMP/bundle"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          # Imported into a private home of this job; the passphrase goes to gpg through a file, never through argv.
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          test -n "$fingerprint"

          # Central wants, for every file: .asc (signature), .md5 and .sha1 (hex digest only).
          add() {
            local source="$1" artifact="$2" name="$3" dir="$bundle/$group_path/$2/$version"
            mkdir -p "$dir"
            cp "$source" "$dir/$name"
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
              --local-user "$fingerprint" --armor --detach-sign --output "$dir/$name.asc" "$dir/$name"
            md5sum "$dir/$name" | cut -d' ' -f1 > "$dir/$name.md5"
            sha1sum "$dir/$name" | cut -d' ' -f1 > "$dir/$name.sha1"
            sha256sum "$dir/$name" | cut -d' ' -f1 > "$dir/$name.sha256"
          }
          add "$ARTIFACT_DIR/parent.pom.xml" mcp-contracts-parent "mcp-contracts-parent-$version.pom"
          for module in mcp-contracts mcp-cedar-entities mcp-policy-bundle mcp-manifest; do
            add "$ARTIFACT_DIR/$module/pom.xml" "$module" "$module-$version.pom"
            for suffix in '' -sources -javadoc; do
              add "$ARTIFACT_DIR/$module/$module-$version$suffix.jar" "$module" "$module-$version$suffix.jar"
            done
          done
          add "$ARTIFACT_DIR/mcp-contracts/mcp-contracts-$version-test-vectors.jar" mcp-contracts "mcp-contracts-$version-test-vectors.jar"
          rm -f "$GNUPGHOME/passphrase"
          (cd "$bundle" && zip -qr "$RUNNER_TEMP/central-bundle.zip" pl)

          # The curl configuration comes from stdin, so the token is not in the argument list.
          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_TOKEN" | base64 -w0)"
          echo "::add-mask::$token"
          portal=https://central.sonatype.com/api/v1/publisher
          id="$(printf 'header = "Authorization: Bearer %s"\n' "$token" \
            | curl --fail-with-body -sS -K - -X POST -F "bundle=@$RUNNER_TEMP/central-bundle.zip" \
                "$portal/upload?name=mcp-contracts-$version&publishingType=USER_MANAGED")"
          echo "Central deployment id: $id"
          for attempt in $(seq 1 40); do
            status="$(printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --fail-with-body -sS -K - -X POST "$portal/status?id=$id")"
            state="$(printf '%s' "$status" | jq -r '.deploymentState')"
            echo "deployment state: $state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) break ;;
              FAILED) printf '%s\n' "$status" | jq '.errors' >&2; exit 1 ;;
            esac
            sleep 15
          done
          if [ "$state" = VALIDATED ]; then
            echo "Validated. Publish or drop the deployment at https://central.sonatype.com/publishing/deployments"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Publish the npm package
        working-directory: ${{ runner.temp }}/empty
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships 11.x.
          npm_version="$(npm --version)"
          test "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n 1)" = 11.5.1
          # Only for the first version: a granular token (publish, @aiwcorpo). The .npmrc is written here, in the empty
          # directory, and reads the token from the environment; without NPM_TOKEN npm uses the OIDC identity of the job.
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          fi
          npm publish --ignore-scripts --provenance --access public "$ARTIFACT_DIR"/npm/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
