openapi: 3.1.0
info:
  title: MCP Credential Broker API
  version: 1.1.0
  summary: Contract C4 of the MCP platform.
  description: |
    Internal API of the credential broker. Callers and their authentication:

    - gateway: mTLS with client certificate CN=mcp-gateway and an internal JWT (C2) with
      aud=mcp-credential-broker; `sub` is taken from the JWT.
    - portal BFF: mTLS with CN=mcp-portal-bff and the user's token exchanged in the IdP for
      aud=mcp-credential-broker; `sub` is taken from that token. The BFF cannot name another `sub`.
    - offboarding (IGA/HR webhook): mTLS with CN=mcp-offboarding only.

    Secret values leave the broker only in the body of `POST /v1/credentials/resolve` to the gateway.
    No other endpoint returns them. After DELETE, purge or a revoked credential the broker publishes
    `credential.invalidated` (schemas/credential-invalidated-event.schema.json).

    Error bodies for statuses not described in C4 use the generic `Error` shape (CC-012).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://mcp-credential-broker.internal:8443
    description: Internal endpoint (TLS, mTLS required).
tags:
  - name: credentials
    description: Credential resolution for the gateway.
  - name: connections
    description: Connections of the current user, used by the portal BFF.
  - name: admin
    description: Offboarding.
  - name: systems
    description: Configured target systems.
paths:
  /v1/credentials/resolve:
    post:
      tags: [credentials]
      operationId: resolveCredential
      x-allowed-client-cn: [mcp-gateway]
      summary: Resolve the credential of the calling user for a system.
      description: |
        Caller: gateway only. `subjectToken` is the user's token already exchanged by the gateway (RFC 8693)
        for aud=mcp-credential-broker, required only for systems configured as `token-exchange`.
        The raw C1 token is never accepted. `value` appears only in this response; the gateway may cache it
        in memory for at most `cacheTtlSeconds`.
      security:
        - mtls: []
          gatewayInternalJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
            examples:
              jira:
                value:
                  system: jira
              gitlab_with_scopes:
                value:
                  system: gitlab
                  scopes: [read_api]
      responses:
        '200':
          description: Credential for the X-MCP-Credential header (C3).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedCredential'
              examples:
                user_secret:
                  summary: Jira PAT stored by the user
                  value:
                    scheme: Bearer
                    value: test-only-jira-pat-0000000000000000
                    type: user-secret
                    expiresAt: '2027-01-31T00:00:00Z'
                    cacheTtlSeconds: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The user has no usable connection for the system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRequired'
              examples:
                credential_required:
                  value:
                    error: credential_required
                    system: jira
                    connectUrl: https://mcp-portal.internal/connections?system=jira
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Connections of the current user, without secret values.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Connections of the user identified by the token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
              examples:
                two_connections:
                  value:
                    - system: jira
                      type: user-secret
                      status: connected
                      backendUser: jkowalski
                      expiresAt: '2027-01-31T00:00:00Z'
                      connectedAt: '2026-10-01T08:00:00Z'
                      lastUsedAt: '2026-10-26T19:58:00Z'
                    - system: gitlab
                      type: user-oauth
                      status: expiring
                      backendUser: jkowalski
                      expiresAt: '2026-10-30T08:00:00Z'
                      connectedAt: '2026-09-30T08:00:00Z'
                      lastUsedAt: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/connections/{system}/oauth/start:
    parameters:
      - $ref: '#/components/parameters/System'
    post:
      tags: [connections]
      operationId: startOAuth
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Start an OAuth authorization flow to the system for the current user.
      description: |
        The broker keeps `state`, the PKCE verifier and `sub` under `flowId`. The provider's `redirect_uri`
        is the BFF callback `GET /api/v1/oauth/callback` (C12). `returnPath` must be a relative path of the portal.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStartRequest'
            examples:
              catalog:
                value:
                  returnPath: /catalog
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: URL to which the browser is redirected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartResponse'
              examples:
                gitlab:
                  value:
                    authorizeUrl: https://gitlab.internal/oauth/authorize?client_id=mcp-broker&response_type=code&state=st-7Q2xk9&code_challenge=Zx8-test&code_challenge_method=S256&redirect_uri=https%3A%2F%2Fmcp-portal.internal%2Fapi%2Fv1%2Foauth%2Fcallback
                    flowId: flow-01J9Z3T6Y2K4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/connections/{system}/oauth/complete:
    parameters:
      - $ref: '#/components/parameters/System'
    post:
      tags: [connections]
      operationId: completeOAuth
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Finish the OAuth flow, verify the backend identity and store the token.
      description: |
        The broker checks that `sub` of the BFF token equals `sub` of the flow and that `state` matches,
        exchanges the code, calls the system's whoami (C4.1) and compares the identity with the SSO user.
        On mismatch nothing is stored.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCompleteRequest'
            examples:
              callback:
                value:
                  flowId: flow-01J9Z3T6Y2K4
                  code: test-authorization-code
                  state: st-7Q2xk9
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Connection stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCompleteResponse'
              examples:
                connected:
                  value:
                    status: connected
                    backendUser: jkowalski
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Identity mismatch or invalid/expired flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCompleteError'
              examples:
                identity_mismatch:
                  value:
                    error: identity_mismatch
                flow_invalid:
                  value:
                    error: flow_invalid
  /v1/connections/{system}/secret:
    parameters:
      - $ref: '#/components/parameters/System'
    put:
      tags: [connections]
      operationId: putSecret
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Store a PAT / password / API key of the current user after validating it in the system.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSecretRequest'
            examples:
              jira_pat:
                value:
                  secret: test-only-jira-pat-0000000000000000
                  expiresAt: '2027-01-31T00:00:00Z'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Secret validated with whoami (C4.1) and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSecretResponse'
              examples:
                connected:
                  value:
                    status: connected
                    backendUser: jkowalski
                    expiresAt: '2027-01-31T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: The system rejected the secret or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSecretError'
              examples:
                secret_invalid:
                  value:
                    error: secret_invalid
                identity_mismatch:
                  value:
                    error: identity_mismatch
  /v1/connections/{system}:
    parameters:
      - $ref: '#/components/parameters/System'
    delete:
      tags: [connections]
      operationId: deleteConnection
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Disconnect the system for the current user and revoke the token at the provider when possible.
      description: Idempotent. Publishes credential.invalidated for (sub, system).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Disconnected (or there was nothing to disconnect).
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/admin/users/{sub}/purge:
    post:
      tags: [admin]
      operationId: purgeUser
      x-allowed-client-cn: [mcp-offboarding]
      summary: Remove all connections of a user (offboarding).
      description: |
        Caller: IGA/HR webhook with mTLS CN=mcp-offboarding, no bearer token. Idempotent. Publishes
        credential.invalidated for every removed (sub, system).
      security:
        - mtls: []
      parameters:
        - name: sub
          in: path
          required: true
          description: '`sub` of the user from the IdP (C1).'
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
      responses:
        '204':
          description: All connections removed (or none existed).
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/systems:
    get:
      tags: [systems]
      operationId: listSystems
      x-allowed-client-cn: [mcp-gateway, mcp-portal-bff]
      summary: Target systems configured in the broker.
      description: The only operation that accepts the service variant of the internal JWT (gateway start-up, CC-030).
      security:
        - mtls: []
          gatewayInternalJwt: []
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Systems and their credential types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemInfo'
              examples:
                all:
                  value:
                    - system: jira
                      supportedTypes: [user-oauth, user-secret]
                      defaultType: user-secret
                      oauthScopes: []
                    - system: confluence
                      supportedTypes: [user-oauth, user-secret]
                      defaultType: user-secret
                      oauthScopes: []
                    - system: gitlab
                      supportedTypes: [user-oauth, user-secret]
                      defaultType: user-oauth
                      oauthScopes: [read_api, api]
                    - system: servicedesk
                      supportedTypes: [service-account]
                      defaultType: service-account
                      oauthScopes: []
                    - system: opensearch
                      supportedTypes: [token-exchange]
                      defaultType: token-exchange
                      oauthScopes: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate from the internal CA. Allowed CNs per operation are listed in the operation extension x-allowed-client-cn; any other CN gets 403.
    gatewayInternalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal JWT (C2, schemas/internal-jwt.schema.json) with aud=mcp-credential-broker; client certificate CN=mcp-gateway. User variant everywhere; the service variant (no user) is accepted only by GET /v1/systems (CC-030).
    bffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User token exchanged in the IdP (RFC 8693) for aud=mcp-credential-broker; client certificate CN=mcp-portal-bff.
  parameters:
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/SystemId'
      example: jira
  headers:
    NoStore:
      description: Required on every response carrying a secret; intermediaries and clients must not cache it.
      required: true
      schema:
        type: string
        const: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      description: Missing or invalid token or client certificate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    Forbidden:
      description: Authenticated caller that is not allowed to use this operation (wrong certificate CN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error: forbidden
    UpstreamUnavailable:
      description: Secret store, IdP or the target system is unavailable. The gateway maps this to upstream_unavailable (C10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            upstream_unavailable:
              value:
                error: upstream_unavailable
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C4 does not define.
      required: [error]
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    ResolveRequest:
      type: object
      required: [system]
      properties:
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        scopes:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        subjectToken:
          type: string
          description: User token exchanged by the gateway for aud=mcp-credential-broker; only for token-exchange systems.
          minLength: 1
      additionalProperties: false
    ResolvedCredential:
      type: object
      required: [scheme, value, type, expiresAt, cacheTtlSeconds]
      properties:
        scheme:
          $ref: '../schemas/common.schema.json#/$defs/CredentialScheme'
        value:
          type: string
          minLength: 1
          description: Secret value placed after the scheme in X-MCP-Credential. Never logged.
        type:
          $ref: '../schemas/common.schema.json#/$defs/CredentialType'
        expiresAt:
          description: Expiry of the credential; null when the system does not report one.
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/Timestamp'
            - type: 'null'
        cacheTtlSeconds:
          type: integer
          minimum: 0
          maximum: 60
      additionalProperties: false
    CredentialRequired:
      type: object
      required: [error, system, connectUrl]
      properties:
        error:
          const: credential_required
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        connectUrl:
          type: string
          format: uri
          description: Portal page where the user connects the account.
      additionalProperties: false
    ConnectionStatus:
      type: string
      description: expiring = expires in less than 7 days.
      enum: [connected, expiring, expired, revoked, error]
    Connection:
      type: object
      required: [system, type, status, backendUser, expiresAt, connectedAt, lastUsedAt]
      properties:
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        type:
          $ref: '../schemas/common.schema.json#/$defs/CredentialType'
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        backendUser:
          type: string
          description: User name in the target system confirmed by whoami (C4.1).
        expiresAt:
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/Timestamp'
            - type: 'null'
        connectedAt:
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        lastUsedAt:
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/Timestamp'
            - type: 'null'
      additionalProperties: false
    OAuthStartRequest:
      type: object
      required: [returnPath]
      properties:
        returnPath:
          $ref: '#/components/schemas/ReturnPath'
      additionalProperties: false
    ReturnPath:
      type: string
      description: Relative path inside the portal, optionally with a query. No percent-encoding at all (portal paths do not need it), no backslash, no absolute or protocol-relative URL, so no number of decoding passes can turn it into //host (open redirect, CC-032). The BFF redirects only to the validated value as is, without decoding it.
      pattern: '^/(?!/)[A-Za-z0-9._~!$&''()*+,;=:@/?-]*$'
      maxLength: 512
    OAuthStartResponse:
      type: object
      required: [authorizeUrl, flowId]
      properties:
        authorizeUrl:
          type: string
          format: uri
        flowId:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    OAuthCompleteRequest:
      type: object
      required: [flowId, code, state]
      properties:
        flowId:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
      additionalProperties: false
    OAuthCompleteResponse:
      type: object
      required: [status, backendUser]
      properties:
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        backendUser:
          type: string
      additionalProperties: false
    OAuthCompleteError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [identity_mismatch, flow_invalid]
      additionalProperties: false
    PutSecretRequest:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        expiresAt:
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
      additionalProperties: false
    PutSecretResponse:
      type: object
      required: [status, backendUser, expiresAt]
      properties:
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        backendUser:
          type: string
        expiresAt:
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/Timestamp'
            - type: 'null'
      additionalProperties: false
    PutSecretError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [secret_invalid, identity_mismatch]
      additionalProperties: false
    SystemInfo:
      type: object
      required: [system, supportedTypes, defaultType, oauthScopes]
      properties:
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        supportedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/CredentialType'
        defaultType:
          $ref: '../schemas/common.schema.json#/$defs/CredentialType'
        oauthScopes:
          type: array
          uniqueItems: true
          items:
            type: string
      additionalProperties: false
