# Generated by scripts/bundle-openapi.mjs from openapi/mcp-server.v1.yaml. Do not edit.
openapi: 3.1.0
info:
  title: MCP Server Interface
  version: 7.0.0
  summary: Contract C14 of the MCP platform (what every MCP server serves to the gateway, and the public key set of the gateway).
  description: |
    The gateway connects to every MCP server; a server connects to nothing of the platform except the public key set of the
    gateway (CC-249). There is no client certificate on either side, no certificate of the internal CA for a server and no
    token that an operator has to create.

    **Who calls what.** The gateway calls `GET /.well-known/mcp-manifest` and `POST /.well-known/mcp-policy-data` on every
    server, next to the MCP endpoint itself (`internalUrl`, speaking MCP). The server fetches `GET /.well-known/mcp-jwks.json`
    from the gateway, at the public address of the platform (`MCP_GATEWAY_JWKS_URI`, `https://<domain>/.well-known/mcp-jwks.json`).
    The well-known paths are at the origin (scheme, host and port) of `internalUrl`, not under its path: one origin is one server (one
    `serverId`), so a process that serves several systems needs one origin for each.

    **Transport.** HTTPS with any certificate (a CA certificate, the self-signed certificate that the starter generates at its first start,
    or the certificate of the author), or `http` inside the Docker network of the platform when the administrator allowed it
    (`allowPlainHttp`, C5). How the gateway decides to trust the certificate (`ca`, `pinned`, `plain`) is described in C5, "The gateway connects to
    servers". The server asks for no client certificate.

    **Authentication.** Every path of the server except a minimal health check (not part of this contract) needs `Authorization: Bearer <internal JWT>` of
    the right purpose (C2, `schemas/internal-jwt.schema.json`): ES256 signature against the JWKS of the gateway, `iss`, `aud` equal to the
    `serverId` of the receiver (one exception, below), `exp` within 30 s of the clock and `exp - iat` at most 60 s, a `jti` not seen within its validity window
    (each request has a new token), and `rid` equal to the `X-Request-Id` header. **The purpose is the claim `use`**, and the receiver refuses a token
    whose purpose is not the one of the endpoint (`401`, reason `wrong_purpose`), whatever else is valid:

    | Endpoint | `use` | JWT variant |
    | --- | --- | --- |
    | `GET /.well-known/mcp-manifest` | `manifest` | service (no user, no tool) |
    | `POST /.well-known/mcp-policy-data` | `policy-data` | service |
    | the MCP endpoint (`initialize`, `server/discover`, `tools/list`, `ping`, `tools/call`, streams, notifications) | `call` | as in C2 |

    A token of one purpose is never accepted for another: a `call` token cannot read the manifest or replace policy data, and a `manifest`
    or `policy-data` token cannot call a tool. Test vectors: `test-vectors/jwt/purpose-*`.

    **Audience at add time.** The `serverId` is derived from the manifest, so it is unknown when the gateway reads the manifest for the first time
    (the add operation of C5). The token of that probe carries `aud: mcp-pending`. A server accepts `mcp-pending` ONLY for `use: manifest` and ONLY on
    `GET /.well-known/mcp-manifest`; every other purpose and path (`policy-data`, every `call`) requires `aud` equal to its own `serverId`, and a token
    with `aud: mcp-pending` presented there is `401` `wrong_audience`. Test vectors: `test-vectors/jwt/valid-service-manifest-pending-audience` and
    `test-vectors/jwt/pending-audience-*`.

    **How the gateway connects.** For every connection the gateway resolves the host once, judges every resolved address (README, "Connecting a server") and
    connects only to an address it judged, never resolving the name again for that connection. Over TLS it keeps the original name for SNI and hostname
    verification; over plain `http` it connects to the IP literal, so the `Host` header of the request carries the IP, not the name. A server must therefore
    not depend on the `Host` header, and a self-signed certificate is not matched against any `Host` by the server.

    **The gate of policy data (fail-closed).** A server evaluates a `tools/call` only with policy data that is at least as new as `prv` of the token
    and only when its own policies are the approved ones (README, "Policy data gate"). Which refusal the server returns:

    - the server holds no policy data, or `prv` is greater than the `revision` it holds: `409` with the body `PolicyDataStale`
      (`error: policy_data_stale`), before the tool is executed and before anything else is done with the request. The gateway reacts by
      pushing its current policy data (`POST /.well-known/mcp-policy-data`) and repeating the `tools/call` **once** with a new token (new `jti`).
      If the second answer is again `409`, or the push fails, the client gets `upstream_unavailable` (C10); there is no third attempt.
    - the data is current but the server refuses to evaluate (`policies_not_approved`, `policies_differ`, `overrides_invalid`):
      the MCP answer is `upstream_unavailable` (C10); the gateway does not push and does not repeat.

    The gateway also pushes after every change of the revision and periodically (at most every 60 s, an upper bound; an unreachable server may be retried sooner), so `409` is the exception: a server
    that was restarted, or one that missed a push. A server never accepts a revision lower than or equal to the one it holds as new data.
    Reference rule and vectors: `scripts/lib/policy-data-gate.mjs`, `test-vectors/policy-data-gate`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{host}:{port}
    description: An MCP server, at the origin of its internalUrl.
    variables:
      host:
        default: mcp-jira.corp.local
      port:
        default: "8443"
tags:
  - name: server
  - name: gateway
paths:
  /.well-known/mcp-manifest:
    get:
      tags:
        - server
      operationId: getServerManifest
      summary: The manifest of the server (called by the gateway).
      description: |
        The C6 document (`schemas/server-manifest.schema.json`) that the starter builds from the code of the server: its tools with their definitions and
        hashes, its policies and resource types, its credential types. It is the same document that the build writes to `target/mcp-manifest.json`.
        The gateway pulls it when a server is added, on a refresh requested by an administrator and in its runtime loop; it recomputes every
        hash, never trusts the declared ones and approves nothing by pulling (C5, "Manifest intake"). The answer is the same for every caller
        and carries no secret, but only the gateway may read it: the purpose of the token is `manifest`.
        `Cache-Control: no-store`.
      security:
        - gatewayJwt: []
      responses:
        "200":
          description: The manifest.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerManifest"
              examples:
                jira:
                  value:
                    serverId: mcp-jira
                    version: 1.4.0
                    system: jira
                    internalUrl: https://mcp-jira.corp.local:8443/mcp
                    credential:
                      required: true
                      acceptedTypes:
                        - user-oauth
                        - user-secret
                    resourceTypes:
                      - type: Jira::Project
                        attributes:
                          - key
                          - category
                        idPattern: ^[A-Z][A-Z0-9_]{1,9}$
                        scopePattern: ^[A-Z][A-Z0-9_]{1,9}$
                        earlyScopeCheck: true
                        classification:
                          attribute: category
                          kind: string
                          required: true
                      - type: Jira::Issue
                        attributes:
                          - key
                        parent: Jira::Project
                        parentAttribute: project
                        idPattern: ^[A-Z][A-Z0-9_]{1,9}-[1-9][0-9]{0,9}$
                    policies:
                      namespace: Jira
                      schema: |
                        namespace Jira {
                          entity Project { key: String, category: String, scopes: Set<ResourceScope> };
                          entity Issue in [Project] { key: String, project: Project, scopes: Set<ResourceScope> };
                          action "read", "update" appliesTo { principal: [User], resource: [Project, Issue], context: RequestContext };
                        }
                      files:
                        - name: read.cedar
                          text: |
                            @id("jira-read")
                            permit (principal in UserGroup::"mcp-jira-read", action == Jira::Action::"read", resource);
                    policiesHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
                    tools:
                      - name: get_issue
                        risk: READ_ONLY
                        action: read
                        resourceRefs:
                          - argument: issueKey
                            type: Jira::Issue
                        definition:
                          name: get_issue
                          title: Get issue
                          description: Returns one Jira issue by key.
                          inputSchema:
                            type: object
                            properties:
                              issueKey:
                                type: string
                                description: Issue key, e.g. ABC-123
                                pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                maxLength: 32
                            required:
                              - issueKey
                            additionalProperties: false
                          annotations:
                            readOnlyHint: true
                        definitionHash: sha256:3b556e5421d66b7508742a96b309dc4c404075d02797d8fe5b38d76d1c870d14
                      - name: update_issue
                        risk: UPDATE
                        action: update
                        resourceRefs:
                          - argument: issueKey
                            type: Jira::Issue
                        definition:
                          name: update_issue
                          title: Update issue
                          description: Updates the summary of an issue.
                          inputSchema:
                            type: object
                            properties:
                              issueKey:
                                type: string
                                description: Issue key, e.g. ABC-123
                                pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                maxLength: 32
                              summary:
                                type: string
                                maxLength: 255
                            required:
                              - issueKey
                              - summary
                            additionalProperties: false
                          annotations:
                            readOnlyHint: false
                            destructiveHint: false
                        definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/NotReady"
  /.well-known/mcp-policy-data:
    post:
      tags:
        - server
      operationId: pushPolicyData
      summary: The gateway replaces the policy data of the server (called by the gateway).
      description: |
        The body is the administrator data that the server needs to evaluate its own policies, reduced to this server by the gateway: the scope mapping to the scopes
        of the namespace of this server (it never learns the grants of another system), `approvedPoliciesHash` (the hash the administrator approved
        for this server; absent while nothing is approved), the allowed AI clients (`azp`) and the overrides that target this server or all servers.
        The purpose of the token is `policy-data`; `prv` of the token is the revision of the body.

        **Replacement rule.** The server replaces what it holds only with a strictly higher `revision`; a `revision` equal to or lower than the one it holds is
        answered `200` with `accepted: false` and the revision it keeps (a gateway instance that is behind must not move a server back). The revision is a counter
        that only rises. The server keeps the data in memory and loses it when it stops, which is why the gateway pushes after every change and
        periodically; a server that holds none refuses calls as `policy_data_stale` (see above) until the next push.

        **What the server does with it.** It computes the `policiesHash` of its own policies and resource types, and validates every override against the schema composed
        with its fragment. The answer says what the gate now decides (`gate`), without refusing the push: data that makes the gate refuse is still data (the gateway then shows
        the administrator why the server refuses). A body that does not match the schema is `400` and changes nothing.
      security:
        - gatewayJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyData"
            examples:
              for_a_server:
                value:
                  revision: 42
                  approvedPoliciesHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
                  scopeMapping:
                    - group: mcp-jira-proj-ABC
                      scopes:
                        - Jira::Project/ABC
                  allowedClients:
                    - claude-code
                    - claude-ai
                  overrides:
                    - id: override-no-claude-ai
                      text: forbid (principal, action, resource) when { context.client == "claude-ai" };
      responses:
        "200":
          description: Processed. `accepted` is false when the revision was not newer than the one held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDataAck"
              examples:
                accepted:
                  value:
                    revision: 42
                    accepted: true
                    gate: ok
                not_newer:
                  value:
                    revision: 42
                    accepted: false
                    gate: ok
                not_approved:
                  value:
                    revision: 43
                    accepted: true
                    gate: policies_differ
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/TooLarge"
  /mcp:
    post:
      tags:
        - server
      operationId: callServerMcp
      summary: The MCP endpoint of the server (only the answers that belong to this interface).
      description: |
        The path is the path of `internalUrl` (`/mcp` here); the endpoint speaks MCP (Streamable HTTP) and is not described by this document, except for the answers that the
        gateway acts on. The token has the purpose `call`. Besides `401` (a token that fails C2, including `wrong_purpose`), a `tools/call` can be refused with
        `409 policy_data_stale`, see "The gate of policy data" above: the gateway pushes its policy data and repeats the call once. Any other refusal of the gate is an MCP
        answer with the error `upstream_unavailable` (C10) and is not retried.
      security:
        - gatewayJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC message of MCP.
            examples:
              tools_call:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/call
                  params:
                    name: get_issue
                    arguments:
                      issueKey: ABC-123
      responses:
        "200":
          description: The MCP answer (a JSON-RPC response or an event stream); not described here.
          content:
            application/json:
              schema:
                type: object
              examples:
                result:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      content:
                        - type: text
                          text: ABC-123 Fix the login form
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: The server holds no policy data, or older than `prv` of the token. Nothing was executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDataStale"
              examples:
                behind:
                  value:
                    error: policy_data_stale
                    heldRevision: 40
                    requiredRevision: 42
                nothing_held:
                  value:
                    error: policy_data_stale
                    heldRevision: null
                    requiredRevision: 42
  /.well-known/mcp-jwks.json:
    get:
      tags:
        - gateway
      operationId: getGatewayJwks
      summary: Public keys of the gateway (called by servers; served by the gateway).
      description: |
        The JWKS against which servers verify the internal JWT (C2). It is **public** and needs no authentication or client certificate: it holds public keys only. The gateway serves it at
        `https://<domain>/.well-known/mcp-jwks.json` through the public listener of the platform (the reverse proxy routes this one
        path of `/.well-known/` to the gateway, next to `oauth-protected-resource`); the document is the same as on the internal
        port of the gateway that the broker and the portal use. Servers cache it and fetch it again, at most once per
        minute, when they see an unknown `kid` (key rotation); until a fetch succeeds they keep the last copy they have, and they never accept a token
        signed with a key that is not in a copy they fetched. A server without a copy refuses every request (`401`).
        `Cache-Control: public, max-age=300`.
      servers:
        - url: https://{domain}
          description: The public address of the platform (publicBaseUrl).
          variables:
            domain:
              default: mcp.corp.local
      security: []
      responses:
        "200":
          description: The key set.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: public, max-age=300
              example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
              examples:
                two_keys:
                  value:
                    keys:
                      - kty: EC
                        crv: P-256
                        x: NeIacPAJDJujrDiTknjxxPlNOy7TMJOU7pWtU_5XO5g
                        y: Cpye8DT6x6-kCzg2mn3Cj_SSSDIL9giWrfobJy_MKWA
                        kid: gw-2026-11-a
                        alg: ES256
                        use: sig
                      - kty: EC
                        crv: P-256
                        x: -cwaIo20Js-hUm6xfpKULlASHnBC-wg9de3l1J-0jcY
                        y: esKrHsMlPBeUN38AXfeZlCUst_PVTIeTj1BA3a5eiNk
                        kid: gw-2026-11-b
                        alg: ES256
                        use: sig
components:
  securitySchemes:
    gatewayJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal JWT of the gateway (C2), ES256, with the purpose (`use`) of the endpoint, `aud` equal to the serverId of the receiver and a one-time `jti`. No client certificate is used.
  responses:
    Unauthenticated:
      description: Missing or invalid token. `reason` is the reason of C2 (`missing_token`, `malformed`, `alg_not_allowed`, `unknown_kid`, `bad_signature`, `wrong_issuer`, `wrong_audience`, `expired`, `not_yet_valid`, `lifetime_too_long`, `replayed_jti`, `request_id_mismatch`, `invalid_claims`, `test_key_not_allowed`, `jwks_unavailable`) or `wrong_purpose` (a token of another purpose than the endpoint). Nothing is done with the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            wrong_purpose:
              value:
                error: unauthenticated
                reason: wrong_purpose
                message: the token is not for this endpoint
    BadRequest:
      description: The body is not valid JSON or does not match the schema. Nothing changes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              value:
                error: invalid_request
                message: revision is required
    TooLarge:
      description: The body is larger than the limit of the server (at least 1 MiB is accepted).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            too_large:
              value:
                error: invalid_request
                message: body too large
    NotReady:
      description: The server has not built its manifest yet (it is starting).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            starting:
              value:
                error: upstream_unavailable
                message: the manifest is not ready
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    PolicyDataStale:
      type: object
      description: The refusal of the gate that the gateway answers with a push and one repeat of the call.
      required:
        - error
        - heldRevision
        - requiredRevision
      properties:
        error:
          const: policy_data_stale
        heldRevision:
          description: The revision the server holds; null when it holds none.
          oneOf:
            - $ref: "#/components/schemas/PolicyRevision"
            - type: "null"
        requiredRevision:
          description: "`prv` of the token."
          $ref: "#/components/schemas/PolicyRevision"
      additionalProperties: false
    PolicyDataAck:
      type: object
      required:
        - revision
        - accepted
        - gate
      properties:
        revision:
          description: The revision the server holds after this call.
          $ref: "#/components/schemas/PolicyRevision"
        accepted:
          description: True when the pushed revision replaced the data held (it was strictly newer).
          type: boolean
        gate:
          description: What the gate decides with the data now held (README, "Policy data gate"). ok means that the server evaluates calls.
          type: string
          enum:
            - ok
            - policies_not_approved
            - policies_differ
            - overrides_invalid
      additionalProperties: false
    Jwks:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - kty
              - crv
              - x
              - y
              - kid
              - alg
              - use
            properties:
              kty:
                const: EC
              crv:
                const: P-256
              x:
                type: string
                pattern: ^[A-Za-z0-9_-]{43}$
              y:
                type: string
                pattern: ^[A-Za-z0-9_-]{43}$
              kid:
                type: string
                minLength: 1
                maxLength: 128
              alg:
                const: ES256
              use:
                const: sig
            additionalProperties: false
      additionalProperties: false
    PolicyData:
      type: object
      description: The administrator data a server needs to evaluate its own policies (7.0.0), pushed by the gateway; moved here from GET /internal/v1/policy-data (CC-249).
      required:
        - revision
        - scopeMapping
        - allowedClients
        - overrides
      properties:
        revision:
          $ref: "#/components/schemas/PolicyRevision"
        approvedPoliciesHash:
          description: policiesHash (policies and resourceTypes) that the administrator approved for the receiving server; absent while nothing is approved. The server evaluates only when its own hash equals it.
          $ref: "#/components/schemas/DefinitionHash"
        scopeMapping:
          description: Only the scopes of types in the namespace of the receiving server; groups without one are left out.
          type: array
          items:
            $ref: "#/components/schemas/ScopeMappingEntry"
        allowedClients:
          description: Values of `azp` that may call (MCP_ALLOWED_CLIENTS of the gateway); checked in code before Cedar.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9._-]{1,128}$
        overrides:
          description: Overrides that target this server or all servers.
          type: array
          items:
            type: object
            required:
              - id
              - text
            properties:
              id:
                $ref: "#/components/schemas/OverrideId"
              text:
                type: string
                minLength: 1
                maxLength: 8000
            additionalProperties: false
      additionalProperties: false
    ResourceType:
      description: "Cedar entity type of a resource, declared by a server in the resourceTypes of its manifest (C6): <Namespace>::<Name>, where the namespace is the Cedar namespace of the server. No type is built in."
      type: string
      pattern: ^[A-Z][A-Za-z0-9]{0,30}::[A-Z][A-Za-z0-9]{0,30}$
    ToolName:
      description: Server-side tool name (without the gateway prefix). Snake case; a double underscore is forbidden because the gateway uses it as the <system>__<tool> separator (C5).
      type: string
      pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 64
    Risk:
      type: string
      enum:
        - READ_ONLY
        - UPDATE
        - DESTRUCTIVE
    ToolAction:
      description: Cedar action evaluated by the server on the resolved resource (C6, C7).
      type: string
      enum:
        - read
        - update
        - delete
        - admin
    ResourceRef:
      type: object
      required:
        - argument
        - type
      properties:
        argument:
          description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 64
        type:
          $ref: "#/components/schemas/ResourceType"
      additionalProperties: false
    McpToolDefinition:
      description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential. title is required (CC-115) and hashed like description (CC-042); icons and _meta are not allowed in v1, because they would reach the client without being pinned.
      type: object
      required:
        - name
        - title
        - description
        - inputSchema
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        title:
          type: string
          minLength: 1
          description: Display name shown by MCP clients; required since 3.0.0 (CC-115) and part of definitionHash (CC-042).
        description:
          type: string
          minLength: 1
        inputSchema:
          type: object
          description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11). Closed and bounded (CC-078, CC-123); checked by the semantic rules, because JSON Schema cannot express them for arbitrary nesting.
        outputSchema:
          type: object
        annotations:
          type: object
      additionalProperties: false
    DefinitionHash:
      description: sha256:<hex> over the RFC 8785 canonical JSON described in C6 (see test-vectors/definition-hash).
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ToolEntryFields:
      description: Fields of a manifest tool entry, open for composition (used by the gateway registry API). risk and action are required by ToolEntry and forbidden by AdapterToolEntry.
      type: object
      required:
        - name
        - resourceRefs
        - definition
        - definitionHash
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        additionalGroup:
          description: "Optional group (C9) that a user needs in addition to the group the risk derives: mcp-<system>-<suffix> with the system of this server and a suffix other than read, write and destructive (checked by the rule additional-group-valid), for example mcp-opensearch-ops for an ops-only tool. It can only narrow access (platform-call-additional-group); the risk-derived group is still needed. Part of definitionHash, so a change needs approval. Not allowed in an adapter manifest."
          type: string
          pattern: ^mcp-[a-z][a-z0-9]{1,30}-[a-z][a-z0-9-]{0,30}$
          maxLength: 70
        resourceRefs:
          description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        definition:
          $ref: "#/components/schemas/McpToolDefinition"
        definitionHash:
          description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
          $ref: "#/components/schemas/DefinitionHash"
    AdapterToolEntry:
      description: "Manifest entry of a tool of an adapter (CC-193). The adapter does not classify: risk and action are absent (the administrator gives them at approval), resourceRefs is empty (policies are per tool), and definitionHash covers the definition, resourceRefs, system and credential without risk and action."
      type: object
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
        - not:
            anyOf:
              - required:
                  - risk
              - required:
                  - action
              - required:
                  - additionalGroup
          properties:
            resourceRefs:
              type: array
              maxItems: 0
              items:
                $ref: "#/components/schemas/ResourceRef"
      unevaluatedProperties: false
    ResourceTypeDeclaration:
      description: Everything the entity builder knows about a resource type of this server; there is no built-in type (cedar/entity-builder.md).
      type: object
      required:
        - type
        - attributes
        - idPattern
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        attributes:
          description: Attributes the server's resolver fills from the system (Cedar entity attributes), without the parent attribute and without scopes, which the builder adds.
          type: array
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9]*$
          uniqueItems: true
        parent:
          description: Type of the containing resource, declared in this manifest, same namespace.
          $ref: "#/components/schemas/ResourceType"
        parentAttribute:
          description: Cedar attribute that holds the parent entity; required with parent and only then.
          type: string
          pattern: ^[a-z][A-Za-z0-9]*$
        idPattern:
          description: "Anchored regular expression (^...$, no top-level alternation) of the ids of this type: tool arguments, resolved resources. Written in the subset that Java and ECMAScript share; matched against the whole id."
          type: string
          pattern: ^\^.+\$$
          maxLength: 2048
        scopePattern:
          description: "Anchored regular expression of the local part of a grantable scope id (<Type>/<local part>). Absent: the type cannot be granted in the scope mapping."
          type: string
          pattern: ^\^.+\$$
          maxLength: 2048
        earlyScopeCheck:
          description: Whether the gateway checks tool arguments of this type against the scopes of the user before the call (context.refs). Only for types whose scope is the exact id; requires scopePattern.
          type: boolean
          default: false
        classification:
          description: The attribute the builder normalizes (trim, ASCII lower case, sets without duplicates); a resource missing a required one is refused (internal_error).
          type: object
          required:
            - attribute
            - kind
            - required
          properties:
            attribute:
              type: string
              pattern: ^[a-z][A-Za-z0-9]*$
            kind:
              enum:
                - string
                - set
            required:
              type: boolean
          additionalProperties: false
      dependentRequired:
        parent:
          - parentAttribute
        parentAttribute:
          - parent
      additionalProperties: false
    ToolEntry:
      description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
      type: object
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
        - required:
            - risk
            - action
      unevaluatedProperties: false
    ServerId:
      description: MCP server id; always mcp-<system>, one server per system (C5).
      type: string
      pattern: ^mcp-(?!(?:gateway|offboarding|portal|broker|prometheus|platform|admin|registry|adapter|internal|ci)$)[a-z][a-z0-9]{1,30}$
    SemVer:
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
    SystemId:
      description: "Target system identifier, lower case: the id of a system that the credential broker and the gateway registry know at runtime (a row, not a list in the contracts). The ids gateway, offboarding, portal, broker, prometheus, platform, admin, registry, adapter, internal and ci are reserved: mcp-<system> is also the CN of a server certificate, and mcp-gateway, mcp-offboarding and the like are the CNs of platform components."
      type: string
      pattern: ^(?!(?:gateway|offboarding|portal|broker|prometheus|platform|admin|registry|adapter|internal|ci)$)[a-z][a-z0-9]{1,30}$
    CredentialType:
      type: string
      enum:
        - user-oauth
        - user-secret
        - token-exchange
        - service-account
    PolicyRevision:
      description: "Revision of the policy data of the gateway (scope mapping, allowed clients, overrides, approved policy hashes; pushed to servers with POST /.well-known/mcp-policy-data, C14): a counter that the gateway raises on every change and never lowers (C7): max(previous + 1, current epoch milliseconds), so that a restore of the database cannot take it below what servers already hold. A receiver never accepts a revision lower than or equal to the one it holds, as new data. 0 means 'gateway without policy data' and is not the revision of any data; a receiver must not infer anything about policy from it."
      type: integer
      minimum: 0
      maximum: 9007199254740991
    GroupName:
      description: Group / entitlement name from C9. Only the mcp- prefix is used by the platform.
      type: string
      pattern: ^mcp-[A-Za-z0-9][A-Za-z0-9._-]*$
      maxLength: 255
    ResourceScopeId:
      description: "Id of a ResourceScope (C7): <Type>/<local part>, where the type is declared by a registered server and the local part matches its scopePattern (checked by the gateway against the registry, not by this pattern). ASCII only."
      type: string
      pattern: ^[A-Z][A-Za-z0-9]{0,30}::[A-Z][A-Za-z0-9]{0,30}/[!-~]{1,1024}$
      maxLength: 1100
    ScopeMappingEntry:
      type: object
      required:
        - group
        - scopes
      properties:
        group:
          $ref: "#/components/schemas/GroupName"
        scopes:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ResourceScopeId"
      additionalProperties: false
    OverrideId:
      description: override-<name>; the prefixes override- and platform- are reserved, so an override cannot replace a platform policy by id.
      type: string
      pattern: ^override-[a-z0-9][a-z0-9-]{0,54}$
    ServerManifest:
      title: MCP server manifest (C6)
      description: "Generated by the starter at build time (target/mcp-manifest.json) or built at startup from the server's tools/list (CC-140), served by every server at GET /.well-known/mcp-manifest (C14, requires an internal JWT with use manifest, C2) and pulled by the gateway when the server is added, on refresh and in its runtime loop (C5, 'Manifest intake'; CC-249). Rules checked in addition to this schema (see README, 'Reguły semantyczne'): serverId == 'mcp-' + system; tool names unique; every resourceRefs[].type and resourceTypes[].parent is declared in resourceTypes; resourceTypes[].type unique, all in one Cedar namespace that equals policies.namespace; each declaration consistent (parent and parentAttribute together, parent in the same namespace, earlyScopeCheck only with a scopePattern, the classification attribute among attributes, idPattern and scopePattern anchored with ^ and $ without a top-level alternation); policies.files names unique; policiesHash recomputed from policies and resourceTypes equals the declared one; definition.name == name; definition.inputSchema has no confirmation_code and is closed and bounded (CC-078, CC-123: type object and additionalProperties false at every object level, no open maps, every string with maxLength unless an enum or const, every array with maxItems and items, every number with minimum and maximum, patterns anchored with ^ and $, every node typed, no allOf/anyOf/oneOf/not/if/then/else); definitionHash recomputed from definition and the entry equals the declared one (CC-005)."
      type: object
      required:
        - serverId
        - version
        - system
        - credential
        - resourceTypes
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        version:
          $ref: "#/components/schemas/SemVer"
        system:
          $ref: "#/components/schemas/SystemId"
        environment:
          description: Environment the server was built for (CC-138). Absent means production. A gateway in production mode rejects a manifest with dev (422 manifest_rejected, reason environment_mismatch). Not part of any definitionHash.
          type: string
          enum:
            - production
            - dev
        internalUrl:
          description: "Informational and optional (CC-249): the gateway connects to the address an administrator gave it and ignores this one."
          type: string
          format: uri
          pattern: ^https?://
        credential:
          type: object
          required:
            - required
            - acceptedTypes
          properties:
            required:
              type: boolean
            acceptedTypes:
              type: array
              items:
                $ref: "#/components/schemas/CredentialType"
              uniqueItems: true
          if:
            properties:
              required:
                const: true
          then:
            properties:
              acceptedTypes:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialType"
                minItems: 1
          additionalProperties: false
        resourceTypes:
          type: array
          items:
            $ref: "#/components/schemas/ResourceTypeDeclaration"
        tools:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: "#/components/schemas/ToolEntry"
              - $ref: "#/components/schemas/AdapterToolEntry"
          description: "Which of the two entry forms applies depends on source: AdapterToolEntry when source is adapter, ToolEntry otherwise (CC-193)."
        source:
          description: "Absent for a server built on the starter. adapter marks the manifest of an adapter, the sidecar of a foreign MCP server (CC-193): its tool entries carry no risk and no action (an administrator classifies them at approval, outside definitionHash) and no resourceRefs, no resourceTypes and no policies (its policies are its own, outside the platform)."
          const: adapter
        policies:
          description: "The policy fragment of the server (C7), from src/main/resources/mcp/policies/ of its repository: the Cedar schema of its one namespace and its resource policies. Present for a server built on the starter, absent for an adapter. It is validated at registration (base schema plus fragment compose and validate in strict mode, see cedar/entity-builder.md) and is part of what an administrator approves (policiesHash)."
          type: object
          required:
            - namespace
            - schema
            - files
          properties:
            namespace:
              description: The Cedar namespace of the server; every resourceTypes[].type starts with it.
              type: string
              pattern: ^[A-Z][A-Za-z0-9]{0,30}$
            schema:
              description: "Text of schema.cedarschema: exactly one namespace, the server's own."
              type: string
              minLength: 1
              maxLength: 200000
            files:
              description: The *.cedar files of the server, in file name order.
              type: array
              maxItems: 100
              items:
                type: object
                required:
                  - name
                  - text
                properties:
                  name:
                    type: string
                    pattern: ^[a-z0-9][a-z0-9._-]{0,63}\.cedar$
                  text:
                    type: string
                    maxLength: 200000
                additionalProperties: false
          additionalProperties: false
        policiesHash:
          description: 'sha256 over the RFC 8785 canonical JSON of {"policies": <policies>, "resourceTypes": <resourceTypes>} (see test-vectors/policies-hash): a change of a declaration (earlyScopeCheck, idPattern, scopePattern, classification) needs approval like a change of a policy. The gateway recomputes it; a changed hash of a deployed server puts the server in pending_approval until an administrator approves it. Present exactly when policies is.'
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
      $defs:
        ResourceTypeDeclaration:
          description: Everything the entity builder knows about a resource type of this server; there is no built-in type (cedar/entity-builder.md).
          type: object
          required:
            - type
            - attributes
            - idPattern
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            attributes:
              description: Attributes the server's resolver fills from the system (Cedar entity attributes), without the parent attribute and without scopes, which the builder adds.
              type: array
              items:
                type: string
                pattern: ^[a-z][A-Za-z0-9]*$
              uniqueItems: true
            parent:
              description: Type of the containing resource, declared in this manifest, same namespace.
              $ref: "#/components/schemas/ResourceType"
            parentAttribute:
              description: Cedar attribute that holds the parent entity; required with parent and only then.
              type: string
              pattern: ^[a-z][A-Za-z0-9]*$
            idPattern:
              description: "Anchored regular expression (^...$, no top-level alternation) of the ids of this type: tool arguments, resolved resources. Written in the subset that Java and ECMAScript share; matched against the whole id."
              type: string
              pattern: ^\^.+\$$
              maxLength: 2048
            scopePattern:
              description: "Anchored regular expression of the local part of a grantable scope id (<Type>/<local part>). Absent: the type cannot be granted in the scope mapping."
              type: string
              pattern: ^\^.+\$$
              maxLength: 2048
            earlyScopeCheck:
              description: Whether the gateway checks tool arguments of this type against the scopes of the user before the call (context.refs). Only for types whose scope is the exact id; requires scopePattern.
              type: boolean
              default: false
            classification:
              description: The attribute the builder normalizes (trim, ASCII lower case, sets without duplicates); a resource missing a required one is refused (internal_error).
              type: object
              required:
                - attribute
                - kind
                - required
              properties:
                attribute:
                  type: string
                  pattern: ^[a-z][A-Za-z0-9]*$
                kind:
                  enum:
                    - string
                    - set
                required:
                  type: boolean
              additionalProperties: false
          dependentRequired:
            parent:
              - parentAttribute
            parentAttribute:
              - parent
          additionalProperties: false
        ResourceRef:
          type: object
          required:
            - argument
            - type
          properties:
            argument:
              description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
              type: string
              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
              maxLength: 64
            type:
              $ref: "#/components/schemas/ResourceType"
          additionalProperties: false
        ToolEntry:
          description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
          type: object
          allOf:
            - $ref: "#/components/schemas/ToolEntryFields"
            - required:
                - risk
                - action
          unevaluatedProperties: false
        ToolEntryFields:
          description: Fields of a manifest tool entry, open for composition (used by the gateway registry API). risk and action are required by ToolEntry and forbidden by AdapterToolEntry.
          type: object
          required:
            - name
            - resourceRefs
            - definition
            - definitionHash
          properties:
            name:
              $ref: "#/components/schemas/ToolName"
            risk:
              $ref: "#/components/schemas/Risk"
            action:
              $ref: "#/components/schemas/ToolAction"
            additionalGroup:
              description: "Optional group (C9) that a user needs in addition to the group the risk derives: mcp-<system>-<suffix> with the system of this server and a suffix other than read, write and destructive (checked by the rule additional-group-valid), for example mcp-opensearch-ops for an ops-only tool. It can only narrow access (platform-call-additional-group); the risk-derived group is still needed. Part of definitionHash, so a change needs approval. Not allowed in an adapter manifest."
              type: string
              pattern: ^mcp-[a-z][a-z0-9]{1,30}-[a-z][a-z0-9-]{0,30}$
              maxLength: 70
            resourceRefs:
              description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
              type: array
              items:
                $ref: "#/components/schemas/ResourceRef"
            definition:
              $ref: "#/components/schemas/McpToolDefinition"
            definitionHash:
              description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
              $ref: "#/components/schemas/DefinitionHash"
        McpToolDefinition:
          description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential. title is required (CC-115) and hashed like description (CC-042); icons and _meta are not allowed in v1, because they would reach the client without being pinned.
          type: object
          required:
            - name
            - title
            - description
            - inputSchema
          properties:
            name:
              $ref: "#/components/schemas/ToolName"
            title:
              type: string
              minLength: 1
              description: Display name shown by MCP clients; required since 3.0.0 (CC-115) and part of definitionHash (CC-042).
            description:
              type: string
              minLength: 1
            inputSchema:
              type: object
              description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11). Closed and bounded (CC-078, CC-123); checked by the semantic rules, because JSON Schema cannot express them for arbitrary nesting.
            outputSchema:
              type: object
            annotations:
              type: object
          additionalProperties: false
        AdapterToolEntry:
          description: "Manifest entry of a tool of an adapter (CC-193). The adapter does not classify: risk and action are absent (the administrator gives them at approval), resourceRefs is empty (policies are per tool), and definitionHash covers the definition, resourceRefs, system and credential without risk and action."
          type: object
          allOf:
            - $ref: "#/components/schemas/ToolEntryFields"
            - not:
                anyOf:
                  - required:
                      - risk
                  - required:
                      - action
                  - required:
                      - additionalGroup
              properties:
                resourceRefs:
                  type: array
                  maxItems: 0
                  items:
                    $ref: "#/components/schemas/ResourceRef"
          unevaluatedProperties: false
      allOf:
        - if:
            required:
              - source
          then:
            properties:
              tools:
                items:
                  $ref: "#/components/schemas/AdapterToolEntry"
                type: array
              resourceTypes:
                type: array
                maxItems: 0
                items:
                  $ref: "#/components/schemas/ResourceTypeDeclaration"
            not:
              anyOf:
                - required:
                    - policies
                - required:
                    - policiesHash
          else:
            properties:
              tools:
                items:
                  $ref: "#/components/schemas/ToolEntry"
                type: array
            required:
              - policies
              - policiesHash
      dependentRequired:
        policies:
          - policiesHash
        policiesHash:
          - policies
