  /api/v1/admin/registry/servers/{serverId}/tools/{tool}/approve:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - $ref: "#/components/parameters/Tool"
    post:
      tags:
        - admin
      operationId: approveAdminTool
      summary: Approve a pending tool definition (proxy to C5). The manual way to accept a change made outside a deployment (CC-133).
      description: |
        Plain approve is unchanged. With acceptRiskLowering true (an entry with riskLowered true, CC-167) the BFF requires a fresh MFA of the administrator, the same mechanism and window as the registration of the Authenticator: without it `401 step_up_required` with `stepUpUrl`. The BFF sends the field only when it is true, so that an older gateway keeps accepting the request.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
            examples:
              approve:
                value:
                  definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
              approve_lower_risk:
                value:
                  definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                  acceptRiskLowering: true
      responses:
        "204":
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          description: Approved.
        "401":
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          description: No valid session, or acceptRiskLowering true without a fresh MFA (step_up_required with stepUpUrl, the return path is the admin page, CC-167).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StepUpRequired"
                  - $ref: "#/components/schemas/Error"
              examples:
                step_up_required:
                  value:
                    error: step_up_required
                    stepUpUrl: /api/v1/auth/login?stepUp=true&returnPath=/admin/registry
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          description: The definition changed again; reload the diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                hash_mismatch:
                  value:
                    error: hash_mismatch
        "422":
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          description: The pending definition lowers the risk floor and acceptRiskLowering was not given; it is not approved (CC-133, CC-167).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestRejected"
              examples:
                risk_lowered:
                  value:
                    error: manifest_rejected
                    reason: risk_lowered
                    message: update_issue lowers risk from UPDATE to READ_ONLY
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
components:
  headers:
    RequestId:
      description: requestId (UUIDv7) of this request, the same value as in the audit events of the BFF, broker and gateway (CC-047, CC-087). Not a secret; the UI shows its first 8 characters next to an error.
      required: true
      schema:
        $ref: "#/components/schemas/RequestId"
      example: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
    NoStore:
      description: Required on responses carrying the authenticator seed or the arguments of a pending call (CC-091, CC-093); intermediaries and clients must not cache them.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
      example: no-cache
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Session cookie set by the BFF after OIDC login (HttpOnly, Secure, SameSite=Lax).
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Value of the __Host-XSRF-TOKEN cookie (not HttpOnly, Secure, SameSite=Strict, Path=/, no Domain) set by the BFF (CC-055). Required for POST, PUT and DELETE.
  parameters:
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SystemId"
      example: jira
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ServerId"
      example: mcp-jira
    Tool:
      name: tool
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ToolName"
      example: update_issue
  responses:
    BadRequest:
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      description: No valid session; the frontend navigates to GET /api/v1/auth/login (CC-023).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    StepUpOrUnauthenticated:
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      description: No valid session, or the operation needs a fresh MFA login (step_up_required with stepUpUrl, CC-010).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/StepUpRequired"
              - $ref: "#/components/schemas/Error"
          examples:
            step_up_required:
              value:
                error: step_up_required
                stepUpUrl: /api/v1/auth/login?stepUp=true&returnPath=/catalog
    CsrfInvalid:
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      description: Missing or wrong X-XSRF-TOKEN header (must equal the XSRF-TOKEN cookie).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            csrf_invalid:
              value:
                error: csrf_invalid
    Forbidden:
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      description: Not an admin (mcp-platform-admin), or CSRF token invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            access_denied:
              value:
                error: access_denied
    NotFound:
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      description: Does not exist or is not visible to the user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_found_or_denied:
              value:
                error: not_found_or_denied
    TooManyRequests:
      headers:
        Retry-After:
          description: Seconds to wait, at least 1.
          schema:
            type: integer
            minimum: 1
          example: 60
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      description: A limit of the BFF was exceeded (CC-156). Retry-After says how long to wait; no header names a limit or a setting.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rate_limited:
              value:
                error: rate_limited
    UpstreamUnavailable:
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      description: "The broker, the gateway admin API, the IGA or the IdP token exchange did not answer or answered with an error the BFF does not pass on (CC-050). No partial data: the catalog is either complete or 503. Upstream bodies are never forwarded."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            upstream_unavailable:
              value:
                error: upstream_unavailable
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C12 does not define.
      required:
        - error
      properties:
        error:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
        requestId:
          $ref: "#/components/schemas/RequestId"
      additionalProperties: false
    StepUpRequired:
      type: object
      required:
        - error
        - stepUpUrl
      properties:
        error:
          const: step_up_required
        stepUpUrl:
          type: string
          format: uri-reference
          description: Where the browser goes to re-authenticate with max_age / acr_values; normally GET /api/v1/auth/login with stepUp=true. The returnPath inside it is a default; the frontend may replace it with any portal path that matches ReturnPath (e.g. back to the form), keeping stepUp=true (CC-048).
      additionalProperties: false
    LoginErrorCode:
      type: string
      description: Value of `loginError` in `/?loginError=<code>` after a failed login (CC-051). Closed list.
      enum:
        - cancelled
        - idp_error
        - session_expired
        - step_up_failed
    Me:
      type: object
      required:
        - username
        - displayName
        - groups
        - isAdmin
      properties:
        username:
          type: string
        displayName:
          type: string
        groups:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GroupName"
        isAdmin:
          type: boolean
          description: Member of mcp-platform-admin.
        mfaFreshUntil:
          description: Until when the last MFA authentication counts as fresh for step-up protected operations (CC-053). Absent when MFA is not fresh or unknown. Informational only; the BFF still enforces step-up on the operations that need it (registering and removing the authenticator, CC-093; PUT secret does not, CC-090), so the frontend uses it to start step-up before showing a form that needs it.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    CatalogStatus:
      type: string
      enum:
        - connected
        - expiring
        - reconnect_required
        - not_connected
        - request_pending
        - no_access
    CatalogAction:
      type: string
      enum:
        - copy_link
        - connect_oauth
        - add_secret
        - reconnect
        - request_access
        - view_request
        - disconnect
    CatalogCredential:
      type: object
      description: Credential types of the system (C4 GET /v1/systems) (CC-080).
      required:
        - supportedTypes
        - defaultType
      properties:
        supportedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CredentialType"
        defaultType:
          $ref: "#/components/schemas/CredentialType"
      additionalProperties: false
    ConnectErrorCode:
      type: string
      description: Value of `connectError` appended to returnPath after a failed OAuth connection (CC-022, CC-086). Closed list. cancelled = the user cancelled at the provider (error=access_denied).
      enum:
        - flow_invalid
        - provider_error
        - cancelled
    PortalCatalogServer:
      type: object
      required:
        - serverId
        - system
        - version
        - url
        - status
        - actions
        - tools
      properties:
        credential:
          $ref: "#/components/schemas/CatalogCredential"
        connection:
          description: The current user's connection to the system (C4 GET /v1/connections). null when there is none or when nothing is to be connected (service-account, token-exchange). Never contains a secret value (CC-080).
          oneOf:
            - $ref: "#/components/schemas/Connection"
            - type: "null"
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        url:
          type: string
          format: uri
          description: Public MCP endpoint <publicBaseUrl>/s/<serverId>/mcp, used by copy_link (CC-021, CC-089).
        status:
          $ref: "#/components/schemas/CatalogStatus"
        actions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CatalogAction"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTool"
      additionalProperties: false
    PortalCatalog:
      type: object
      required:
        - servers
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/PortalCatalogServer"
      additionalProperties: false
    ConnectOAuthRequest:
      type: object
      properties:
        returnPath:
          $ref: "#/components/schemas/ReturnPath"
      additionalProperties: false
    ConnectOAuthResponse:
      type: object
      required:
        - authorizeUrl
      properties:
        authorizeUrl:
          type: string
          format: uri
      additionalProperties: false
    AccessRequestStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled
    AccessRequest:
      type: object
      description: Shape of C13 AccessRequest (CC-024).
      required:
        - requestId
        - entitlement
        - status
        - createdAt
      properties:
        requestId:
          type: string
        entitlement:
          $ref: "#/components/schemas/GroupName"
        status:
          $ref: "#/components/schemas/AccessRequestStatus"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        decidedAt:
          description: When the IGA decided the request (approved or rejected). Absent while the request is pending (CC-154).
          $ref: "#/components/schemas/Timestamp"
        requestUrl:
          type: string
          format: uri
          description: Page of the request in the IGA, when the adapter has one.
      additionalProperties: false
    RequestableEntitlement:
      type: object
      required:
        - entitlement
      properties:
        entitlement:
          $ref: "#/components/schemas/GroupName"
        description:
          type: string
          maxLength: 500
          description: Text of the IGA catalog, untrusted.
      additionalProperties: false
    AccessRequestCreate:
      type: object
      required:
        - entitlement
      properties:
        entitlement:
          $ref: "#/components/schemas/GroupName"
      additionalProperties: false
    AccessRequestResult:
      oneOf:
        - type: object
          required:
            - requestUrl
          properties:
            requestUrl:
              type: string
              format: uri
          additionalProperties: false
        - type: object
          required:
            - requestId
          properties:
            requestId:
              type: string
          additionalProperties: false
    ClientConfigs:
      type: object
      description: Ready-to-paste configuration for supported AI clients.
      required:
        - claudeCode
        - copilot
        - codex
      properties:
        claudeCode:
          type: string
        copilot:
          type: string
        codex:
          type: string
      additionalProperties: false
    McpEndpoint:
      type: object
      description: Result of getMcpEndpoint (CC-175).
      required:
        - url
        - toolCount
        - clientConfigs
      properties:
        url:
          type: string
          format: uri
          description: "`<publicBaseUrl>/mcp` and, when there is a filter, `?` and its canonical form."
        filter:
          description: Canonical filter (CC-170); absent when no filter was given.
          $ref: "#/components/schemas/EndpointFilterQuery"
        toolCount:
          type: integer
          minimum: 0
          description: Tools of the user's catalog (granted, not disabled) that the filter leaves visible; an estimate, the tools/list of the gateway is the authority.
        clientConfigs:
          $ref: "#/components/schemas/ClientConfigs"
      additionalProperties: false
    InvalidFilter:
      type: object
      description: 400 of getMcpEndpoint for a filter that does not parse (same error and reason as the gateway, CC-170).
      required:
        - error
        - reason
      properties:
        error:
          const: invalid_request
        reason:
          const: invalid_filter
        message:
          type: string
          maxLength: 500
        requestId:
          $ref: "#/components/schemas/RequestId"
      additionalProperties: false
    ReturnPath:
      type: string
      description: Relative path inside the portal, optionally with a query. No percent-encoding at all (portal paths do not need it), no backslash, no absolute or protocol-relative URL, so no number of decoding passes can turn it into //host (open redirect, CC-032). The BFF redirects only to the validated value as is, without decoding it. Since 3.0.0 (CC-099) the path must not start with a prefix that the reverse proxy sends to the BFF or the gateway (`/api`, `/mcp`, `/s`, `/v`, `/.well-known`, each as a whole segment, so `/apiary` and `/mcp-docs` are fine; `/mcp` is the aggregate endpoint of the gateway since 5.0.0, CC-169, and `/v` stays reserved because the proxy may still send it to the gateway for its 404, CC-177), because a redirect after login or OAuth would land on an endpoint instead of in the SPA; and it must not contain a `.` or `..` segment (before the query), which a browser would resolve to such a prefix. The semicolon is not allowed either (path parameters such as `/api;x` or `/..;/api` are read as `/api` and `/..` by common servlet containers).
      pattern: ^(?![^?]*/\.\.?(?:[/?]|$))(?!/(?:api|mcp|s|v|\.well-known)(?:[/?]|$))/(?!/)[A-Za-z0-9._~!$&'()*+,=:@/?-]*$
      maxLength: 512
    RequestId:
      description: UUIDv7 request id (C2 rid, X-Request-Id).
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    GroupName:
      description: Group / entitlement name from C9. Only the mcp- prefix is used by the platform.
      type: string
      pattern: ^mcp-[A-Za-z0-9][A-Za-z0-9._-]*$
      maxLength: 255
    Timestamp:
      description: ISO 8601 date-time in UTC (suffix Z).
      type: string
      format: date-time
      pattern: Z$
    CredentialType:
      type: string
      enum:
        - user-oauth
        - user-secret
        - token-exchange
        - service-account
    SystemId:
      description: Target system identifier, lower case (01-contracts conventions).
      type: string
      enum:
        - jira
        - confluence
        - gitlab
        - servicedesk
        - opensearch
    ConnectionStatus:
      type: string
      description: expiring = expires in less than 7 days; only for `user-secret` with a declared `expiresAt` (CC-103). A `user-oauth` connection has expiresAt null (the token is refreshed by the broker) and never becomes expiring.
      enum:
        - connected
        - expiring
        - expired
        - revoked
        - error
    Connection:
      type: object
      required:
        - system
        - type
        - status
        - backendUser
        - expiresAt
        - connectedAt
        - lastUsedAt
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        type:
          $ref: "#/components/schemas/CredentialType"
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          type: string
          description: User name in the target system read by whoami (C4.1, CC-101). Not compared with the SSO identity; the portal shows it as "Connected as <backendUser>".
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        connectedAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    ServerId:
      description: MCP server id; always mcp-<system>, one server per system (C5).
      type: string
      enum:
        - mcp-jira
        - mcp-confluence
        - mcp-gitlab
        - mcp-servicedesk
        - mcp-opensearch
    SemVer:
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
    QualifiedToolName:
      description: "Tool name as seen by MCP clients, in C5 and C12: <system>__<tool>."
      type: string
      pattern: ^(jira|confluence|gitlab|servicedesk|opensearch)__[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 80
    Risk:
      type: string
      enum:
        - READ_ONLY
        - UPDATE
        - DESTRUCTIVE
    ToolAction:
      description: Cedar action evaluated by the server on the resolved resource (C6, C7).
      type: string
      enum:
        - read
        - update
        - delete
        - admin
    Access:
      type: string
      enum:
        - granted
        - denied
    CatalogTool:
      type: object
      required:
        - name
        - description
        - risk
        - action
        - access
        - requiredEntitlements
      properties:
        name:
          $ref: "#/components/schemas/QualifiedToolName"
        description:
          type: string
          description: definition.description of the approved manifest entry (CC-005, CC-014).
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        access:
          $ref: "#/components/schemas/Access"
        requiredEntitlements:
          description: Groups (C9) that grant this tool according to policy; empty when policy names none.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GroupName"
        title:
          type: string
          minLength: 1
          description: definition.title of the approved manifest entry (CC-042, CC-082), a short display name for the UI. Absent when the tool has no title; the UI then falls back to description.
        disabled:
          type: boolean
          default: false
          description: True when an administrator disabled the tool or its server (C10 tool_disabled; a hash pending approval counts) (CC-081).
        requiresConfirmation:
          type: boolean
          default: false
          description: True when every call needs a confirmation (C11), risk DESTRUCTIVE or a policy requires it. Computed by the gateway (CC-081).
      additionalProperties: false
    PutSecretRequest:
      type: object
      required:
        - secret
      properties:
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Single token (PAT or API key), never login and password (CC-049).
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PutSecretResponse:
      type: object
      required:
        - status
        - backendUser
        - expiresAt
      properties:
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          type: string
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    PutSecretError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - secret_invalid
      additionalProperties: false
    ConfirmationId:
      description: Opaque, unguessable id of a pending confirmation (C11); used in URL paths and as the key of the portal preview.
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    ResourceType:
      description: Cedar entity type of a system resource (C7).
      type: string
      enum:
        - Jira::Project
        - Jira::Issue
        - Confluence::Space
        - Confluence::Page
        - GitLab::Group
        - GitLab::Project
        - OpenSearch::Index
        - ServiceDesk::Queue
        - ServiceDesk::Ticket
    resource:
      type: object
      required:
        - type
        - id
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        id:
          description: "Resource id as the system knows it (Jira key, GitLab path, index name, page id). Free-form because ids of the five systems use different alphabets (slashes, dots, spaces in some service desks). Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031). The length limit counts code points; producers should keep ids below 512 characters. Independently of this, the audit JSON serializer must escape every control character and U+2028/U+2029."
          type: string
          pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,512}$
        parent:
          description: "Parent as <Namespace>::<Type>::<id>, e.g. Jira::Project::ABC (C8 example format). The id part has the same exclusions as resource.id: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
          type: string
          pattern: ^[A-Za-z]+::[A-Za-z]+::[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]+$
          maxLength: 600
      additionalProperties: false
    ConfirmationArgument:
      type: object
      required:
        - name
        - value
        - truncated
      properties:
        name:
          type: string
        value:
          type: string
          description: JSON serialization of the argument value, cut to a gateway limit when truncated is true.
        truncated:
          type: boolean
      additionalProperties: false
    ConfirmationView:
      type: object
      required:
        - confirmationId
        - tool
        - system
        - arguments
        - expiresAt
      properties:
        confirmationId:
          $ref: "#/components/schemas/ConfirmationId"
        tool:
          $ref: "#/components/schemas/QualifiedToolName"
        system:
          description: System the tool acts on; the portal shows it next to the tool (CC-077). Read by the gateway from its own record of the pending call, never from the client.
          $ref: "#/components/schemas/SystemId"
        resource:
          description: Main resource of the call from resourceRefs (type, id, parent), computed by the gateway, the same value that goes to the audit event (CC-098); absent when the tool takes no resource identifier. Same limits as in C8, including the exclusion of control and bidirectional characters in id.
          $ref: "#/components/schemas/resource"
        arguments:
          description: Arguments sorted by name (fixed order), without confirmation_code.
          type: array
          items:
            $ref: "#/components/schemas/ConfirmationArgument"
        expiresAt:
          description: End of the validity of the pending call (C11, 120 s after creation, not extended by a repeated first call); the portal shows a countdown.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    AuthenticatorStatus:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          description: none = no registration; active = usable (possibly locked, see lockedUntil); disabled = switched off by the daily limit of wrong codes (CC-126), the user must register again.
          enum:
            - none
            - active
            - disabled
        registeredAt:
          description: Present with state active or disabled.
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          description: Last accepted code; absent until the first one.
          $ref: "#/components/schemas/Timestamp"
        lockedUntil:
          description: Present while verification is blocked after repeated wrong codes. Only the passing of time lifts it (CC-091).
          $ref: "#/components/schemas/Timestamp"
        disabledAt:
          description: Present exactly with state disabled (CC-126).
          $ref: "#/components/schemas/Timestamp"
        disabledReason:
          description: Present exactly with state disabled; a single value today, not an unlock option.
          type: string
          enum:
            - daily_failure_limit
      additionalProperties: false
      if:
        properties:
          state:
            const: disabled
        required:
          - state
      then:
        required:
          - disabledAt
          - disabledReason
      else:
        not:
          anyOf:
            - required:
                - disabledAt
            - required:
                - disabledReason
    AuthenticatorEnrollmentId:
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    AuthenticatorEnrollment:
      type: object
      required:
        - enrollmentId
        - otpauthUri
        - secret
        - expiresAt
      properties:
        enrollmentId:
          $ref: "#/components/schemas/AuthenticatorEnrollmentId"
        otpauthUri:
          type: string
          format: uri
          pattern: ^otpauth://totp/
          description: Contains the seed. Drawn as a QR code locally by the frontend and never sent to an external QR service.
        secret:
          description: Seed, Base32 without padding, shown once for manual entry. Never logged, audited or stored by the BFF or the browser.
          type: string
          pattern: ^[A-Z2-7]{32}$
        expiresAt:
          description: End of the 10 minute validity of this enrollment.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    ConfirmationCode:
      description: "Code typed by the user from the authenticator app (TOTP, RFC 6238: 6 digits), sent by the agent as confirmation_code; not issued by the platform (CC-091). The text form matters: a code can start with a zero."
      type: string
      pattern: ^[0-9]{6}$
    AuthenticatorEnrollmentConfirm:
      type: object
      required:
        - enrollmentId
        - code
      properties:
        enrollmentId:
          $ref: "#/components/schemas/AuthenticatorEnrollmentId"
        code:
          $ref: "#/components/schemas/ConfirmationCode"
      additionalProperties: false
    AuthenticatorEnrollmentError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_code
            - enrollment_invalid
      additionalProperties: false
    EndpointFilterQuery:
      description: "Canonical query of the aggregate MCP endpoint (/mcp and /s/<serverId>/mcp), CC-170: parameters systems, tools, access, exclude in this fixed order, values lower case, comma separated, sorted bytewise, without duplicates; no percent-encoding, no empty parameter. Reference: scripts/lib/endpoint-filter.mjs. Limits (at most 5 entries in systems, 100 in tools, 100 in exclude) are checked by the reference parser, not by this pattern. Appears without the leading '?'."
      type: string
      pattern: ^(?:systems=[a-z][a-z0-9]*(?:,[a-z][a-z0-9]*)*)?(?:(?:^|&)tools=[a-z][a-z0-9_]*(?:,[a-z][a-z0-9_]*)*)?(?:(?:^|&)access=(?:read|write))?(?:(?:^|&)exclude=[a-z][a-z0-9_]*(?:,[a-z][a-z0-9_]*)*)?$
      minLength: 1
      maxLength: 512
    ComponentId:
      description: Identifier of a platform component, e.g. mcp-gateway, mcp-credential-broker, mcp-jira.
      type: string
      pattern: ^mcp-[a-z0-9]+(-[a-z0-9]+)*$
      maxLength: 64
    ToolName:
      description: Server-side tool name (without the gateway prefix). Snake case; a double underscore is forbidden because the gateway uses it as the <system>__<tool> separator (C5).
      type: string
      pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 64
    PolicyRevision:
      description: Policy bundle revision YYYYMMDDHHMMSS-<sha7> (C7). Ordered by the timestamp part. The value 00000000000000-0000000 means 'gateway without a loaded bundle' (M1 only, CC-068); it is not the revision of any bundle and a receiver must not infer anything about policy from it.
      type: string
      pattern: ^[0-9]{14}-[0-9a-f]{7}$
    ErrorCode:
      description: Client-visible error codes (C10).
      type: string
      enum:
        - unauthenticated
        - access_denied
        - tool_disabled
        - confirmation_required
        - confirmation_failed
        - confirmation_superseded
        - confirmation_cancelled
        - confirmation_blocked
        - credential_required
        - not_found_or_denied
        - invalid_argument
        - rate_limited
        - step_up_required
        - upstream_unavailable
        - internal_error
    DefinitionHash:
      description: sha256:<hex> over the RFC 8785 canonical JSON described in C6 (see test-vectors/definition-hash).
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ActivityCall:
      type: object
      required:
        - requestId
        - ts
        - tool
        - result
      properties:
        requestId:
          description: requestId of the first request of the call (the one that created a pending confirmation, if any).
          $ref: "#/components/schemas/RequestId"
        ts:
          description: Time of that first request.
          $ref: "#/components/schemas/Timestamp"
        client:
          type: string
          maxLength: 255
          description: Client id (azp), e.g. claude-code; the UI maps it to a display name.
        filter:
          description: Normalized filter of the address the call was made on (CC-174); absent when the address had no filter.
          $ref: "#/components/schemas/EndpointFilterQuery"
        tool:
          $ref: "#/components/schemas/QualifiedToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        resource:
          description: Same shape and limits as resource in the audit event (C8), including the exclusion of control and bidirectional characters in id (CC-031).
          $ref: "#/components/schemas/resource"
        result:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: |
            Final state of the call. Known values: ok, error, denied_not_granted, denied_filter_scope, denied_policy,
            tool_disabled, credential_required, rate_limited, step_up_required, confirmation_pending, confirmed,
            expired, confirmation_failed, superseded, blocked_by_pending, cancelled. A client must show an unknown value as a generic label.
        wrongCodeCount:
          description: Number of wrong confirmation codes (answers invalid or replayed of the broker) given for this call; present only for calls that needed a confirmation and were not refused as blocked_by_pending. A retry that came too late or found no pending call is not a wrong code.
          type: integer
          minimum: 0
          maximum: 3
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
      additionalProperties: false
    ResourceRef:
      type: object
      required:
        - argument
        - type
      properties:
        argument:
          description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 64
        type:
          $ref: "#/components/schemas/ResourceType"
      additionalProperties: false
    McpToolDefinition:
      description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential. title is required (CC-115) and hashed like description (CC-042); icons and _meta are not allowed in v1, because they would reach the client without being pinned.
      type: object
      required:
        - name
        - title
        - description
        - inputSchema
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        title:
          type: string
          minLength: 1
          description: Display name shown by MCP clients; required since 3.0.0 (CC-115) and part of definitionHash (CC-042).
        description:
          type: string
          minLength: 1
        inputSchema:
          type: object
          description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11). Closed and bounded (CC-078, CC-123); checked by the semantic rules, because JSON Schema cannot express them for arbitrary nesting.
        outputSchema:
          type: object
        annotations:
          type: object
      additionalProperties: false
    ToolEntryFields:
      description: Fields of a manifest tool entry, open for composition (used by the gateway registry API).
      type: object
      required:
        - name
        - risk
        - action
        - resourceRefs
        - definition
        - definitionHash
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        resourceRefs:
          description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        definition:
          $ref: "#/components/schemas/McpToolDefinition"
        definitionHash:
          description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
          $ref: "#/components/schemas/DefinitionHash"
    RegistryToolStatus:
      type: string
      enum:
        - approved
        - pending_approval
    RegistryTool:
      description: Manifest tool entry (C6) with its approval status. Pending entries are shown when present.
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/RegistryToolStatus"
        change:
          type: string
          enum:
            - new
            - changed
          description: Present exactly when status is pending_approval. new means no approved entry exists, changed means an approved entry exists and differs (CC-097).
        source:
          type: string
          enum:
            - ci
            - server
          description: Present exactly when status is pending_approval (CC-162); same meaning as PendingTool.source.
        riskLowered:
          type: boolean
          description: True when the pending entry has a risk below the risk floor (CC-167). The tool is hidden and refused as tool_disabled, and only an administrator can approve it, with acceptRiskLowering true. Absent means false.
        approvedInVersion:
          description: Version of the manifest at which the approved entry was approved; null for a new tool that has no approved entry. Absent only for an approved tool whose version was not recorded before this field existed (CC-097).
          oneOf:
            - $ref: "#/components/schemas/SemVer"
            - type: "null"
      unevaluatedProperties: false
    RegistryServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        enabled:
          type: boolean
          default: true
          description: False when the server is disabled in gateway configuration or by an overrides policy, or when its held manifest fails the checks at start (CC-159). All tools of a disabled server report disabled=true in the catalog (CC-081, CC-088). Read only; the portal has no switch.
        tools:
          type: array
          items:
            $ref: "#/components/schemas/RegistryTool"
      additionalProperties: false
    ToolEntry:
      description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
      type: object
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      unevaluatedProperties: false
    PendingTool:
      type: object
      required:
        - approvedEntry
        - pendingEntry
        - pendingHash
        - pendingVersion
        - source
      properties:
        approvedInVersion:
          description: Version of the manifest at which approvedEntry was approved; null when approvedEntry is null (CC-097).
          oneOf:
            - $ref: "#/components/schemas/SemVer"
            - type: "null"
        pendingVersion:
          description: Version of the manifest in which the pending entry appeared (CC-097). For source server it is the version the server reported in initialize, a value the server controls, so the administrator sees it together with source.
          $ref: "#/components/schemas/SemVer"
        riskLowered:
          type: boolean
          description: True when the pending entry has a risk below the risk floor, the highest risk ever reported for the tool (CC-167); approve needs acceptRiskLowering true then. Absent means false.
        source:
          type: string
          enum:
            - ci
            - server
          description: Where the pending entry comes from (CC-162). ci is an entry left by a PUT of the pipeline (the reviewed commit); server is a definition that the running server presented. A server entry never replaces a ci entry, see the README, "Rejestr i przypinanie definicji".
        approvedEntry:
          description: Currently approved entry; null for a new tool.
          oneOf:
            - $ref: "#/components/schemas/ToolEntry"
            - type: "null"
        pendingEntry:
          $ref: "#/components/schemas/ToolEntry"
        pendingHash:
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
    ApproveRequest:
      type: object
      required:
        - definitionHash
      properties:
        definitionHash:
          $ref: "#/components/schemas/DefinitionHash"
        acceptRiskLowering:
          type: boolean
          default: false
          description: Only an administrator (mcp-platform-admin) can set it, and only through this operation; the pipeline (PUT) never lowers a risk, and the portal asks for a fresh MFA first. Sent only when true. On an entry that lowers nothing it is ignored (definition_approved). Without it an entry that lowers the risk floor is 422 risk_lowered; with it the lower risk is approved, the floor becomes that risk and the audit event is admin_change with reason risk_lowered_by_admin (CC-167).
      additionalProperties: false
    ManifestRejected:
      type: object
      description: 422 of a registration or an approval (CC-133). reason is a known value or absent for the older rejections (a hash that does not match, a rule of the manifest).
      required:
        - error
      properties:
        error:
          const: manifest_rejected
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Known values are risk_lowered, environment_mismatch (CC-138) and credential_type_mismatch (CC-159). A client must show an unknown value as a generic message.
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    AuditEvent:
      title: Audit event (C8)
      description: One JSON object per line on a dedicated logger/appender shipped to the SIEM. Never contains argument values, tool results, secrets, confirmation codes, TOTP codes, authenticator seeds or otpauth URIs; additionalProperties is false so such fields cannot be added by accident. Target system of broker events is carried in 'server' (mcp-<system>). The serializer must escape control characters, U+2028 and U+2029 in every string value.
      type: object
      required:
        - ts
        - requestId
        - component
        - componentId
        - event
      properties:
        ts:
          $ref: "#/components/schemas/Timestamp"
        requestId:
          $ref: "#/components/schemas/RequestId"
        clientRequestId:
          description: X-Request-Id sent by the AI client, recorded by the gateway only (C3). Untrusted, so limited to a log-safe alphabet (CC-031); the gateway drops a value that does not match instead of rejecting the call.
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        component:
          type: string
          enum:
            - gateway
            - broker
            - server
            - portal
        componentId:
          $ref: "#/components/schemas/ComponentId"
        event:
          type: string
          enum:
            - tool_call
            - policy_decision
            - credential_resolve
            - connection_change
            - confirmation
            - admin_change
            - authentication
            - authenticator
        sub:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          maxLength: 255
        backendUser:
          description: "Account in the target system read by whoami (C4.1, CC-101), for connection_change: the only trace of which account a user connected (CC-117). Same length limit as username. Never a secret. Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
          type: string
          pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,255}$
        client:
          type: string
          maxLength: 255
        filter:
          description: Normalized query of the endpoint filter of the request (CC-170, CC-174), only when the request carried one; absent without a filter. Made of system and tool names only, so it is neither a secret nor personal data. Carried by the gateway on tool_call, policy_decision, confirmation and credential_resolve; never by authentication, by servers or by the broker (they do not receive the filter, correlation is by requestId).
          $ref: "#/components/schemas/EndpointFilterQuery"
        server:
          $ref: "#/components/schemas/ServerId"
        tool:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        resource:
          type: object
          required:
            - type
            - id
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            id:
              description: "Resource id as the system knows it (Jira key, GitLab path, index name, page id). Free-form because ids of the five systems use different alphabets (slashes, dots, spaces in some service desks). Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031). The length limit counts code points; producers should keep ids below 512 characters. Independently of this, the audit JSON serializer must escape every control character and U+2028/U+2029."
              type: string
              pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,512}$
            parent:
              description: "Parent as <Namespace>::<Type>::<id>, e.g. Jira::Project::ABC (C8 example format). The id part has the same exclusions as resource.id: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
              type: string
              pattern: ^[A-Za-z]+::[A-Za-z]+::[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]+$
              maxLength: 600
          additionalProperties: false
        decision:
          type: string
          enum:
            - allow
            - deny
            - confirmation_pending
        reason:
          description: "Machine-readable reason, snake case. Known values: policy_forbid, not_granted, tool_disabled, user_confirmed, user_confirmed_no_preview, confirmation_expired, attempts_exhausted, authenticator_not_registered, authenticator_disabled, superseded, pending_exists, cancelled_by_owner, credential_required, step_up_required, rate_limited, rate_limited_user, rate_limited_client, rate_limited_tool, exchange_denied, system_not_configured, subject_token_invalid, credential_type_mismatch, risk_lowered_by_admin, user_purged, unused_cleanup, definition_changed, tool_not_served, definition_submitted, filter_scope, invalid_filter, filter_mismatch, policy_unavailable, policy_error. credential_type_mismatch: on the gateway (event credential_resolve, outcome error, errorCode internal_error; credentialType is the type the broker returned) the broker returned a type that is not in the set of types the gateway configuration allows for the system; on a server (event policy_decision or tool_call) the type in X-MCP-Credential-Type, sent by the gateway with X-MCP-Credential, is not in the set of the server's accepted credential types, is missing or is not one of the four types, or the server has none configured, and the check comes before Cedar, the grant probe and the resolvers: decision deny, outcome error, errorCode internal_error, the client learns nothing more (CC-166). For rate limits (gateway, CC-156) a refused call or request is recorded as tool_call (a tools/call) or policy_decision (any other MCP request) with decision deny, outcome denied, errorCode rate_limited and reason rate_limited_user, rate_limited_client (the pair user and AI client) or rate_limited_tool (the pair user and tool); the client is not told which limit applied, the administrator is. The gateway may aggregate excess events as for CC-125. For event credential_resolve (broker, gateway): exchange_denied (the IdP refused the token exchange, CC-157, outcome denied; the gateway records it on the tool_call event of the call it had allowed, decision allow, outcome denied, errorCode access_denied, which is the normative shape for the activity row, CC-165) and system_not_configured (the system is not configured in the broker, CC-158, outcome error) and subject_token_invalid (the subject token of a token exchange has the wrong audience, has expired or belongs to another sub than the internal JWT, CC-157, outcome denied). For event connection_change (broker): user_purged (the connection was removed by the offboarding purge, CC-155) and unused_cleanup (the connection was removed because it had not been used for the configured number of days, 180 by default, CC-155). Both offboarding purges (broker and gateway) emit one admin_change with reason user_purged and outcome ok for every call, also when nothing was removed and for an unknown sub, so that a call of mcp-offboarding always leaves a trace (CC-155). For event confirmation (gateway, CC-094): confirmation_pending is the decision when the pending call is created, and the outcome is one of user_confirmed (code accepted), user_confirmed_no_preview (accepted although the owner did not open the portal preview), confirmation_expired, attempts_exhausted, authenticator_not_registered, authenticator_disabled, code_burned (the retry carried a code of a burned step: confirmation_failed outwards, no attempt spent, not a wrong code, CC-128), cancelled_by_owner (the owner cancelled the pending call in the portal, CC-128; decision deny, errorCode confirmation_cancelled, emitted when the cancel is accepted and again when the cancelled call is retried), pending_exists (a new DESTRUCTIVE call was refused because another one is pending and its preview was opened; errorCode confirmation_blocked, CC-127), superseded (the pending DESTRUCTIVE call was replaced by a newer one of the same user, CC-127; emitted for the older call when the newer is created, and again when the older call is retried); user_declined and preview_not_viewed are not emitted since 3.0.0 (there is no decline, and the preview is optional). For event authenticator (broker, portal, CC-094): authenticator_enrollment_started, authenticator_registered, authenticator_enrollment_failed, authenticator_removed, authenticator_reset_by_admin (outcome ok or denied; the target user is sub), authenticator_seed_missing (the seed of a registered authenticator is gone from the secret store: the registration is reset to none, outcome error, errorCode upstream_unavailable, CC-142), authenticator_disabled (the daily limit of 20 wrong codes in 24 hours switched the authenticator off, CC-126; outcome denied) and, for the check of a code with decision allow or deny, totp_verified, totp_invalid, totp_replayed, totp_locked, totp_disabled, totp_burned (a code of a burned step: replayed for the broker but not a failure and not counted, CC-128), totp_steps_burned (the current codes were invalidated because the owner cancelled a pending operation or a new DESTRUCTIVE operation followed a viewed one, CC-128; outcome ok), totp_not_registered (these carry tool and client from the internal JWT). For event connection_change (broker) a failed revocation at the provider is recorded with reason provider_revoke_failed (the connection is deleted anyway, outcome error; CC-142). For tool_call and policy_decision: filter_scope (the tool exists and the user may call it, but the endpoint filter of the request leaves it out, decision deny, outcome denied, errorCode not_found_or_denied, CC-170), invalid_filter (the query of the request does not parse or exceeds a limit, policy_decision, decision deny, outcome error, without errorCode, CC-170), filter_mismatch (the filter of the request differs from the filter bound to the MCP session, policy_decision, decision deny, outcome denied, CC-172), policy_unavailable (no policy bundle is loaded, so nothing can be decided and the request is refused), policy_error (the policy engine failed on this request) definition_changed (the definition the server presents differs from the approved one, so the tool is hidden and refused with errorCode tool_disabled, CC-133) upstream_unavailable (on tool_call or policy_decision: a store behind the check, such as the counter of the limits, did not answer and the request was refused, CC-167) and tool_not_served (the approved tool is missing from the tools the server serves, so it is hidden and refused with errorCode tool_disabled, CC-161). definition_changed and tool_not_served are recorded on every refused call (not once per read) and when a read finds the difference there is no separate event. A failed read of the server's tools/list is not evidence of either: the gateway keeps its last successful read, and a call that needs a fresh read that fails is refused as upstream_unavailable without a call to the server. On a server policy_forbid is a refusal by policy (a forbid rule or no permit) and not_granted a resource that could not be resolved or has no grant (CC-141). Event admin_change records the administrative changes of the gateway and of the broker. For the registry, with reasons definition_registered (the pipeline registered a manifest and the definition was approved by that call: a READ_ONLY tool, CC-133), definition_submitted (the registration left a new or changed UPDATE or DESTRUCTIVE tool pending approval, CC-133), definition_approved (an administrator approved a pending definition; sub is the administrator and definitionHash the approved hash) and risk_lowered_by_admin (an administrator approved a risk lower than the floor with acceptRiskLowering; one event instead of definition_approved, with risk set to the new risk, CC-167), tool_removed (a tool left the registered manifest). For definition_approved the sub is the administrator; for user_purged it is the purged user, and the calling identity (the certificate CN mcp-offboarding) is not a field of this schema. Other reasons are not defined. For event authentication it is the rejection code: for the internal JWT (receiver: server, broker) one of the vectors (missing_token, bad_signature, unknown_kid, alg_not_allowed, wrong_issuer, wrong_audience, expired, replayed_jti, service_token_not_allowed, tool_mismatch, invalid_claims, lifetime_too_long, not_yet_valid, request_id_mismatch, tool_missing, tool_not_allowed, test_key_not_allowed, malformed); for the token of the AI client at the gateway (C1, CC-120): missing_token, malformed, bad_signature, unknown_kid, alg_not_allowed, wrong_issuer, wrong_audience, expired, not_yet_valid, invalid_claims, and for infrastructure failures client_certificate_rejected, jwks_unavailable, replay_store_unavailable (the last two with errorCode upstream_unavailable). The gateway also emits authentication for its own admin port (C5 /admin/v1 and /actuator/prometheus, CC-125): client_certificate_rejected for a client certificate that is missing, not from the internal CA, lacks the clientAuth purpose or has a CN that the operation does not allow, and the token reasons above for a BFF token that fails validation (aud mcp-gateway-admin). replay_store_unavailable is emitted only by receivers of the internal JWT (servers through the starter, the broker), never by the gateway. The gateway may aggregate or sample client_certificate_rejected on its admin port (for example one event per source address per minute, or a counter in its metrics) so that a scanner cannot flood the SIEM (CC-125)."
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        policyRevision:
          $ref: "#/components/schemas/PolicyRevision"
        credentialType:
          $ref: "#/components/schemas/CredentialType"
        outcome:
          type: string
          enum:
            - ok
            - error
            - denied
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        latencyMs:
          type: integer
          minimum: 0
        argsLength:
          description: Length in bytes of the serialized arguments; the only trace of arguments allowed in audit.
          type: integer
          minimum: 0
        definitionHash:
          description: "Hash of the tool definition an admin_change concerns (CC-133): for definition_approved the approved hash, for definition_registered the hash of each registered definition (one event per tool), for tool_removed the hash of the removed entry. Together with sub (the administrator) and tool it tells afterwards who approved which definition. Not a secret."
          $ref: "#/components/schemas/DefinitionHash"
      allOf:
        - description: "Authenticator events (CC-094) always say how they ended (outcome) and why (reason). The field list stays closed through additionalProperties: there is no field that could carry a code, a seed or an otpauth URI."
          if:
            properties:
              event:
                const: authenticator
            required:
              - event
          then:
            required:
              - outcome
              - reason
        - description: "Rejected authentication (CC-071, CC-120): emitted by a receiver of the internal JWT (server, broker) and by the gateway for the token of the AI client (C1). Closed list of fields (propertyNames): everything that comes from the claims of the unverified token (sub, username, client, tool, risk, resource, filter, policyRevision, credentialType) is forbidden, and so is any part of the token. Carries the rejection code in reason."
          if:
            properties:
              event:
                const: authentication
            required:
              - event
          then:
            required:
              - outcome
              - reason
            properties:
              outcome:
                const: denied
            if:
              properties:
                reason:
                  enum:
                    - jwks_unavailable
                    - replay_store_unavailable
              required:
                - reason
            then:
              required:
                - errorCode
              properties:
                errorCode:
                  const: upstream_unavailable
            propertyNames:
              enum:
                - ts
                - requestId
                - clientRequestId
                - component
                - componentId
                - event
                - server
                - decision
                - reason
                - outcome
                - errorCode
                - latencyMs
            allOf:
              - description: replay_store_unavailable belongs to receivers of the internal JWT (server, broker); the gateway has no replay store for tokens of the AI client (CC-125).
                if:
                  properties:
                    reason:
                      const: replay_store_unavailable
                  required:
                    - reason
                then:
                  properties:
                    component:
                      enum:
                        - server
                        - broker
      additionalProperties: false
