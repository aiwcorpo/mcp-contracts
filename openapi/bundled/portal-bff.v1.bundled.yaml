          description: Newest first; at most the retention window back (30 days by default, CC-134). X-Next-Cursor is present when more rows exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityCall"
              examples:
                recent:
                  value:
                    - requestId: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
                      ts: 2026-10-26T20:00:00.123Z
                      client: claude-code
                      filter: systems=jira&access=read
                      tool: jira__get_issue
                      risk: READ_ONLY
                      resource:
                        type: Jira::Issue
                        id: ABC-123
                        parent: Jira::Project::ABC
                      result: ok
