        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider when the user cancelled or the provider failed.
          schema:
            type: string
      responses:
        "302":
          description: Back to the portal.
          headers:
            Location:
              required: true
              schema:
