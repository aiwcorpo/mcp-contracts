                                  type: string
                                  maxLength: 255
                              required:
                                - issueKey
                                - summary
                              additionalProperties: false
                            annotations:
                              readOnlyHint: false
                              destructiveHint: false
                          definitionHash: sha256:6e93bf7a90b607d4b54e073b0d46ee942aca6932a4b67a84bafa75f8213f4a49
                          status: pending_approval
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/admin/registry/servers/{serverId}/tools/{tool}/pending:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - $ref: "#/components/parameters/Tool"
    get:
      tags:
        - admin
      operationId: getAdminPendingTool
      summary: Pending tool change for a diff (proxy to C5).
      security:
        - session: []
      responses:
        "200":
          description: Approved vs pending entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingTool"
              examples:
                new_tool:
                  value:
                    approvedEntry: null
                    pendingEntry:
                      name: update_issue
                      risk: UPDATE
                      action: update
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: update_issue
                        description: Updates the summary of an issue.
                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                            summary:
                              type: string
                              maxLength: 255
                          required:
                            - issueKey
                            - summary
                          additionalProperties: false
                        annotations:
                          readOnlyHint: false
                          destructiveHint: false
                      definitionHash: sha256:6e93bf7a90b607d4b54e073b0d46ee942aca6932a4b67a84bafa75f8213f4a49
                    pendingHash: sha256:6e93bf7a90b607d4b54e073b0d46ee942aca6932a4b67a84bafa75f8213f4a49
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/admin/registry/servers/{serverId}/tools/{tool}/approve:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - $ref: "#/components/parameters/Tool"
    post:
      tags:
        - admin
      operationId: approveAdminTool
      summary: Approve a pending tool definition (proxy to C5).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
            examples:
              approve:
                value:
                  definitionHash: sha256:6e93bf7a90b607d4b54e073b0d46ee942aca6932a4b67a84bafa75f8213f4a49
      responses:
        "204":
          description: Approved.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The definition changed again; reload the diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                hash_mismatch:
                  value:
                    error: hash_mismatch
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Session cookie set by the BFF after OIDC login (HttpOnly, Secure, SameSite=Lax).
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Value of the __Host-XSRF-TOKEN cookie (not HttpOnly, Secure, SameSite=Strict, Path=/, no Domain) set by the BFF (CC-055). Required for POST, PUT and DELETE.
  parameters:
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SystemId"
      example: jira
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ServerId"
      example: mcp-jira
    Tool:
      name: tool
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ToolName"
      example: update_issue
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      description: No valid session; the frontend navigates to GET /api/v1/auth/login (CC-023).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    StepUpOrUnauthenticated:
      description: No valid session, or the operation needs a fresh MFA login (step_up_required with stepUpUrl, CC-010).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/StepUpRequired"
              - $ref: "#/components/schemas/Error"
          examples:
            step_up_required:
              value:
                error: step_up_required
                stepUpUrl: /api/v1/auth/login?stepUp=true&returnPath=/catalog
    CsrfInvalid:
      description: Missing or wrong X-XSRF-TOKEN header (must equal the XSRF-TOKEN cookie).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            csrf_invalid:
              value:
                error: csrf_invalid
    Forbidden:
      description: Not an admin (mcp-platform-admin), or CSRF token invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            access_denied:
              value:
                error: access_denied
    NotFound:
      description: Does not exist or is not visible to the user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_found_or_denied:
              value:
                error: not_found_or_denied
    UpstreamUnavailable:
      description: "The broker, the gateway admin API or the IdP token exchange did not answer or answered with an error the BFF does not pass on (CC-050). No partial data: the catalog is either complete or 503. Upstream bodies are never forwarded."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            upstream_unavailable:
              value:
                error: upstream_unavailable
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C12 does not define.
      required:
        - error
      properties:
        error:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    StepUpRequired:
      type: object
      required:
        - error
        - stepUpUrl
      properties:
        error:
          const: step_up_required
        stepUpUrl:
          type: string
          format: uri-reference
          description: Where the browser goes to re-authenticate with max_age / acr_values; normally GET /api/v1/auth/login with stepUp=true. The returnPath inside it is a default; the frontend may replace it with any portal path that matches ReturnPath (e.g. back to the form), keeping stepUp=true (CC-048).
      additionalProperties: false
    LoginErrorCode:
      type: string
      description: Value of `loginError` in `/?loginError=<code>` after a failed login (CC-051). Closed list.
      enum:
        - cancelled
        - idp_error
        - session_expired
        - step_up_failed
    Me:
      type: object
      required:
        - username
        - displayName
        - groups
        - isAdmin
      properties:
        username:
          type: string
        displayName:
          type: string
        groups:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GroupName"
        isAdmin:
          type: boolean
          description: Member of mcp-platform-admin.
        mfaFreshUntil:
          description: Until when the last MFA authentication counts as fresh for step-up protected operations (CC-053). Absent when MFA is not fresh or unknown. Informational only; the BFF still enforces step-up on PUT secret and confirmations, so the frontend uses it to start step-up before showing a secret field.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    CatalogStatus:
      type: string
      enum:
        - connected
        - expiring
        - reconnect_required
        - not_connected
        - request_pending
        - no_access
    CatalogAction:
      type: string
      enum:
        - copy_link
        - connect_oauth
        - add_secret
        - reconnect
        - request_access
        - view_request
        - disconnect
    PortalCatalogServer:
      type: object
      required:
        - serverId
        - system
        - version
        - url
        - status
        - actions
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        url:
          type: string
          format: uri
          description: Full MCP endpoint https://<gateway>/s/<serverId>/mcp, used by copy_link (CC-021).
        status:
          $ref: "#/components/schemas/CatalogStatus"
        actions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CatalogAction"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTool"
      additionalProperties: false
    PortalCatalog:
      type: object
      required:
        - servers
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/PortalCatalogServer"
      additionalProperties: false
    ConnectOAuthRequest:
      type: object
      properties:
        returnPath:
          $ref: "#/components/schemas/ReturnPath"
      additionalProperties: false
    ConnectOAuthResponse:
      type: object
      required:
        - authorizeUrl
      properties:
        authorizeUrl:
          type: string
          format: uri
      additionalProperties: false
    AccessRequestStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled
    AccessRequest:
      type: object
      description: Shape of C13 AccessRequest (CC-024).
      required:
        - requestId
        - entitlement
        - status
        - createdAt
      properties:
        requestId:
          type: string
        entitlement:
          $ref: "#/components/schemas/GroupName"
        status:
          $ref: "#/components/schemas/AccessRequestStatus"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        requestUrl:
          type: string
          format: uri
          description: Page of the request in the IGA, when the adapter has one.
      additionalProperties: false
    AccessRequestCreate:
      type: object
      required:
        - entitlement
      properties:
        entitlement:
          $ref: "#/components/schemas/GroupName"
      additionalProperties: false
    AccessRequestResult:
      oneOf:
        - type: object
          required:
            - requestUrl
          properties:
            requestUrl:
              type: string
              format: uri
          additionalProperties: false
        - type: object
          required:
            - requestId
          properties:
            requestId:
              type: string
          additionalProperties: false
    ClientConfigs:
      type: object
      description: Ready-to-paste configuration for supported AI clients.
      required:
        - claudeCode
        - copilot
        - codex
      properties:
        claudeCode:
          type: string
        copilot:
          type: string
        codex:
          type: string
      additionalProperties: false
    PortalVirtualServer:
      allOf:
        - $ref: "#/components/schemas/VirtualServerFields"
      type: object
      required:
        - clientConfigs
      properties:
        clientConfigs:
          $ref: "#/components/schemas/ClientConfigs"
      unevaluatedProperties: false
    VirtualServerFields:
      type: object
      description: Same fields as C5 VirtualServer.
      required:
        - slug
        - displayName
        - tools
        - url
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        displayName:
          type: string
        tools:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/QualifiedToolName"
        resourceDefaults:
          $ref: "#/components/schemas/ResourceDefaults"
        url:
          type: string
          format: uri
    PortalVirtualServerCreated:
      type: object
      required:
        - slug
        - url
        - clientConfigs
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        url:
          type: string
          format: uri
        clientConfigs:
          $ref: "#/components/schemas/ClientConfigs"
      additionalProperties: false
    ReturnPath:
      type: string
      description: Relative path inside the portal, optionally with a query. No percent-encoding at all (portal paths do not need it), no backslash, no absolute or protocol-relative URL, so no number of decoding passes can turn it into //host (open redirect, CC-032). The BFF redirects only to the validated value as is, without decoding it.
      pattern: ^/(?!/)[A-Za-z0-9._~!$&'()*+,;=:@/?-]*$
      maxLength: 512
    GroupName:
      description: Group / entitlement name from C9. Only the mcp- prefix is used by the platform.
      type: string
      pattern: ^mcp-[A-Za-z0-9][A-Za-z0-9._-]*$
      maxLength: 255
    Timestamp:
      description: ISO 8601 date-time in UTC (suffix Z).
      type: string
      format: date-time
      pattern: Z$
    ServerId:
      description: MCP server id; always mcp-<system>, one server per system (C5).
      type: string
      enum:
        - mcp-jira
        - mcp-confluence
        - mcp-gitlab
        - mcp-servicedesk
        - mcp-opensearch
    SystemId:
      description: Target system identifier, lower case (01-contracts conventions).
      type: string
      enum:
        - jira
        - confluence
        - gitlab
        - servicedesk
        - opensearch
    SemVer:
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
    QualifiedToolName:
      description: "Tool name as seen by MCP clients, in C5 and C12: <system>__<tool>."
      type: string
      pattern: ^(jira|confluence|gitlab|servicedesk|opensearch)__[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 80
    Risk:
      type: string
      enum:
        - READ_ONLY
        - UPDATE
        - DESTRUCTIVE
    ToolAction:
      description: Cedar action evaluated by the server on the resolved resource (C6, C7).
      type: string
      enum:
        - read
        - update
        - delete
        - admin
    Access:
      type: string
      enum:
        - granted
        - denied
    CatalogTool:
      type: object
      required:
        - name
        - description
        - risk
        - action
        - access
        - requiredEntitlements
      properties:
        name:
          $ref: "#/components/schemas/QualifiedToolName"
        description:
          type: string
          description: definition.description of the approved manifest entry (CC-005, CC-014).
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        access:
          $ref: "#/components/schemas/Access"
        requiredEntitlements:
          description: Groups (C9) that grant this tool according to policy; empty when policy names none.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GroupName"
      additionalProperties: false
    CredentialType:
      type: string
      enum:
        - user-oauth
        - user-secret
        - token-exchange
        - service-account
    ConnectionStatus:
      type: string
      description: expiring = expires in less than 7 days.
      enum:
        - connected
        - expiring
        - expired
        - revoked
        - error
    Connection:
      type: object
      required:
        - system
        - type
        - status
        - backendUser
        - expiresAt
        - connectedAt
        - lastUsedAt
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        type:
          $ref: "#/components/schemas/CredentialType"
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          type: string
          description: User name in the target system confirmed by whoami (C4.1).
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        connectedAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    PutSecretRequest:
      type: object
      required:
        - secret
      properties:
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Single token (PAT or API key), never login and password (CC-049).
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PutSecretResponse:
      type: object
      required:
        - status
        - backendUser
        - expiresAt
      properties:
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          type: string
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    PutSecretError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - secret_invalid
            - identity_mismatch
      additionalProperties: false
    ConfirmationId:
      description: Opaque, unguessable id of a pending confirmation (C11); used in URL paths.
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    ConfirmationArgument:
      type: object
      required:
        - name
        - value
        - truncated
      properties:
        name:
          type: string
        value:
          type: string
          description: JSON serialization of the argument value, cut to a gateway limit when truncated is true.
        truncated:
          type: boolean
      additionalProperties: false
    ConfirmationView:
      type: object
      required:
        - confirmationId
        - tool
        - arguments
        - expiresAt
      properties:
        confirmationId:
          $ref: "#/components/schemas/ConfirmationId"
        tool:
          $ref: "#/components/schemas/QualifiedToolName"
        arguments:
          description: Arguments sorted by name (fixed order), without confirmation_code.
          type: array
          items:
            $ref: "#/components/schemas/ConfirmationArgument"
        expiresAt:
          description: End of the confirmation TTL (C11, 120 s after creation); the portal shows a countdown.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    ConfirmationDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - approve
            - decline
      additionalProperties: false
    VirtualServerSlug:
      description: Virtual server slug; used in the URL path /v/<slug>/mcp (C5).
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    JiraProjectKey:
      description: "Jira Data Center project key: first character an upper-case letter, then upper-case letters, digits or underscore (Jira project key format rules; hyphens not supported). Length 2..10 (Jira default maximum project key size; configurable in Jira, a larger limit needs a contract change)."
      type: string
      pattern: ^[A-Z][A-Z0-9_]{1,9}$
    JiraProjectKeys:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/JiraProjectKey"
    ConfluenceSpaceKey:
      description: "Confluence Data Center space key of a global space: letters and digits only. Personal spaces (~user) cannot be granted or narrowed."
      type: string
      pattern: ^[A-Za-z0-9]{1,255}$
    ConfluenceSpaceKeys:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ConfluenceSpaceKey"
    GitLabGroupPath:
      description: "Full path of a GitLab group: 1..20 segments separated by / (subgroups nest up to 20 levels). A segment has only letters, digits, _, . and -, starts and ends with a letter or digit and has no consecutive special characters; the path does not end in .git or .atom (GitLab reserved names / path rules)."
      type: string
      pattern: ^(?!.*\.(?:git|atom)$)[A-Za-z0-9](?:[._-]?[A-Za-z0-9])*(?:/[A-Za-z0-9](?:[._-]?[A-Za-z0-9])*){0,19}$
      maxLength: 1024
    GitLabGroupPaths:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/GitLabGroupPath"
    OpenSearchIndexPrefix:
      description: "Grantable index prefix: OpenSearchIndexName that does not end with '-' or '.'. Covers the index named exactly like the prefix and every index starting with '<prefix>-'."
      type: string
      pattern: ^(?!\.{1,2}$)[a-z0-9.][a-z0-9._-]{0,253}[a-z0-9_]$|^[a-z0-9]$
    OpenSearchIndexPrefixes:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/OpenSearchIndexPrefix"
    ServiceDeskQueueId:
      description: "Queue id of the generic service desk adapter (D10): conservative alphabet, to be made configurable per adapter in a later version."
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
    ServiceDeskQueueIds:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ServiceDeskQueueId"
    ResourceDefaults:
      type: object
      description: Narrowing per resource type (C5). Becomes the vsc claim and context.vsScopes in Cedar (cedar/entity-builder.md). Ids follow the per-system patterns of common.schema.json (OpenSearch::Index takes index prefixes). At most 50 ids per type keep the internal JWT small.
      properties:
        Jira::Project:
          $ref: "#/components/schemas/JiraProjectKeys"
        Confluence::Space:
          $ref: "#/components/schemas/ConfluenceSpaceKeys"
        GitLab::Group:
          $ref: "#/components/schemas/GitLabGroupPaths"
        OpenSearch::Index:
          $ref: "#/components/schemas/OpenSearchIndexPrefixes"
        ServiceDesk::Queue:
          $ref: "#/components/schemas/ServiceDeskQueueIds"
      additionalProperties: false
    VirtualServerCreate:
      type: object
      required:
        - slug
        - displayName
        - tools
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        tools:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/QualifiedToolName"
        resourceDefaults:
          $ref: "#/components/schemas/ResourceDefaults"
      additionalProperties: false
    RequestId:
      description: UUIDv7 request id (C2 rid, X-Request-Id).
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ComponentId:
      description: Identifier of a platform component, e.g. mcp-gateway, mcp-credential-broker, mcp-jira.
      type: string
      pattern: ^mcp-[a-z0-9]+(-[a-z0-9]+)*$
      maxLength: 64
    ToolName:
      description: Server-side tool name (without the gateway prefix). Snake case; a double underscore is forbidden because the gateway uses it as the <system>__<tool> separator (C5).
      type: string
      pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 64
    ResourceType:
      description: Cedar entity type of a system resource (C7).
      type: string
      enum:
        - Jira::Project
        - Jira::Issue
        - Confluence::Space
        - Confluence::Page
        - GitLab::Group
        - GitLab::Project
        - OpenSearch::Index
        - ServiceDesk::Queue
        - ServiceDesk::Ticket
    PolicyRevision:
      description: Policy bundle revision YYYYMMDDHHMMSS-<sha7> (C7). Ordered by the timestamp part.
      type: string
      pattern: ^[0-9]{14}-[0-9a-f]{7}$
    ErrorCode:
      description: Client-visible error codes (C10).
      type: string
      enum:
        - unauthenticated
        - access_denied
        - tool_disabled
        - confirmation_required
        - confirmation_failed
        - confirmation_declined
        - credential_required
        - not_found_or_denied
        - invalid_argument
        - rate_limited
        - step_up_required
        - upstream_unavailable
        - internal_error
    ResourceRef:
      type: object
      required:
        - argument
        - type
      properties:
        argument:
          description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 64
        type:
          $ref: "#/components/schemas/ResourceType"
      additionalProperties: false
    McpToolDefinition:
      description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential. title is hashed like description (CC-042); icons and _meta are not allowed in v1, because they would reach the client without being pinned.
      type: object
      required:
        - name
        - description
        - inputSchema
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        title:
          type: string
          minLength: 1
          description: Display name shown by MCP clients; part of definitionHash (CC-042).
        description:
          type: string
          minLength: 1
        inputSchema:
          type: object
          description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11).
        outputSchema:
          type: object
        annotations:
          type: object
      additionalProperties: false
    DefinitionHash:
      description: sha256:<hex> over the RFC 8785 canonical JSON described in C6 (see test-vectors/definition-hash).
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ToolEntryFields:
      description: Fields of a manifest tool entry, open for composition (used by the gateway registry API).
      type: object
      required:
        - name
        - risk
        - action
        - resourceRefs
        - definition
        - definitionHash
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        resourceRefs:
          description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        definition:
          $ref: "#/components/schemas/McpToolDefinition"
        definitionHash:
          description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
          $ref: "#/components/schemas/DefinitionHash"
    RegistryToolStatus:
      type: string
      enum:
        - approved
        - pending_approval
    RegistryTool:
      description: Manifest tool entry (C6) with its approval status. Pending entries are shown when present.
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/RegistryToolStatus"
      unevaluatedProperties: false
    RegistryServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/RegistryTool"
      additionalProperties: false
    ToolEntry:
      description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
      type: object
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      unevaluatedProperties: false
    PendingTool:
      type: object
      required:
        - approvedEntry
        - pendingEntry
        - pendingHash
      properties:
        approvedEntry:
          description: Currently approved entry; null for a new tool.
          oneOf:
            - $ref: "#/components/schemas/ToolEntry"
            - type: "null"
        pendingEntry:
          $ref: "#/components/schemas/ToolEntry"
        pendingHash:
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
    ApproveRequest:
      type: object
      required:
        - definitionHash
      properties:
        definitionHash:
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
    AuditEvent:
      title: Audit event (C8)
      description: One JSON object per line on a dedicated logger/appender shipped to the SIEM. Never contains argument values, tool results, secrets or confirmation codes; additionalProperties is false so such fields cannot be added by accident. Target system of broker events is carried in 'server' (mcp-<system>). The serializer must escape control characters, U+2028 and U+2029 in every string value.
      type: object
      required:
        - ts
        - requestId
        - component
        - componentId
        - event
      properties:
        ts:
          $ref: "#/components/schemas/Timestamp"
        requestId:
          $ref: "#/components/schemas/RequestId"
        clientRequestId:
          description: X-Request-Id sent by the AI client, recorded by the gateway only (C3). Untrusted, so limited to a log-safe alphabet (CC-031); the gateway drops a value that does not match instead of rejecting the call.
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        component:
          type: string
          enum:
            - gateway
            - broker
            - server
            - portal
        componentId:
          $ref: "#/components/schemas/ComponentId"
        event:
          type: string
          enum:
            - tool_call
            - policy_decision
            - credential_resolve
            - connection_change
            - confirmation
            - admin_change
        sub:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          maxLength: 255
        client:
          type: string
          maxLength: 255
        virtualServer:
          $ref: "#/components/schemas/VirtualServerSlug"
        server:
          $ref: "#/components/schemas/ServerId"
        tool:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        resource:
          type: object
          required:
            - type
            - id
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            id:
              description: Resource id as the system knows it (Jira key, GitLab path, index name, page id). Free-form because ids of the five systems use different alphabets (slashes, dots, spaces in some service desks), but C0 and C1 control characters, DEL, U+2028, U+2029 and the bidirectional controls U+202A..U+202E and U+2066..U+2069 are excluded so the line-oriented SIEM format and log viewers cannot be misled (CC-031). The length limit counts UTF-16 code units (JSON Schema validators in Java and JavaScript); producers should keep ids below 512 characters. Independently of this, the audit JSON serializer must escape every control character and U+2028/U+2029.
              type: string
              pattern: ^[^\u0000-\u001f\u007f-\u009f\u2028\u2029\u202a-\u202e\u2066-\u2069]{1,512}$
            parent:
              description: Parent as <Namespace>::<Type>::<id>, e.g. Jira::Project::ABC (C8 example format).
              type: string
              pattern: ^[A-Za-z]+::[A-Za-z]+::.+$
              maxLength: 600
          additionalProperties: false
        decision:
          type: string
          enum:
            - allow
            - deny
            - confirmation_pending
        reason:
          description: "Machine-readable reason, snake case. Known values: policy_forbid, not_granted, tool_disabled, user_confirmed, user_declined, confirmation_expired, credential_required, step_up_required, rate_limited."
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        policyRevision:
          $ref: "#/components/schemas/PolicyRevision"
        credentialType:
          $ref: "#/components/schemas/CredentialType"
        outcome:
          type: string
          enum:
            - ok
            - error
            - denied
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        latencyMs:
          type: integer
          minimum: 0
        argsLength:
          description: Length in bytes of the serialized arguments; the only trace of arguments allowed in audit.
          type: integer
          minimum: 0
      additionalProperties: false
