      operationId: oauthCallback
      summary: redirect_uri registered at OAuth providers.
      description: |
        The BFF checks that the flow belongs to the current session, calls C4 oauth/complete and redirects to
        `returnPath` with `connected=<system>` appended (`?` when returnPath has no query, `&` otherwise). On
        failure it appends `connectError=<code>` the same way, code `identity_mismatch`, `flow_invalid` or
