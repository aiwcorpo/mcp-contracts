paths:
  /admin/v1/catalog:
    get:
      tags:
        - catalog
      operationId: getCatalog
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Registered servers and tools with the current user's access computed from policy.
      description: |
        When the gateway cannot read the state of the emergency switches (CC-194) the catalog is not computed from a guess: the answer is `503 upstream_unavailable` with `Retry-After`, never a catalog that shows a switched tool as available (fail-closed, CC-224).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: Approved tools of all registered servers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
              examples:
                jira_reader:
                  value:
                    servers:
                      - serverId: mcp-jira
                        system: jira
                        version: 1.4.0
                        tools:
                          - name: jira__get_issue
                            title: Pobranie zgłoszenia
                            description: Returns one Jira issue by key.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements:
                              - mcp-jira-read
                          - name: jira__update_issue
                            description: Updates the summary of an issue.
                            risk: UPDATE
                            action: update
                            access: denied
                            requiredEntitlements:
                              - mcp-jira-write
                          - name: jira__delete_issue
                            title: Usunięcie zgłoszenia
                            description: Deletes an issue permanently.
                            risk: DESTRUCTIVE
                            action: delete
                            access: denied
                            requiredEntitlements:
                              - mcp-jira-destructive
                            requiresConfirmation: true
                      - serverId: mcp-gitlab
                        system: gitlab
                        version: 1.0.0
                        tools:
                          - name: gitlab__get_project
                            description: Returns one GitLab project by path.
                            risk: READ_ONLY
                            action: read
                            access: denied
                            requiredEntitlements:
                              - mcp-gitlab-read
                            disabled: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/KillSwitchStoreUnavailable"
