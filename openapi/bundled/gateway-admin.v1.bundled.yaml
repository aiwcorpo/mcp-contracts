                    - name: get_issue
                      risk: READ_ONLY
                      action: read
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: get_issue
                        title: Get issue
                        description: Returns one Jira issue by key.
                        inputSchema:
                          type: object
