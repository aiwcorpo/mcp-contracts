          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Override"
              examples:
                block_drop_table:
                  value:
                    id: block-drop-table
                    target: all-servers
                    text: forbid (principal, action, resource is Tool) when { resource.name == "drop_table" };
                    setBy: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
                    setAt: 2026-11-06T09:30:00Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The text is not a valid forbid-only override for its target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideRejected"
              examples:
                permit:
                  value:
                    error: override_rejected
                    reason: not_forbid
                    message: an override is forbid only
    delete:
      tags:
        - policy
      operationId: deleteOverride
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Remove an emergency override (group mcp-platform-admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/registry/servers/{serverId}/policies/pending:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags:
        - registry
      operationId: getPendingServerPolicies
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Policies of a server waiting for approval, next to the approved ones (admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: Approved versus pending policies, for the diff the administrator reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingPolicies"
              examples:
                first_registration:
                  value:
                    approvedHash: null
                    approvedPolicies: null
                    pendingHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
                    pendingVersion: 1.4.0
                    source: ci
                    pendingPolicies:
                      namespace: Jira
                      schema: |
                        namespace Jira {
                          entity Project { key: String, category: String, scopes: Set<ResourceScope> };
                          entity Issue in [Project] { key: String, project: Project, scopes: Set<ResourceScope> };
                          action "read", "update" appliesTo { principal: [User], resource: [Project, Issue], context: RequestContext };
                        }
                      files:
                        - name: read.cedar
                          text: |
                            @id("jira-read")
                            permit (principal in UserGroup::"mcp-jira-read", action == Jira::Action::"read", resource);
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/registry/servers/{serverId}/policies/approve:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags:
        - registry
      operationId: approveServerPolicies
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Approve the pending policies of a server (group mcp-platform-admin).
      description: |
        `policiesHash` must equal the current pending hash, otherwise 409 and nothing changes. After the approval the
        policies are the ones served to the server in the policy data and the tools of the server follow their own approvals
        again. The audit event is `admin_change` with reason `policies_approved`.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovePoliciesRequest"
            examples:
              approve:
                value:
                  policiesHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
      responses:
        "204":
          description: Approved.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: policiesHash differs from the pending hash (the policies changed again, or nothing is pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                hash_mismatch:
                  value:
                    error: hash_mismatch
  /internal/v1/policy-data:
    get:
      tags:
        - policy
      operationId: getPolicyData
      x-allowed-client-cn:
        - "{registeredServerId}"
      summary: Policy data for a server (internal TLS port).
      description: |
        For servers, not for people. The certificate must come from the internal CA and its CN must be the `serverId` of a
        server in the registry; any other CN is `403`. The answer is the administrator data a server needs to evaluate its
        own policies: the scope mapping, the allowed AI clients (`azp`, from the configuration of the gateway) and the
        overrides that target this server or all servers (overrides for the gateway are not sent). The data is served with
        an `ETag` (the revision, quoted); a client repeats the call with `If-None-Match` and gets `304` while nothing changed.
        The internal JWT carries the revision as `prv`: a server that sees a newer one than it holds refreshes at once and
        keeps polling at an interval it configures. A server that has no data it can use refuses its calls as
        `upstream_unavailable` (C10).
      security:
        - mtls: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the data the server holds.
          schema:
            type: string
            maxLength: 64
          example: '"20261106093000-a1b2c3d"'
      responses:
        "200":
          description: The policy data.
          headers:
            ETag:
              description: The revision of the data, quoted.
              required: true
              schema:
                type: string
                pattern: ^"[0-9]{14}-[0-9a-f]{7}"$
              example: '"20261106093000-a1b2c3d"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyData"
              examples:
                for_a_server:
                  value:
                    revision: 20261106093000-a1b2c3d
                    scopeMapping:
                      - group: mcp-jira-proj-ABC
                        scopes:
                          - Jira::Project/ABC
                    allowedClients:
                      - claude-code
                      - claude-ai
                    overrides:
                      - id: block-drop-table
                        text: forbid (principal, action, resource is Tool) when { resource.name == "drop_table" };
        "304":
          description: The server already holds this revision.
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/policy/status:
    get:
      tags:
        - policy
      operationId: getPolicyStatus
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Revision of the policy data that each gateway instance serves (admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: One entry per running instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyStatus"
              examples:
                two_instances:
                  value:
                    instances:
                      - instanceId: mcp-gateway-0
                        revision: 20261026120000-a1b2c3d
                      - instanceId: mcp-gateway-1
                        revision: 20261026120000-a1b2c3d
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  headers:
    NoStore:
      description: Required on responses carrying the arguments of a pending call (CC-091); intermediaries and clients must not cache them.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
      example: no-cache
    DocumentETag:
      description: Version of the document (quoted opaque token); the next write sends it in If-Match.
      required: true
      schema:
        type: string
        pattern: ^"[A-Za-z0-9_-]{8,128}"$
      example: '"Zx8Tq2LmWk93vNpA"'
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate from the internal CA; CN=mcp-portal-bff for BFF calls, CN=mcp-registry-ci-<serverId> for registry writes (one certificate per server pipeline).
    bffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User token exchanged in the IdP (RFC 8693) for aud=mcp-gateway-admin.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the document the change is based on.
      schema:
        type: string
        pattern: ^"[A-Za-z0-9_-]{8,128}"$
      example: '"Zx8Tq2LmWk93vNpA"'
    OverrideId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OverrideId"
      example: block-drop-table
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ServerId"
      example: mcp-jira
    Tool:
      name: tool
      in: path
      required: true
      description: Server-side tool name (without the system prefix).
      schema:
        $ref: "#/components/schemas/ToolName"
      example: update_issue
    ConfirmationId:
      name: confirmationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConfirmationId"
      example: cnf_4k9Qe2LxW7tB3mZp
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    ServerRejected:
      description: The settings are inconsistent (7.0.0).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServerRejected"
          examples:
            server_id_mismatch:
              value:
                error: server_rejected
                reason: server_id_mismatch
                message: serverId must be mcp-<system>
    KillSwitchStoreUnavailable:
      description: The gateway cannot read or store the emergency switches (fail-closed). A switch is never reported as on when it could not be stored; a call that needs the state of the switches is refused as upstream_unavailable.
      headers:
        Retry-After:
          description: Seconds to wait before repeating the call.
          schema:
            type: integer
            minimum: 1
          example: 10
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unavailable:
              value:
                error: upstream_unavailable
    BadRequest:
      description: Malformed request or schema violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      description: Missing or invalid token or client certificate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    Forbidden:
      description: Caller lacks mcp-platform-admin or uses the wrong client certificate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            access_denied:
              value:
                error: access_denied
    NotFound:
      description: Does not exist or is not visible to the caller (not_found_or_denied).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_found_or_denied:
              value:
                error: not_found_or_denied
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C5 does not define.
      required:
        - error
      properties:
        error:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    KillSwitchRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Why the switch is on, free text of the administrator. Kept in the registry and shown in the portal; never part of an audit event and untrusted text for the UI like every administrator text (CC-094 rules). The portal BFF rejects a reason that contains hidden or control characters (text hygiene rules) with `400 invalid_request`, because the administrator types it and such a character is almost certainly a mistake; the gateway keeps its own range check (CC-210).
      additionalProperties: false
    KillSwitch:
      type: object
      required:
        - scope
        - serverId
        - setBy
        - setAt
        - reason
      properties:
        scope:
          type: string
          enum:
            - server
            - tool
        serverId:
          $ref: "#/components/schemas/ServerId"
        tool:
          description: Present exactly when scope is tool.
          $ref: "#/components/schemas/ToolName"
        setBy:
          description: sub of the administrator who put the switch.
          type: string
          minLength: 1
          maxLength: 255
        setAt:
          $ref: "#/components/schemas/Timestamp"
        reason:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    KillSwitchList:
      type: object
      required:
        - switches
      properties:
        switches:
          type: array
          items:
            $ref: "#/components/schemas/KillSwitch"
      additionalProperties: false
    DisabledBy:
      type: string
      enum:
        - kill_switch
        - approval
        - configuration
      description: Why a tool or server is disabled, present only when disabled is true (CC-194). kill_switch is an emergency switch of an administrator, approval a definition waiting for approval or classification, configuration the gateway configuration or an overrides policy. When more than one applies the first of the list is shown.
    ManifestRejected:
      type: object
      description: 422 of a registration or an approval (CC-133). reason is a known value or absent for the older rejections (a hash that does not match, a rule of the manifest).
      required:
        - error
      properties:
        error:
          const: manifest_rejected
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Known values are policies_invalid, resource_types_invalid and namespace_conflict (7.0.0, see registerServer), risk_lowered, environment_mismatch (CC-138), credential_type_mismatch (CC-159), adapter_mode_mismatch (CC-206; adapter manifest on the channel of the pipeline, or the reverse, or a server not in adapter mode), classification_required (CC-193; an entry with source adapter is approved without risk and action) and classification_not_allowed (CC-193; risk or action sent for an entry that is not from an adapter; CC-227, a risk other than READ_ONLY for an entry from an adapter) and classification_inconsistent (CC-207; risk and action that do not fit each other). A client must show an unknown value as a generic message.
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    Access:
      type: string
      enum:
        - granted
        - denied
    CatalogTool:
      type: object
      required:
        - name
        - description
        - risk
        - action
        - access
        - requiredEntitlements
      properties:
        name:
          $ref: "#/components/schemas/QualifiedToolName"
        description:
          type: string
          description: definition.description of the approved manifest entry (CC-005, CC-014).
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        access:
          $ref: "#/components/schemas/Access"
        requiredEntitlements:
          description: Groups (C9) that grant this tool according to policy; empty when policy names none.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GroupName"
        title:
          type: string
          minLength: 1
          description: definition.title of the approved manifest entry (CC-042, CC-082), a short display name for the UI. Absent when the tool has no title; the UI then falls back to description.
        disabled:
          type: boolean
          default: false
          description: True when an administrator disabled the tool or its server (C10 tool_disabled; a hash pending approval counts) (CC-081).
        disabledBy:
          $ref: "#/components/schemas/DisabledBy"
        requiresConfirmation:
          type: boolean
          default: false
          description: True when every call needs a confirmation (C11), risk DESTRUCTIVE or a policy requires it. Computed by the gateway (CC-081).
      additionalProperties: false
    CatalogServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTool"
      additionalProperties: false
    Catalog:
      type: object
      required:
        - servers
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogServer"
      additionalProperties: false
    RegistryToolStatus:
      type: string
      enum:
        - approved
        - pending_approval
    RegistryTool:
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      type: object
      required:
        - status
      description: Manifest tool entry (C6) with its approval status. Pending entries are shown when present. risk and action are always present except on a pending entry whose source is adapter (CC-193); an approved adapter tool has the classification of the administrator in them.
      properties:
        classifiedBy:
          description: sub of the administrator who classified the tool; present only for a tool of an adapter that was classified (CC-193).
          type: string
          minLength: 1
          maxLength: 255
        classifiedAt:
          description: When the tool was classified (CC-193).
          $ref: "#/components/schemas/Timestamp"
        status:
          $ref: "#/components/schemas/RegistryToolStatus"
        change:
          type: string
          enum:
            - new
            - changed
          description: Present exactly when status is pending_approval. new means no approved entry exists, changed means an approved entry exists and differs (CC-097).
        source:
          type: string
          enum:
            - ci
            - server
            - adapter
          description: Present exactly when status is pending_approval (CC-162, CC-193); same meaning as PendingTool.source.
        riskLowered:
          type: boolean
          description: True when the pending entry has a risk below the risk floor (CC-167). The tool is hidden and refused as tool_disabled, and only an administrator can approve it, with acceptRiskLowering true. Absent means false.
        approvedInVersion:
          description: Version of the manifest at which the approved entry was approved; null for a new tool that has no approved entry. Absent only for an approved tool whose version was not recorded before this field existed (CC-097).
          oneOf:
            - $ref: "#/components/schemas/SemVer"
            - type: "null"
      unevaluatedProperties: false
    RegistryServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        enabled:
          type: boolean
          default: true
          description: False when the server is disabled in gateway configuration or by an overrides policy, or when its held manifest fails the checks at start (CC-159). All tools of a disabled server report disabled=true in the catalog (CC-081, CC-088). Read only here; the emergency switch of a server is a separate resource (CC-194).
        policiesStatus:
          description: approved when the policies of the manifest are the approved ones; pending_approval when they changed or were never approved, and the tools of the server are blocked (7.0.0). Absent for an adapter, which has no policies.
          type: string
          enum:
            - approved
            - pending_approval
        policiesHash:
          description: policiesHash of the approved policies; absent until the first approval.
          $ref: "#/components/schemas/DefinitionHash"
        pendingPoliciesHash:
          description: policiesHash waiting for approval; present exactly with policiesStatus pending_approval.
          $ref: "#/components/schemas/DefinitionHash"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/RegistryTool"
      additionalProperties: false
    AdapterRegistryTool:
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      type: object
      required:
        - status
      description: A tool in the answer to the adapter (CC-207). The same as RegistryTool without classifiedBy and classifiedAt - an adapter is the sidecar of a foreign server and has no business with the identity of administrators. risk and action are present only for a tool that was classified earlier.
      properties:
        status:
          $ref: "#/components/schemas/RegistryToolStatus"
        change:
          type: string
          enum:
            - new
            - changed
        source:
          type: string
          enum:
            - adapter
        riskLowered:
          type: boolean
        approvedInVersion:
          oneOf:
            - $ref: "#/components/schemas/SemVer"
            - type: "null"
      unevaluatedProperties: false
    AdapterRegistryServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AdapterRegistryTool"
      additionalProperties: false
    PendingTool:
      type: object
      required:
        - approvedEntry
        - pendingEntry
        - pendingHash
        - pendingVersion
        - source
      properties:
        approvedInVersion:
          description: Version of the manifest at which approvedEntry was approved; null when approvedEntry is null (CC-097).
          oneOf:
            - $ref: "#/components/schemas/SemVer"
            - type: "null"
        pendingVersion:
          description: Version of the manifest in which the pending entry appeared (CC-097). For source server it is the version the server reported in initialize, a value the server controls, so the administrator sees it together with source.
          $ref: "#/components/schemas/SemVer"
        riskLowered:
          type: boolean
          description: True when the pending entry has a risk below the risk floor, the highest risk ever reported for the tool (CC-167); approve needs acceptRiskLowering true then. Absent means false.
        source:
          type: string
          enum:
            - ci
            - server
            - adapter
          description: Where the pending entry comes from (CC-162, CC-193). ci is an entry left by a PUT of the pipeline (the reviewed commit); server is a definition that the running server presented; adapter is an entry that an adapter (the sidecar of a foreign MCP server) presented at startup, never approved automatically and without risk and action until an administrator classifies it. A server entry never replaces a ci entry, see the README, "Rejestr i przypinanie definicji".
        approvedEntry:
          description: Currently approved entry; null for a new tool. For an adapter tool it carries the classification of the administrator.
          oneOf:
            - $ref: "#/components/schemas/ToolEntry"
            - type: "null"
        pendingEntry:
          description: The pending entry. Without risk and action when source is adapter (CC-193).
          oneOf:
            - $ref: "#/components/schemas/ToolEntry"
            - $ref: "#/components/schemas/AdapterToolEntry"
        pendingHash:
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
    ApproveRequest:
      type: object
      required:
        - definitionHash
      properties:
        definitionHash:
          $ref: "#/components/schemas/DefinitionHash"
        acceptRiskLowering:
          type: boolean
          default: false
          description: Only an administrator (mcp-platform-admin) can set it, and only through this operation; the pipeline (PUT) never lowers a risk, and the portal asks for a fresh MFA first. Sent only when true. On an entry that lowers nothing it is ignored (definition_approved). Without it an entry that lowers the risk floor is 422 risk_lowered; with it the lower risk is approved, the floor becomes that risk and the audit event is admin_change with reason risk_lowered_by_admin (CC-167).
        risk:
          $ref: "#/components/schemas/Risk"
          description: Classification by the administrator (CC-193). Required for an entry with source adapter, which has no risk, and for such an entry only READ_ONLY is accepted (an adapter is read only, CC-227, any other value is 422 manifest_rejected, reason classification_not_allowed); forbidden for any other entry (the same 422). The classification is data of the registry, outside definitionHash; lowering a classification given earlier needs acceptRiskLowering like any lowering (CC-167).
        action:
          $ref: "#/components/schemas/ToolAction"
          description: Cedar action given by the administrator together with risk (CC-193); required and forbidden under the same conditions as risk; for an adapter it fits READ_ONLY, so it is read.
      additionalProperties: false
    ActivityCall:
      type: object
      required:
        - requestId
        - ts
        - tool
        - result
      properties:
        requestId:
          description: requestId of the first request of the call (the one that created a pending confirmation, if any).
          $ref: "#/components/schemas/RequestId"
        ts:
          description: Time of that first request.
          $ref: "#/components/schemas/Timestamp"
        client:
          type: string
          maxLength: 255
          description: Client id (azp), e.g. claude-code; the UI maps it to a display name.
        filter:
          description: Normalized filter of the address the call was made on (CC-174); absent when the address had no filter. Its entries have the syntax of system ids and tool names but are chosen by the client and not checked against the platform's systems and tools (CC-186).
          $ref: "#/components/schemas/EndpointFilterQuery"
        tool:
          $ref: "#/components/schemas/QualifiedToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        resource:
          description: Same shape and limits as resource in the audit event (C8), including the exclusion of control and bidirectional characters in id (CC-031).
          $ref: "#/components/schemas/resource"
        result:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: |
            Final state of the call. Known values: ok, error, denied_not_granted, denied_filter_scope, denied_policy,
            tool_disabled, credential_required, rate_limited, step_up_required, confirmation_pending, confirmed,
            expired, confirmation_failed, superseded, blocked_by_pending, cancelled. A client must show an unknown value as a generic label.
        wrongCodeCount:
          description: Number of wrong confirmation codes (answers invalid or replayed of the broker) given for this call; present only for calls that needed a confirmation and were not refused as blocked_by_pending. A retry that came too late or found no pending call is not a wrong code.
          type: integer
          minimum: 0
          maximum: 3
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
      additionalProperties: false
    ConfirmationArgument:
      type: object
      required:
        - name
        - value
        - truncated
      properties:
        name:
          type: string
        value:
          type: string
          description: JSON serialization of the argument value, cut to a gateway limit when truncated is true.
        truncated:
          type: boolean
      additionalProperties: false
    ConfirmationView:
      type: object
      required:
        - confirmationId
        - tool
        - system
        - arguments
        - expiresAt
      properties:
        confirmationId:
          $ref: "#/components/schemas/ConfirmationId"
        tool:
          $ref: "#/components/schemas/QualifiedToolName"
        system:
          description: System the tool acts on; the portal shows it next to the tool (CC-077). Read by the gateway from its own record of the pending call, never from the client.
          $ref: "#/components/schemas/SystemId"
        resource:
          description: Main resource of the call from resourceRefs (type, id, parent), computed by the gateway, the same value that goes to the audit event (CC-098); absent when the tool takes no resource identifier. Same limits as in C8, including the exclusion of control and bidirectional characters in id.
          $ref: "#/components/schemas/resource"
        arguments:
          description: Arguments sorted by name (fixed order), without confirmation_code.
          type: array
          items:
            $ref: "#/components/schemas/ConfirmationArgument"
        expiresAt:
          description: End of the validity of the pending call (C11, 120 s after creation, not extended by a repeated first call); the portal shows a countdown.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PolicyStatus:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            type: object
            required:
              - instanceId
              - revision
            properties:
              instanceId:
                type: string
              revision:
                $ref: "#/components/schemas/PolicyRevision"
            additionalProperties: false
      additionalProperties: false
    ServerCredentialConfig:
      type: object
      description: How the gateway gets the credential for the server (C3). `type` is the default type of the system that goes into `context.credentialType` (CC-136) and must be one of `acceptedTypes`; `acceptedTypes` never mixes service-account with user types (CC-168).
      required:
        - required
        - acceptedTypes
        - type
      properties:
        required:
          type: boolean
        acceptedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CredentialType"
        type:
          $ref: "#/components/schemas/CredentialType"
      additionalProperties: false
    ServerConfig:
      type: object
      description: A server in the registry of the gateway (7.0.0).
      required:
        - serverId
        - system
        - internalUrl
        - tlsName
        - credential
        - enabled
        - adapter
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        internalUrl:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 255
        tlsName:
          description: Name the gateway expects in the certificate of the server.
          type: string
          pattern: ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$
        credential:
          $ref: "#/components/schemas/ServerCredentialConfig"
        enabled:
          type: boolean
        adapter:
          description: True when the server is served through an adapter (CC-206) and takes its manifest on the adapter channel.
          type: boolean
      additionalProperties: false
    ServerConfigCreate:
      type: object
      required:
        - serverId
        - system
        - internalUrl
        - credential
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        internalUrl:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 255
        tlsName:
          description: Default `<serverId>.internal`.
          type: string
          pattern: ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$
        credential:
          $ref: "#/components/schemas/ServerCredentialConfig"
        enabled:
          type: boolean
          default: true
        adapter:
          type: boolean
          default: false
      additionalProperties: false
    ServerConfigPatch:
      type: object
      minProperties: 1
      properties:
        internalUrl:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 255
        tlsName:
          type: string
          pattern: ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$
        credential:
          $ref: "#/components/schemas/ServerCredentialConfig"
        enabled:
          type: boolean
        adapter:
          type: boolean
      additionalProperties: false
    ServerRejected:
      type: object
      description: 422 of a change of a server. Known reasons are server_id_mismatch (serverId is not mcp-<system>), credential_types_mixed (service-account next to a user type, CC-168) and credential_type_not_accepted (type is not in acceptedTypes).
      required:
        - error
      properties:
        error:
          const: server_rejected
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    ScopeMappingEntry:
      type: object
      required:
        - group
        - scopes
      properties:
        group:
          $ref: "#/components/schemas/GroupName"
        scopes:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ResourceScopeId"
      additionalProperties: false
    ScopeMappingDocument:
      type: object
      description: The whole mapping from groups to resource scopes. A group is listed once; a group without an entry grants nothing.
      required:
        - scopeMapping
      properties:
        scopeMapping:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/ScopeMappingEntry"
      additionalProperties: false
    ScopeMappingRejected:
      type: object
      description: 422 of a write of the scope mapping. Known reasons are unknown_resource_type (no registered server declares the type), scope_not_grantable (the type has no scopePattern), scope_invalid (the local part does not match the scopePattern) and group_duplicate.
      required:
        - error
      properties:
        error:
          const: scope_mapping_rejected
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    OverrideId:
      type: string
      pattern: ^[a-z][a-z0-9-]{0,62}$
    OverrideTarget:
      description: gateway (the decision on call), all-servers (every server evaluates it) or the serverId of one server.
      type: string
      pattern: ^(gateway|all-servers|mcp-[a-z][a-z0-9]{1,30})$
    OverrideRequest:
      type: object
      required:
        - target
        - text
      properties:
        target:
          $ref: "#/components/schemas/OverrideTarget"
        text:
          description: Cedar text of exactly one forbid policy.
          type: string
          minLength: 1
          maxLength: 8000
      additionalProperties: false
    Override:
      type: object
      required:
        - id
        - target
        - text
        - setBy
        - setAt
      properties:
        id:
          $ref: "#/components/schemas/OverrideId"
        target:
          $ref: "#/components/schemas/OverrideTarget"
        text:
          type: string
          minLength: 1
          maxLength: 8000
        setBy:
          description: sub of the administrator who wrote it.
          type: string
          minLength: 1
          maxLength: 255
        setAt:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    OverrideRejected:
      type: object
      description: 422 of a write of an override. Known reasons are not_forbid, not_one_policy, invalid_policy (does not parse or does not validate against the schema of its target), id_mismatch (the @id of the text is not the id of the override) and target_unknown (a serverId that is not in the registry).
      required:
        - error
      properties:
        error:
          const: override_rejected
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    PendingPolicies:
      type: object
      required:
        - approvedHash
        - approvedPolicies
        - pendingHash
        - pendingPolicies
        - pendingVersion
        - source
      properties:
        approvedHash:
          oneOf:
            - $ref: "#/components/schemas/DefinitionHash"
            - type: "null"
        approvedPolicies:
          description: The approved policies; null for the first registration.
          oneOf:
            - $ref: "#/components/schemas/policies"
            - type: "null"
        pendingHash:
          $ref: "#/components/schemas/DefinitionHash"
        pendingPolicies:
          $ref: "#/components/schemas/policies"
        pendingVersion:
          description: Version of the manifest in which the pending policies appeared.
          $ref: "#/components/schemas/SemVer"
        source:
          description: Where the pending policies come from, as for a pending tool (ci or server).
          type: string
          enum:
            - ci
            - server
      additionalProperties: false
    ApprovePoliciesRequest:
      type: object
      required:
        - policiesHash
      properties:
        policiesHash:
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
    PolicyData:
      type: object
      description: The administrator data a server needs to evaluate its own policies (7.0.0).
      required:
        - revision
        - scopeMapping
        - allowedClients
        - overrides
      properties:
        revision:
          $ref: "#/components/schemas/PolicyRevision"
        scopeMapping:
          type: array
          items:
            $ref: "#/components/schemas/ScopeMappingEntry"
        allowedClients:
          description: Values of `azp` that may call (MCP_ALLOWED_CLIENTS of the gateway); checked in code before Cedar.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9._-]{1,128}$
        overrides:
          description: Overrides that target this server or all servers.
          type: array
          items:
            type: object
            required:
              - id
              - text
            properties:
              id:
                $ref: "#/components/schemas/OverrideId"
              text:
                type: string
                minLength: 1
                maxLength: 8000
            additionalProperties: false
      additionalProperties: false
    ServerId:
      description: MCP server id; always mcp-<system>, one server per system (C5).
      type: string
      pattern: ^mcp-[a-z][a-z0-9]{1,30}$
    SystemId:
      description: "Target system identifier, lower case: the id of a system that the credential broker and the gateway registry know at runtime (a row, not a list in the contracts)."
      type: string
      pattern: ^[a-z][a-z0-9]{1,30}$
    SemVer:
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
    QualifiedToolName:
      description: "Tool name as seen by MCP clients, in C5 and C12: <system>__<tool>, with the system pattern of SystemId."
      type: string
      pattern: ^[a-z][a-z0-9]{1,30}__[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 100
    Risk:
      type: string
      enum:
        - READ_ONLY
        - UPDATE
        - DESTRUCTIVE
    ToolAction:
      description: Cedar action evaluated by the server on the resolved resource (C6, C7).
      type: string
      enum:
        - read
        - update
        - delete
        - admin
    GroupName:
      description: Group / entitlement name from C9. Only the mcp- prefix is used by the platform.
      type: string
      pattern: ^mcp-[A-Za-z0-9][A-Za-z0-9._-]*$
      maxLength: 255
    DefinitionHash:
      description: sha256:<hex> over the RFC 8785 canonical JSON described in C6 (see test-vectors/definition-hash).
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ToolName:
      description: Server-side tool name (without the gateway prefix). Snake case; a double underscore is forbidden because the gateway uses it as the <system>__<tool> separator (C5).
      type: string
      pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 64
    ResourceType:
      description: "Cedar entity type of a resource, declared by a server in the resourceTypes of its manifest (C6): <Namespace>::<Name>, where the namespace is the Cedar namespace of the server. No type is built in."
      type: string
      pattern: ^[A-Z][A-Za-z0-9]{0,30}::[A-Z][A-Za-z0-9]{0,30}$
    ResourceRef:
      type: object
      required:
        - argument
        - type
      properties:
        argument:
          description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 64
        type:
          $ref: "#/components/schemas/ResourceType"
      additionalProperties: false
    McpToolDefinition:
      description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential. title is required (CC-115) and hashed like description (CC-042); icons and _meta are not allowed in v1, because they would reach the client without being pinned.
      type: object
      required:
        - name
        - title
        - description
        - inputSchema
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        title:
          type: string
          minLength: 1
          description: Display name shown by MCP clients; required since 3.0.0 (CC-115) and part of definitionHash (CC-042).
        description:
          type: string
          minLength: 1
        inputSchema:
          type: object
          description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11). Closed and bounded (CC-078, CC-123); checked by the semantic rules, because JSON Schema cannot express them for arbitrary nesting.
        outputSchema:
          type: object
        annotations:
          type: object
      additionalProperties: false
    ToolEntryFields:
      description: Fields of a manifest tool entry, open for composition (used by the gateway registry API). risk and action are required by ToolEntry and forbidden by AdapterToolEntry.
      type: object
      required:
        - name
        - resourceRefs
        - definition
        - definitionHash
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        resourceRefs:
          description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        definition:
          $ref: "#/components/schemas/McpToolDefinition"
        definitionHash:
          description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
          $ref: "#/components/schemas/DefinitionHash"
    Timestamp:
      description: ISO 8601 date-time in UTC (suffix Z).
      type: string
      format: date-time
      pattern: Z$
    AdapterToolEntry:
      description: "Manifest entry of a tool of an adapter (CC-193). The adapter does not classify: risk and action are absent (the administrator gives them at approval), resourceRefs is empty (policies are per tool), and definitionHash covers the definition, resourceRefs, system and credential without risk and action."
      type: object
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
        - not:
            anyOf:
              - required:
                  - risk
              - required:
                  - action
          properties:
            resourceRefs:
              type: array
              maxItems: 0
              items:
                $ref: "#/components/schemas/ResourceRef"
      unevaluatedProperties: false
    ResourceTypeDeclaration:
      description: Everything the entity builder knows about a resource type of this server; there is no built-in type (cedar/entity-builder.md).
      type: object
      required:
        - type
        - attributes
        - idPattern
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        attributes:
          description: Attributes the server's resolver fills from the system (Cedar entity attributes), without the parent attribute and without scopes, which the builder adds.
          type: array
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9]*$
          uniqueItems: true
        parent:
          description: Type of the containing resource, declared in this manifest, same namespace.
          $ref: "#/components/schemas/ResourceType"
        parentAttribute:
          description: Cedar attribute that holds the parent entity; required with parent and only then.
          type: string
          pattern: ^[a-z][A-Za-z0-9]*$
        idPattern:
          description: "Anchored regular expression (^...$, no top-level alternation) of the ids of this type: tool arguments, resolved resources. Written in the subset that Java and ECMAScript share; matched against the whole id."
          type: string
          pattern: ^\^.+\$$
          maxLength: 2048
        scopePattern:
          description: "Anchored regular expression of the local part of a grantable scope id (<Type>/<local part>). Absent: the type cannot be granted in the scope mapping."
          type: string
          pattern: ^\^.+\$$
          maxLength: 2048
        earlyScopeCheck:
          description: Whether the gateway checks tool arguments of this type against the scopes of the user before the call (context.refs). Only for types whose scope is the exact id; requires scopePattern.
          type: boolean
          default: false
        classification:
          description: The attribute the builder normalizes (trim, ASCII lower case, sets without duplicates); a resource missing a required one is refused (internal_error).
          type: object
          required:
            - attribute
            - kind
            - required
          properties:
            attribute:
              type: string
              pattern: ^[a-z][A-Za-z0-9]*$
            kind:
              enum:
                - string
                - set
            required:
              type: boolean
          additionalProperties: false
      dependentRequired:
        parent:
          - parentAttribute
        parentAttribute:
          - parent
      additionalProperties: false
    ToolEntry:
      description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
      type: object
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
        - required:
            - risk
            - action
      unevaluatedProperties: false
    CredentialType:
      type: string
      enum:
        - user-oauth
        - user-secret
        - token-exchange
        - service-account
    RequestId:
      description: UUIDv7 request id (C2 rid, X-Request-Id).
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ComponentId:
      description: Identifier of a platform component, e.g. mcp-gateway, mcp-credential-broker, mcp-jira.
      type: string
      pattern: ^mcp-[a-z0-9]+(-[a-z0-9]+)*$
      maxLength: 64
    EndpointFilterQuery:
      description: "Canonical query of the aggregate MCP endpoint (/mcp and /s/<serverId>/mcp), CC-170: parameters systems, tools, access, exclude in this fixed order, values lower case, comma separated, sorted bytewise, without duplicates; no percent-encoding, no empty parameter, no leading or trailing ampersand. Entries of systems are system ids, entries of tools are qualified tool names (<system>__<tool>, one double underscore), entries of exclude are either. Reference: scripts/lib/endpoint-filter.mjs. Sorting, absence of duplicates and the limits (at most 5 entries in systems, 100 in tools, 100 in exclude, 512 bytes in all) cannot be written as a pattern; the reference parser checks them and the vectors pin them (CC-186). Appears without the leading '?'."
      type: string
      pattern: ^(?!.*&$)(?:systems=[a-z][a-z0-9]*(?:,[a-z][a-z0-9]*)*(?:&|$))?(?:tools=[a-z][a-z0-9]*__[a-z][a-z0-9]*(?:_[a-z0-9]+)*(?:,[a-z][a-z0-9]*__[a-z][a-z0-9]*(?:_[a-z0-9]+)*)*(?:&|$))?(?:access=(?:read|write)(?:&|$))?(?:exclude=(?:[a-z][a-z0-9]*__[a-z][a-z0-9]*(?:_[a-z0-9]+)*|[a-z][a-z0-9]*)(?:,(?:[a-z][a-z0-9]*__[a-z][a-z0-9]*(?:_[a-z0-9]+)*|[a-z][a-z0-9]*))*)?$
      minLength: 1
      maxLength: 512
    PolicyRevision:
      description: Revision of the policy data of the gateway (scope mapping, allowed clients, overrides; GET /internal/v1/policy-data), YYYYMMDDHHMMSS-<sha7> (C7). Ordered by the timestamp part. The value 00000000000000-0000000 means 'gateway without policy data' and is not the revision of any data; a receiver must not infer anything about policy from it.
      type: string
      pattern: ^[0-9]{14}-[0-9a-f]{7}$
    ErrorCode:
      description: Client-visible error codes (C10).
      type: string
      enum:
        - unauthenticated
        - access_denied
        - tool_disabled
        - confirmation_required
        - confirmation_failed
        - confirmation_superseded
        - confirmation_cancelled
        - confirmation_blocked
        - credential_required
        - not_found_or_denied
        - invalid_argument
        - rate_limited
        - step_up_required
        - upstream_unavailable
        - internal_error
    resource:
      type: object
      required:
        - type
        - id
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        id:
          description: "Resource id as the system knows it (Jira key, GitLab path, index name, page id). Free-form because ids of the five systems use different alphabets (slashes, dots, spaces in some service desks). Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031). The length limit counts code points; producers should keep ids below 512 characters. Independently of this, the audit JSON serializer must escape every control character and U+2028/U+2029."
          type: string
          pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,512}$
        parent:
          description: "Parent as <Namespace>::<Type>::<id>, e.g. Jira::Project::ABC (C8 example format). The id part has the same exclusions as resource.id: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
          type: string
          pattern: ^[A-Za-z]+::[A-Za-z]+::[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]+$
          maxLength: 600
      additionalProperties: false
    ConfirmationId:
      description: Opaque, unguessable id of a pending confirmation (C11); used in URL paths and as the key of the portal preview.
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    ResourceScopeId:
      description: "Id of a ResourceScope (C7): <Type>/<local part>, where the type is declared by a registered server and the local part matches its scopePattern (checked by the gateway against the registry, not by this pattern). ASCII only."
      type: string
      pattern: ^[A-Z][A-Za-z0-9]{0,30}::[A-Z][A-Za-z0-9]{0,30}/[!-~]{1,1024}$
      maxLength: 1100
    policies:
      description: "The policy fragment of the server (C7), from src/main/resources/mcp/policies/ of its repository: the Cedar schema of its one namespace and its resource policies. Present for a server built on the starter, absent for an adapter. It is validated at registration (base schema plus fragment compose and validate in strict mode, see cedar/entity-builder.md) and is part of what an administrator approves (policiesHash)."
      type: object
      required:
        - namespace
        - schema
        - files
      properties:
        namespace:
          description: The Cedar namespace of the server; every resourceTypes[].type starts with it.
          type: string
          pattern: ^[A-Z][A-Za-z0-9]{0,30}$
        schema:
          description: "Text of schema.cedarschema: exactly one namespace, the server's own."
          type: string
          minLength: 1
          maxLength: 200000
        files:
          description: The *.cedar files of the server, in file name order.
          type: array
          maxItems: 100
          items:
            type: object
            required:
              - name
              - text
            properties:
              name:
                type: string
                pattern: ^[a-z0-9][a-z0-9._-]{0,63}\.cedar$
              text:
                type: string
                maxLength: 200000
            additionalProperties: false
      additionalProperties: false
    ServerManifest:
      title: MCP server manifest (C6)
      description: "Generated by the starter at build time (target/mcp-manifest.json, the artifact of the reviewed commit) or built at startup from the server's tools/list (CC-140), served at GET /mcp-manifest (requires C2) and registered with PUT /admin/v1/registry/servers/{serverId} (C5). Rules checked in addition to this schema (see README, 'Reguły semantyczne'): serverId == 'mcp-' + system; tool names unique; every resourceRefs[].type and resourceTypes[].parent is declared in resourceTypes; resourceTypes[].type unique, all in one Cedar namespace that equals policies.namespace; each declaration consistent (parent and parentAttribute together, parent in the same namespace, earlyScopeCheck only with a scopePattern, the classification attribute among attributes, idPattern and scopePattern anchored with ^ and $ without a top-level alternation); policies.files names unique; policiesHash recomputed from policies and resourceTypes equals the declared one; definition.name == name; definition.inputSchema has no confirmation_code and is closed and bounded (CC-078, CC-123: type object and additionalProperties false at every object level, no open maps, every string with maxLength unless an enum or const, every array with maxItems and items, every number with minimum and maximum, patterns anchored with ^ and $, every node typed, no allOf/anyOf/oneOf/not/if/then/else); definitionHash recomputed from definition and the entry equals the declared one (CC-005)."
      type: object
      required:
        - serverId
        - version
        - system
        - internalUrl
        - credential
        - resourceTypes
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        version:
          $ref: "#/components/schemas/SemVer"
        system:
          $ref: "#/components/schemas/SystemId"
        environment:
          description: Environment the server was built for (CC-138). Absent means production. A gateway in production mode rejects a manifest with dev (422 manifest_rejected, reason environment_mismatch). Not part of any definitionHash.
          type: string
          enum:
            - production
            - dev
        internalUrl:
          description: Informational. The gateway takes serverId -> system/internalUrl only from its own configuration and rejects a manifest that disagrees (C5).
          type: string
          format: uri
          pattern: ^https://
        credential:
          type: object
          required:
            - required
            - acceptedTypes
          properties:
            required:
              type: boolean
            acceptedTypes:
              type: array
              items:
                $ref: "#/components/schemas/CredentialType"
              uniqueItems: true
          if:
            properties:
              required:
                const: true
          then:
            properties:
              acceptedTypes:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialType"
                minItems: 1
          additionalProperties: false
        resourceTypes:
          type: array
          items:
            $ref: "#/components/schemas/ResourceTypeDeclaration"
        tools:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: "#/components/schemas/ToolEntry"
              - $ref: "#/components/schemas/AdapterToolEntry"
          description: "Which of the two entry forms applies depends on source: AdapterToolEntry when source is adapter, ToolEntry otherwise (CC-193)."
        source:
          description: "Absent for a server built on the starter. adapter marks the manifest of an adapter, the sidecar of a foreign MCP server (CC-193): its tool entries carry no risk and no action (an administrator classifies them at approval, outside definitionHash) and no resourceRefs, no resourceTypes and no policies (its policies are its own, outside the platform)."
          const: adapter
        policies:
          description: "The policy fragment of the server (C7), from src/main/resources/mcp/policies/ of its repository: the Cedar schema of its one namespace and its resource policies. Present for a server built on the starter, absent for an adapter. It is validated at registration (base schema plus fragment compose and validate in strict mode, see cedar/entity-builder.md) and is part of what an administrator approves (policiesHash)."
          type: object
          required:
            - namespace
            - schema
            - files
          properties:
            namespace:
              description: The Cedar namespace of the server; every resourceTypes[].type starts with it.
              type: string
              pattern: ^[A-Z][A-Za-z0-9]{0,30}$
            schema:
              description: "Text of schema.cedarschema: exactly one namespace, the server's own."
              type: string
              minLength: 1
              maxLength: 200000
            files:
              description: The *.cedar files of the server, in file name order.
              type: array
              maxItems: 100
              items:
                type: object
                required:
                  - name
                  - text
                properties:
                  name:
                    type: string
                    pattern: ^[a-z0-9][a-z0-9._-]{0,63}\.cedar$
                  text:
                    type: string
                    maxLength: 200000
                additionalProperties: false
          additionalProperties: false
        policiesHash:
          description: 'sha256 over the RFC 8785 canonical JSON of {"policies": <policies>, "resourceTypes": <resourceTypes>} (see test-vectors/policies-hash): a change of a declaration (earlyScopeCheck, idPattern, scopePattern, classification) needs approval like a change of a policy. The gateway recomputes it; a changed hash of a deployed server puts the server in pending_approval until an administrator approves it. Present exactly when policies is.'
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
      $defs:
        ResourceTypeDeclaration:
          description: Everything the entity builder knows about a resource type of this server; there is no built-in type (cedar/entity-builder.md).
          type: object
          required:
            - type
            - attributes
            - idPattern
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            attributes:
              description: Attributes the server's resolver fills from the system (Cedar entity attributes), without the parent attribute and without scopes, which the builder adds.
              type: array
              items:
                type: string
                pattern: ^[a-z][A-Za-z0-9]*$
              uniqueItems: true
            parent:
              description: Type of the containing resource, declared in this manifest, same namespace.
              $ref: "#/components/schemas/ResourceType"
            parentAttribute:
              description: Cedar attribute that holds the parent entity; required with parent and only then.
              type: string
              pattern: ^[a-z][A-Za-z0-9]*$
            idPattern:
              description: "Anchored regular expression (^...$, no top-level alternation) of the ids of this type: tool arguments, resolved resources. Written in the subset that Java and ECMAScript share; matched against the whole id."
              type: string
              pattern: ^\^.+\$$
              maxLength: 2048
            scopePattern:
              description: "Anchored regular expression of the local part of a grantable scope id (<Type>/<local part>). Absent: the type cannot be granted in the scope mapping."
              type: string
              pattern: ^\^.+\$$
              maxLength: 2048
            earlyScopeCheck:
              description: Whether the gateway checks tool arguments of this type against the scopes of the user before the call (context.refs). Only for types whose scope is the exact id; requires scopePattern.
              type: boolean
              default: false
            classification:
              description: The attribute the builder normalizes (trim, ASCII lower case, sets without duplicates); a resource missing a required one is refused (internal_error).
              type: object
              required:
                - attribute
                - kind
                - required
              properties:
                attribute:
                  type: string
                  pattern: ^[a-z][A-Za-z0-9]*$
                kind:
                  enum:
                    - string
                    - set
                required:
                  type: boolean
              additionalProperties: false
          dependentRequired:
            parent:
              - parentAttribute
            parentAttribute:
              - parent
          additionalProperties: false
        ResourceRef:
          type: object
          required:
            - argument
            - type
          properties:
            argument:
              description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
              type: string
              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
              maxLength: 64
            type:
              $ref: "#/components/schemas/ResourceType"
          additionalProperties: false
        ToolEntry:
          description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
          type: object
          allOf:
            - $ref: "#/components/schemas/ToolEntryFields"
            - required:
                - risk
                - action
          unevaluatedProperties: false
        ToolEntryFields:
          description: Fields of a manifest tool entry, open for composition (used by the gateway registry API). risk and action are required by ToolEntry and forbidden by AdapterToolEntry.
          type: object
          required:
            - name
            - resourceRefs
            - definition
            - definitionHash
          properties:
            name:
              $ref: "#/components/schemas/ToolName"
            risk:
              $ref: "#/components/schemas/Risk"
            action:
              $ref: "#/components/schemas/ToolAction"
            resourceRefs:
              description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
              type: array
              items:
                $ref: "#/components/schemas/ResourceRef"
            definition:
              $ref: "#/components/schemas/McpToolDefinition"
            definitionHash:
              description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
              $ref: "#/components/schemas/DefinitionHash"
        McpToolDefinition:
          description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential. title is required (CC-115) and hashed like description (CC-042); icons and _meta are not allowed in v1, because they would reach the client without being pinned.
          type: object
          required:
            - name
            - title
            - description
            - inputSchema
          properties:
            name:
              $ref: "#/components/schemas/ToolName"
            title:
              type: string
              minLength: 1
              description: Display name shown by MCP clients; required since 3.0.0 (CC-115) and part of definitionHash (CC-042).
            description:
              type: string
              minLength: 1
            inputSchema:
              type: object
              description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11). Closed and bounded (CC-078, CC-123); checked by the semantic rules, because JSON Schema cannot express them for arbitrary nesting.
            outputSchema:
              type: object
            annotations:
              type: object
          additionalProperties: false
        AdapterToolEntry:
          description: "Manifest entry of a tool of an adapter (CC-193). The adapter does not classify: risk and action are absent (the administrator gives them at approval), resourceRefs is empty (policies are per tool), and definitionHash covers the definition, resourceRefs, system and credential without risk and action."
          type: object
          allOf:
            - $ref: "#/components/schemas/ToolEntryFields"
            - not:
                anyOf:
                  - required:
                      - risk
                  - required:
                      - action
              properties:
                resourceRefs:
                  type: array
                  maxItems: 0
                  items:
                    $ref: "#/components/schemas/ResourceRef"
          unevaluatedProperties: false
      allOf:
        - if:
            required:
              - source
          then:
            properties:
              tools:
                items:
                  $ref: "#/components/schemas/AdapterToolEntry"
                type: array
              resourceTypes:
                type: array
                maxItems: 0
                items:
                  $ref: "#/components/schemas/ResourceTypeDeclaration"
            not:
              anyOf:
                - required:
                    - policies
                - required:
                    - policiesHash
          else:
            properties:
              tools:
                items:
                  $ref: "#/components/schemas/ToolEntry"
                type: array
            required:
              - policies
              - policiesHash
      dependentRequired:
        policies:
          - policiesHash
        policiesHash:
          - policies
    AuditEvent:
      title: Audit event (C8)
      description: One JSON object per line on a dedicated logger/appender shipped to the SIEM. Never contains argument values, tool results, secrets, confirmation codes, TOTP codes, authenticator seeds or otpauth URIs; additionalProperties is false so such fields cannot be added by accident. Target system of broker events is carried in 'server' (mcp-<system>). The serializer must escape control characters, U+2028 and U+2029 in every string value.
      type: object
      required:
        - ts
        - requestId
        - component
        - componentId
        - event
      properties:
        ts:
          $ref: "#/components/schemas/Timestamp"
        requestId:
          $ref: "#/components/schemas/RequestId"
        clientRequestId:
          description: X-Request-Id sent by the AI client, recorded by the gateway only (C3). Untrusted, so limited to a log-safe alphabet (CC-031); the gateway drops a value that does not match instead of rejecting the call.
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        component:
          type: string
          enum:
            - gateway
            - broker
            - server
            - portal
        componentId:
          $ref: "#/components/schemas/ComponentId"
        event:
          type: string
          enum:
            - tool_call
            - policy_decision
            - credential_resolve
            - connection_change
            - confirmation
            - admin_change
            - authentication
            - authenticator
        sub:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          maxLength: 255
        backendUser:
          description: "Account in the target system read by whoami (C4.1, CC-101), for connection_change: the only trace of which account a user connected (CC-117). Same length limit as username. Never a secret. Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
          type: string
          pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,255}$
        client:
          type: string
          maxLength: 255
        filter:
          description: Normalized query of the endpoint filter of the request (CC-170, CC-174), only when the request carried one; absent without a filter. Made of tokens that have the syntax of a system id or a qualified tool name and nothing else, so it is neither a secret nor personal data; the parser does not check that a token names a system or tool that exists, so the client chooses these tokens and the field is data from the client, not a list of the platform's systems (CC-186). Carried by the gateway on tool_call, policy_decision, confirmation and credential_resolve; never by authentication, by servers or by the broker (they do not receive the filter, correlation is by requestId).
          $ref: "#/components/schemas/EndpointFilterQuery"
        server:
          $ref: "#/components/schemas/ServerId"
        tool:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          description: Cedar action an administrator gave a tool of an adapter together with risk, on admin_change with reason definition_approved or risk_lowered_by_admin (CC-206); with risk it is the classification. Absent on every other event. An approval that carries both risk and action on a tool of an adapter is the classification of that tool.
          $ref: "#/components/schemas/ToolAction"
        resource:
          type: object
          required:
            - type
            - id
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            id:
              description: "Resource id as the system knows it (Jira key, GitLab path, index name, page id). Free-form because ids of the five systems use different alphabets (slashes, dots, spaces in some service desks). Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031). The length limit counts code points; producers should keep ids below 512 characters. Independently of this, the audit JSON serializer must escape every control character and U+2028/U+2029."
              type: string
              pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,512}$
            parent:
              description: "Parent as <Namespace>::<Type>::<id>, e.g. Jira::Project::ABC (C8 example format). The id part has the same exclusions as resource.id: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
              type: string
              pattern: ^[A-Za-z]+::[A-Za-z]+::[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]+$
              maxLength: 600
          additionalProperties: false
        decision:
          type: string
          enum:
            - allow
            - deny
            - confirmation_pending
        reason:
          description: "Machine-readable reason, snake case. Known values: policy_forbid, not_granted, tool_disabled, user_confirmed, user_confirmed_no_preview, confirmation_expired, attempts_exhausted, authenticator_not_registered, authenticator_disabled, superseded, pending_exists, cancelled_by_owner, credential_required, step_up_required, rate_limited, rate_limited_user, rate_limited_client, rate_limited_tool, exchange_denied, system_not_configured, subject_token_invalid, credential_type_mismatch, risk_lowered_by_admin, user_purged, unused_cleanup, definition_changed, tool_not_served, definition_submitted, filter_scope, invalid_filter, filter_mismatch, invalid_cursor, policy_unavailable, policy_error, kill_switch, kill_switch_set, kill_switch_cleared, secret_missing, database_unavailable, refresh_token_lost, user_offboarding, secret_store_unavailable, token_refreshed, oauth_grant_revoked, connection_changed_during_refresh, provider_unavailable, connection_busy. credential_type_mismatch: on the gateway (event credential_resolve, outcome error, errorCode internal_error; credentialType is the type the broker returned) the broker returned a type that is not in the set of types the gateway configuration allows for the system; on a server (event policy_decision or tool_call) the type in X-MCP-Credential-Type, sent by the gateway with X-MCP-Credential, is not in the set of the server's accepted credential types, is missing or is not one of the four types, or the server has none configured, and the check comes before Cedar, the grant probe and the resolvers: decision deny, outcome error, errorCode internal_error, the client learns nothing more (CC-166). For rate limits (gateway, CC-156) a refused call or request is recorded as tool_call (a tools/call) or policy_decision (any other MCP request) with decision deny, outcome denied, errorCode rate_limited and reason rate_limited_user, rate_limited_client (the pair user and AI client) or rate_limited_tool (the pair user and tool); the client is not told which limit applied, the administrator is. The gateway may aggregate excess events as for CC-125. For event credential_resolve (broker, gateway): exchange_denied (the IdP refused the token exchange, CC-157, outcome denied; the gateway records it on the tool_call event of the call it had allowed, decision allow, outcome denied, errorCode access_denied, which is the normative shape for the activity row, CC-165) and system_not_configured (the system is not configured in the broker, CC-158, outcome error) and subject_token_invalid (the subject token of a token exchange has the wrong audience, has expired or belongs to another sub than the internal JWT, CC-157, outcome denied). For event connection_change (broker): user_purged (the connection was removed by the offboarding purge, CC-155) and unused_cleanup (the connection was removed because it had not been used for the configured number of days, 180 by default, CC-155). Both offboarding purges (broker and gateway) emit one admin_change with reason user_purged and outcome ok for every call, also when nothing was removed and for an unknown sub, so that a call of mcp-offboarding always leaves a trace (CC-155). For event confirmation (gateway, CC-094): confirmation_pending is the decision when the pending call is created, and the outcome is one of user_confirmed (code accepted), user_confirmed_no_preview (accepted although the owner did not open the portal preview), confirmation_expired, attempts_exhausted, authenticator_not_registered, authenticator_disabled, code_burned (the retry carried a code of a burned step: confirmation_failed outwards, no attempt spent, not a wrong code, CC-128), cancelled_by_owner (the owner cancelled the pending call in the portal, CC-128; decision deny, errorCode confirmation_cancelled, emitted when the cancel is accepted and again when the cancelled call is retried), pending_exists (a new DESTRUCTIVE call was refused because another one is pending and its preview was opened; errorCode confirmation_blocked, CC-127), superseded (the pending DESTRUCTIVE call was replaced by a newer one of the same user, CC-127; emitted for the older call when the newer is created, and again when the older call is retried); user_declined and preview_not_viewed are not emitted since 3.0.0 (there is no decline, and the preview is optional). For event authenticator (broker, portal, CC-094): authenticator_enrollment_started, authenticator_registered, authenticator_enrollment_failed, authenticator_removed, authenticator_reset_by_admin (outcome ok or denied; the target user is sub), authenticator_seed_missing (the seed of a registered authenticator is gone from the secret store: the registration is reset to none, outcome error, errorCode upstream_unavailable, CC-142), authenticator_disabled (the daily limit of 20 wrong codes in 24 hours switched the authenticator off, CC-126; outcome denied) and, for the check of a code with decision allow or deny, totp_verified, totp_invalid, totp_replayed, totp_locked, totp_disabled, totp_burned (a code of a burned step: replayed for the broker but not a failure and not counted, CC-128), totp_steps_burned (the current codes were invalidated because the owner cancelled a pending operation or a new DESTRUCTIVE operation followed a viewed one, CC-128; outcome ok), totp_not_registered (these carry tool and client from the internal JWT). For events of the broker (CC-196, CC-205), reasons that were not listed before 6.0.0 (the outcomes and error codes below are the ones the broker reports in its STATUS; ws-06 confirms them, and only database_unavailable, refresh_token_lost and secret_missing have vectors): database_unavailable (the database did not answer: the operation is refused with 503, outcome error, errorCode upstream_unavailable; also for the authenticator), secret_store_unavailable (the secret store did not answer, outcome error, errorCode upstream_unavailable), refresh_token_lost (the provider rotated the refresh token and the broker could not store the new one even after retries; the new tokens are revoked at the provider and the connection goes to error, not revoked; connection_change, outcome error), user_offboarding (a write was refused because a purge of the user is running or has just run, CC-155; outcome denied), token_refreshed (the access token was renewed, outcome ok), oauth_grant_revoked (the provider answered invalid_grant, the connection is revoked), connection_changed_during_refresh (the connection was replaced or deleted while it was being refreshed, so the refresh result was dropped), provider_unavailable (the provider did not answer, outcome error, errorCode upstream_unavailable), connection_busy (another refresh of the same connection holds the lock) and secret_missing (the secret of a connection is gone from the secret store: the broker sets the state of the connection to error so that the user connects again, connection_change, outcome error, CC-205). For event connection_change (broker) a failed revocation at the provider is recorded with reason provider_revoke_failed (the connection is deleted anyway, outcome error; CC-142). For tool_call and policy_decision: filter_scope (the tool exists and the user may call it, but the endpoint filter of the request leaves it out, decision deny, outcome denied, errorCode not_found_or_denied, CC-170, CC-178: checked before tool_disabled, upstream_unavailable and credential_required and before the confirmation gate), invalid_filter (the query of the request does not parse or exceeds a limit, policy_decision, decision deny, outcome error, without errorCode, CC-170), filter_mismatch (the route or the filter of the request differs from the ones bound to the MCP session, policy_decision, decision deny, outcome denied, CC-172, CC-184; a session of another user or an unknown one is a 404 without this reason), invalid_cursor (the cursor of tools/list is malformed, was changed or was issued to another user or for another filter, policy_decision, decision deny, outcome error, without errorCode, CC-181), These four refusals that a client can repeat at will (invalid_filter, filter_mismatch, invalid_cursor and a tools/call answered not_found_or_denied with not_granted or filter_scope) are written at most once per user and reason in an interval (10 s by default); the rest is only counted in mcp_audit_endpoint_suppressed_total{reason}, and the request is refused either way (CC-190, CC-191: the key of the interval is user, reason and target, and a summary event with suppressedCount follows each window), policy_unavailable (no policy bundle is loaded, so nothing can be decided and the request is refused), policy_error (the policy engine failed on this request) definition_changed (the definition the server presents differs from the approved one, so the tool is hidden and refused with errorCode tool_disabled, CC-133) upstream_unavailable (on tool_call or policy_decision: a store behind the check, such as the counter of the limits, the session store or the store of the emergency switches, did not answer and the request was refused, CC-167, CC-194, CC-199; also a request that the gateway shed because too many were in progress, CC-199, which the gateway may aggregate as in CC-125) and tool_not_served (the approved tool is missing from the tools the server serves, so it is hidden and refused with errorCode tool_disabled, CC-161). definition_changed and tool_not_served are recorded on every refused call (not once per read) and when a read finds the difference there is no separate event. A failed read of the server's tools/list is not evidence of either: the gateway keeps its last successful read, and a call that needs a fresh read that fails is refused as upstream_unavailable without a call to the server. kill_switch (tool_call, decision deny, outcome denied, errorCode tool_disabled: the tool or its server was switched off by an administrator, CC-194; tool_disabled alone is a definition waiting for approval or classification). At the tool level of the gateway policy_forbid is a refusal by a forbid rule (for example from the overrides bundle) answered not_found_or_denied, and not_granted means that no permit allowed the tool (CC-198); the activity row of the user for both stays denied_not_granted. On a server policy_forbid is a refusal by policy (a forbid rule or no permit) and not_granted a resource that could not be resolved or has no grant (CC-141). Event admin_change records the administrative changes of the gateway and of the broker. For the registry, with reasons definition_registered (the pipeline registered a manifest and the definition was approved by that call: a READ_ONLY tool, CC-133), definition_submitted (the registration left a new or changed UPDATE or DESTRUCTIVE tool pending approval, CC-133), definition_approved (an administrator approved a pending definition; sub is the administrator and definitionHash the approved hash) and risk_lowered_by_admin (an administrator approved a risk lower than the floor with acceptRiskLowering; one event instead of definition_approved, with risk set to the new risk, CC-167), tool_removed (a tool left the registered manifest), kill_switch_set and kill_switch_cleared (an administrator switched a server or a tool off or on again, CC-194; sub is the administrator, the tool is in tool and the system in server; the free text of the administrator is not part of the event). For definition_approved the sub is the administrator; for a tool of an adapter the same event carries the risk and the action the administrator gave (CC-193, CC-207), which is how a classification differs from any other approval; for user_purged it is the purged user, and the calling identity (the certificate CN mcp-offboarding) is not a field of this schema. Other reasons are not defined. For event authentication it is the rejection code: for the internal JWT (receiver: server, broker) one of the vectors (missing_token, bad_signature, unknown_kid, alg_not_allowed, wrong_issuer, wrong_audience, expired, replayed_jti, service_token_not_allowed, tool_mismatch, invalid_claims, lifetime_too_long, not_yet_valid, request_id_mismatch, tool_missing, tool_not_allowed, test_key_not_allowed, malformed; for the sidecar of an adapter also classification_missing, a tools/call without mcp_risk and mcp_action, CC-226); for the token of the AI client at the gateway (C1, CC-120): missing_token, malformed, bad_signature, unknown_kid, alg_not_allowed, wrong_issuer, wrong_audience, expired, not_yet_valid, invalid_claims, and for infrastructure failures client_certificate_rejected, jwks_unavailable, replay_store_unavailable (the last two with errorCode upstream_unavailable). The gateway also emits authentication for its own admin port (C5 /admin/v1 and /actuator/prometheus, CC-125): client_certificate_rejected for a client certificate that is missing, not from the internal CA, lacks the clientAuth purpose or has a CN that the operation does not allow, and the token reasons above for a BFF token that fails validation (aud mcp-gateway-admin). replay_store_unavailable is emitted only by receivers of the internal JWT (servers through the starter, the broker), never by the gateway. The broker uses these two names (jwks_unavailable, replay_store_unavailable) in an event authentication with outcome denied like the servers do; key_source_unavailable and jti_store_unavailable are not defined (CC-197). The broker also records the rejection of the token itself (bad_signature, expired, replayed_jti and the other codes of the internal JWT above) as an event authentication with outcome denied and without server, sub or tool, not as the event of the operation it was about to authorize; for a rejected token it writes no credential_resolve or connection_change (CC-211). decision is optional on authentication (deny when present); the broker writes none (CC-212). The gateway may aggregate or sample client_certificate_rejected on its admin port (for example one event per source address per minute, or a counter in its metrics) so that a scanner cannot flood the SIEM (CC-125)."
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        policyRevision:
          $ref: "#/components/schemas/PolicyRevision"
        credentialType:
          $ref: "#/components/schemas/CredentialType"
        outcome:
          type: string
          enum:
            - ok
            - error
            - denied
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        latencyMs:
          type: integer
          minimum: 0
        suppressedCount:
          description: "On the summary event of CC-191, written when the window of a user and reason closes: how many refusals of that reason were left out of the audit in that window (CC-190). Only the gateway writes it, on policy_decision or tool_call with decision deny. The summary may carry suppressedTargets as well."
          type: integer
          minimum: 1
        suppressedTargets:
          description: "On the summary event of CC-191, next to suppressedCount (CC-195): how many different targets (tool names, or hashes of filters and cursors, never written to the event) the left out refusals of that window concerned. Lets the SIEM tell one repeated call from a sweep over many tools."
          type: integer
          minimum: 1
        argsLength:
          description: Length in bytes of the serialized arguments; the only trace of arguments allowed in audit.
          type: integer
          minimum: 0
        definitionHash:
          description: "Hash of the tool definition an admin_change concerns (CC-133): for definition_approved the approved hash, for definition_registered the hash of each registered definition (one event per tool), for tool_removed the hash of the removed entry. Together with sub (the administrator) and tool it tells afterwards who approved which definition. Not a secret."
          $ref: "#/components/schemas/DefinitionHash"
      allOf:
        - description: "The filter field (CC-174, CC-186) belongs to the gateway and to four events only, and a rejected filter has none (nothing valid was normalized): authentication is covered by its closed field list, broker and server events by component."
          if:
            required:
              - filter
          then:
            properties:
              component:
                const: gateway
              event:
                enum:
                  - tool_call
                  - policy_decision
                  - confirmation
                  - credential_resolve
              reason:
                not:
                  const: invalid_filter
        - description: "Authenticator events (CC-094) always say how they ended (outcome) and why (reason). The field list stays closed through additionalProperties: there is no field that could carry a code, a seed or an otpauth URI."
          if:
            properties:
              event:
                const: authenticator
            required:
              - event
          then:
            required:
              - outcome
              - reason
        - description: "Rejected authentication (CC-071, CC-120): emitted by a receiver of the internal JWT (server, broker) and by the gateway for the token of the AI client (C1). Closed list of fields (propertyNames): everything that comes from the claims of the unverified token (sub, username, client, tool, risk, resource, filter, policyRevision, credentialType) is forbidden, and so is any part of the token. Carries the rejection code in reason."
          if:
            properties:
              event:
                const: authentication
            required:
              - event
          then:
            required:
              - outcome
              - reason
            properties:
              outcome:
                const: denied
            if:
              properties:
                reason:
                  enum:
                    - jwks_unavailable
                    - replay_store_unavailable
              required:
                - reason
            then:
              required:
                - errorCode
              properties:
                errorCode:
                  const: upstream_unavailable
            propertyNames:
              enum:
                - ts
                - requestId
                - clientRequestId
                - component
                - componentId
                - event
                - server
                - decision
                - reason
                - outcome
                - errorCode
                - latencyMs
            allOf:
              - description: replay_store_unavailable belongs to receivers of the internal JWT (server, broker); the gateway has no replay store for tokens of the AI client (CC-125).
                if:
                  properties:
                    reason:
                      const: replay_store_unavailable
                  required:
                    - reason
                then:
                  properties:
                    component:
                      enum:
                        - server
                        - broker
      additionalProperties: false
