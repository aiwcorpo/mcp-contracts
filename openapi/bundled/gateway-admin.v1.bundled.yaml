        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerManifest"
            examples:
              adapter:
                value:
                  serverId: mcp-jira
                  version: 0.3.0
                  system: jira
                  source: adapter
                  internalUrl: https://mcp-jira.internal:8443/mcp
                  credential:
                    required: true
                    acceptedTypes:
                      - user-oauth
                      - user-secret
                  resourceTypes: []
                  tools:
