                        attributes:
                          - key
                        parent: Jira::Project
                        parentAttribute: project
                        idPattern: ^[A-Z][A-Z0-9_]{1,9}-[1-9][0-9]{0,9}$
                    pendingHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
                    pendingVersion: 1.4.0
                    source: manifest
                    pendingPolicies:
                      namespace: Jira
                      schema: |
                        namespace Jira {
                          entity Project { key: String, category: String, scopes: Set<ResourceScope> };
                          entity Issue in [Project] { key: String, project: Project, scopes: Set<ResourceScope> };
                          action "read", "update" appliesTo { principal: [User], resource: [Project, Issue], context: RequestContext };
                        }
                      files:
                        - name: read.cedar
                          text: |
                            @id("jira-read")
                            permit (principal in UserGroup::"mcp-jira-read", action == Jira::Action::"read", resource);
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/registry/servers/{serverId}/policies/approve:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags:
        - registry
      operationId: approveServerPolicies
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Approve the pending policies of a server (group mcp-platform-admin).
      description: |
        `policiesHash` must equal the current pending hash, otherwise 409 and nothing changes; it covers the policies and the
        resource type declarations together. The approval sets `approvedPoliciesHash` of that server in the policy data, which is
        the only thing that lets the server evaluate: the starter computes the hash of its own policies and resourceTypes and
        refuses every call (`upstream_unavailable`) when it differs from the approved one or when nothing is approved. Approval
        is allowed even when it makes existing scope mapping entries invalid (a narrower `scopePattern`, a removed type); the
        answer lists the entries that will be ignored, so the administrator sees the effect, and every one is audited when the
        gateway evaluates. The tools of the server follow their own approvals again. The BFF asks for a fresh MFA. The audit
        event is `admin_change` with reason `policies_approved`. If the approved declarations change or free a namespace, the entries of
        the scope mapping for the freed namespace are removed and audited (`scope_mapping_entry_removed`).
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovePoliciesRequest"
            examples:
              approve:
                value:
                  policiesHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
      responses:
        "200":
          description: Approved; the mapping entries that the approval makes invalid and that evaluation will therefore ignore.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovePoliciesResult"
              examples:
                nothing_ignored:
                  value:
                    ignoredMappingEntries: []
                narrower_pattern:
                  value:
                    ignoredMappingEntries:
                      - group: mcp-jira-proj-ABC
                        scope: Jira::Project/ABCDEFGHIJ
                        reason: invalid_scope
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/StepUpOrUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: policiesHash differs from the pending hash (the policies changed again, or nothing is pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                hash_mismatch:
                  value:
                    error: hash_mismatch
  /admin/v1/policy/status:
    get:
      tags:
        - policy
      operationId: getPolicyStatus
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Revision of the policy data that each gateway instance serves (admin).
      security:
