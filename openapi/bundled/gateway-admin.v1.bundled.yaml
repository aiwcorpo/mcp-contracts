  /admin/v1/registry/adapters/{serverId}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    put:
      tags:
        - registry
      operationId: submitAdapterManifest
      x-allowed-client-cn:
        - mcp-adapter-{serverId}
      summary: An adapter submits the manifest of its foreign server at startup (CC-206).
      description: |
        The channel of `mcp-server-adapter` (the sidecar of a foreign MCP server, CC-193). The body is the C6 manifest with `source: adapter`;
        `serverId` in the body must equal the path.

        **Identity of the adapter.** The certificate is bound to one server: its CN is `mcp-adapter-<serverId>` (for example
        `mcp-adapter-mcp-jira`), compared as a whole and case-sensitively like the CN of the pipeline (CC-161). It is a different CN from
        `mcp-registry-ci-<serverId>`, so a pipeline cannot use this operation and an adapter cannot use `registerServer`. Another CN is `403` and
        `client_certificate_rejected` in the audit. The answers come in this order (CC-207): the certificate (`403`) first, so that a caller without the right CN learns nothing about the mode of any server; then `serverId` in the body against the path (`400`); then the mode and the `source` (`422`).

        **Adapter mode is gateway configuration.** Which `serverId` is served by an adapter is set in the configuration of the gateway, never by a
        manifest. For a `serverId` in adapter mode this operation is the only way to submit a manifest and `registerServer` answers `422`,
        `manifest_rejected`, reason `adapter_mode_mismatch`; for any other `serverId` this operation answers `422` with the same reason, and so does
        a manifest without `source: adapter` sent here or with it sent to `registerServer`. Nothing is stored in these cases.

        **What the call stores.** Every new or changed tool becomes `pending_approval` (`change` new or changed, `source` adapter, `pendingVersion` the
        version of the manifest) without classification, a READ_ONLY-looking tool included: nothing of an adapter is approved by this call, and an
        unclassified tool is hidden and refused as `tool_disabled`. An entry whose `definitionHash` did not change stays as it is, with its
        classification. A tool missing from the manifest is removed (`tool_removed`) together with its classification: if it returns it is a new, unclassified tool and the administrator classifies it again (CC-207). Audit as `admin_change`: `definition_submitted` for every pending
        entry and `tool_removed`. The administrator classifies and approves with `approveTool` (`risk`, `action`).

        **Rejections.** The same checks as for `registerServer` (hash recomputed without risk and action, semantic rules, binding of serverId to
        system and internalUrl from configuration, credential types) with `422 manifest_rejected`. The environment check applies too.
