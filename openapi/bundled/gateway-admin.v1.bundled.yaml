          description: A scope does not fit the declared resource types, or a group is listed twice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeMappingRejected"
              examples:
                unknown_type:
                  value:
                    error: scope_mapping_rejected
                    reason: unknown_resource_type
                    message: Mystery::Place/x names a type that no registered server declares
        "428":
          description: "`If-Match` is missing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                required:
                  value:
                    error: precondition_required
  /admin/v1/policy/overrides:
