                  resourceDefaults:
                    Jira::Project:
                      - ABC
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualServerCreated"
              examples:
                created:
                  value:
                    slug: team-a-dev
                    url: https://mcp-gateway.internal/v/team-a-dev/mcp
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
