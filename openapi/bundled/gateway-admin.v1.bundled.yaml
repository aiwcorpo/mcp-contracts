components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate from the internal CA; CN=mcp-portal-bff for BFF calls, CN=mcp-registry-ci for registry writes.
    bffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User token exchanged in the IdP (RFC 8693) for aud=mcp-gateway-admin.
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/VirtualServerSlug"
      example: team-a-dev
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ServerId"
      example: mcp-jira
    Tool:
      name: tool
      in: path
      required: true
      description: Server-side tool name (without the system prefix).
      schema:
        $ref: "#/components/schemas/ToolName"
      example: update_issue
    ConfirmationId:
      name: confirmationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConfirmationId"
      example: cnf_4k9Qe2LxW7tB3mZp
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    StepUpOrUnauthenticated:
      description: Missing or invalid token, or the user's last MFA authentication is not fresh enough (step_up_required with stepUpUrl, CC-010, CC-034).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/StepUpRequired"
              - $ref: "#/components/schemas/Error"
          examples:
            step_up_required:
              value:
                error: step_up_required
                stepUpUrl: https://mcp-portal.internal/api/v1/auth/login?stepUp=true&returnPath=/confirm/cnf_4k9Qe2LxW7tB3mZp
    BadRequest:
      description: Malformed request or schema violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      description: Missing or invalid token or client certificate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    Forbidden:
      description: Caller lacks mcp-platform-admin or uses the wrong client certificate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            access_denied:
              value:
                error: access_denied
    NotFound:
      description: Does not exist or is not visible to the caller (not_found_or_denied).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_found_or_denied:
              value:
                error: not_found_or_denied
  schemas:
    StepUpRequired:
      type: object
      required:
        - error
        - stepUpUrl
      properties:
        error:
          const: step_up_required
        stepUpUrl:
          type: string
          format: uri
          description: Portal URL that re-authenticates with max_age / acr_values (configured in the gateway).
      additionalProperties: false
    Error:
      type: object
      description: Generic error body for statuses whose body C5 does not define.
      required:
        - error
      properties:
        error:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    Access:
      type: string
      enum:
        - granted
        - denied
    CatalogTool:
      type: object
      required:
        - name
        - description
        - risk
        - action
        - access
        - requiredEntitlements
      properties:
        name:
          $ref: "#/components/schemas/QualifiedToolName"
        description:
          type: string
          description: definition.description of the approved manifest entry (CC-005, CC-014).
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        access:
          $ref: "#/components/schemas/Access"
        requiredEntitlements:
          description: Groups (C9) that grant this tool according to policy; empty when policy names none.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GroupName"
      additionalProperties: false
    CatalogServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTool"
      additionalProperties: false
    Catalog:
      type: object
      required:
        - servers
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogServer"
      additionalProperties: false
    ResourceDefaults:
      type: object
      description: Narrowing per resource type (C5). Becomes context.vsScopes in Cedar (cedar/entity-builder.md).
      propertyNames:
        $ref: "#/components/schemas/ScopeResourceType"
      additionalProperties:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 255
    VirtualServerCreate:
      type: object
      required:
        - slug
        - displayName
        - tools
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        tools:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/QualifiedToolName"
        resourceDefaults:
          $ref: "#/components/schemas/ResourceDefaults"
      additionalProperties: false
    VirtualServerCreated:
      type: object
      required:
        - slug
        - url
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        url:
          type: string
          format: uri
          description: MCP endpoint https://<gateway>/v/<slug>/mcp
      additionalProperties: false
    VirtualServer:
      type: object
      required:
        - slug
        - displayName
        - tools
        - url
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        displayName:
          type: string
        tools:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/QualifiedToolName"
        resourceDefaults:
          $ref: "#/components/schemas/ResourceDefaults"
        url:
          type: string
          format: uri
      additionalProperties: false
    RegistryToolStatus:
      type: string
      enum:
        - approved
        - pending_approval
    RegistryTool:
      description: Manifest tool entry (C6) with its approval status. Pending entries are shown when present.
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/RegistryToolStatus"
      unevaluatedProperties: false
    RegistryServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/RegistryTool"
      additionalProperties: false
    PendingTool:
      type: object
      required:
        - approvedEntry
        - pendingEntry
        - pendingHash
      properties:
        approvedEntry:
          description: Currently approved entry; null for a new tool.
          oneOf:
            - $ref: "#/components/schemas/ToolEntry"
            - type: "null"
        pendingEntry:
          $ref: "#/components/schemas/ToolEntry"
        pendingHash:
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
    ApproveRequest:
      type: object
      required:
        - definitionHash
      properties:
        definitionHash:
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
    ConfirmationArgument:
      type: object
      required:
        - name
        - value
        - truncated
      properties:
        name:
          type: string
        value:
          type: string
          description: JSON serialization of the argument value, cut to a gateway limit when truncated is true.
        truncated:
          type: boolean
      additionalProperties: false
    ConfirmationView:
      type: object
      required:
        - confirmationId
        - tool
        - arguments
        - expiresAt
      properties:
        confirmationId:
          $ref: "#/components/schemas/ConfirmationId"
        tool:
          $ref: "#/components/schemas/QualifiedToolName"
        arguments:
          description: Arguments sorted by name (fixed order), without confirmation_code.
          type: array
          items:
            $ref: "#/components/schemas/ConfirmationArgument"
        expiresAt:
          description: End of the confirmation TTL (C11, 120 s after creation); the portal shows a countdown.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    ConfirmationDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - approve
            - decline
      additionalProperties: false
    PolicyStatus:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            type: object
            required:
              - instanceId
              - revision
            properties:
              instanceId:
                type: string
              revision:
                $ref: "#/components/schemas/PolicyRevision"
            additionalProperties: false
      additionalProperties: false
    ServerId:
      description: MCP server id; always mcp-<system>, one server per system (C5).
      type: string
      enum:
        - mcp-jira
        - mcp-confluence
        - mcp-gitlab
        - mcp-servicedesk
        - mcp-opensearch
    SystemId:
      description: Target system identifier, lower case (01-contracts conventions).
      type: string
      enum:
        - jira
        - confluence
        - gitlab
        - servicedesk
        - opensearch
    SemVer:
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
    QualifiedToolName:
      description: "Tool name as seen by MCP clients, in C5 and C12: <system>__<tool>."
      type: string
      pattern: ^(jira|confluence|gitlab|servicedesk|opensearch)__[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 80
    Risk:
      type: string
      enum:
        - READ_ONLY
        - UPDATE
        - DESTRUCTIVE
    ToolAction:
      description: Cedar action evaluated by the server on the resolved resource (C6, C7).
      type: string
      enum:
        - read
        - update
        - delete
        - admin
    GroupName:
      description: Group / entitlement name from C9. Only the mcp- prefix is used by the platform.
      type: string
      pattern: ^mcp-[A-Za-z0-9][A-Za-z0-9._-]*$
      maxLength: 255
    VirtualServerSlug:
      description: Virtual server slug; used in the URL path /v/<slug>/mcp (C5).
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    ScopeResourceType:
      description: Resource types that can be narrowed by a virtual server (C5 resourceDefaults) and granted by scope groups (C9).
      type: string
      enum:
        - Jira::Project
        - Confluence::Space
        - GitLab::Group
        - OpenSearch::Index
        - ServiceDesk::Queue
    ToolName:
      description: Server-side tool name (without the gateway prefix). Snake case; a double underscore is forbidden because the gateway uses it as the <system>__<tool> separator (C5).
      type: string
      pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 64
    ResourceType:
      description: Cedar entity type of a system resource (C7).
      type: string
      enum:
        - Jira::Project
        - Jira::Issue
        - Confluence::Space
        - Confluence::Page
        - GitLab::Group
        - GitLab::Project
        - OpenSearch::Index
        - ServiceDesk::Queue
        - ServiceDesk::Ticket
    ResourceRef:
      type: object
      required:
        - argument
        - type
      properties:
        argument:
          description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 64
        type:
          $ref: "#/components/schemas/ResourceType"
      additionalProperties: false
    McpToolDefinition:
      description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential.
      type: object
      required:
        - name
        - description
        - inputSchema
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        description:
          type: string
          minLength: 1
        inputSchema:
          type: object
          description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11).
        outputSchema:
          type: object
        annotations:
          type: object
      additionalProperties: false
    DefinitionHash:
      description: sha256:<hex> over the RFC 8785 canonical JSON described in C6 (see test-vectors/definition-hash).
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ToolEntryFields:
      description: Fields of a manifest tool entry, open for composition (used by the gateway registry API).
      type: object
      required:
        - name
        - risk
        - action
        - resourceRefs
        - definition
        - definitionHash
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        resourceRefs:
          description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        definition:
          $ref: "#/components/schemas/McpToolDefinition"
        definitionHash:
          description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
          $ref: "#/components/schemas/DefinitionHash"
    CredentialType:
      type: string
      enum:
        - user-oauth
        - user-secret
        - token-exchange
        - service-account
    ResourceTypeDeclaration:
      type: object
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        attributes:
          description: Attributes the server's resolver fills from the system (Cedar entity attributes).
          type: array
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9]*$
          uniqueItems: true
        parent:
          $ref: "#/components/schemas/ResourceType"
      additionalProperties: false
    ToolEntry:
      description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
      type: object
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      unevaluatedProperties: false
    Timestamp:
      description: ISO 8601 date-time in UTC (suffix Z).
      type: string
      format: date-time
      pattern: Z$
    RequestId:
      description: UUIDv7 request id (C2 rid, X-Request-Id).
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ComponentId:
      description: Identifier of a platform component, e.g. mcp-gateway, mcp-credential-broker, mcp-jira.
      type: string
      pattern: ^mcp-[a-z0-9]+(-[a-z0-9]+)*$
      maxLength: 64
    PolicyRevision:
      description: Policy bundle revision YYYYMMDDHHMMSS-<sha7> (C7). Ordered by the timestamp part.
      type: string
      pattern: ^[0-9]{14}-[0-9a-f]{7}$
    ErrorCode:
      description: Client-visible error codes (C10).
      type: string
      enum:
        - unauthenticated
        - access_denied
        - tool_disabled
        - confirmation_required
        - confirmation_failed
        - confirmation_declined
        - credential_required
        - not_found_or_denied
        - invalid_argument
        - rate_limited
        - step_up_required
        - upstream_unavailable
        - internal_error
    ConfirmationId:
      description: Opaque, unguessable id of a pending confirmation (C11); used in URL paths.
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    ServerManifest:
      title: MCP server manifest (C6)
      description: "Generated by the starter at build time (target/mcp-manifest.json), served at GET /mcp-manifest (requires C2) and registered with PUT /admin/v1/registry/servers/{serverId} (C5). Rules checked in addition to this schema (see README, 'Reguły semantyczne'): serverId == 'mcp-' + system; tool names unique; every resourceRefs[].type and resourceTypes[].parent is declared in resourceTypes; resourceTypes[].type unique; definition.name == name; definition.inputSchema has no confirmation_code; definitionHash recomputed from definition and the entry equals the declared one (CC-005)."
      type: object
      required:
        - serverId
        - version
        - system
        - internalUrl
        - credential
        - resourceTypes
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        version:
          $ref: "#/components/schemas/SemVer"
        system:
          $ref: "#/components/schemas/SystemId"
        internalUrl:
          description: Informational. The gateway takes serverId -> system/internalUrl only from its own configuration and rejects a manifest that disagrees (C5).
          type: string
          format: uri
          pattern: ^https://
        credential:
          type: object
          required:
            - required
            - acceptedTypes
          properties:
            required:
              type: boolean
            acceptedTypes:
              type: array
              items:
                $ref: "#/components/schemas/CredentialType"
              uniqueItems: true
          if:
            properties:
              required:
                const: true
          then:
            properties:
              acceptedTypes:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialType"
                minItems: 1
          additionalProperties: false
        resourceTypes:
          type: array
          items:
            $ref: "#/components/schemas/ResourceTypeDeclaration"
        tools:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ToolEntry"
      additionalProperties: false
      $defs:
        ResourceTypeDeclaration:
          type: object
          required:
            - type
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            attributes:
              description: Attributes the server's resolver fills from the system (Cedar entity attributes).
              type: array
              items:
                type: string
                pattern: ^[a-z][A-Za-z0-9]*$
              uniqueItems: true
            parent:
              $ref: "#/components/schemas/ResourceType"
          additionalProperties: false
        ResourceRef:
          type: object
          required:
            - argument
            - type
          properties:
            argument:
              description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
              type: string
              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
              maxLength: 64
            type:
              $ref: "#/components/schemas/ResourceType"
          additionalProperties: false
        ToolEntry:
          description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
          type: object
          allOf:
            - $ref: "#/components/schemas/ToolEntryFields"
          unevaluatedProperties: false
        ToolEntryFields:
          description: Fields of a manifest tool entry, open for composition (used by the gateway registry API).
          type: object
          required:
            - name
            - risk
            - action
            - resourceRefs
            - definition
            - definitionHash
          properties:
            name:
              $ref: "#/components/schemas/ToolName"
            risk:
              $ref: "#/components/schemas/Risk"
            action:
              $ref: "#/components/schemas/ToolAction"
            resourceRefs:
              description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
              type: array
              items:
                $ref: "#/components/schemas/ResourceRef"
            definition:
              $ref: "#/components/schemas/McpToolDefinition"
            definitionHash:
              description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
              $ref: "#/components/schemas/DefinitionHash"
        McpToolDefinition:
          description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential.
          type: object
          required:
            - name
            - description
            - inputSchema
          properties:
            name:
              $ref: "#/components/schemas/ToolName"
            description:
              type: string
              minLength: 1
            inputSchema:
              type: object
              description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11).
            outputSchema:
              type: object
            annotations:
              type: object
          additionalProperties: false
    AuditEvent:
      title: Audit event (C8)
      description: One JSON object per line on a dedicated logger/appender shipped to the SIEM. Never contains argument values, tool results, secrets or confirmation codes; additionalProperties is false so such fields cannot be added by accident. Target system of broker events is carried in 'server' (mcp-<system>). The serializer must escape control characters, U+2028 and U+2029 in every string value.
      type: object
      required:
        - ts
        - requestId
        - component
        - componentId
        - event
      properties:
        ts:
          $ref: "#/components/schemas/Timestamp"
        requestId:
          $ref: "#/components/schemas/RequestId"
        clientRequestId:
          description: X-Request-Id sent by the AI client, recorded by the gateway only (C3). Untrusted, so limited to a log-safe alphabet (CC-031); the gateway drops a value that does not match instead of rejecting the call.
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        component:
          type: string
          enum:
            - gateway
            - broker
            - server
            - portal
        componentId:
          $ref: "#/components/schemas/ComponentId"
        event:
          type: string
          enum:
            - tool_call
            - policy_decision
            - credential_resolve
            - connection_change
            - confirmation
            - admin_change
        sub:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          maxLength: 255
        client:
          type: string
          maxLength: 255
        virtualServer:
          $ref: "#/components/schemas/VirtualServerSlug"
        server:
          $ref: "#/components/schemas/ServerId"
        tool:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        resource:
          type: object
          required:
            - type
            - id
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            id:
              description: Resource id as the system knows it (Jira key, GitLab path, index name, page id). Free-form because ids of the five systems use different alphabets (slashes, dots, spaces in some service desks), but C0 and C1 control characters, DEL, U+2028 and U+2029 are excluded so the line-oriented SIEM format cannot be broken (CC-031). Independently of this, the audit JSON serializer must escape every control character and U+2028/U+2029.
              type: string
              pattern: ^[^\u0000-\u001f\u007f-\u009f\u2028\u2029]{1,512}$
            parent:
              description: Parent as <Namespace>::<Type>::<id>, e.g. Jira::Project::ABC (C8 example format).
              type: string
              pattern: ^[A-Za-z]+::[A-Za-z]+::.+$
              maxLength: 600
          additionalProperties: false
        decision:
          type: string
          enum:
            - allow
            - deny
            - confirmation_pending
        reason:
          description: "Machine-readable reason, snake case. Known values: policy_forbid, not_granted, tool_disabled, user_confirmed, user_declined, confirmation_expired, credential_required, step_up_required, rate_limited."
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        policyRevision:
          $ref: "#/components/schemas/PolicyRevision"
        credentialType:
          $ref: "#/components/schemas/CredentialType"
        outcome:
          type: string
          enum:
            - ok
            - error
            - denied
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        latencyMs:
          type: integer
          minimum: 0
        argsLength:
          description: Length in bytes of the serialized arguments; the only trace of arguments allowed in audit.
          type: integer
          minimum: 0
      additionalProperties: false
