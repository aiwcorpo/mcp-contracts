  /admin/v1/confirmations/{confirmationId}:
    parameters:
      - $ref: "#/components/parameters/ConfirmationId"
    get:
      tags:
        - confirmations
      operationId: getConfirmation
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Read-only preview of a pending confirmation; owner only, valid session, no fresh MFA.
      description: |
        The preview is optional: the code from the authenticator works without opening it (CC-091). The gateway
        computes everything from its own record of the pending call, never from the client. A GET has no side effect:
        the view is recorded only by the explicit `markConfirmationViewed` call (CC-127), so that a prerender or a
        prefetch of the page cannot set it. Once the view is recorded, a different DESTRUCTIVE operation of the user does
        not supersede this one: it is refused with `confirmation_blocked` until this one is confirmed or the block ends at
        max(expiry, view + 90 s), also when its attempts ran out or it expired earlier (CC-127). When B is created after that block, the gateway first burns the current codes at the broker (`invalidateAuthenticatorCodes`, same per-user step as the creation; if it fails B is not created), because a code typed for A can stay valid for 90 s after A expired. There is no decision endpoint: a confirmation is given by typing the TOTP code in the MCP client, and
        refusing is not typing it (the call expires after 120 s).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: Tool and arguments in a fixed order; long values are truncated and marked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationView"
              examples:
                delete_issue:
                  value:
                    confirmationId: cnf_4k9Qe2LxW7tB3mZp
                    tool: jira__delete_issue
                    system: jira
                    resource:
                      type: Jira::Issue
                      id: ABC-123
                      parent: Jira::Project::ABC
                    arguments:
                      - name: issueKey
                        value: '"ABC-123"'
                        truncated: false
                    expiresAt: 2026-10-26T20:02:00Z
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown, expired, superseded by a newer DESTRUCTIVE operation of the user (CC-127; only when the preview had not been opened) or not owned by the caller; one answer for all of them (invariant 8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found_or_denied:
                  value:
                    error: not_found_or_denied
  /admin/v1/confirmations/{confirmationId}/viewed:
    parameters:
      - $ref: "#/components/parameters/ConfirmationId"
    post:
      tags:
        - confirmations
      operationId: markConfirmationViewed
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Record that the owner has the preview of a pending confirmation open and visible (CC-127).
      description: |
        Called by the portal after the preview page is rendered and visible, never by a GET and never for a prefetch or
        prerender. Idempotent: the first call sets `previewViewedAt`, later calls change nothing. Owner only. Recording the
        view and the check that a different DESTRUCTIVE operation makes against it are atomic with each other (one
        operation per user), so a race ends with B refused (view first) or A superseded and this call answering 404 (B
        first). The view blocks other DESTRUCTIVE operations as described in `getConfirmation`.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "204":
          description: Recorded (or it was recorded before).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown, expired, superseded, not owned by the caller, or attempts exhausted when the call was never viewed (not_found_or_denied); a call that was viewed before its attempts ran out answers 204 again (idempotent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found_or_denied:
                  value:
                    error: not_found_or_denied
        "503":
          description: The gateway cannot record the view because its state store is unavailable (fail-closed). The portal then shows that the protection "first wins after the preview" is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                upstream_unavailable:
                  value:
                    error: upstream_unavailable
  /admin/v1/confirmations/{confirmationId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ConfirmationId"
    post:
      tags:
        - confirmations
      operationId: cancelConfirmation
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: The owner cancels a pending confirmation; nothing is approved (CC-128).
      description: |
        Owner only; a valid session is enough, no fresh MFA, because the call removes a pending operation and approves
        nothing. This is not a decision endpoint: a confirmation is still given only by the TOTP code typed in the MCP
        client. The gateway removes the pending call with a compare-and-delete that is ordered with the code check on the
        same record, so a code typed in parallel after the cancel does not confirm the call (the check answers
        `confirmation_cancelled`). The cancel also burns the current TOTP codes of the owner at the broker
        (`invalidateAuthenticatorCodes`, called first; if it fails the answer is `503` and nothing is cancelled), so that a
        code typed for this operation and kept by the agent cannot confirm a new one. The block of "first wins after the preview" (CC-127) ends with it. A later retry of the
        cancelled call gets the C10 error `confirmation_cancelled` (the gateway keeps a tombstone until the original TTL
        ends; no broker call, no attempt or TOTP step spent), the audit event is `confirmation` with
        `reason: cancelled_by_owner`, and the call is `cancelled` in `activity/calls`. Idempotent while the tombstone lives
        (a second cancel is `204` and does not burn the codes again: only the cancel that changes the state calls the broker); cancelling a viewed call whose attempts ran out is allowed (`204`, lifts the block); the cancel works until the call expires (`expiresAt`), after that it is `404`, although the block can last up to 90 s longer; `404 not_found_or_denied` for an unknown, expired, superseded, executed or foreign call.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "204":
          description: Cancelled (or cancelled before).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown, expired, superseded, already executed or not owned by the caller (not_found_or_denied).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found_or_denied:
                  value:
                    error: not_found_or_denied
        "503":
          description: The broker could not burn the current codes; nothing was cancelled (fail-closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                upstream_unavailable:
                  value:
                    error: upstream_unavailable
  /admin/v1/users/{sub}/purge:
    post:
      tags:
        - admin
      operationId: purgeUser
      x-allowed-client-cn:
        - mcp-offboarding
      summary: Remove everything the gateway keeps about a user (offboarding, CC-155).
      description: |
        Caller: IGA/HR webhook with mTLS CN=mcp-offboarding, no bearer token. Idempotent. Removes the virtual servers
        (links) of the user, the pending confirmations and their tombstones, the MCP sessions in Redis and the cached
        credentials of the user. The activity records (`/admin/v1/activity`, `activity/calls`) are not removed: they stay
        until the end of their retention, 30 days by default, as evidence (CC-134). Audit: one admin_change event with
        reason user_purged and outcome ok for every call, also when there was nothing to remove and also for a `sub`
        the gateway does not know (the answer is `204` either way), plus one virtual_server_change event with reason
        user_purged for every removed link (CC-155). The event carries the `sub` of the purged user and no counts.

        **Accepted window (decision 2026-10-29).** The gateway does not block the `sub` after a purge: a token of an MCP client
        issued before it stays valid until it expires (at most 60 minutes, C1). Within that window a calling user can still use
        a system that needs no connection of the user, such as the service account of Service Desk. Sessions of the portal are
        ended by the back-channel logout of the IdP, and a `purge` repeated after that logout is safe and recommended (a
        flow that was still open can create a connection after the first one). The full offboarding is three independent
        idempotent calls, in any order (recommended: the IdP first, so that tokens stop being renewed): the IdP or IGA
        removes the groups, the broker purges (`POST /v1/admin/users/{sub}/purge` of C4) and the gateway purges.
      security:
        - mtls: []
      parameters:
        - name: sub
          in: path
          required: true
          description: "`sub` of the user from the IdP (C1)."
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
      responses:
        "204":
          description: Everything removed, or nothing existed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Redis or the store of links did not answer; nothing is guaranteed removed, repeat the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                upstream_unavailable:
                  value:
                    error: upstream_unavailable
  /admin/v1/policy/status:
    get:
      tags:
        - policy
      operationId: getPolicyStatus
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Policy bundle revision loaded by each gateway instance (admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: One entry per running instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyStatus"
              examples:
                two_instances:
                  value:
                    instances:
                      - instanceId: mcp-gateway-0
                        revision: 20261026120000-a1b2c3d
                      - instanceId: mcp-gateway-1
                        revision: 20261026120000-a1b2c3d
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  headers:
    NoStore:
      description: Required on responses carrying the arguments of a pending call (CC-091); intermediaries and clients must not cache them.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
      example: no-cache
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate from the internal CA; CN=mcp-portal-bff for BFF calls, CN=mcp-registry-ci-<serverId> for registry writes (one certificate per server pipeline).
    bffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User token exchanged in the IdP (RFC 8693) for aud=mcp-gateway-admin.
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/VirtualServerSlug"
      example: team-a-dev
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ServerId"
      example: mcp-jira
    Tool:
      name: tool
      in: path
      required: true
      description: Server-side tool name (without the system prefix).
      schema:
        $ref: "#/components/schemas/ToolName"
      example: update_issue
    ConfirmationId:
      name: confirmationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConfirmationId"
      example: cnf_4k9Qe2LxW7tB3mZp
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    BadRequest:
      description: Malformed request or schema violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      description: Missing or invalid token or client certificate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    Forbidden:
      description: Caller lacks mcp-platform-admin or uses the wrong client certificate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            access_denied:
              value:
                error: access_denied
    NotFound:
      description: Does not exist or is not visible to the caller (not_found_or_denied).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_found_or_denied:
              value:
                error: not_found_or_denied
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C5 does not define.
      required:
        - error
      properties:
        error:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    ManifestRejected:
      type: object
      description: 422 of a registration or an approval (CC-133). reason is a known value or absent for the older rejections (a hash that does not match, a rule of the manifest).
      required:
        - error
      properties:
        error:
          const: manifest_rejected
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Known values are risk_lowered, environment_mismatch (CC-138) and credential_type_mismatch (CC-159). A client must show an unknown value as a generic message.
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    Access:
      type: string
      enum:
        - granted
        - denied
    CatalogTool:
      type: object
      required:
        - name
        - description
        - risk
        - action
        - access
        - requiredEntitlements
      properties:
        name:
          $ref: "#/components/schemas/QualifiedToolName"
        description:
          type: string
          description: definition.description of the approved manifest entry (CC-005, CC-014).
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        access:
          $ref: "#/components/schemas/Access"
        requiredEntitlements:
          description: Groups (C9) that grant this tool according to policy; empty when policy names none.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GroupName"
        title:
          type: string
          minLength: 1
          description: definition.title of the approved manifest entry (CC-042, CC-082), a short display name for the UI. Absent when the tool has no title; the UI then falls back to description.
        disabled:
          type: boolean
          default: false
          description: True when an administrator disabled the tool or its server (C10 tool_disabled; a hash pending approval counts) (CC-081). A disabled tool cannot be added to a virtual server (POST /virtual-servers answers 403 access_denied).
        requiresConfirmation:
          type: boolean
          default: false
          description: True when every call needs a confirmation (C11), risk DESTRUCTIVE or a policy requires it. Computed by the gateway (CC-081).
      additionalProperties: false
    CatalogServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTool"
      additionalProperties: false
    Catalog:
      type: object
      required:
        - servers
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogServer"
      additionalProperties: false
    ResourceDefaults:
      type: object
      description: Dormant (CC-085); the gateway answers 400 resource_defaults_unsupported for a non-empty value, absent or {} is accepted. Narrowing per resource type (C5). Becomes the vsc claim and context.vsScopes in Cedar (cedar/entity-builder.md). Ids follow the per-system patterns of common.schema.json (OpenSearch::Index takes index prefixes). At most 50 ids per type keep the internal JWT small.
      properties:
        Jira::Project:
          $ref: "#/components/schemas/JiraProjectKeys"
        Confluence::Space:
          $ref: "#/components/schemas/ConfluenceSpaceKeys"
        GitLab::Group:
          $ref: "#/components/schemas/GitLabGroupPaths"
        OpenSearch::Index:
          $ref: "#/components/schemas/OpenSearchIndexPrefixes"
        ServiceDesk::Queue:
          $ref: "#/components/schemas/ServiceDeskQueueIds"
      additionalProperties: false
    JiraProjectKeys:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/JiraProjectKey"
    ConfluenceSpaceKeys:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ConfluenceSpaceKey"
    GitLabGroupPaths:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/GitLabGroupPath"
    OpenSearchIndexPrefixes:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/OpenSearchIndexPrefix"
    ServiceDeskQueueIds:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ServiceDeskQueueId"
    VirtualServerCreate:
      type: object
      required:
        - slug
        - displayName
        - tools
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        tools:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/QualifiedToolName"
        resourceDefaults:
          description: Dormant (CC-085). The gateway answers 400 resource_defaults_unsupported for a non-empty value; absent or {} is accepted.
          $ref: "#/components/schemas/ResourceDefaults"
      additionalProperties: false
    VirtualServerCreated:
      type: object
      required:
        - slug
        - url
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        url:
          type: string
          format: uri
          description: Public MCP endpoint <publicBaseUrl>/v/<slug>/mcp (CC-089).
      additionalProperties: false
    VirtualServer:
      type: object
      required:
        - slug
        - displayName
        - tools
        - url
      properties:
        slug:
          $ref: "#/components/schemas/VirtualServerSlug"
        displayName:
          type: string
        tools:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/QualifiedToolName"
        resourceDefaults:
          description: Dormant (CC-085); never present in responses.
          $ref: "#/components/schemas/ResourceDefaults"
        url:
          type: string
          format: uri
          description: Public MCP endpoint <publicBaseUrl>/v/<slug>/mcp (CC-089).
      additionalProperties: false
    RegistryToolStatus:
      type: string
      enum:
        - approved
        - pending_approval
    RegistryTool:
      description: Manifest tool entry (C6) with its approval status. Pending entries are shown when present.
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/RegistryToolStatus"
        change:
          type: string
          enum:
            - new
            - changed
          description: Present exactly when status is pending_approval. new means no approved entry exists, changed means an approved entry exists and differs (CC-097).
        source:
          type: string
          enum:
            - ci
            - server
          description: Present exactly when status is pending_approval (CC-162); same meaning as PendingTool.source.
        riskLowered:
          type: boolean
          description: True when the pending entry has a risk below the risk floor (CC-167). The tool is hidden and refused as tool_disabled, and only an administrator can approve it, with acceptRiskLowering true. Absent means false.
        approvedInVersion:
          description: Version of the manifest at which the approved entry was approved; null for a new tool that has no approved entry. Absent only for an approved tool whose version was not recorded before this field existed (CC-097).
          oneOf:
            - $ref: "#/components/schemas/SemVer"
            - type: "null"
      unevaluatedProperties: false
    RegistryServer:
      type: object
      required:
        - serverId
        - system
        - version
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/SemVer"
        enabled:
          type: boolean
          default: true
          description: False when the server is disabled in gateway configuration or by an overrides policy, or when its held manifest fails the checks at start (CC-159). All tools of a disabled server report disabled=true in the catalog (CC-081, CC-088). Read only; the portal has no switch.
        tools:
          type: array
          items:
            $ref: "#/components/schemas/RegistryTool"
      additionalProperties: false
    PendingTool:
      type: object
      required:
        - approvedEntry
        - pendingEntry
        - pendingHash
        - pendingVersion
        - source
      properties:
        approvedInVersion:
          description: Version of the manifest at which approvedEntry was approved; null when approvedEntry is null (CC-097).
          oneOf:
            - $ref: "#/components/schemas/SemVer"
            - type: "null"
        pendingVersion:
          description: Version of the manifest in which the pending entry appeared (CC-097). For source server it is the version the server reported in initialize, a value the server controls, so the administrator sees it together with source.
          $ref: "#/components/schemas/SemVer"
        riskLowered:
          type: boolean
          description: True when the pending entry has a risk below the risk floor, the highest risk ever reported for the tool (CC-167); approve needs acceptRiskLowering true then. Absent means false.
        source:
          type: string
          enum:
            - ci
            - server
          description: Where the pending entry comes from (CC-162). ci is an entry left by a PUT of the pipeline (the reviewed commit); server is a definition that the running server presented. A server entry never replaces a ci entry, see the README, "Rejestr i przypinanie definicji".
        approvedEntry:
          description: Currently approved entry; null for a new tool.
          oneOf:
            - $ref: "#/components/schemas/ToolEntry"
            - type: "null"
        pendingEntry:
          $ref: "#/components/schemas/ToolEntry"
        pendingHash:
          $ref: "#/components/schemas/DefinitionHash"
      additionalProperties: false
    ApproveRequest:
      type: object
      required:
        - definitionHash
      properties:
        definitionHash:
          $ref: "#/components/schemas/DefinitionHash"
        acceptRiskLowering:
          type: boolean
          default: false
          description: Only an administrator (mcp-platform-admin) can set it, and only through this operation; the pipeline (PUT) never lowers a risk, and the portal asks for a fresh MFA first. Sent only when true. On an entry that lowers nothing it is ignored (definition_approved). Without it an entry that lowers the risk floor is 422 risk_lowered; with it the lower risk is approved, the floor becomes that risk and the audit event is admin_change with reason risk_lowered_by_admin (CC-167).
      additionalProperties: false
    ActivityCall:
      type: object
      required:
        - requestId
        - ts
        - tool
        - result
      properties:
        requestId:
          description: requestId of the first request of the call (the one that created a pending confirmation, if any).
          $ref: "#/components/schemas/RequestId"
        ts:
          description: Time of that first request.
          $ref: "#/components/schemas/Timestamp"
        client:
          type: string
          maxLength: 255
          description: Client id (azp), e.g. claude-code; the UI maps it to a display name.
        virtualServer:
          $ref: "#/components/schemas/VirtualServerSlug"
        tool:
          $ref: "#/components/schemas/QualifiedToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        resource:
          description: Same shape and limits as resource in the audit event (C8), including the exclusion of control and bidirectional characters in id (CC-031).
          $ref: "#/components/schemas/resource"
        result:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: |
            Final state of the call. Known values: ok, error, denied_not_granted, denied_link_scope, denied_policy,
            tool_disabled, credential_required, rate_limited, step_up_required, confirmation_pending, confirmed,
            expired, confirmation_failed, superseded, blocked_by_pending, cancelled. A client must show an unknown value as a generic label.
        wrongCodeCount:
          description: Number of wrong confirmation codes (answers invalid or replayed of the broker) given for this call; present only for calls that needed a confirmation and were not refused as blocked_by_pending. A retry that came too late or found no pending call is not a wrong code.
          type: integer
          minimum: 0
          maximum: 3
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
      additionalProperties: false
    ConfirmationArgument:
      type: object
      required:
        - name
        - value
        - truncated
      properties:
        name:
          type: string
        value:
          type: string
          description: JSON serialization of the argument value, cut to a gateway limit when truncated is true.
        truncated:
          type: boolean
      additionalProperties: false
    ConfirmationView:
      type: object
      required:
        - confirmationId
        - tool
        - system
        - arguments
        - expiresAt
      properties:
        confirmationId:
          $ref: "#/components/schemas/ConfirmationId"
        tool:
          $ref: "#/components/schemas/QualifiedToolName"
        system:
          description: System the tool acts on; the portal shows it next to the tool (CC-077). Read by the gateway from its own record of the pending call, never from the client.
          $ref: "#/components/schemas/SystemId"
        resource:
          description: Main resource of the call from resourceRefs (type, id, parent), computed by the gateway, the same value that goes to the audit event (CC-098); absent when the tool takes no resource identifier. Same limits as in C8, including the exclusion of control and bidirectional characters in id.
          $ref: "#/components/schemas/resource"
        arguments:
          description: Arguments sorted by name (fixed order), without confirmation_code.
          type: array
          items:
            $ref: "#/components/schemas/ConfirmationArgument"
        expiresAt:
          description: End of the validity of the pending call (C11, 120 s after creation, not extended by a repeated first call); the portal shows a countdown.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PolicyStatus:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            type: object
            required:
              - instanceId
              - revision
            properties:
              instanceId:
                type: string
              revision:
                $ref: "#/components/schemas/PolicyRevision"
            additionalProperties: false
      additionalProperties: false
    ServerId:
      description: MCP server id; always mcp-<system>, one server per system (C5).
      type: string
      enum:
        - mcp-jira
        - mcp-confluence
        - mcp-gitlab
        - mcp-servicedesk
        - mcp-opensearch
    SystemId:
      description: Target system identifier, lower case (01-contracts conventions).
      type: string
      enum:
        - jira
        - confluence
        - gitlab
        - servicedesk
        - opensearch
    SemVer:
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
    QualifiedToolName:
      description: "Tool name as seen by MCP clients, in C5 and C12: <system>__<tool>."
      type: string
      pattern: ^(jira|confluence|gitlab|servicedesk|opensearch)__[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 80
    Risk:
      type: string
      enum:
        - READ_ONLY
        - UPDATE
        - DESTRUCTIVE
    ToolAction:
      description: Cedar action evaluated by the server on the resolved resource (C6, C7).
      type: string
      enum:
        - read
        - update
        - delete
        - admin
    GroupName:
      description: Group / entitlement name from C9. Only the mcp- prefix is used by the platform.
      type: string
      pattern: ^mcp-[A-Za-z0-9][A-Za-z0-9._-]*$
      maxLength: 255
    VirtualServerSlug:
      description: Virtual server slug; used in the URL path /v/<slug>/mcp (C5).
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    JiraProjectKey:
      description: "Jira Data Center project key: first character an upper-case letter, then upper-case letters, digits or underscore (Jira project key format rules; hyphens not supported). Length 2..10 (Jira default maximum project key size; configurable in Jira, a larger limit needs a contract change)."
      type: string
      pattern: ^[A-Z][A-Z0-9_]{1,9}$
    ConfluenceSpaceKey:
      description: "Confluence Data Center space key of a global space: letters and digits only. Personal spaces (~user) cannot be granted or narrowed."
      type: string
      pattern: ^[A-Za-z0-9]{1,255}$
    GitLabGroupPath:
      description: "Full path of a GitLab group: 1..20 segments separated by / (subgroups nest up to 20 levels). A segment has only letters, digits, _, . and -, starts and ends with a letter or digit and has no consecutive special characters; the path does not end in .git or .atom (GitLab reserved names / path rules)."
      type: string
      pattern: ^(?!.*\.(?:git|atom)$)[A-Za-z0-9](?:[._-]?[A-Za-z0-9])*(?:/[A-Za-z0-9](?:[._-]?[A-Za-z0-9])*){0,19}$
      maxLength: 1024
    OpenSearchIndexPrefix:
      description: "Grantable index prefix: OpenSearchIndexName that does not end with '-' or '.'. Covers the index named exactly like the prefix and every index starting with '<prefix>-'. One anchored expression without an alternation at the top level, so that it satisfies the input-schema-bounded rule when a tool uses it as a contractPattern (CC-139); it matches the same strings as before."
      type: string
      pattern: ^(?:[a-z0-9][a-z0-9._-]{0,253}[a-z0-9_]|[a-z0-9])$
    ServiceDeskQueueId:
      description: "Queue id of the generic service desk adapter (D10): conservative alphabet, to be made configurable per adapter in a later version."
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
    ToolName:
      description: Server-side tool name (without the gateway prefix). Snake case; a double underscore is forbidden because the gateway uses it as the <system>__<tool> separator (C5).
      type: string
      pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 64
    ResourceType:
      description: Cedar entity type of a system resource (C7).
      type: string
      enum:
        - Jira::Project
        - Jira::Issue
        - Confluence::Space
        - Confluence::Page
        - GitLab::Group
        - GitLab::Project
        - OpenSearch::Index
        - ServiceDesk::Queue
        - ServiceDesk::Ticket
    ResourceRef:
      type: object
      required:
        - argument
        - type
      properties:
        argument:
          description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 64
        type:
          $ref: "#/components/schemas/ResourceType"
      additionalProperties: false
    McpToolDefinition:
      description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential. title is required (CC-115) and hashed like description (CC-042); icons and _meta are not allowed in v1, because they would reach the client without being pinned.
      type: object
      required:
        - name
        - title
        - description
        - inputSchema
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        title:
          type: string
          minLength: 1
          description: Display name shown by MCP clients; required since 3.0.0 (CC-115) and part of definitionHash (CC-042).
        description:
          type: string
          minLength: 1
        inputSchema:
          type: object
          description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11). Closed and bounded (CC-078, CC-123); checked by the semantic rules, because JSON Schema cannot express them for arbitrary nesting.
        outputSchema:
          type: object
        annotations:
          type: object
      additionalProperties: false
    DefinitionHash:
      description: sha256:<hex> over the RFC 8785 canonical JSON described in C6 (see test-vectors/definition-hash).
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ToolEntryFields:
      description: Fields of a manifest tool entry, open for composition (used by the gateway registry API).
      type: object
      required:
        - name
        - risk
        - action
        - resourceRefs
        - definition
        - definitionHash
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        action:
          $ref: "#/components/schemas/ToolAction"
        resourceRefs:
          description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        definition:
          $ref: "#/components/schemas/McpToolDefinition"
        definitionHash:
          description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
          $ref: "#/components/schemas/DefinitionHash"
    CredentialType:
      type: string
      enum:
        - user-oauth
        - user-secret
        - token-exchange
        - service-account
    ResourceTypeDeclaration:
      type: object
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        attributes:
          description: Attributes the server's resolver fills from the system (Cedar entity attributes).
          type: array
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9]*$
          uniqueItems: true
        parent:
          $ref: "#/components/schemas/ResourceType"
      additionalProperties: false
    ToolEntry:
      description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
      type: object
      allOf:
        - $ref: "#/components/schemas/ToolEntryFields"
      unevaluatedProperties: false
    Timestamp:
      description: ISO 8601 date-time in UTC (suffix Z).
      type: string
      format: date-time
      pattern: Z$
    RequestId:
      description: UUIDv7 request id (C2 rid, X-Request-Id).
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ComponentId:
      description: Identifier of a platform component, e.g. mcp-gateway, mcp-credential-broker, mcp-jira.
      type: string
      pattern: ^mcp-[a-z0-9]+(-[a-z0-9]+)*$
      maxLength: 64
    PolicyRevision:
      description: Policy bundle revision YYYYMMDDHHMMSS-<sha7> (C7). Ordered by the timestamp part. The value 00000000000000-0000000 means 'gateway without a loaded bundle' (M1 only, CC-068); it is not the revision of any bundle and a receiver must not infer anything about policy from it.
      type: string
      pattern: ^[0-9]{14}-[0-9a-f]{7}$
    ErrorCode:
      description: Client-visible error codes (C10).
      type: string
      enum:
        - unauthenticated
        - access_denied
        - tool_disabled
        - confirmation_required
        - confirmation_failed
        - confirmation_superseded
        - confirmation_cancelled
        - confirmation_blocked
        - credential_required
        - not_found_or_denied
        - invalid_argument
        - rate_limited
        - step_up_required
        - upstream_unavailable
        - internal_error
    resource:
      type: object
      required:
        - type
        - id
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        id:
          description: "Resource id as the system knows it (Jira key, GitLab path, index name, page id). Free-form because ids of the five systems use different alphabets (slashes, dots, spaces in some service desks). Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031). The length limit counts code points; producers should keep ids below 512 characters. Independently of this, the audit JSON serializer must escape every control character and U+2028/U+2029."
          type: string
          pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,512}$
        parent:
          description: "Parent as <Namespace>::<Type>::<id>, e.g. Jira::Project::ABC (C8 example format). The id part has the same exclusions as resource.id: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
          type: string
          pattern: ^[A-Za-z]+::[A-Za-z]+::[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]+$
          maxLength: 600
      additionalProperties: false
    ConfirmationId:
      description: Opaque, unguessable id of a pending confirmation (C11); used in URL paths and as the key of the portal preview.
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    ServerManifest:
      title: MCP server manifest (C6)
      description: "Generated by the starter at build time (target/mcp-manifest.json, the artifact of the reviewed commit) or built at startup from the server's tools/list (CC-140), served at GET /mcp-manifest (requires C2) and registered with PUT /admin/v1/registry/servers/{serverId} (C5). Rules checked in addition to this schema (see README, 'Reguły semantyczne'): serverId == 'mcp-' + system; tool names unique; every resourceRefs[].type and resourceTypes[].parent is declared in resourceTypes; resourceTypes[].type unique; definition.name == name; definition.inputSchema has no confirmation_code and is closed and bounded (CC-078, CC-123: type object and additionalProperties false at every object level, no open maps, every string with maxLength unless an enum or const, every array with maxItems and items, every number with minimum and maximum, patterns anchored with ^ and $, every node typed, no allOf/anyOf/oneOf/not/if/then/else); definitionHash recomputed from definition and the entry equals the declared one (CC-005)."
      type: object
      required:
        - serverId
        - version
        - system
        - internalUrl
        - credential
        - resourceTypes
        - tools
      properties:
        serverId:
          $ref: "#/components/schemas/ServerId"
        version:
          $ref: "#/components/schemas/SemVer"
        system:
          $ref: "#/components/schemas/SystemId"
        environment:
          description: Environment the server was built for (CC-138). Absent means production. A gateway in production mode rejects a manifest with dev (422 manifest_rejected, reason environment_mismatch). Not part of any definitionHash.
          type: string
          enum:
            - production
            - dev
        internalUrl:
          description: Informational. The gateway takes serverId -> system/internalUrl only from its own configuration and rejects a manifest that disagrees (C5).
          type: string
          format: uri
          pattern: ^https://
        credential:
          type: object
          required:
            - required
            - acceptedTypes
          properties:
            required:
              type: boolean
            acceptedTypes:
              type: array
              items:
                $ref: "#/components/schemas/CredentialType"
              uniqueItems: true
          if:
            properties:
              required:
                const: true
          then:
            properties:
              acceptedTypes:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialType"
                minItems: 1
          additionalProperties: false
        resourceTypes:
          type: array
          items:
            $ref: "#/components/schemas/ResourceTypeDeclaration"
        tools:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ToolEntry"
      additionalProperties: false
      $defs:
        ResourceTypeDeclaration:
          type: object
          required:
            - type
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            attributes:
              description: Attributes the server's resolver fills from the system (Cedar entity attributes).
              type: array
              items:
                type: string
                pattern: ^[a-z][A-Za-z0-9]*$
              uniqueItems: true
            parent:
              $ref: "#/components/schemas/ResourceType"
          additionalProperties: false
        ResourceRef:
          type: object
          required:
            - argument
            - type
          properties:
            argument:
              description: Name of a top-level argument of the tool's inputSchema whose value is a resource id (string or array of strings).
              type: string
              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
              maxLength: 64
            type:
              $ref: "#/components/schemas/ResourceType"
          additionalProperties: false
        ToolEntry:
          description: Manifest entry of one tool. Every tool that accepts a resource identifier MUST declare resourceRefs (C6).
          type: object
          allOf:
            - $ref: "#/components/schemas/ToolEntryFields"
          unevaluatedProperties: false
        ToolEntryFields:
          description: Fields of a manifest tool entry, open for composition (used by the gateway registry API).
          type: object
          required:
            - name
            - risk
            - action
            - resourceRefs
            - definition
            - definitionHash
          properties:
            name:
              $ref: "#/components/schemas/ToolName"
            risk:
              $ref: "#/components/schemas/Risk"
            action:
              $ref: "#/components/schemas/ToolAction"
            resourceRefs:
              description: Always present; an empty array when the tool takes no resource identifier (one canonical form for definitionHash).
              type: array
              items:
                $ref: "#/components/schemas/ResourceRef"
            definition:
              $ref: "#/components/schemas/McpToolDefinition"
            definitionHash:
              description: sha256 over the canonical JSON of definition + risk, action, resourceRefs + system, credential (CC-004, CC-005). Receivers recompute it.
              $ref: "#/components/schemas/DefinitionHash"
        McpToolDefinition:
          description: Full MCP tool definition as returned by tools/list (CC-005). Input of definitionHash together with risk, action, resourceRefs and the server fields system and credential. title is required (CC-115) and hashed like description (CC-042); icons and _meta are not allowed in v1, because they would reach the client without being pinned.
          type: object
          required:
            - name
            - title
            - description
            - inputSchema
          properties:
            name:
              $ref: "#/components/schemas/ToolName"
            title:
              type: string
              minLength: 1
              description: Display name shown by MCP clients; required since 3.0.0 (CC-115) and part of definitionHash (CC-042).
            description:
              type: string
              minLength: 1
            inputSchema:
              type: object
              description: JSON Schema of the arguments. Must not declare confirmation_code (reserved for the gateway, C11). Closed and bounded (CC-078, CC-123); checked by the semantic rules, because JSON Schema cannot express them for arbitrary nesting.
            outputSchema:
              type: object
            annotations:
              type: object
          additionalProperties: false
    AuditEvent:
      title: Audit event (C8)
      description: One JSON object per line on a dedicated logger/appender shipped to the SIEM. Never contains argument values, tool results, secrets, confirmation codes, TOTP codes, authenticator seeds or otpauth URIs; additionalProperties is false so such fields cannot be added by accident. Target system of broker events is carried in 'server' (mcp-<system>). The serializer must escape control characters, U+2028 and U+2029 in every string value.
      type: object
      required:
        - ts
        - requestId
        - component
        - componentId
        - event
      properties:
        ts:
          $ref: "#/components/schemas/Timestamp"
        requestId:
          $ref: "#/components/schemas/RequestId"
        clientRequestId:
          description: X-Request-Id sent by the AI client, recorded by the gateway only (C3). Untrusted, so limited to a log-safe alphabet (CC-031); the gateway drops a value that does not match instead of rejecting the call.
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        component:
          type: string
          enum:
            - gateway
            - broker
            - server
            - portal
        componentId:
          $ref: "#/components/schemas/ComponentId"
        event:
          type: string
          enum:
            - tool_call
            - policy_decision
            - credential_resolve
            - connection_change
            - confirmation
            - admin_change
            - authentication
            - authenticator
            - virtual_server_change
        sub:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          maxLength: 255
        backendUser:
          description: "Account in the target system read by whoami (C4.1, CC-101), for connection_change: the only trace of which account a user connected (CC-117). Same length limit as username. Never a secret. Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
          type: string
          pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,255}$
        client:
          type: string
          maxLength: 255
        virtualServer:
          $ref: "#/components/schemas/VirtualServerSlug"
        server:
          $ref: "#/components/schemas/ServerId"
        tool:
          $ref: "#/components/schemas/ToolName"
        risk:
          $ref: "#/components/schemas/Risk"
        resource:
          type: object
          required:
            - type
            - id
          properties:
            type:
              $ref: "#/components/schemas/ResourceType"
            id:
              description: "Resource id as the system knows it (Jira key, GitLab path, index name, page id). Free-form because ids of the five systems use different alphabets (slashes, dots, spaces in some service desks). Excluded characters: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031). The length limit counts code points; producers should keep ids below 512 characters. Independently of this, the audit JSON serializer must escape every control character and U+2028/U+2029."
              type: string
              pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]{1,512}$
            parent:
              description: "Parent as <Namespace>::<Type>::<id>, e.g. Jira::Project::ABC (C8 example format). The id part has the same exclusions as resource.id: C0 and C1 control characters and DEL (also TAB, LF, CR), every Unicode format character (\\p{Cf}: zero-width characters U+200B..U+200F, U+2060, U+FEFF, soft hyphen, bidirectional controls, Arabic letter mark U+061C, tag characters U+E0000..U+E007F), surrogates, U+2028, U+2029, noncharacters (U+FDD0..U+FDEF, U+FFFE, U+FFFF), the invisible fillers U+034F, U+115F, U+1160, U+3164, U+FFA0, U+2800 and the variation selectors U+FE00..U+FE0F. This is the set of the text hygiene of the README (CC-121), stricter for log fields since 3.0.2 (zero-width, direction marks and tag characters used to pass), so that the line-oriented SIEM format and log viewers cannot be misled (CC-031)."
              type: string
              pattern: ^[A-Za-z]+::[A-Za-z]+::[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]+$
              maxLength: 600
          additionalProperties: false
        decision:
          type: string
          enum:
            - allow
            - deny
            - confirmation_pending
        reason:
          description: "Machine-readable reason, snake case. Known values: policy_forbid, not_granted, tool_disabled, user_confirmed, user_confirmed_no_preview, confirmation_expired, attempts_exhausted, authenticator_not_registered, authenticator_disabled, superseded, pending_exists, cancelled_by_owner, credential_required, step_up_required, rate_limited, rate_limited_user, rate_limited_client, rate_limited_tool, exchange_denied, system_not_configured, subject_token_invalid, credential_type_mismatch, risk_lowered_by_admin, user_purged, unused_cleanup, definition_changed, tool_not_served, definition_submitted, link_scope, policy_unavailable, policy_error. credential_type_mismatch: on the gateway (event credential_resolve, outcome error, errorCode internal_error; credentialType is the type the broker returned) the broker returned a type that is not in the set of types the gateway configuration allows for the system; on a server (event policy_decision or tool_call) the type in X-MCP-Credential-Type, sent by the gateway with X-MCP-Credential, is not in the set of the server's accepted credential types, is missing or is not one of the four types, or the server has none configured, and the check comes before Cedar, the grant probe and the resolvers: decision deny, outcome error, errorCode internal_error, the client learns nothing more (CC-166). For rate limits (gateway, CC-156) a refused call or request is recorded as tool_call (a tools/call) or policy_decision (any other MCP request) with decision deny, outcome denied, errorCode rate_limited and reason rate_limited_user, rate_limited_client (the pair user and AI client) or rate_limited_tool (the pair user and tool); the client is not told which limit applied, the administrator is. The gateway may aggregate excess events as for CC-125. For event credential_resolve (broker, gateway): exchange_denied (the IdP refused the token exchange, CC-157, outcome denied; the gateway records it on the tool_call event of the call it had allowed, decision allow, outcome denied, errorCode access_denied, which is the normative shape for the activity row, CC-165) and system_not_configured (the system is not configured in the broker, CC-158, outcome error) and subject_token_invalid (the subject token of a token exchange has the wrong audience, has expired or belongs to another sub than the internal JWT, CC-157, outcome denied). For event connection_change (broker): user_purged (the connection was removed by the offboarding purge, CC-155) and unused_cleanup (the connection was removed because it had not been used for the configured number of days, 180 by default, CC-155). For event virtual_server_change the offboarding purge of the gateway records user_purged for every removed link, and both purges (broker and gateway) emit one admin_change with reason user_purged and outcome ok for every call, also when nothing was removed and for an unknown sub, so that a call of mcp-offboarding always leaves a trace (CC-155). For event confirmation (gateway, CC-094): confirmation_pending is the decision when the pending call is created, and the outcome is one of user_confirmed (code accepted), user_confirmed_no_preview (accepted although the owner did not open the portal preview), confirmation_expired, attempts_exhausted, authenticator_not_registered, authenticator_disabled, code_burned (the retry carried a code of a burned step: confirmation_failed outwards, no attempt spent, not a wrong code, CC-128), cancelled_by_owner (the owner cancelled the pending call in the portal, CC-128; decision deny, errorCode confirmation_cancelled, emitted when the cancel is accepted and again when the cancelled call is retried), pending_exists (a new DESTRUCTIVE call was refused because another one is pending and its preview was opened; errorCode confirmation_blocked, CC-127), superseded (the pending DESTRUCTIVE call was replaced by a newer one of the same user, CC-127; emitted for the older call when the newer is created, and again when the older call is retried); user_declined and preview_not_viewed are not emitted since 3.0.0 (there is no decline, and the preview is optional). For event authenticator (broker, portal, CC-094): authenticator_enrollment_started, authenticator_registered, authenticator_enrollment_failed, authenticator_removed, authenticator_reset_by_admin (outcome ok or denied; the target user is sub), authenticator_seed_missing (the seed of a registered authenticator is gone from the secret store: the registration is reset to none, outcome error, errorCode upstream_unavailable, CC-142), authenticator_disabled (the daily limit of 20 wrong codes in 24 hours switched the authenticator off, CC-126; outcome denied) and, for the check of a code with decision allow or deny, totp_verified, totp_invalid, totp_replayed, totp_locked, totp_disabled, totp_burned (a code of a burned step: replayed for the broker but not a failure and not counted, CC-128), totp_steps_burned (the current codes were invalidated because the owner cancelled a pending operation or a new DESTRUCTIVE operation followed a viewed one, CC-128; outcome ok), totp_not_registered (these carry tool, client and virtualServer from the internal JWT). For event virtual_server_change (gateway, CC-116; before 3.0.0 these were admin_change, CC-107): vs_created, vs_deleted, slug_taken, not_granted, invalid_request, virtual_server_limit, not_found_or_denied, and upstream_unavailable when a store behind the operation is down (the list of tools of a link is not a field of this schema; CC-142). For event connection_change (broker) a failed revocation at the provider is recorded with reason provider_revoke_failed (the connection is deleted anyway, outcome error; CC-142). For tool_call and policy_decision: link_scope (the tool or resource lies outside the virtual server link, decision deny), policy_unavailable (no policy bundle is loaded, so nothing can be decided and the request is refused), policy_error (the policy engine failed on this request) definition_changed (the definition the server presents differs from the approved one, so the tool is hidden and refused with errorCode tool_disabled, CC-133) upstream_unavailable (on tool_call or policy_decision: a store behind the check, such as the counter of the limits, did not answer and the request was refused, CC-167) and tool_not_served (the approved tool is missing from the tools the server serves, so it is hidden and refused with errorCode tool_disabled, CC-161). definition_changed and tool_not_served are recorded on every refused call (not once per read) and when a read finds the difference there is no separate event. A failed read of the server's tools/list is not evidence of either: the gateway keeps its last successful read, and a call that needs a fresh read that fails is refused as upstream_unavailable without a call to the server. On a server policy_forbid is a refusal by policy (a forbid rule or no permit) and not_granted a resource that could not be resolved or has no grant (CC-141). Event admin_change records the administrative changes of the gateway and of the broker. For the registry, with reasons definition_registered (the pipeline registered a manifest and the definition was approved by that call: a READ_ONLY tool, CC-133), definition_submitted (the registration left a new or changed UPDATE or DESTRUCTIVE tool pending approval, CC-133), definition_approved (an administrator approved a pending definition; sub is the administrator and definitionHash the approved hash) and risk_lowered_by_admin (an administrator approved a risk lower than the floor with acceptRiskLowering; one event instead of definition_approved, with risk set to the new risk, CC-167), tool_removed (a tool left the registered manifest). For definition_approved the sub is the administrator; for user_purged it is the purged user, and the calling identity (the certificate CN mcp-offboarding) is not a field of this schema. Other reasons are not defined. The vs_* reasons are not emitted with admin_change since 3.0.0. For event authentication it is the rejection code: for the internal JWT (receiver: server, broker) one of the vectors (missing_token, bad_signature, unknown_kid, alg_not_allowed, wrong_issuer, wrong_audience, expired, replayed_jti, service_token_not_allowed, tool_mismatch, invalid_claims, lifetime_too_long, not_yet_valid, request_id_mismatch, tool_missing, tool_not_allowed, test_key_not_allowed, malformed); for the token of the AI client at the gateway (C1, CC-120): missing_token, malformed, bad_signature, unknown_kid, alg_not_allowed, wrong_issuer, wrong_audience, expired, not_yet_valid, invalid_claims, and for infrastructure failures client_certificate_rejected, jwks_unavailable, replay_store_unavailable (the last two with errorCode upstream_unavailable). The gateway also emits authentication for its own admin port (C5 /admin/v1 and /actuator/prometheus, CC-125): client_certificate_rejected for a client certificate that is missing, not from the internal CA, lacks the clientAuth purpose or has a CN that the operation does not allow, and the token reasons above for a BFF token that fails validation (aud mcp-gateway-admin). replay_store_unavailable is emitted only by receivers of the internal JWT (servers through the starter, the broker), never by the gateway. The gateway may aggregate or sample client_certificate_rejected on its admin port (for example one event per source address per minute, or a counter in its metrics) so that a scanner cannot flood the SIEM (CC-125)."
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        policyRevision:
          $ref: "#/components/schemas/PolicyRevision"
        credentialType:
          $ref: "#/components/schemas/CredentialType"
        outcome:
          type: string
          enum:
            - ok
            - error
            - denied
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        latencyMs:
          type: integer
          minimum: 0
        argsLength:
          description: Length in bytes of the serialized arguments; the only trace of arguments allowed in audit.
          type: integer
          minimum: 0
        definitionHash:
          description: "Hash of the tool definition an admin_change concerns (CC-133): for definition_approved the approved hash, for definition_registered the hash of each registered definition (one event per tool), for tool_removed the hash of the removed entry. Together with sub (the administrator) and tool it tells afterwards who approved which definition. Not a secret."
          $ref: "#/components/schemas/DefinitionHash"
      allOf:
        - description: "Authenticator events (CC-094) always say how they ended (outcome) and why (reason). The field list stays closed through additionalProperties: there is no field that could carry a code, a seed or an otpauth URI."
          if:
            properties:
              event:
                const: authenticator
            required:
              - event
          then:
            required:
              - outcome
              - reason
        - description: "Virtual server changes (CC-116) always say how they ended (outcome) and why (reason: vs_created, vs_deleted, slug_taken, not_granted, invalid_request, virtual_server_limit, not_found_or_denied)."
          if:
            properties:
              event:
                const: virtual_server_change
            required:
              - event
          then:
            required:
              - outcome
              - reason
        - description: "Rejected authentication (CC-071, CC-120): emitted by a receiver of the internal JWT (server, broker) and by the gateway for the token of the AI client (C1). Closed list of fields (propertyNames): everything that comes from the claims of the unverified token (sub, username, client, tool, risk, resource, virtualServer, policyRevision, credentialType) is forbidden, and so is any part of the token. Carries the rejection code in reason."
          if:
            properties:
              event:
                const: authentication
            required:
              - event
          then:
            required:
              - outcome
              - reason
            properties:
              outcome:
                const: denied
            if:
              properties:
                reason:
                  enum:
                    - jwks_unavailable
                    - replay_store_unavailable
              required:
                - reason
            then:
              required:
                - errorCode
              properties:
                errorCode:
                  const: upstream_unavailable
            propertyNames:
              enum:
                - ts
                - requestId
                - clientRequestId
                - component
                - componentId
                - event
                - server
                - decision
                - reason
                - outcome
                - errorCode
                - latencyMs
            allOf:
              - description: replay_store_unavailable belongs to receivers of the internal JWT (server, broker); the gateway has no replay store for tokens of the AI client (CC-125).
                if:
                  properties:
                    reason:
                      const: replay_store_unavailable
                  required:
                    - reason
                then:
                  properties:
                    component:
                      enum:
                        - server
                        - broker
      additionalProperties: false
