              schema:
                $ref: "#/components/schemas/Catalog"
              examples:
                jira_reader:
                  value:
                    servers:
                      - serverId: mcp-jira
                        system: jira
                        version: 1.4.0
                        tools:
                          - name: jira__get_issue
                            description: Returns one Jira issue by key.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements:
                              - mcp-jira-read
                          - name: jira__update_issue
                            description: Updates the summary of an issue.
                            risk: UPDATE
                            action: update
                            access: denied
                            requiredEntitlements:
                              - mcp-jira-write
                      - serverId: mcp-gitlab
                        system: gitlab
                        version: 1.0.0
                        tools:
                          - name: gitlab__get_project
                            description: Returns one GitLab project by path.
                            risk: READ_ONLY
                            action: read
                            access: denied
                            requiredEntitlements:
                              - mcp-gitlab-read
