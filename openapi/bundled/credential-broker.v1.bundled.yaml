  /v1/connections/{system}/secret:
    parameters:
      - $ref: "#/components/parameters/System"
    put:
      tags:
        - connections
      operationId: putSecret
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Store a token (PAT or API key) of the current user after validating it in the system.
      description: |
        `secret` is a single token; Basic credentials are not accepted for users (CC-049). When the token
        replaces the credential of an existing connection, the broker publishes credential.invalidated (CC-046).
        Whoami (C4.1, CC-101): the broker calls the system only to check that the credential is valid (`422
        secret_invalid` otherwise) and to read `backendUser`; it does not compare it with the SSO identity (one person
        has different logins in different systems), so there is no identity error: `identity_mismatch` was removed in
        3.0.0. The portal shows the account ("Connected as <backendUser>").
        `expiresAt` is optional information of the user: the real expiry of a PAT is set in the target system, so the
        broker accepts any valid timestamp or none (CC-084). The status `expiring` (less than 7 days left) exists
        only when a date was given.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSecretRequest"
            examples:
              jira_pat:
                value:
                  secret: test-only-jira-pat-0000000000000000
                  expiresAt: 2027-01-31T00:00:00Z
      responses:
        "200":
          description: Secret validated with whoami (C4.1; Jira /rest/api/2/myself, Confluence /rest/api/user/current) and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutSecretResponse"
              examples:
                connected:
                  value:
                    status: connected
                    backendUser: jkowalski
                    expiresAt: 2027-01-31T00:00:00Z
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The system rejected the secret (whoami failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutSecretError"
              examples:
                secret_invalid:
                  value:
                    error: secret_invalid
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/connections/{system}:
    parameters:
      - $ref: "#/components/parameters/System"
    delete:
      tags:
        - connections
      operationId: deleteConnection
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Disconnect the system for the current user and revoke the token at the provider when possible.
      description: Idempotent. Publishes credential.invalidated for (sub, system).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "204":
          description: Disconnected (or there was nothing to disconnect).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/admin/users/{sub}/purge:
    post:
      tags:
        - admin
      operationId: purgeUser
      x-allowed-client-cn:
        - mcp-offboarding
      summary: Remove everything the broker keeps about a user (offboarding).
      description: |
        Caller: IGA/HR webhook with mTLS CN=mcp-offboarding, no bearer token. Idempotent (CC-155). Removes, in this
        order of importance: every connection of the user with its secrets (all versions in the secret store), the OAuth
        flows in progress, the authenticator registration and its seed (CC-092) and the row that blocks the user, if there
        is one. This is the only call that deletes the block, because the user no longer exists. Publishes
        credential.invalidated for every removed (sub, system). Audit: one admin_change event with reason user_purged
        and outcome ok for every call, also when there was nothing to remove and for a user the broker does not know (the
        answer is `204` either way), plus connection_change with reason user_purged for each connection and
        authenticator with reason authenticator_removed (CC-155). A purge repeated after the back-channel logout of the
        portal is safe and recommended: an OAuth flow that was still open can create a connection after the first one.
      security:
        - mtls: []
      parameters:
        - name: sub
          in: path
          required: true
          description: "`sub` of the user from the IdP (C1)."
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
      responses:
        "204":
          description: All connections removed (or none existed).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/authenticator:
    get:
      tags:
        - authenticator
      operationId: getAuthenticator
      x-allowed-client-cn:
        - mcp-portal-bff
        - mcp-gateway
      summary: State of the registration of the calling user (no secret).
      description: |
        Callers: the portal BFF (user token) and the gateway (internal JWT, user variant, `tool` = the tool whose
        call is being confirmed; CC-092). The gateway uses it to decide between a pending confirmation and
        `registerUrl`. `lockedUntil` is present while verification is blocked after repeated wrong codes (CC-091); it
        is a property of the user, not of the registration, so removing and registering again does not lift it, and
        no operation of this API lifts it before the time passes. Because of that `state: none` can carry `lockedUntil`.
        `state: disabled` (CC-126) means the daily limit of wrong codes was reached: the authenticator stays unusable
        until the user registers again (`POST /v1/authenticator/enrollment` is allowed from `disabled`). That is not an
        unlock of the lock above: nothing is undone, a new registration replaces the old one.
      security:
        - mtls: []
          bffUserToken: []
        - mtls: []
          gatewayInternalJwt: []
      responses:
        "200":
          description: State of the registration of the calling user.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorStatus"
              examples:
                none:
                  value:
                    state: none
                active:
                  value:
                    state: active
                    registeredAt: 2026-10-27T09:00:00Z
                    lastUsedAt: 2026-10-27T09:30:00Z
                locked:
                  value:
                    state: active
                    registeredAt: 2026-10-27T09:00:00Z
                    lastUsedAt: 2026-10-27T09:30:00Z
                    lockedUntil: 2026-10-27T10:00:00Z
                disabled:
                  value:
                    state: disabled
                    registeredAt: 2026-10-27T09:00:00Z
                    lastUsedAt: 2026-10-27T09:30:00Z
                    disabledAt: 2026-10-28T11:00:00Z
                    disabledReason: daily_failure_limit
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
    delete:
      tags:
        - authenticator
      operationId: deleteAuthenticator
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Remove the registration of the calling user. Idempotent.
      description: |
        The BFF calls it only after a fresh MFA authentication in the IdP (CC-093). Removing does not lift a lock
        (CC-091). A disabled registration (CC-126) and a pending enrollment are removed too.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "204":
          description: Removed (or there was none).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/authenticator/enrollment:
    post:
      tags:
        - authenticator
      operationId: startAuthenticatorEnrollment
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Create a seed and show it once. Together with resolve the only response of C4 that carries a secret.
      description: |
        The BFF calls it only after a fresh MFA authentication in the IdP (CC-093); the broker trusts the BFF for the
        freshness of that MFA (client certificate CN=mcp-portal-bff), a deliberate assumption (CC-092). The seed (20
        random bytes from a CSPRNG) is returned in this response only, as Base32 `secret` and inside `otpauthUri`; it can never be read
        again, and it is never logged or audited. A pending enrollment lives 10 minutes; calling this operation
        again replaces it. With an active registration the answer is `409 already_registered`: remove it first. From
        `disabled` (CC-126) the call is allowed and is the way out: the activation of the new registration clears the
        disabled state and the daily counter (a lock of the user stays).
        `otpauthUri` has the fixed form
        `otpauth://totp/MCP%20Platform:<username>?secret=<Base32>&issuer=MCP%20Platform&algorithm=SHA1&digits=6&period=30`
        with `username` percent-encoded.

        **Storage of the seed (normative, CC-092):** the active seed and the seed of a pending enrollment are stored only
        encrypted with the Transit engine of the secret store (no envelope, like credentials), under the path
        `mcp/authenticators/<sha256(sub)>`; the decrypted record contains `sub`, which is compared with the `sub` of the
        request. A pending enrollment lives 10 minutes in that encrypted form and is deleted on activation, on expiry and
        after the third wrong code. The broker database holds only metadata (state, `registeredAt`, `lastUsedAt`,
        `lastAcceptedStep`, counters, `lockedUntil`, `disabledAt`); the seed never appears in plain text in Redis, in the
        database, in logs or in audit events.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "201":
          description: Seed shown once; it cannot be read again.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorEnrollment"
              examples:
                started:
                  value:
                    enrollmentId: enr_8Hq2Zk5LpW9vXc3N
                    otpauthUri: otpauth://totp/MCP%20Platform:jkowalski?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ&issuer=MCP%20Platform&algorithm=SHA1&digits=6&period=30
                    secret: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
                    expiresAt: 2026-10-27T09:10:00Z
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A registration is already active; remove it first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                already_registered:
                  value:
                    error: already_registered
        "429":
          description: Too many enrollment starts for this user. The default limit is 10 starts per hour per sub, configurable in the broker (CC-151); Retry-After says when to retry.
          headers:
            Retry-After:
              description: Seconds to wait, at least 1.
              schema:
                type: integer
                minimum: 1
              example: 600
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  value:
                    error: rate_limited
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/authenticator/enrollment/confirm:
    post:
      tags:
        - authenticator
      operationId: confirmAuthenticatorEnrollment
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Activate the registration with the first code from the app.
      description: |
        The code must be a valid TOTP of the new seed (window of one step either way). Success activates the
        registration and sets `lastAcceptedStep` to the step of that code, so the same code cannot confirm an
        operation right after. Three wrong codes destroy the pending enrollment (`enrollment_invalid`), and so does
        the 10 minute TTL. Wrong codes here do not count toward the verification lock. Activation sets the new
        registration up with clean counters (short and daily) and no disabled state; a lock of the user is kept, because
        it belongs to the user and only time lifts it (CC-091).
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorEnrollmentConfirm"
            examples:
              first_code:
                value:
                  enrollmentId: enr_8Hq2Zk5LpW9vXc3N
                  code: "705202"
      responses:
        "200":
          description: Registration active.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorStatus"
              examples:
                active:
                  value:
                    state: active
                    registeredAt: 2026-10-27T09:05:00Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: invalid_code (wrong code, try again) or enrollment_invalid (expired, unknown, destroyed after three wrong codes; start again).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorEnrollmentError"
              examples:
                invalid_code:
                  value:
                    error: invalid_code
                enrollment_invalid:
                  value:
                    error: enrollment_invalid
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/authenticator/verify:
    post:
      tags:
        - authenticator
      operationId: verifyAuthenticatorCode
      x-allowed-client-cn:
        - mcp-gateway
      summary: Verify a code of the calling user. Returns only the result.
      description: |
        Caller: gateway only, internal JWT user variant with `tool` set to the tool being confirmed (C2). The code is
        checked as TOTP (RFC 6238: HMAC-SHA-1, 6 digits, 30 s step, steps t-1, t and t+1 of the broker clock) and
        compared as text in constant time. A step is accepted once: `lastAcceptedStep` is advanced by one atomic
        conditional write, a code of a step that is not newer is `replayed`. Five consecutive failures (`invalid` or
        `replayed`) within 15 minutes block verification of the user for 15 minutes; during the block `locked` is
        returned without looking at the code. The block ends only when the time passes (CC-091). A success resets the
        counter. A user without an active registration gets `not_registered`. A second, daily limit (CC-126): 20 failures
        (`invalid` or `replayed`) within 24 hours (rolling window) disable the authenticator; a success does not reset
        this counter, `locked` answers are not failures, and a disabled authenticator answers `disabled` without looking
        at the code until the user registers again with a fresh MFA. This is not an unlock: the 5-in-15-minutes block
        above is unchanged and still ends only with time. All limits are broker configuration with these defaults. A
        malformed code is `400` and counts nowhere. **Atomicity (normative):** the check "not locked, not disabled", the
        counters (5-in-15-minutes, 20-in-24-hours) and the lock are one atomic step per `sub`: the broker serializes
        `verify` per user or reserves the attempt in one conditional write (for example one `UPDATE ... RETURNING` or a
        script in the store) BEFORE it computes the TOTP, and a success resets the short counter the same way. Fifty
        parallel wrong codes give exactly five checks (`invalid`) and then `locked` (`test-vectors/totp/concurrent-*`); a
        broker that reads a counter, checks, and writes it later is not conforming. The seed never appears in the
        response; any status other than 200 is a failure for the caller (fail-closed).
      security:
        - mtls: []
          gatewayInternalJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorVerifyRequest"
            examples:
              code:
                value:
                  code: "705202"
      responses:
        "200":
          description: Result of the check.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorVerifyResult"
              examples:
                ok:
                  value:
                    result: ok
                invalid:
                  value:
                    result: invalid
                replayed:
                  value:
                    result: replayed
                locked:
                  value:
                    result: locked
                    retryAfterSeconds: 840
                burned:
                  value:
                    result: burned
                disabled:
                  value:
                    result: disabled
                not_registered:
                  value:
                    result: not_registered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/authenticator/invalidate-codes:
    post:
      tags:
        - authenticator
      operationId: invalidateAuthenticatorCodes
      x-allowed-client-cn:
        - mcp-gateway
      summary: Burn the current TOTP codes of the calling user when the owner cancelled a pending operation or a new DESTRUCTIVE operation follows a viewed one (CC-128).
      description: |
        Caller: gateway only, internal JWT user variant (`sub` of the owner) with `tool` set to the tool of the operation that
        causes the burn: the cancelled operation when the owner cancels, the new operation B when B is created after a
        viewed operation A (also a confirmed one). Two callers of this operation, one effect. The broker marks the step of its clock and the next one as used, like a replay: `burnedThrough =
        max(burnedThrough, step + 1)` and `lastAcceptedStep = max(lastAcceptedStep, burnedThrough)`, in one atomic step per
        `sub` (with the other counters of `verify`). Afterwards a code of a burned step gets the result `burned` of `verifyAuthenticatorCode` (the gateway shows it to the client like a replay, spends no attempt and counts no wrong code) and is **not** a
        failure for the 5-in-15-minutes or the daily limit, so a code that the user typed for the cancelled operation
        and the agent kept cannot confirm a new operation, and cannot be used to lock the user out either. The next code
        (two steps on, after 30 to 60 s) works. Idempotent and never lowers a step. A user without an active registration:
        `204`, nothing to burn. The gateway calls it BEFORE it removes the pending call; if it fails the owner's cancel
        answers `503` and the pending call stays (fail-closed).
      security:
        - mtls: []
          gatewayInternalJwt: []
      responses:
        "204":
          description: Burned (or nothing to burn).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/admin/users/{sub}/authenticator/reset:
    post:
      tags:
        - admin
      operationId: resetUserAuthenticator
      x-allowed-client-cn:
        - mcp-offboarding
      summary: Remove the registration of a user (lost phone and lost Entra MFA). Idempotent.
      description: |
        Caller: helpdesk/IGA with mTLS CN=mcp-offboarding, no bearer token, the same channel as `purge` (CC-091).
        Removes the registration and a pending enrollment; the user registers again with a fresh MFA. It does not
        lift a verification lock.
      security:
        - mtls: []
      parameters:
        - name: sub
          in: path
          required: true
          description: "`sub` of the user from the IdP (C1)."
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
      responses:
        "204":
          description: Removed (or there was none).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/systems:
    get:
      tags:
        - systems
      operationId: listSystems
      x-allowed-client-cn:
        - mcp-gateway
        - mcp-portal-bff
      summary: Target systems configured in the broker.
      description: |
        The only operation that accepts the service variant of the internal JWT (gateway start-up, CC-030).
        Each security alternative belongs to one certificate: `gatewayInternalJwt` only with CN=mcp-gateway,
        `bffUserToken` only with CN=mcp-portal-bff; any other combination gets 403.
      security:
        - mtls: []
          gatewayInternalJwt: []
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: Systems and their credential types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemInfo"
              examples:
                all:
                  value:
                    - system: jira
                      supportedTypes:
                        - user-oauth
                        - user-secret
                      defaultType: user-secret
                      oauthScopes: []
                    - system: confluence
                      supportedTypes:
                        - user-oauth
                        - user-secret
                      defaultType: user-secret
                      oauthScopes: []
                    - system: gitlab
                      supportedTypes:
                        - user-oauth
                        - user-secret
                      defaultType: user-oauth
                      oauthScopes:
                        - read_api
                        - api
                    - system: servicedesk
                      supportedTypes:
                        - service-account
                      defaultType: service-account
                      oauthScopes: []
                    - system: opensearch
                      supportedTypes:
                        - token-exchange
                      defaultType: token-exchange
                      oauthScopes: []
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate from the internal CA. Allowed CNs per operation are listed in the operation extension x-allowed-client-cn; any other CN gets 403.
    gatewayInternalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal JWT (C2, schemas/internal-jwt.schema.json) with aud=mcp-credential-broker; client certificate CN=mcp-gateway. User variant everywhere, with `tool` set for `resolve` and the authenticator calls (CC-092); the service variant (no user) is accepted only by GET /v1/systems (CC-030).
    bffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User token exchanged in the IdP (RFC 8693) for aud=mcp-credential-broker; client certificate CN=mcp-portal-bff.
  parameters:
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SystemId"
      example: jira
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: requestId of the BFF (UUIDv7, CC-047). The broker uses it as requestId of its audit events when it is a valid UUIDv7, otherwise it generates one. For the gateway the header is required and equals rid of the internal JWT (C2).
      schema:
        $ref: "#/components/schemas/RequestId"
      example: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
  headers:
    NoStore:
      description: Required on every response carrying a secret; intermediaries and clients must not cache it.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
      example: no-cache
    RequestId:
      description: requestId the broker used for this request and its audit events (CC-047).
      required: true
      schema:
        $ref: "#/components/schemas/RequestId"
      example: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_request:
              value:
                error: invalid_request
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Unauthenticated:
      description: Missing or invalid token or client certificate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value:
                error: unauthenticated
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Forbidden:
      description: Authenticated caller that is not allowed to use this operation (wrong certificate CN).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                error: forbidden
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    SystemNotConfigured:
      description: The system is not configured in the broker (CC-158). A defect of the installation, not of the request; audited as credential_resolve with reason system_not_configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            system_not_configured:
              value:
                error: system_not_configured
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    TooManyRequests:
      description: A limit of the broker was exceeded (CC-156). Retry-After says in seconds when to try again; no header names a limit or a setting.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rate_limited:
              value:
                error: rate_limited
      headers:
        Retry-After:
          description: Seconds to wait, at least 1.
          schema:
            type: integer
            minimum: 1
          example: 60
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    UpstreamUnavailable:
      description: Secret store, IdP, Redis or the target system did not answer (CC-064, every C4 operation). The gateway maps this to upstream_unavailable (C10); the BFF answers its own 503 (CC-050).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            upstream_unavailable:
              value:
                error: upstream_unavailable
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C4 does not define.
      required:
        - error
      properties:
        error:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    ResolveRequest:
      type: object
      required:
        - system
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        scopes:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        subjectToken:
          type: string
          description: User token exchanged by the gateway for aud=mcp-credential-broker; only for token-exchange systems.
          minLength: 1
      additionalProperties: false
    ResolvedCredential:
      type: object
      required:
        - scheme
        - value
        - type
        - expiresAt
        - cacheTtlSeconds
      properties:
        scheme:
          $ref: "#/components/schemas/CredentialScheme"
        value:
          type: string
          minLength: 1
          description: Secret value placed after the scheme in X-MCP-Credential. Never logged.
        type:
          $ref: "#/components/schemas/CredentialType"
        expiresAt:
          description: Expiry of the credential; null when the system does not report one. Never null for token-exchange (CC-157).
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        cacheTtlSeconds:
          type: integer
          minimum: 0
          maximum: 60
      if:
        properties:
          type:
            const: token-exchange
      then:
        properties:
          expiresAt:
            $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    CredentialRequired:
      type: object
      required:
        - error
        - system
        - connectUrl
      properties:
        error:
          const: credential_required
        system:
          $ref: "#/components/schemas/SystemId"
        connectUrl:
          type: string
          format: uri
          description: Informational (CC-105). The gateway builds the link it puts in the C10 error from its own `publicBaseUrl` and ignores this value, so that there is one source of the portal address.
      additionalProperties: false
    ConnectionStatus:
      type: string
      description: expiring = expires in less than 7 days; only for `user-secret` with a declared `expiresAt` (CC-103). A `user-oauth` connection has expiresAt null (the token is refreshed by the broker) and never becomes expiring.
      enum:
        - connected
        - expiring
        - expired
        - revoked
        - error
    Connection:
      type: object
      required:
        - system
        - type
        - status
        - backendUser
        - expiresAt
        - connectedAt
        - lastUsedAt
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        type:
          $ref: "#/components/schemas/CredentialType"
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          type: string
          description: User name in the target system read by whoami (C4.1, CC-101). Not compared with the SSO identity; the portal shows it as "Connected as <backendUser>".
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        connectedAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    OAuthStartRequest:
      type: object
      required:
        - returnPath
      properties:
        returnPath:
          $ref: "#/components/schemas/ReturnPath"
      additionalProperties: false
    ReturnPath:
      type: string
      description: Relative path inside the portal, optionally with a query. No percent-encoding at all (portal paths do not need it), no backslash, no absolute or protocol-relative URL, so no number of decoding passes can turn it into //host (open redirect, CC-032). The BFF redirects only to the validated value as is, without decoding it. Since 3.0.0 (CC-099) the path must not start with a prefix that the reverse proxy sends to the BFF or the gateway (`/api`, `/s`, `/v`, `/.well-known`, each as a whole segment, so `/apiary` is fine), because a redirect after login or OAuth would land on an endpoint instead of in the SPA; and it must not contain a `.` or `..` segment (before the query), which a browser would resolve to such a prefix. The semicolon is not allowed either (path parameters such as `/api;x` or `/..;/api` are read as `/api` and `/..` by common servlet containers).
      pattern: ^(?![^?]*/\.\.?(?:[/?]|$))(?!/(?:api|s|v|\.well-known)(?:[/?]|$))/(?!/)[A-Za-z0-9._~!$&'()*+,=:@/?-]*$
      maxLength: 512
    OAuthStartResponse:
      type: object
      required:
        - authorizeUrl
        - flowId
      properties:
        authorizeUrl:
          type: string
          format: uri
        flowId:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    OAuthCompleteRequest:
      type: object
      required:
        - flowId
        - code
        - state
      properties:
        flowId:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
      additionalProperties: false
    OAuthCompleteResponse:
      type: object
      required:
        - status
        - backendUser
      properties:
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          type: string
      additionalProperties: false
    OAuthCompleteError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - flow_invalid
            - system_not_configured
      additionalProperties: false
    PutSecretRequest:
      type: object
      required:
        - secret
      properties:
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Single token (PAT or API key), never login and password (CC-049).
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PutSecretResponse:
      type: object
      required:
        - status
        - backendUser
        - expiresAt
      properties:
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          type: string
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    PutSecretError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - secret_invalid
      additionalProperties: false
    SystemInfo:
      type: object
      required:
        - system
        - supportedTypes
        - defaultType
        - oauthScopes
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        supportedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CredentialType"
        defaultType:
          $ref: "#/components/schemas/CredentialType"
        oauthScopes:
          type: array
          uniqueItems: true
          items:
            type: string
      additionalProperties: false
    AuthenticatorStatus:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          description: none = no registration; active = usable (possibly locked, see lockedUntil); disabled = switched off by the daily limit of wrong codes (CC-126), the user must register again.
          enum:
            - none
            - active
            - disabled
        registeredAt:
          description: Present with state active or disabled.
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          description: Last accepted code; absent until the first one.
          $ref: "#/components/schemas/Timestamp"
        lockedUntil:
          description: Present while verification is blocked after repeated wrong codes. Only the passing of time lifts it (CC-091).
          $ref: "#/components/schemas/Timestamp"
        disabledAt:
          description: Present exactly with state disabled (CC-126).
          $ref: "#/components/schemas/Timestamp"
        disabledReason:
          description: Present exactly with state disabled; a single value today, not an unlock option.
          type: string
          enum:
            - daily_failure_limit
      additionalProperties: false
      if:
        properties:
          state:
            const: disabled
        required:
          - state
      then:
        required:
          - disabledAt
          - disabledReason
      else:
        not:
          anyOf:
            - required:
                - disabledAt
            - required:
                - disabledReason
    AuthenticatorEnrollmentId:
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    AuthenticatorEnrollment:
      type: object
      required:
        - enrollmentId
        - otpauthUri
        - secret
        - expiresAt
      properties:
        enrollmentId:
          $ref: "#/components/schemas/AuthenticatorEnrollmentId"
        otpauthUri:
          type: string
          format: uri
          pattern: ^otpauth://totp/
          description: Contains the seed. Drawn as a QR code locally by the frontend and never sent to an external QR service.
        secret:
          description: Seed, Base32 without padding, shown once for manual entry. Never logged, audited or stored by the BFF or the browser.
          type: string
          pattern: ^[A-Z2-7]{32}$
        expiresAt:
          description: End of the 10 minute validity of this enrollment.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    AuthenticatorEnrollmentConfirm:
      type: object
      required:
        - enrollmentId
        - code
      properties:
        enrollmentId:
          $ref: "#/components/schemas/AuthenticatorEnrollmentId"
        code:
          $ref: "#/components/schemas/ConfirmationCode"
      additionalProperties: false
    AuthenticatorEnrollmentError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_code
            - enrollment_invalid
      additionalProperties: false
    AuthenticatorVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          $ref: "#/components/schemas/ConfirmationCode"
      additionalProperties: false
    AuthenticatorVerifyResult:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - ok
            - invalid
            - replayed
            - burned
            - locked
            - disabled
            - not_registered
        retryAfterSeconds:
          description: Seconds until the block ends; present exactly with locked.
          type: integer
          minimum: 1
      additionalProperties: false
      if:
        properties:
          result:
            const: locked
        required:
          - result
      then:
        required:
          - retryAfterSeconds
      else:
        not:
          required:
            - retryAfterSeconds
    SystemId:
      description: Target system identifier, lower case (01-contracts conventions).
      type: string
      enum:
        - jira
        - confluence
        - gitlab
        - servicedesk
        - opensearch
    RequestId:
      description: UUIDv7 request id (C2 rid, X-Request-Id).
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Timestamp:
      description: ISO 8601 date-time in UTC (suffix Z).
      type: string
      format: date-time
      pattern: Z$
    CredentialScheme:
      description: Scheme of the X-MCP-Credential header value (C3).
      type: string
      enum:
        - Bearer
        - Basic
        - Token
        - ApiKey
    CredentialType:
      type: string
      enum:
        - user-oauth
        - user-secret
        - token-exchange
        - service-account
    ConfirmationCode:
      description: "Code typed by the user from the authenticator app (TOTP, RFC 6238: 6 digits), sent by the agent as confirmation_code; not issued by the platform (CC-091). The text form matters: a code can start with a zero."
      type: string
      pattern: ^[0-9]{6}$
