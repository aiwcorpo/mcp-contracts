# Generated by scripts/bundle-openapi.mjs from openapi/credential-broker.v1.yaml. Do not edit.
openapi: 3.1.0
info:
  title: MCP Credential Broker API
  version: 7.0.0
  summary: Contract C4 of the MCP platform.
  description: |
    Internal API of the credential broker. Callers and their authentication:

    - gateway: mTLS with client certificate CN=mcp-gateway and an internal JWT (C2) with
      aud=mcp-credential-broker; `sub` is taken from the JWT.
    - portal BFF: mTLS with CN=mcp-portal-bff and the user's token exchanged in the IdP for
      aud=mcp-credential-broker; `sub` is taken from that token. The BFF cannot name another `sub`.
    - offboarding (IGA/HR webhook, helpdesk): mTLS with CN=mcp-offboarding only.

    Malformed input on the admin operations is `400`: an `If-Match` or `If-None-Match` that is not a well-formed value, and a path id that does not match its pattern (never `404`). A well-formed id that names nothing is `404` (a delete of a system that has none is `204`), and a well-formed `If-Match` that is stale is `412`. The systems are runtime data (7.0.0): `GET /v1/systems` lists the systems the broker knows and the admin operations under
    `/v1/admin/systems` add, change and remove them without a restart. No component has a built-in list of systems.

    Secret values leave the broker only in the body of `POST /v1/credentials/resolve` to the gateway.
    The one other secret is the seed of the user's TOTP authenticator, returned to the owner once in the `201`
    of `POST /v1/authenticator/enrollment` (CC-092, exception to invariant 4); after that the broker only reports
    the result of a check. No other endpoint returns a secret. After DELETE, purge, a revoked credential, and when a new credential
    replaces the one of an existing connection (`PUT .../secret`, `oauth/complete`; CC-046), the broker publishes
    `credential.invalidated` (schemas/credential-invalidated-event.schema.json). A first connection publishes nothing.

    `user-secret` for users is a single token (PAT, API key) sent as `secret`. Since 6.3.0 a user may also give a
    pair: `username` together with `secret` (the password or the API token of that login), stored by the broker as one
    secret and sent by the gateway with the scheme `Basic` (CC-222; CC-049 allowed only a single token). A system that
    accepts Basic only for a service is still connected with `service-account` (D10, CC-049).

    Rate limits are broker configuration, not contract (CC-135). Where a limit is exceeded the broker answers
    `429 rate_limited` with `Retry-After` (seconds, at least 1) and no other header that reveals a setting.

    Correlation (CC-047): every response carries `X-Request-Id`. The BFF sends its own requestId in the optional
    `X-Request-Id` header; the broker uses it for its audit events when it is a valid UUIDv7 and generates one
    otherwise. The gateway's `X-Request-Id` must equal `rid` of the internal JWT (C2).

    Error bodies for statuses not described in C4 use the generic `Error` shape (CC-012).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://mcp-credential-broker.internal:8443
    description: Internal endpoint (TLS, mTLS required).
tags:
  - name: credentials
    description: Credential resolution for the gateway.
  - name: connections
    description: Connections of the current user, used by the portal BFF.
  - name: authenticator
    description: Registration and verification of the TOTP authenticator that confirms destructive actions (CC-091, CC-092).
  - name: admin
    description: Offboarding and reset of an authenticator registration.
  - name: systems
    description: Configured target systems, and their administration (7.0.0).
paths:
  /v1/credentials/resolve:
    post:
      tags:
        - credentials
      operationId: resolveCredential
      x-allowed-client-cn:
        - mcp-gateway
      summary: Resolve the credential of the calling user for a system.
      description: |
        Caller: gateway only. `subjectToken` is the user's token already exchanged by the gateway (RFC 8693)
        for aud=mcp-credential-broker, required only for systems configured as `token-exchange`.
        The raw C1 token is never accepted. `value` appears only in this response; the gateway may cache it
        in memory for at most `cacheTtlSeconds`.

        **token-exchange (CC-157).** Before it exchanges anything the broker verifies `subjectToken` the way it verifies
        a user token of the BFF (signature and issuer against the key set of the IdP) and checks that the audience is
        mcp-credential-broker, that it has not expired (with the clock skew of C2) and that its `sub` equals the `sub` of
        the internal JWT of the call; decoding alone is not a check. A token that fails any of these is `400 invalid_request`
        (audit credential_resolve with reason subject_token_invalid, outcome denied), so that a mistake of the gateway never
        gives the token of another user to the caller. The gateway answers the client with the C10 error internal_error. The broker exchanges `subjectToken` in the IdP for a token for the system
        (audience and scope come from the configuration of the system) and returns `type` token-exchange, scheme
        Bearer, an `expiresAt` that is always set (never null) and `cacheTtlSeconds` that is neither above 60 nor
        beyond `expiresAt`. Nothing is stored in the secret store. When the IdP refuses the exchange (the user may not
        use this resource) the answer is `403 exchange_denied`, which the gateway maps to the C10 error access_denied
        without requiredEntitlements and audits as credential_resolve with reason exchange_denied. When the IdP does
        not answer the answer is `503`.

        **service-account (CC-157).** The broker reads the key of the account from the secret store
        (`secret/data/mcp/service-accounts/<system>`) and returns `type` service-account with the scheme the system
        needs (Bearer or Basic) and an `expiresAt` that follows the rotation of the key or is null. The user has no
        connection to the system, so `GET /v1/connections` does not list it.

        A system that is not configured in the broker is `422 system_not_configured` (CC-158). It is a defect of
        the installation and not of the request; the gateway answers the client with the C10 error internal_error and
        logs the cause.
      security:
        - mtls: []
          gatewayInternalJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
            examples:
              jira:
                value:
                  system: jira
              gitlab_with_scopes:
                value:
                  system: gitlab
                  scopes:
                    - read_api
      responses:
        "200":
          description: Credential for the X-MCP-Credential header (C3).
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedCredential"
              examples:
                user_secret:
                  summary: Jira PAT stored by the user
                  value:
                    scheme: Bearer
                    value: test-only-jira-pat-0000000000000000
                    type: user-secret
                    expiresAt: 2027-01-31T00:00:00Z
                    cacheTtlSeconds: 60
                token_exchange:
                  summary: OpenSearch token exchanged in the IdP for this user
                  value:
                    scheme: Bearer
                    value: test-only-exchanged-token-0000000000
                    type: token-exchange
                    expiresAt: 2026-10-26T20:05:00Z
                    cacheTtlSeconds: 60
                user_secret_basic:
                  summary: Login and token stored by the user (a system whose userSecretScheme is Basic)
                  value:
                    scheme: Basic
                    value: dGVzdC1vbmx5LWxvZ2luOnRlc3Qtb25seS10b2tlbi0wMDAwMDAwMDAwMDAwMDAw
                    type: user-secret
                    expiresAt: null
                    cacheTtlSeconds: 60
                service_account:
                  summary: Service desk key of the platform
                  value:
                    scheme: Basic
                    value: dGVzdC1vbmx5LXNlcnZpY2UtYWNjb3VudDp0ZXN0LW9ubHk=
                    type: service-account
                    expiresAt: null
                    cacheTtlSeconds: 60
        "400":
          description: Malformed request, or a subjectToken that failed the checks (wrong audience, expired, another sub, bad signature).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_request:
                  value:
                    error: invalid_request
                subject_token_invalid:
                  value:
                    error: invalid_request
                    message: subjectToken does not belong to the caller
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller is not allowed to use the operation (wrong certificate CN), or the IdP refused the token exchange.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                forbidden:
                  value:
                    error: forbidden
                exchange_denied:
                  value:
                    error: exchange_denied
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "409":
          description: The user has no usable connection for the system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRequired"
              examples:
                credential_required:
                  value:
                    error: credential_required
                    system: jira
                    connectUrl: https://mcp-portal.internal/connections?system=jira
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "422":
          $ref: "#/components/responses/SystemNotConfigured"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections:
    get:
      tags:
        - connections
      operationId: listConnections
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Connections of the current user, without secret values.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: Connections of the user identified by the token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
              examples:
                two_connections:
                  value:
                    - system: jira
                      type: user-secret
                      status: connected
                      backendUser: jkowalski
                      verified: true
                      expiresAt: 2027-01-31T00:00:00Z
                      connectedAt: 2026-10-01T08:00:00Z
                      lastUsedAt: 2026-10-26T19:58:00Z
                    - system: gitlab
                      type: user-oauth
                      status: connected
                      backendUser: jkowalski
                      verified: true
                      expiresAt: null
                      connectedAt: 2026-09-30T08:00:00Z
                      lastUsedAt: null
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/connections/{system}/oauth/start:
    parameters:
      - $ref: "#/components/parameters/System"
    post:
      tags:
        - connections
      operationId: startOAuth
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Start an OAuth authorization flow to the system for the current user.
      description: |
        The broker keeps `state`, the PKCE verifier and `sub` under `flowId`. The provider's `redirect_uri`
        is the BFF callback `GET /api/v1/oauth/callback` (C12). `returnPath` must be a relative path of the portal.
        Starts are limited per `sub` (CC-156); over the limit the answer is `429 rate_limited`.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthStartRequest"
            examples:
              catalog:
                value:
                  returnPath: /catalog
      responses:
        "200":
          description: URL to which the browser is redirected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartResponse"
              examples:
                gitlab:
                  value:
                    authorizeUrl: https://gitlab.internal/oauth/authorize?client_id=mcp-broker&response_type=code&state=st-7Q2xk9&code_challenge=Zx8-test&code_challenge_method=S256&redirect_uri=https%3A%2F%2Fmcp-portal.internal%2Fapi%2Fv1%2Foauth%2Fcallback
                    flowId: flow-01J9Z3T6Y2K4
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/SystemNotConfigured"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/connections/{system}/oauth/complete:
    parameters:
      - $ref: "#/components/parameters/System"
    post:
      tags:
        - connections
      operationId: completeOAuth
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Finish the OAuth flow, verify the backend identity and store the token.
      description: |
        The broker checks that `sub` of the BFF token equals `sub` of the flow and that `state` matches,
        exchanges the code and calls the system's whoami (C4.1) only to read `backendUser` (no comparison with the
        SSO identity, CC-101). Whoami endpoints: Jira `GET /rest/api/2/myself` (`name`), Confluence Data Center
        `GET /rest/api/user/current` (`username`, CC-073), GitLab `GET /api/v4/user` (`username`). When the token
        replaces the credential of an existing connection, the broker publishes credential.invalidated (CC-046).
        A system without `user-oauth` in `supportedTypes` is `400 invalid_request`, as in `oauth/start` (CC-102). The
        BFF maps `503` of this operation to `connectError=provider_error` (CC-102). Completions are limited per `sub`
        (CC-156); over the limit the answer is `429 rate_limited`. A system that is not configured is `422
        system_not_configured` (CC-158).
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCompleteRequest"
            examples:
              callback:
                value:
                  flowId: flow-01J9Z3T6Y2K4
                  code: test-authorization-code
                  state: st-7Q2xk9
      responses:
        "200":
          description: Connection stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCompleteResponse"
              examples:
                connected:
                  value:
                    status: connected
                    backendUser: jkowalski
                    verified: true
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid or expired flow, or `state`/`sub` that do not match the flow (flow_invalid), or a system that is not configured in the broker (system_not_configured, CC-158).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCompleteError"
              examples:
                flow_invalid:
                  value:
                    error: flow_invalid
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/connections/{system}/secret:
    parameters:
      - $ref: "#/components/parameters/System"
    put:
      tags:
        - connections
      operationId: putSecret
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Store a token (PAT or API key) of the current user after validating it in the system.
      description: |
        `secret` is a single token, or the password or API token of the login given in `username` (CC-222). With
        `username` the broker stores the pair as one secret, whoami runs with the Basic credential, and `resolve` returns
        the scheme `Basic` with `value` = base64(`username`:`secret`); `username` for a system whose `userSecretScheme`
        is not `Basic` is `400 invalid_request`, and so is a request without `username` for a system whose `userSecretScheme` is `Basic` (the broker never tries Bearer for it). When the token
        replaces the credential of an existing connection, the broker publishes credential.invalidated (CC-046).
        For a `generic-rest` system the whoami is the one configured in the system (`whoami`); without it the secret is stored unverified (`verified` false, `backendUser` null, audit reason `secret_stored_unverified`).
        Whoami (C4.1, CC-101): the broker calls the system only to check that the credential is valid (`422
        secret_invalid` otherwise) and to read `backendUser`; it does not compare it with the SSO identity (one person
        has different logins in different systems), so there is no identity error: `identity_mismatch` was removed in
        3.0.0. The portal shows the account ("Connected as <backendUser>").
        `expiresAt` is optional information of the user: the real expiry of a PAT is set in the target system, so the
        broker accepts any valid timestamp or none (CC-084). The status `expiring` (less than 7 days left) exists
        only when a date was given.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSecretRequest"
            examples:
              jira_pat:
                value:
                  secret: test-only-jira-pat-0000000000000000
                  expiresAt: 2027-01-31T00:00:00Z
              basic_pair:
                value:
                  username: test-only-login
                  secret: test-only-token-0000000000000000
      responses:
        "200":
          description: Secret validated with whoami (C4.1; Jira /rest/api/2/myself, Confluence /rest/api/user/current) and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutSecretResponse"
              examples:
                connected:
                  value:
                    status: connected
                    backendUser: jkowalski
                    verified: true
                    expiresAt: 2027-01-31T00:00:00Z
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The system rejected the secret (whoami failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutSecretError"
              examples:
                secret_invalid:
                  value:
                    error: secret_invalid
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/connections/{system}:
    parameters:
      - $ref: "#/components/parameters/System"
    delete:
      tags:
        - connections
      operationId: deleteConnection
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Disconnect the system for the current user and revoke the token at the provider when possible.
      description: Idempotent. Publishes credential.invalidated for (sub, system).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "204":
          description: Disconnected (or there was nothing to disconnect).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/admin/users/{sub}/purge:
    post:
      tags:
        - admin
      operationId: purgeUser
      x-allowed-client-cn:
        - mcp-offboarding
      summary: Remove everything the broker keeps about a user (offboarding).
      description: |
        Caller: IGA/HR webhook with mTLS CN=mcp-offboarding, no bearer token. Idempotent (CC-155). Removes, in this
        order of importance: every connection of the user with its secrets (all versions in the secret store), the OAuth
        flows in progress, the authenticator registration and its seed (CC-092) and the row that blocks the user, if there
        is one. This is the only call that deletes the block, because the user no longer exists. Publishes
        credential.invalidated for every removed (sub, system). Audit: one admin_change event with reason user_purged
        and outcome ok for every call, also when there was nothing to remove and for a user the broker does not know (the
        answer is `204` either way), plus connection_change with reason user_purged for each connection and
        authenticator with reason authenticator_removed (CC-155). A purge repeated after the back-channel logout of the
        portal is safe and recommended: an OAuth flow that was still open can create a connection after the first one.
      security:
        - mtls: []
      parameters:
        - name: sub
          in: path
          required: true
          description: "`sub` of the user from the IdP (C1)."
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
      responses:
        "204":
          description: All connections removed (or none existed).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/authenticator:
    get:
      tags:
        - authenticator
      operationId: getAuthenticator
      x-allowed-client-cn:
        - mcp-portal-bff
        - mcp-gateway
      summary: State of the registration of the calling user (no secret).
      description: |
        Callers: the portal BFF (user token) and the gateway (internal JWT, user variant, `tool` = the tool whose
        call is being confirmed; CC-092). The gateway uses it to decide between a pending confirmation and
        `registerUrl`. `lockedUntil` is present while verification is blocked after repeated wrong codes (CC-091); it
        is a property of the user, not of the registration, so removing and registering again does not lift it, and
        no operation of this API lifts it before the time passes. Because of that `state: none` can carry `lockedUntil`.
        `state: disabled` (CC-126) means the daily limit of wrong codes was reached: the authenticator stays unusable
        until the user registers again (`POST /v1/authenticator/enrollment` is allowed from `disabled`). That is not an
        unlock of the lock above: nothing is undone, a new registration replaces the old one.
      security:
        - mtls: []
          bffUserToken: []
        - mtls: []
          gatewayInternalJwt: []
      responses:
        "200":
          description: State of the registration of the calling user.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorStatus"
              examples:
                none:
                  value:
                    state: none
                active:
                  value:
                    state: active
                    registeredAt: 2026-10-27T09:00:00Z
                    lastUsedAt: 2026-10-27T09:30:00Z
                locked:
                  value:
                    state: active
                    registeredAt: 2026-10-27T09:00:00Z
                    lastUsedAt: 2026-10-27T09:30:00Z
                    lockedUntil: 2026-10-27T10:00:00Z
                disabled:
                  value:
                    state: disabled
                    registeredAt: 2026-10-27T09:00:00Z
                    lastUsedAt: 2026-10-27T09:30:00Z
                    disabledAt: 2026-10-28T11:00:00Z
                    disabledReason: daily_failure_limit
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
    delete:
      tags:
        - authenticator
      operationId: deleteAuthenticator
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Remove the registration of the calling user. Idempotent.
      description: |
        The BFF calls it only after a fresh MFA authentication in the IdP (CC-093). Removing does not lift a lock
        (CC-091). A disabled registration (CC-126) and a pending enrollment are removed too.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "204":
          description: Removed (or there was none).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/authenticator/enrollment:
    post:
      tags:
        - authenticator
      operationId: startAuthenticatorEnrollment
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Create a seed and show it once. Together with resolve the only response of C4 that carries a secret.
      description: |
        The BFF calls it only after a fresh MFA authentication in the IdP (CC-093); the broker trusts the BFF for the
        freshness of that MFA (client certificate CN=mcp-portal-bff), a deliberate assumption (CC-092). The seed (20
        random bytes from a CSPRNG) is returned in this response only, as Base32 `secret` and inside `otpauthUri`; it can never be read
        again, and it is never logged or audited. A pending enrollment lives 10 minutes; calling this operation
        again replaces it. With an active registration the answer is `409 already_registered`: remove it first. From
        `disabled` (CC-126) the call is allowed and is the way out: the activation of the new registration clears the
        disabled state and the daily counter (a lock of the user stays).
        `otpauthUri` has the fixed form
        `otpauth://totp/MCP%20Platform:<username>?secret=<Base32>&issuer=MCP%20Platform&algorithm=SHA1&digits=6&period=30`
        with `username` percent-encoded.

        **Storage of the seed (normative, CC-092):** the active seed and the seed of a pending enrollment are stored only
        encrypted with the Transit engine of the secret store (no envelope, like credentials), under the path
        `mcp/authenticators/<sha256(sub)>`; the decrypted record contains `sub`, which is compared with the `sub` of the
        request. A pending enrollment lives 10 minutes in that encrypted form and is deleted on activation, on expiry and
        after the third wrong code. The broker database holds only metadata (state, `registeredAt`, `lastUsedAt`,
        `lastAcceptedStep`, counters, `lockedUntil`, `disabledAt`); the seed never appears in plain text in Redis, in the
        database, in logs or in audit events.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "201":
          description: Seed shown once; it cannot be read again.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorEnrollment"
              examples:
                started:
                  value:
                    enrollmentId: enr_8Hq2Zk5LpW9vXc3N
                    otpauthUri: otpauth://totp/MCP%20Platform:jkowalski?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ&issuer=MCP%20Platform&algorithm=SHA1&digits=6&period=30
                    secret: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
                    expiresAt: 2026-10-27T09:10:00Z
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A registration is already active; remove it first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                already_registered:
                  value:
                    error: already_registered
        "429":
          description: Too many enrollment starts for this user. The default limit is 10 starts per hour per sub, configurable in the broker (CC-151); Retry-After says when to retry.
          headers:
            Retry-After:
              description: Seconds to wait, at least 1.
              schema:
                type: integer
                minimum: 1
              example: 600
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  value:
                    error: rate_limited
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/authenticator/enrollment/confirm:
    post:
      tags:
        - authenticator
      operationId: confirmAuthenticatorEnrollment
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Activate the registration with the first code from the app.
      description: |
        The code must be a valid TOTP of the new seed (window of one step either way). Success activates the
        registration and sets `lastAcceptedStep` to the step of that code, so the same code cannot confirm an
        operation right after. Three wrong codes destroy the pending enrollment (`enrollment_invalid`), and so does
        the 10 minute TTL. Wrong codes here do not count toward the verification lock. Activation sets the new
        registration up with clean counters (short and daily) and no disabled state; a lock of the user is kept, because
        it belongs to the user and only time lifts it (CC-091).
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorEnrollmentConfirm"
            examples:
              first_code:
                value:
                  enrollmentId: enr_8Hq2Zk5LpW9vXc3N
                  code: "705202"
      responses:
        "200":
          description: Registration active.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorStatus"
              examples:
                active:
                  value:
                    state: active
                    registeredAt: 2026-10-27T09:05:00Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: invalid_code (wrong code, try again) or enrollment_invalid (expired, unknown, destroyed after three wrong codes; start again).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorEnrollmentError"
              examples:
                invalid_code:
                  value:
                    error: invalid_code
                enrollment_invalid:
                  value:
                    error: enrollment_invalid
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/authenticator/verify:
    post:
      tags:
        - authenticator
      operationId: verifyAuthenticatorCode
      x-allowed-client-cn:
        - mcp-gateway
      summary: Verify a code of the calling user. Returns only the result.
      description: |
        Caller: gateway only, internal JWT user variant with `tool` set to the tool being confirmed (C2). The code is
        checked as TOTP (RFC 6238: HMAC-SHA-1, 6 digits, 30 s step, steps t-1, t and t+1 of the broker clock) and
        compared as text in constant time. A step is accepted once: `lastAcceptedStep` is advanced by one atomic
        conditional write, a code of a step that is not newer is `replayed`. Five consecutive failures (`invalid` or
        `replayed`) within 15 minutes block verification of the user for 15 minutes; during the block `locked` is
        returned without looking at the code. The block ends only when the time passes (CC-091). A success resets the
        counter. A user without an active registration gets `not_registered`. A second, daily limit (CC-126): 20 failures
        (`invalid` or `replayed`) within 24 hours (rolling window) disable the authenticator; a success does not reset
        this counter, `locked` answers are not failures, and a disabled authenticator answers `disabled` without looking
        at the code until the user registers again with a fresh MFA. This is not an unlock: the 5-in-15-minutes block
        above is unchanged and still ends only with time. All limits are broker configuration with these defaults. A
        malformed code is `400` and counts nowhere. **Atomicity (normative):** the check "not locked, not disabled", the
        counters (5-in-15-minutes, 20-in-24-hours) and the lock are one atomic step per `sub`: the broker serializes
        `verify` per user or reserves the attempt in one conditional write (for example one `UPDATE ... RETURNING` or a
        script in the store) BEFORE it computes the TOTP, and a success resets the short counter the same way. Fifty
        parallel wrong codes give exactly five checks (`invalid`) and then `locked` (`test-vectors/totp/concurrent-*`); a
        broker that reads a counter, checks, and writes it later is not conforming. The seed never appears in the
        response; any status other than 200 is a failure for the caller (fail-closed).
      security:
        - mtls: []
          gatewayInternalJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorVerifyRequest"
            examples:
              code:
                value:
                  code: "705202"
      responses:
        "200":
          description: Result of the check.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatorVerifyResult"
              examples:
                ok:
                  value:
                    result: ok
                invalid:
                  value:
                    result: invalid
                replayed:
                  value:
                    result: replayed
                locked:
                  value:
                    result: locked
                    retryAfterSeconds: 840
                burned:
                  value:
                    result: burned
                disabled:
                  value:
                    result: disabled
                not_registered:
                  value:
                    result: not_registered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/authenticator/invalidate-codes:
    post:
      tags:
        - authenticator
      operationId: invalidateAuthenticatorCodes
      x-allowed-client-cn:
        - mcp-gateway
      summary: Burn the current TOTP codes of the calling user when the owner cancelled a pending operation or a new DESTRUCTIVE operation follows a viewed one (CC-128).
      description: |
        Caller: gateway only, internal JWT user variant (`sub` of the owner) with `tool` set to the tool of the operation that
        causes the burn: the cancelled operation when the owner cancels, the new operation B when B is created after a
        viewed operation A (also a confirmed one). Two callers of this operation, one effect. The broker marks the step of its clock and the next one as used, like a replay: `burnedThrough =
        max(burnedThrough, step + 1)` and `lastAcceptedStep = max(lastAcceptedStep, burnedThrough)`, in one atomic step per
        `sub` (with the other counters of `verify`). Afterwards a code of a burned step gets the result `burned` of `verifyAuthenticatorCode` (the gateway shows it to the client like a replay, spends no attempt and counts no wrong code) and is **not** a
        failure for the 5-in-15-minutes or the daily limit, so a code that the user typed for the cancelled operation
        and the agent kept cannot confirm a new operation, and cannot be used to lock the user out either. The next code
        (two steps on, after 30 to 60 s) works. Idempotent and never lowers a step. A user without an active registration:
        `204`, nothing to burn. The gateway calls it BEFORE it removes the pending call; if it fails the owner's cancel
        answers `503` and the pending call stays (fail-closed).
      security:
        - mtls: []
          gatewayInternalJwt: []
      responses:
        "204":
          description: Burned (or nothing to burn).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/admin/users/{sub}/authenticator/reset:
    post:
      tags:
        - admin
      operationId: resetUserAuthenticator
      x-allowed-client-cn:
        - mcp-offboarding
      summary: Remove the registration of a user (lost phone and lost Entra MFA). Idempotent.
      description: |
        Caller: helpdesk/IGA with mTLS CN=mcp-offboarding, no bearer token, the same channel as `purge` (CC-091).
        Removes the registration and a pending enrollment; the user registers again with a fresh MFA. It does not
        lift a verification lock.
      security:
        - mtls: []
      parameters:
        - name: sub
          in: path
          required: true
          description: "`sub` of the user from the IdP (C1)."
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
      responses:
        "204":
          description: Removed (or there was none).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/admin/systems:
