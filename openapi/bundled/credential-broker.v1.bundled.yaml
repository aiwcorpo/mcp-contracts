                      oauthScopes: []
                basic_login:
                  summary: Confluence Cloud and an OpenSearch installation of the customer with its own accounts; the portal shows the field of the login
                  value:
                    - system: confluence
                      supportedTypes:
                        - user-secret
                      defaultType: user-secret
                      oauthScopes: []
                      deployment: cloud
                      userSecretScheme: Basic
                    - system: opensearch
                      supportedTypes:
                        - user-secret
                      defaultType: user-secret
                      oauthScopes: []
                      deployment: dc
                      userSecretScheme: Basic
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate from the internal CA. Allowed CNs per operation are listed in the operation extension x-allowed-client-cn; any other CN gets 403.
    gatewayInternalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal JWT (C2, schemas/internal-jwt.schema.json) with aud=mcp-credential-broker; client certificate CN=mcp-gateway. User variant everywhere, with `tool` set for `resolve` and the authenticator calls (CC-092); the service variant (no user) is accepted only by GET /v1/systems (CC-030).
    bffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User token exchanged in the IdP (RFC 8693) for aud=mcp-credential-broker; client certificate CN=mcp-portal-bff. It carries `auth_time` (OIDC) and the proof of MFA, `acr` and/or `amr`, which the broker needs for the freshness check of admin writes (`auth_time` within 300 s and an `acr` in the configured MFA levels or an `amr` with `mfa`, `otp`, `hwk` or `totp`); the IdP mapper must provide them, and a token without them is not fresh.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the configuration the change is based on.
      schema:
        type: string
        pattern: ^"[A-Za-z0-9_-]{8,128}"$
      example: '"Zx8Tq2LmWk93vNpA"'
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: The ETag of the configuration the change is based on; needed to replace, not to create.
      schema:
        type: string
        pattern: ^"[A-Za-z0-9_-]{8,128}"$
      example: '"Zx8Tq2LmWk93vNpA"'
    IfNoneMatchStar:
      name: If-None-Match
      in: header
      required: false
      description: "`*` to create; the call fails when the system exists."
      schema:
        type: string
        const: "*"
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SystemId"
      example: jira
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: requestId of the BFF (UUIDv7, CC-047). The broker uses it as requestId of its audit events when it is a valid UUIDv7, otherwise it generates one. For the gateway the header is required and equals rid of the internal JWT (C2).
      schema:
        $ref: "#/components/schemas/RequestId"
      example: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
  headers:
    DocumentETag:
      description: Version of the configuration (quoted opaque token); the next write sends it in If-Match.
      required: true
      schema:
        type: string
        pattern: ^"[A-Za-z0-9_-]{8,128}"$
      example: '"Zx8Tq2LmWk93vNpA"'
    NoStore:
      description: Required on every response carrying a secret; intermediaries and clients must not cache it.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
      example: no-cache
    RequestId:
      description: requestId the broker used for this request and its audit events (CC-047).
      required: true
      schema:
        $ref: "#/components/schemas/RequestId"
      example: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
  responses:
    StepUpOrUnauthenticated:
      description: Missing or invalid token, or an admin write whose token has no MFA authentication within 300 seconds (`step_up_required`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            step_up_required:
              value:
                error: step_up_required
    NotFound:
      description: No such system.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_found:
              value:
                error: not_found
    PreconditionFailed:
      description: The configuration changed since the ETag; read it again.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            stale:
              value:
                error: precondition_failed
    PreconditionRequired:
      description: "`If-Match` (or `If-None-Match: *` to create) is missing."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            required:
              value:
                error: precondition_required
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_request:
              value:
                error: invalid_request
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Unauthenticated:
      description: Missing or invalid token or client certificate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value:
                error: unauthenticated
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Forbidden:
      description: Authenticated caller that is not allowed to use this operation (wrong certificate CN).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                error: forbidden
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    SystemNotConfigured:
      description: The system is not configured in the broker (CC-158). A defect of the installation, not of the request; audited as credential_resolve with reason system_not_configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            system_not_configured:
              value:
                error: system_not_configured
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    TooManyRequests:
      description: A limit of the broker was exceeded (CC-156). Retry-After says in seconds when to try again; no header names a limit or a setting.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rate_limited:
              value:
                error: rate_limited
      headers:
        Retry-After:
          description: Seconds to wait, at least 1.
          schema:
            type: integer
            minimum: 1
          example: 60
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    UpstreamUnavailable:
      description: Secret store, IdP, Redis or the target system did not answer (CC-064, every C4 operation). The gateway maps this to upstream_unavailable (C10); the BFF answers its own 503 (CC-050).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            upstream_unavailable:
              value:
                error: upstream_unavailable
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C4 does not define.
      required:
        - error
      properties:
        error:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    ResolveRequest:
      type: object
      required:
        - system
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        scopes:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        subjectToken:
          type: string
          description: User token exchanged by the gateway for aud=mcp-credential-broker; only for token-exchange systems.
          minLength: 1
      additionalProperties: false
    ResolvedCredential:
      type: object
      required:
        - scheme
        - value
        - type
        - expiresAt
        - cacheTtlSeconds
      properties:
        scheme:
          $ref: "#/components/schemas/CredentialScheme"
        value:
          type: string
          minLength: 1
          description: Secret value placed after the scheme in X-MCP-Credential. Never logged.
        type:
          $ref: "#/components/schemas/CredentialType"
        expiresAt:
          description: Expiry of the credential; null when the system does not report one. Never null for token-exchange (CC-157).
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        cacheTtlSeconds:
          type: integer
          minimum: 0
          maximum: 60
      if:
        properties:
          type:
            const: token-exchange
      then:
        properties:
          expiresAt:
            $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    CredentialRequired:
      type: object
      required:
        - error
        - system
        - connectUrl
      properties:
        error:
          const: credential_required
        system:
          $ref: "#/components/schemas/SystemId"
        connectUrl:
          type: string
          format: uri
          description: Informational (CC-105). The gateway builds the link it puts in the C10 error from its own `publicBaseUrl` and ignores this value, so that there is one source of the portal address.
      additionalProperties: false
    ConnectionStatus:
      type: string
      description: needs_reconnect = the connection was invalidated because the administrator changed where the system points (baseUrl, authorizeUrl, tokenUrl, clientId or revokeUrl) or dropped its credential type; the grant and the secret are deleted, the user connects again (7.0.0). expiring = expires in less than 7 days; only for `user-secret` with a declared `expiresAt` (CC-103). A `user-oauth` connection has expiresAt null (the token is refreshed by the broker) and never becomes expiring. error also means that the secret of the connection is gone from the secret store (audit reason secret_missing, CC-205) or that a rotated refresh token could not be stored (refresh_token_lost, CC-196). The user then connects the system again, and connecting writes a new secret and sets connected. revoked only follows invalid_grant of the provider or a removal by the user.
      enum:
        - connected
        - expiring
        - expired
        - revoked
        - error
        - needs_reconnect
    Connection:
      type: object
      required:
        - system
        - type
        - status
        - backendUser
        - verified
        - expiresAt
        - connectedAt
        - lastUsedAt
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        type:
          $ref: "#/components/schemas/CredentialType"
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          description: User name in the target system read by whoami (C4.1, CC-101); null when the secret was stored without verification (`verified` false). Not compared with the SSO identity; the portal shows it as "Connected as <backendUser>", or "not verified" when null.
          oneOf:
            - type: string
            - type: "null"
        verified:
          description: True when the secret was checked with the whoami of the system when it was stored; false for a system without whoami (a `generic-rest` system with no `whoami`), where the secret is stored unverified and there is no backend user (7.0.0).
          type: boolean
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        connectedAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    OAuthStartRequest:
      type: object
      required:
        - returnPath
      properties:
        returnPath:
          $ref: "#/components/schemas/ReturnPath"
      additionalProperties: false
    ReturnPath:
      type: string
      description: Relative path inside the portal, optionally with a query. No percent-encoding at all (portal paths do not need it), no backslash, no absolute or protocol-relative URL, so no number of decoding passes can turn it into //host (open redirect, CC-032). The BFF redirects only to the validated value as is, without decoding it. Since 3.0.0 (CC-099) the path must not start with a prefix that the reverse proxy sends to the BFF or the gateway (`/api`, `/mcp`, `/s`, `/v`, `/.well-known`, each as a whole segment, so `/apiary` and `/mcp-docs` are fine; `/mcp` is the aggregate endpoint of the gateway since 5.0.0, CC-169, and `/v` stays reserved because the proxy may still send it to the gateway for its 404, CC-177), because a redirect after login or OAuth would land on an endpoint instead of in the SPA; and it must not contain a `.` or `..` segment (before the query), which a browser would resolve to such a prefix. The semicolon is not allowed either (path parameters such as `/api;x` or `/..;/api` are read as `/api` and `/..` by common servlet containers).
      pattern: ^(?![^?]*/\.\.?(?:[/?]|$))(?!/(?:api|mcp|s|v|\.well-known)(?:[/?]|$))/(?!/)[A-Za-z0-9._~!$&'()*+,=:@/?-]*$
      maxLength: 512
    OAuthStartResponse:
      type: object
      required:
        - authorizeUrl
        - flowId
      properties:
        authorizeUrl:
          type: string
          format: uri
        flowId:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    OAuthCompleteRequest:
      type: object
      required:
        - flowId
        - code
        - state
      properties:
        flowId:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
      additionalProperties: false
    OAuthCompleteResponse:
      type: object
      required:
        - status
        - backendUser
        - verified
      properties:
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          type: string
        verified:
          description: Always true for user-oauth, because the code exchange and whoami succeeded.
          const: true
      additionalProperties: false
    OAuthCompleteError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - flow_invalid
            - system_not_configured
      additionalProperties: false
    PutSecretRequest:
      type: object
      required:
        - secret
      properties:
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Single token (PAT or API key), or the password or API token belonging to `username` (CC-222). Never a ready `login:password` string.
        username:
          type: string
          minLength: 1
          maxLength: 255
          writeOnly: true
          pattern: ^[^:\p{Cc}\p{Cf}\p{Cs}\u2028\u2029\ufdd0-\ufdef\ufffe\uffff\u034f\u115f\u1160\u3164\uffa0\u2800\ufe00-\ufe0f]+$
          description: Login of the user in the target system, for a system whose `userSecretScheme` is `Basic` (Jira or Confluence Cloud with the e-mail, an OpenSearch installation of the customer with its own accounts; CC-222). No `:` (RFC 7617), the character set of `backendUser` (CC-121, no control characters C0 and C1, no format characters such as zero-width, bidi and soft hyphen, no line or paragraph separators, no invisible fillers). Absent for a single token. Together with `secret` it is one secret of the connection, kept where the broker keeps every `user-secret`, with the same policy. Never logged, never returned (the connection shows only `backendUser` from whoami).
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PutSecretResponse:
      type: object
      required:
        - status
        - backendUser
        - verified
        - expiresAt
      properties:
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        backendUser:
          description: The user name read by whoami; null when the secret was stored without verification.
          oneOf:
            - type: string
            - type: "null"
        verified:
          description: False when the system has no whoami and the secret was stored unverified (7.0.0).
          type: boolean
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    PutSecretError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - secret_invalid
      additionalProperties: false
    SystemDisplayName:
      description: Name that the portal shows for the system (a short label, no control or format characters); the system id when the administrator gives none.
      type: string
      pattern: ^[^\p{Cc}\p{Cf}\p{Cs}\u2028\u2029]{1,64}$
    SystemWhoami:
      description: |
        How a `generic-rest` system checks a user secret (7.0.0). `path` is relative to `baseUrl` (starts with `/`, not `//`, no scheme or host, no `..`, no query, at most 512 characters). `usernameField` is a top-level field of the JSON answer or an RFC 6901 JSON pointer to it. The broker calls `GET baseUrl+path` with the secret (scheme per `userSecretScheme`): 2xx with the field present stores the secret with that backend user; 401 or 403 is `secret_invalid`; anything else is `upstream_unavailable`.
      type: object
      required:
        - path
        - usernameField
      properties:
        path:
          type: string
          pattern: ^/(?!/)(?!.*\.\.)[A-Za-z0-9._~!$&'()*+,;=:@%/-]{0,511}$
          maxLength: 512
        usernameField:
          type: string
          pattern: ^(?:[A-Za-z_][A-Za-z0-9_-]{0,63}|(?:/[A-Za-z0-9_~-]{1,64}){1,8})$
      additionalProperties: false
    SystemAdapter:
      description: How the broker talks to the backend of a system.
      type: string
      enum:
        - atlassian-dc
        - gitlab
        - opensearch
        - generic-rest
    SystemProduct:
      description: The Atlassian product behind an `atlassian-dc` system. Never detected by the broker.
      type: string
      enum:
        - jira
        - confluence
    SystemTimeout:
      description: Optional ISO 8601 duration for calls to the backend, at most 10 minutes.
      type: string
      pattern: ^PT(?:[1-9][0-9]{0,2}S|[1-9]M(?:[0-5]?[0-9]S)?|10M)$
    SystemUserSecretScheme:
      description: How a `user-secret` of the system is entered and handed on (CC-222).
      type: string
      enum:
        - Bearer
        - Basic
    SystemOauthClient:
      type: object
      description: The OAuth client the broker uses for `user-oauth` connections, or its client credentials with the identity provider for `token-exchange`. `authorizeUrl` and `tokenUrl` are required for `user-oauth`; a `token-exchange` system takes no `tokenUrl` (the broker uses the token endpoint of its identity provider).
      required:
        - clientId
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 255
        clientSecret:
          description: Written to the secret store and never returned.
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        authorizeUrl:
          type: string
          format: uri
          pattern: ^https://
        tokenUrl:
          type: string
          format: uri
          pattern: ^https://
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[!#-\[\]-~]{1,128}$
      additionalProperties: false
    SystemOauthClientView:
      type: object
      required:
        - clientId
        - clientSecretSet
      properties:
        clientId:
          type: string
        authorizeUrl:
          type: string
          format: uri
        tokenUrl:
          type: string
          format: uri
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
        clientSecretSet:
          type: boolean
      additionalProperties: false
    SystemAdminRequest:
      type: object
      description: Configuration of a system. `oauth` is required when `supportedTypes` has `user-oauth` or `token-exchange`; every URL is https (a production broker never accepts http).
      required:
        - baseUrl
        - adapter
        - supportedTypes
        - defaultType
        - secretScheme
      allOf:
        - if:
            required:
              - adapter
            properties:
              adapter:
                const: generic-rest
          else:
            not:
              required:
                - whoami
        - if:
            required:
              - adapter
            properties:
              adapter:
                const: atlassian-dc
          then:
            required:
              - product
          else:
            not:
              required:
                - product
        - if:
            required:
              - supportedTypes
            properties:
              supportedTypes:
                type: array
                items:
                  type: string
                contains:
                  const: token-exchange
          then:
            required:
              - exchangeAudience
          else:
            not:
              required:
                - exchangeAudience
      properties:
        displayName:
          $ref: "#/components/schemas/SystemDisplayName"
        baseUrl:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 255
        adapter:
          $ref: "#/components/schemas/SystemAdapter"
        product:
          $ref: "#/components/schemas/SystemProduct"
        revokeUrl:
          description: Where the broker revokes an OAuth grant when a user disconnects. Part of the rule that invalidates connections when it changes.
          type: string
          format: uri
          pattern: ^https://
          maxLength: 255
        timeout:
          $ref: "#/components/schemas/SystemTimeout"
        exchangeAudience:
          description: Audience of the token the broker asks the identity provider for; token-exchange only, and required there. It must be allowed by the configuration of the broker (audience_not_allowed otherwise).
          type: string
          minLength: 1
          maxLength: 255
        userSecretScheme:
          $ref: "#/components/schemas/SystemUserSecretScheme"
        whoami:
          $ref: "#/components/schemas/SystemWhoami"
        supportedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CredentialType"
        defaultType:
          $ref: "#/components/schemas/CredentialType"
        secretScheme:
          description: Scheme in which the broker hands the stored secret to the gateway (C3).
          $ref: "#/components/schemas/CredentialScheme"
        oauth:
          $ref: "#/components/schemas/SystemOauthClient"
      additionalProperties: false
    SystemAdminView:
      type: object
      required:
        - system
        - displayName
        - baseUrl
        - adapter
        - supportedTypes
        - defaultType
        - secretScheme
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        displayName:
          $ref: "#/components/schemas/SystemDisplayName"
        baseUrl:
          type: string
          format: uri
        adapter:
          $ref: "#/components/schemas/SystemAdapter"
        product:
          $ref: "#/components/schemas/SystemProduct"
        revokeUrl:
          type: string
          format: uri
        timeout:
          $ref: "#/components/schemas/SystemTimeout"
        exchangeAudience:
          type: string
        userSecretScheme:
          $ref: "#/components/schemas/SystemUserSecretScheme"
        whoami:
          $ref: "#/components/schemas/SystemWhoami"
        supportedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CredentialType"
        defaultType:
          $ref: "#/components/schemas/CredentialType"
        secretScheme:
          $ref: "#/components/schemas/CredentialScheme"
        oauth:
          $ref: "#/components/schemas/SystemOauthClientView"
      additionalProperties: false
    SystemRejected:
      type: object
      description: 422 of a write of a system. Known reasons are credential_type_not_supported_by_adapter (user-oauth or a mix on a generic-rest system), whoami_not_applicable (whoami on a generic-rest system without user-secret), client_secret_required (baseUrl, authorizeUrl, tokenUrl, clientId or revokeUrl changed without a new clientSecret), token_url_not_settable (tokenUrl for a token-exchange system), audience_not_allowed (exchangeAudience is not on the allowlist in the configuration of the broker), product_required, exchange_audience_required, system_reserved (the system id is reserved, see SystemId), default_type_not_supported (defaultType is not in supportedTypes), credential_types_mixed (service-account next to a user type, CC-168) and oauth_required (user-oauth without an oauth client).
      required:
        - error
      properties:
        error:
          const: system_rejected
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    SystemInfo:
      type: object
      required:
        - system
        - supportedTypes
        - defaultType
        - oauthScopes
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        displayName:
          description: Name that the portal shows for the system; absent means the portal shows the system id.
          $ref: "#/components/schemas/SystemDisplayName"
        supportedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CredentialType"
        defaultType:
          $ref: "#/components/schemas/CredentialType"
        oauthScopes:
          type: array
          uniqueItems: true
          items:
            type: string
        deployment:
          description: Kind of installation of the target system, from broker configuration (CC-222, kept in 7.0.0 because the portal reads it; it is not an admin setting). Absent when the broker does not tell; clients then assume `dc`. Information only, whether a login is needed is decided by `userSecretScheme`, not by `deployment` (an OpenSearch installation of the customer is `dc` and still takes Basic).
          type: string
          enum:
            - dc
            - cloud
        userSecretVerified:
          description: Whether a user secret of the system is checked with a whoami when it is stored (true for every adapter with a built-in whoami and for a `generic-rest` system with `whoami`); false means a secret is stored unverified and the connection has no backend user, so the portal can say "not verified" before the user connects (7.0.0). Meaningful only when `supportedTypes` has `user-secret`.
          type: boolean
        userSecretScheme:
          description: Scheme of the credential the system takes as `user-secret` (CC-222, CC-213). `Basic` means the user gives `username` and `secret`; `Bearer` (the default when absent) means a single token. Meaningful only when `supportedTypes` has `user-secret`. The portal shows the field of the login exactly for `Basic`.
          type: string
          enum:
            - Bearer
            - Basic
      additionalProperties: false
    AuthenticatorStatus:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          description: none = no registration; active = usable (possibly locked, see lockedUntil); disabled = switched off by the daily limit of wrong codes (CC-126), the user must register again.
          enum:
            - none
            - active
            - disabled
        registeredAt:
          description: Present with state active or disabled.
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          description: Last accepted code; absent until the first one.
          $ref: "#/components/schemas/Timestamp"
        lockedUntil:
          description: Present while verification is blocked after repeated wrong codes. Only the passing of time lifts it (CC-091).
          $ref: "#/components/schemas/Timestamp"
        disabledAt:
          description: Present exactly with state disabled (CC-126).
          $ref: "#/components/schemas/Timestamp"
        disabledReason:
          description: Present exactly with state disabled; a single value today, not an unlock option.
          type: string
          enum:
            - daily_failure_limit
      additionalProperties: false
      if:
        properties:
          state:
            const: disabled
        required:
          - state
      then:
        required:
          - disabledAt
          - disabledReason
      else:
        not:
          anyOf:
            - required:
                - disabledAt
            - required:
                - disabledReason
    AuthenticatorEnrollmentId:
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    AuthenticatorEnrollment:
      type: object
      required:
        - enrollmentId
        - otpauthUri
        - secret
        - expiresAt
      properties:
        enrollmentId:
          $ref: "#/components/schemas/AuthenticatorEnrollmentId"
        otpauthUri:
          type: string
          format: uri
          pattern: ^otpauth://totp/
          description: Contains the seed. Drawn as a QR code locally by the frontend and never sent to an external QR service.
        secret:
          description: Seed, Base32 without padding, shown once for manual entry. Never logged, audited or stored by the BFF or the browser.
          type: string
          pattern: ^[A-Z2-7]{32}$
        expiresAt:
          description: End of the 10 minute validity of this enrollment.
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    AuthenticatorEnrollmentConfirm:
      type: object
      required:
        - enrollmentId
        - code
      properties:
        enrollmentId:
          $ref: "#/components/schemas/AuthenticatorEnrollmentId"
        code:
          $ref: "#/components/schemas/ConfirmationCode"
      additionalProperties: false
    AuthenticatorEnrollmentError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_code
            - enrollment_invalid
      additionalProperties: false
    AuthenticatorVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          $ref: "#/components/schemas/ConfirmationCode"
      additionalProperties: false
    AuthenticatorVerifyResult:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - ok
            - invalid
            - replayed
            - burned
            - locked
            - disabled
            - not_registered
        retryAfterSeconds:
          description: Seconds until the block ends; present exactly with locked.
          type: integer
          minimum: 1
      additionalProperties: false
      if:
        properties:
          result:
            const: locked
        required:
          - result
      then:
        required:
          - retryAfterSeconds
      else:
        not:
          required:
            - retryAfterSeconds
    SystemId:
      description: "Target system identifier, lower case: the id of a system that the credential broker and the gateway registry know at runtime (a row, not a list in the contracts). The ids gateway, offboarding, portal, broker, prometheus, platform, admin, registry, adapter, internal and ci are reserved: mcp-<system> is also the CN of a server certificate, and mcp-gateway, mcp-offboarding and the like are the CNs of platform components."
      type: string
      pattern: ^(?!(?:gateway|offboarding|portal|broker|prometheus|platform|admin|registry|adapter|internal|ci)$)[a-z][a-z0-9]{1,30}$
    RequestId:
      description: UUIDv7 request id (C2 rid, X-Request-Id).
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Timestamp:
      description: ISO 8601 date-time in UTC (suffix Z).
      type: string
      format: date-time
      pattern: Z$
    CredentialScheme:
      description: Scheme of the X-MCP-Credential header value (C3).
      type: string
      enum:
        - Bearer
        - Basic
        - Token
        - ApiKey
    CredentialType:
      type: string
      enum:
        - user-oauth
        - user-secret
        - token-exchange
        - service-account
    ConfirmationCode:
      description: "Code typed by the user from the authenticator app (TOTP, RFC 6238: 6 digits), sent by the agent as confirmation_code; not issued by the platform (CC-091). The text form matters: a code can start with a zero."
      type: string
      pattern: ^[0-9]{6}$
