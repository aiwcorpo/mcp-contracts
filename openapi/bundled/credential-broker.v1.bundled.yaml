  /v1/admin/systems/{system}:
    parameters:
      - $ref: "#/components/parameters/System"
      - $ref: "#/components/parameters/RequestIdHeader"
    get:
      tags:
        - systems
      operationId: getAdminSystem
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: One system with its configuration and ETag, without secrets (group mcp-platform-admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: The system.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/DocumentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAdminView"
              examples:
                notes:
                  value:
                    system: notes
                    displayName: Notes
                    baseUrl: https://notes.internal/api
                    adapter: generic-rest
                    supportedTypes:
                      - user-secret
                    defaultType: user-secret
                    secretScheme: Bearer
                    whoami:
                      path: /api/me
                      usernameField: username
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
    put:
      tags:
        - systems
      operationId: putAdminSystem
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Create or replace a system (group mcp-platform-admin).
      description: |
        Adds the system the broker resolves credentials for, or replaces its configuration, without a restart; every instance
        sees it within seconds. `adapter` selects the way the broker talks to the backend (whoami checks, connection tests):
        `atlassian-dc` (which needs `product`, `jira` or `confluence`; the broker never detects it), `gitlab`, `opensearch` or
        `generic-rest`.

        **Credential types per adapter.** `generic-rest` accepts `user-secret` or `service-account`, never both in one system, and never
        `user-oauth` (`422 system_rejected`, reason `credential_type_not_supported_by_adapter`); the other adapters keep the types
        they had. `whoami` (`{path, usernameField}`) exists only for `generic-rest`, and only with `user-secret`: for a `service-account` system it is `422 system_rejected` with the reason `whoami_not_applicable`. With `whoami`, storing a user secret calls
        `GET baseUrl+path` with the secret (scheme per `userSecretScheme`): a 2xx with the field present stores the secret with that
        backend user, 401 or 403 is `secret_invalid`, anything else is `upstream_unavailable`. Without `whoami` the secret is stored
        without verification and the connection has no backend user (`verified: false`, `backendUser: null`; the portal shows "not
        verified"); the audit event of the store records the reason `secret_stored_unverified`. A change of `whoami` does not invalidate
        connections (same host); a change of `baseUrl` still does (below).

        **Addresses.** Every URL the administrator supplies (`baseUrl`, `oauth.authorizeUrl`, `oauth.tokenUrl`, `revokeUrl`) is `https`
        (`^https://`); plain `http` exists only in the dev profile of the broker and a production broker never accepts it. For a
        `token-exchange` system the token endpoint is not settable: the broker takes the token endpoint of its identity provider from its own
        configuration, never from this API, and a body with `oauth.tokenUrl` for such a system is `422` (`token_url_not_settable`).
        `exchangeAudience` is required for `token-exchange` and forbidden otherwise, and it must be on the allowlist of audiences (or patterns) in the configuration of the broker: any other value is `422 system_rejected` with the reason `audience_not_allowed`, so an administrator cannot make the broker ask the identity provider for a token for an audience the operator never allowed. `oauth.authorizeUrl` is required only for
        `user-oauth`. `userSecretScheme` (`Bearer` or `Basic`) says how a `user-secret` is entered and handed on, default `Basic` when
        `secretScheme` is `Basic`, otherwise `Bearer`; `timeout` is an optional ISO 8601 duration for calls to the backend.

        **Client secret.** `oauth.clientSecret` is written to the secret store (OpenBao) and never returned: the view shows
        `clientSecretSet`. A PUT without it keeps the stored secret only when `baseUrl`, `oauth.authorizeUrl`, `oauth.tokenUrl`,
        `oauth.clientId` and `revokeUrl` are unchanged: the secret must be given again whenever one of them changes (`422
        system_rejected`, reason `client_secret_required`), so that a changed address never receives the old secret.

        **A change of where the system points invalidates the connections.** When `baseUrl`, `oauth.authorizeUrl`, `oauth.tokenUrl`,
        `oauth.clientId` or `revokeUrl` changes, every user connection of that system is invalidated: stored grants, secrets and
        pending OAuth flows are deleted without being sent anywhere (no revoke call to the old or the new endpoint, because
        either could be an address the administrator no longer controls), the connections get the status `needs_reconnect`,
        `credential.invalidated` is published per connection and the audit reasons `system_updated` and `connections_invalidated`
        are written. Other changes do not touch the connections; a change of `supportedTypes` that drops the type of an
        existing connection also leaves that connection `needs_reconnect`.

        **Creating** a system whose id still has connections or flows left by an earlier delete purges them first, without sending
        anything, with an audit event (`system_created`, `connections_invalidated`). A create sends `If-None-Match: *`, a
        replace sends `If-Match` with the `ETag` of the configuration that was edited (`412` when it changed, `428` without
        either). The broker itself checks the freshness of the MFA of the administrator token (`auth_time` not older than 300
        seconds and MFA proved by `acr` or `amr`, otherwise `401 step_up_required`) for every admin write, not only the BFF; a caller that is not an
        administrator is `403` with the audit reason `not_admin`. The audit events are `admin_change` with the reasons
        `system_created` or `system_updated` (`system_imported` for a system that the broker read from its start-up
        configuration).
      security:
        - mtls: []
          bffUserToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
        - $ref: "#/components/parameters/IfNoneMatchStar"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemAdminRequest"
            examples:
              notes:
                value:
                  baseUrl: https://notes.internal/api
                  adapter: generic-rest
                  supportedTypes:
                    - user-secret
                  defaultType: user-secret
                  secretScheme: Bearer
                  whoami:
                    path: /api/me
                    usernameField: username
      responses:
        "200":
          description: Stored; the body is the configuration without secrets (`displayName` is the system id when none was given).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/DocumentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAdminView"
              examples:
                notes:
                  value:
                    system: notes
                    displayName: Notes
                    baseUrl: https://notes.internal/api
                    adapter: generic-rest
                    supportedTypes:
                      - user-secret
                    defaultType: user-secret
                    secretScheme: Bearer
                    whoami:
                      path: /api/me
                      usernameField: username
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/StepUpOrUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: The configuration is inconsistent.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRejected"
              examples:
                default_type:
                  value:
                    error: system_rejected
                    reason: default_type_not_supported
                    message: defaultType must be one of supportedTypes
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
    delete:
      tags:
        - systems
      operationId: deleteAdminSystem
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Remove a system (group mcp-platform-admin).
      description: |
        Removes the system, the connections of users to it and their secrets, and the client secret of the system from the
        secret store; nothing is sent to the backend (no revoke call). A call to resolve a credential for it is refused afterwards
        (`system_not_configured`). The server of the system is removed separately in the gateway (`deleteServer`). `If-Match` is
        the `ETag` of the configuration that was edited (`412`, `428`), and the broker checks the freshness of the MFA of the
        administrator token (`auth_time` not older than 300 seconds and an `acr` in the configured MFA levels or an `amr` with `mfa`, `otp`, `hwk` or `totp`, otherwise `401 step_up_required`); the BFF asks for it too.
        A DELETE of an id that has no system is `204` and deletes no stored secret, so a mistyped id cannot remove anything. The
        audit events are `admin_change` with the reasons `system_deleted` and `connections_invalidated`.
      security:
        - mtls: []
          bffUserToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Removed (or there was none).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/StepUpOrUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/systems:
