openapi: 3.1.0
info:
  title: MCP Credential Broker API
  version: 4.1.1-SNAPSHOT
  summary: Contract C4 of the MCP platform.
  description: |
    Internal API of the credential broker. Callers and their authentication:

    - gateway: mTLS with client certificate CN=mcp-gateway and an internal JWT (C2) with
      aud=mcp-credential-broker; `sub` is taken from the JWT.
    - portal BFF: mTLS with CN=mcp-portal-bff and the user's token exchanged in the IdP for
      aud=mcp-credential-broker; `sub` is taken from that token. The BFF cannot name another `sub`.
    - offboarding (IGA/HR webhook, helpdesk): mTLS with CN=mcp-offboarding only.

    Secret values leave the broker only in the body of `POST /v1/credentials/resolve` to the gateway.
    The one other secret is the seed of the user's TOTP authenticator, returned to the owner once in the `201`
    of `POST /v1/authenticator/enrollment` (CC-092, exception to invariant 4); after that the broker only reports
    the result of a check. No other endpoint returns a secret. After DELETE, purge, a revoked credential, and when a new credential
    replaces the one of an existing connection (`PUT .../secret`, `oauth/complete`; CC-046), the broker publishes
    `credential.invalidated` (schemas/credential-invalidated-event.schema.json). A first connection publishes nothing.

    `user-secret` for users is always a single token (PAT, API key) sent as `secret`; Basic (login and password)
    is not supported for users in v1. A system that only accepts Basic is connected with `service-account`
    (D10, CC-049).

    Rate limits are broker configuration, not contract (CC-135). Where a limit is exceeded the broker answers
    `429 rate_limited` with `Retry-After` (seconds, at least 1) and no other header that reveals a setting.

    Correlation (CC-047): every response carries `X-Request-Id`. The BFF sends its own requestId in the optional
    `X-Request-Id` header; the broker uses it for its audit events when it is a valid UUIDv7 and generates one
    otherwise. The gateway's `X-Request-Id` must equal `rid` of the internal JWT (C2).

    Error bodies for statuses not described in C4 use the generic `Error` shape (CC-012).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://mcp-credential-broker.internal:8443
    description: Internal endpoint (TLS, mTLS required).
tags:
  - name: credentials
    description: Credential resolution for the gateway.
  - name: connections
    description: Connections of the current user, used by the portal BFF.
  - name: authenticator
    description: Registration and verification of the TOTP authenticator that confirms destructive actions (CC-091, CC-092).
  - name: admin
    description: Offboarding and reset of an authenticator registration.
  - name: systems
    description: Configured target systems.
paths:
  /v1/credentials/resolve:
    post:
      tags:
        - credentials
      operationId: resolveCredential
      x-allowed-client-cn:
        - mcp-gateway
      summary: Resolve the credential of the calling user for a system.
      description: |
        Caller: gateway only. `subjectToken` is the user's token already exchanged by the gateway (RFC 8693)
        for aud=mcp-credential-broker, required only for systems configured as `token-exchange`.
        The raw C1 token is never accepted. `value` appears only in this response; the gateway may cache it
        in memory for at most `cacheTtlSeconds`.

        **token-exchange (CC-157).** Before it exchanges anything the broker verifies `subjectToken` the way it verifies
        a user token of the BFF (signature and issuer against the key set of the IdP) and checks that the audience is
        mcp-credential-broker, that it has not expired (with the clock skew of C2) and that its `sub` equals the `sub` of
        the internal JWT of the call; decoding alone is not a check. A token that fails any of these is `400 invalid_request`
        (audit credential_resolve with reason subject_token_invalid, outcome denied), so that a mistake of the gateway never
        gives the token of another user to the caller. The gateway answers the client with the C10 error internal_error. The broker exchanges `subjectToken` in the IdP for a token for the system
        (audience and scope come from the configuration of the system) and returns `type` token-exchange, scheme
        Bearer, an `expiresAt` that is always set (never null) and `cacheTtlSeconds` that is neither above 60 nor
        beyond `expiresAt`. Nothing is stored in the secret store. When the IdP refuses the exchange (the user may not
        use this resource) the answer is `403 exchange_denied`, which the gateway maps to the C10 error access_denied
        without requiredEntitlements and audits as credential_resolve with reason exchange_denied. When the IdP does
        not answer the answer is `503`.

        **service-account (CC-157).** The broker reads the key of the account from the secret store
        (`secret/data/mcp/service-accounts/<system>`) and returns `type` service-account with the scheme the system
        needs (Bearer or Basic) and an `expiresAt` that follows the rotation of the key or is null. The user has no
        connection to the system, so `GET /v1/connections` does not list it.

        A system that is not configured in the broker is `422 system_not_configured` (CC-158). It is a defect of
        the installation and not of the request; the gateway answers the client with the C10 error internal_error and
        logs the cause.
      security:
        - mtls: []
          gatewayInternalJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
            examples:
              jira:
                value:
                  system: jira
              gitlab_with_scopes:
                value:
                  system: gitlab
                  scopes:
                    - read_api
      responses:
        "200":
          description: Credential for the X-MCP-Credential header (C3).
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedCredential"
              examples:
                user_secret:
                  summary: Jira PAT stored by the user
                  value:
                    scheme: Bearer
                    value: test-only-jira-pat-0000000000000000
                    type: user-secret
                    expiresAt: 2027-01-31T00:00:00Z
                    cacheTtlSeconds: 60
                token_exchange:
                  summary: OpenSearch token exchanged in the IdP for this user
                  value:
                    scheme: Bearer
                    value: test-only-exchanged-token-0000000000
                    type: token-exchange
                    expiresAt: 2026-10-26T20:05:00Z
                    cacheTtlSeconds: 60
                service_account:
                  summary: Service desk key of the platform
                  value:
                    scheme: Basic
                    value: dGVzdC1vbmx5LXNlcnZpY2UtYWNjb3VudDp0ZXN0LW9ubHk=
                    type: service-account
                    expiresAt: null
                    cacheTtlSeconds: 60
        "400":
          description: Malformed request, or a subjectToken that failed the checks (wrong audience, expired, another sub, bad signature).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_request:
                  value:
                    error: invalid_request
                subject_token_invalid:
                  value:
                    error: invalid_request
                    message: subjectToken does not belong to the caller
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller is not allowed to use the operation (wrong certificate CN), or the IdP refused the token exchange.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                forbidden:
                  value:
                    error: forbidden
                exchange_denied:
                  value:
                    error: exchange_denied
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "409":
          description: The user has no usable connection for the system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRequired"
              examples:
                credential_required:
                  value:
                    error: credential_required
                    system: jira
                    connectUrl: https://mcp-portal.internal/connections?system=jira
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "422":
          $ref: "#/components/responses/SystemNotConfigured"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections:
    get:
      tags:
        - connections
      operationId: listConnections
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Connections of the current user, without secret values.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        "200":
          description: Connections of the user identified by the token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
              examples:
                two_connections:
                  value:
                    - system: jira
                      type: user-secret
                      status: connected
                      backendUser: jkowalski
                      expiresAt: 2027-01-31T00:00:00Z
                      connectedAt: 2026-10-01T08:00:00Z
                      lastUsedAt: 2026-10-26T19:58:00Z
                    - system: gitlab
                      type: user-oauth
                      status: connected
                      backendUser: jkowalski
                      expiresAt: null
                      connectedAt: 2026-09-30T08:00:00Z
                      lastUsedAt: null
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/connections/{system}/oauth/start:
    parameters:
      - $ref: "#/components/parameters/System"
    post:
      tags:
        - connections
      operationId: startOAuth
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Start an OAuth authorization flow to the system for the current user.
      description: |
        The broker keeps `state`, the PKCE verifier and `sub` under `flowId`. The provider's `redirect_uri`
        is the BFF callback `GET /api/v1/oauth/callback` (C12). `returnPath` must be a relative path of the portal.
        Starts are limited per `sub` (CC-156); over the limit the answer is `429 rate_limited`.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthStartRequest"
            examples:
              catalog:
                value:
                  returnPath: /catalog
      responses:
        "200":
          description: URL to which the browser is redirected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartResponse"
              examples:
                gitlab:
                  value:
                    authorizeUrl: https://gitlab.internal/oauth/authorize?client_id=mcp-broker&response_type=code&state=st-7Q2xk9&code_challenge=Zx8-test&code_challenge_method=S256&redirect_uri=https%3A%2F%2Fmcp-portal.internal%2Fapi%2Fv1%2Foauth%2Fcallback
                    flowId: flow-01J9Z3T6Y2K4
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/SystemNotConfigured"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
  /v1/connections/{system}/oauth/complete:
    parameters:
      - $ref: "#/components/parameters/System"
    post:
      tags:
        - connections
      operationId: completeOAuth
      x-allowed-client-cn:
        - mcp-portal-bff
      summary: Finish the OAuth flow, verify the backend identity and store the token.
      description: |
        The broker checks that `sub` of the BFF token equals `sub` of the flow and that `state` matches,
        exchanges the code and calls the system's whoami (C4.1) only to read `backendUser` (no comparison with the
        SSO identity, CC-101). Whoami endpoints: Jira `GET /rest/api/2/myself` (`name`), Confluence Data Center
        `GET /rest/api/user/current` (`username`, CC-073), GitLab `GET /api/v4/user` (`username`). When the token
        replaces the credential of an existing connection, the broker publishes credential.invalidated (CC-046).
        A system without `user-oauth` in `supportedTypes` is `400 invalid_request`, as in `oauth/start` (CC-102). The
        BFF maps `503` of this operation to `connectError=provider_error` (CC-102). Completions are limited per `sub`
        (CC-156); over the limit the answer is `429 rate_limited`. A system that is not configured is `422
        system_not_configured` (CC-158).
