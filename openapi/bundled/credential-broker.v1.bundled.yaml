            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCompleteError"
              examples:
                flow_invalid:
                  value:
                    error: flow_invalid
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
