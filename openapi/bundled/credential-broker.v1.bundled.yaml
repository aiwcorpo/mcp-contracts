        "200":
          description: Connection stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCompleteResponse"
              examples:
                connected:
                  value:
                    status: connected
                    backendUser: jkowalski
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid or expired flow, or `state`/`sub` that do not match the flow (flow_invalid), or a system that is not configured in the broker (system_not_configured, CC-158).
