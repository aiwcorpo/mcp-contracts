openapi: 3.1.0
info:
  title: MCP Gateway Admin API
  version: 4.0.1
  summary: Contract C5 of the MCP platform (catalog, virtual servers, registry, read-only confirmation preview).
  description: |
    Callers and their authentication:

    - portal BFF: mTLS (CN=mcp-portal-bff) and the user's token exchanged in the IdP for aud=mcp-gateway-admin.
      All "current user" semantics use `sub` of that token.
    - CI: mTLS with client certificate CN=mcp-registry-ci-<serverId>, one certificate per server pipeline (registry writes, CC-161).
    - offboarding (IGA/HR webhook, helpdesk): mTLS with CN=mcp-offboarding, no token (user purge, CC-155).
    - admin operations additionally require group mcp-platform-admin in the user's token.

    Tool names in this API are client-visible names `<system>__<tool>`, except under
    `/admin/v1/registry/servers/{serverId}/tools/{tool}` where `{tool}` is the server-side name from the manifest.
    Endpoints for MCP clients are `<publicBaseUrl>/s/<serverId>/mcp` and `<publicBaseUrl>/v/<slug>/mcp`
    (C1 token with aud=mcp-gateway; not described here because they speak MCP, not REST). The portal and the
    gateway share one public origin behind a reverse proxy (CC-089): `/` web, `/api` BFF, `/s/`, `/v/` and
    `/.well-known/oauth-protected-resource*` gateway. `publicBaseUrl` is configuration, never derived from the
    `Host` or `X-Forwarded-Host` of a request. The gateway answers MCP clients only with `application/json` and
    `text/event-stream` on every route, errors included and whatever `Accept` says (never `text/html`), and does
    not forward the `Cookie` header; the proxy adds `X-Content-Type-Options: nosniff` and `Content-Security-Policy:
    default-src 'none'; sandbox` to every response of these routes (README, "Jedna domena").

    A resource the caller may not see is reported as 404, the same as a missing one (security invariant 8).
    Error bodies for statuses whose body C5 does not define use the generic `Error` shape (CC-012).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://mcp-gateway.internal:8443
    description: Internal admin endpoint (TLS, mTLS required).
tags:
  - name: catalog
  - name: virtual-servers
  - name: registry
  - name: activity
  - name: confirmations
  - name: policy
  - name: admin
paths:
  /admin/v1/catalog:
    get:
      tags: [catalog]
      operationId: getCatalog
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Registered servers and tools with the current user's access computed from policy.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Approved tools of all registered servers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
              examples:
                jira_reader:
                  value:
                    servers:
                      - serverId: mcp-jira
                        system: jira
                        version: 1.4.0
                        tools:
                          - name: jira__get_issue
                            title: Pobranie zgłoszenia
                            description: Returns one Jira issue by key.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements: [mcp-jira-read]
                          - name: jira__update_issue
                            description: Updates the summary of an issue.
                            risk: UPDATE
                            action: update
                            access: denied
                            requiredEntitlements: [mcp-jira-write]
                          - name: jira__delete_issue
                            title: Usunięcie zgłoszenia
                            description: Deletes an issue permanently.
                            risk: DESTRUCTIVE
                            action: delete
                            access: denied
                            requiredEntitlements: [mcp-jira-destructive]
                            requiresConfirmation: true
                      - serverId: mcp-gitlab
                        system: gitlab
                        version: 1.0.0
                        tools:
                          - name: gitlab__get_project
                            description: Returns one GitLab project by path.
                            risk: READ_ONLY
                            action: read
                            access: denied
                            requiredEntitlements: [mcp-gitlab-read]
                            disabled: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /admin/v1/virtual-servers:
    get:
      tags: [virtual-servers]
      operationId: listVirtualServers
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Virtual servers (links) owned by the current user.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Links of the current user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VirtualServer'
              examples:
                one_link:
                  value:
                    - slug: team-a-dev
                      displayName: Team A development
                      tools: [jira__search_issues, jira__get_issue]
                      url: https://mcp.aiwcorpo.pl/v/team-a-dev/mcp
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [virtual-servers]
      operationId: createVirtualServer
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Create a virtual server owned by the current user.
      description: |
        A virtual server only narrows. The gateway rejects tools the user may not call (403) and evaluates
        policy again on every call, so a link never keeps a permission the user has lost.
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualServerCreate'
            examples:
              team_a:
                value:
                  slug: team-a-dev
                  displayName: Team A development
                  tools: [jira__search_issues, jira__get_issue]
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualServerCreated'
              examples:
                created:
                  value:
                    slug: team-a-dev
                    url: https://mcp.aiwcorpo.pl/v/team-a-dev/mcp
        '400':
          description: Malformed request, or a non-empty resourceDefaults (resource narrowing is dormant, CC-085).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: invalid_request
                resource_defaults_unsupported:
                  value:
                    error: resource_defaults_unsupported
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: At least one tool is not available to the user (access_denied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                access_denied:
                  value:
                    error: access_denied
        '409':
          description: Slug already used (slug_taken), or the user already has the maximum number of virtual servers (virtual_server_limit_reached; limit per user is gateway configuration, default 50) (CC-119).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slug_taken:
                  value:
                    error: slug_taken
                virtual_server_limit_reached:
                  value:
                    error: virtual_server_limit_reached
  /admin/v1/virtual-servers/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    delete:
      tags: [virtual-servers]
      operationId: deleteVirtualServer
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Delete a virtual server; owner only.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/registry/servers:
    get:
      tags: [registry]
      operationId: listRegistryServers
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Registered servers with tools and approval status (admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '200':
          description: Registry content.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistryServer'
              examples:
                jira_pending:
                  value:
                    - serverId: mcp-jira
                      system: jira
                      version: 1.4.0
                      tools:
                        - name: get_issue
                          risk: READ_ONLY
                          action: read
                          resourceRefs:
                            - argument: issueKey
                              type: Jira::Issue
                          definition:
                            name: get_issue
                            title: Get issue
                            description: Returns one Jira issue by key.
                            inputSchema:
                              type: object
                              properties:
                                issueKey:
                                  type: string
                                  description: Issue key, e.g. ABC-123
                                  pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                  maxLength: 32
                              required:
                                - issueKey
                              additionalProperties: false
                            annotations:
                              readOnlyHint: true
                          definitionHash: sha256:3b556e5421d66b7508742a96b309dc4c404075d02797d8fe5b38d76d1c870d14
                          status: approved
                          approvedInVersion: 1.3.0
                        - name: update_issue
                          risk: UPDATE
                          action: update
                          resourceRefs:
                            - argument: issueKey
                              type: Jira::Issue
                          definition:
                            name: update_issue
                            title: Update issue
                            description: Updates the summary of an issue.
                            inputSchema:
                              type: object
                              properties:
                                issueKey:
                                  type: string
                                  description: Issue key, e.g. ABC-123
                                  pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                  maxLength: 32
                                summary:
                                  type: string
                                  maxLength: 255
                              required:
                                - issueKey
                                - summary
                              additionalProperties: false
                            annotations:
                              readOnlyHint: false
                              destructiveHint: false
                          definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                          status: pending_approval
                          change: changed
                          source: ci
                          approvedInVersion: 1.3.0
                        - name: add_comment
                          risk: UPDATE
                          action: update
                          resourceRefs:
                            - argument: issueKey
                              type: Jira::Issue
                          definition:
                            name: add_comment
                            title: Add comment
                            description: Adds a comment to an issue.
                            inputSchema:
                              type: object
                              properties:
                                issueKey:
                                  type: string
                                  description: Issue key, e.g. ABC-123
                                  pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                  maxLength: 32
                                body:
                                  type: string
                                  maxLength: 4000
                              required:
                                - issueKey
                                - body
                              additionalProperties: false
                            annotations:
                              readOnlyHint: false
                              destructiveHint: false
                          definitionHash: sha256:a6d16c1679d3b58d585deb6090032a8b085d4b78a6d9b6cbf6ad7229796524c4
                          status: pending_approval
                          change: new
                          source: ci
                          approvedInVersion: null
                opensearch_disabled:
                  value:
                    - serverId: mcp-opensearch
                      system: opensearch
                      version: 1.0.0
                      enabled: false
                      tools: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/v1/registry/servers/{serverId}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    put:
      tags: [registry]
      operationId: registerServer
      x-allowed-client-cn: ['mcp-registry-ci-{serverId}']
      summary: Register or update a server manifest (CI).
      description: |
        Body is the C6 manifest (schemas/server-manifest.schema.json); `serverId` in the body must equal the path.

        **Identity of the pipeline (CC-161).** The certificate is bound to one server: its CN is `mcp-registry-ci-<serverId>`
        (for example `mcp-registry-ci-mcp-jira`) and the gateway accepts it only for a `PUT` whose path `serverId` makes the
        CN exactly `mcp-registry-ci-` followed by that `serverId`: a full, case-sensitive comparison of the whole CN (never a
        prefix or substring match), on a certificate that has one CN. Any other CN, including the former `mcp-registry-ci`, is `403` and nothing is stored; the
        gateway audits it as authentication with reason client_certificate_rejected (CC-125). A pipeline of one repository
        therefore cannot change the registry entry of another server. A per-server CN was chosen over a SAN carrying the
        serverId because the contract already authorizes by CN (`x-allowed-client-cn`), which needs no second place in
        the certificate to parse and check.

        **Origin of the body (CC-133).** The body is the manifest built from the reviewed commit (the artifact of the
        build stage, `target/mcp-manifest.json`), never one fetched from a running server, and the job that calls this
        operation runs only for the protected branch. Outside dev mode the gateway does not take a manifest from a
        server by itself and never approves one: a manifest fetched from a server (the bootstrap of the dev stack) exists
        only in dev mode (README, "Tryb produkcyjny i tryb dev").

        **What the call approves.** The review of the commit is the approval of the tools that cannot change data: a new or
        changed READ_ONLY tool is approved by this call (status approved, approvedInVersion set to the version of the
        manifest), and an entry whose definitionHash did not change stays as it is. A new or changed UPDATE or
        DESTRUCTIVE tool becomes pending_approval (change new or changed, pendingVersion = the version of the manifest, source ci) and
        is approved only by the approve operation below, by an administrator. A tool missing from the manifest is
        removed. Audit as admin_change with definitionHash: definition_registered (approved by this call),
        definition_submitted (left pending) and tool_removed. A definition that differs from the approved one without a
        deployment is handled by the gateway as described in the README ("Rejestr i przypinanie definicji") and is also
        pending_approval.

        **Rejections (422 manifest_rejected, with reason).** The gateway recomputes every definitionHash from the entry's
        definition (CC-004, CC-005) and rejects the manifest when one differs or when a semantic manifest rule of the README
        fails. A tool that lowers risk (for example DESTRUCTIVE to READ_ONLY) is always rejected (risk_lowered), also for a
        tool that was removed and added again; a manifest with environment dev on a gateway in production mode (the
        default) is rejected (environment_mismatch, CC-138); so is a manifest whose `credential.acceptedTypes` does not
        contain the credential type that the broker is asked for in this system (credential_type_mismatch, CC-159). At
        start the gateway makes the same checks for the manifests it holds; a held manifest that fails them is not
        replaced: the server is reported with enabled false and its tools are refused as tool_disabled until a manifest
        that passes is registered. The binding serverId -> system/internalUrl comes only from gateway configuration; a
        manifest that disagrees is rejected with 422 and nothing is stored.
      security:
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/server-manifest.schema.json'
            examples:
              jira:
                value:
                  serverId: mcp-jira
                  version: 1.4.0
                  system: jira
                  internalUrl: https://mcp-jira.internal:8443/mcp/jira
                  credential:
                    required: true
                    acceptedTypes:
                      - user-oauth
                      - user-secret
                  resourceTypes:
                    - type: Jira::Project
                      attributes:
                        - key
                        - category
                    - type: Jira::Issue
                      attributes:
                        - key
                        - project
                      parent: Jira::Project
                  tools:
                    - name: get_issue
                      risk: READ_ONLY
                      action: read
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: get_issue
                        title: Get issue
                        description: Returns one Jira issue by key.
                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                              maxLength: 32
                          required:
                            - issueKey
                          additionalProperties: false
                        annotations:
                          readOnlyHint: true
                      definitionHash: sha256:3b556e5421d66b7508742a96b309dc4c404075d02797d8fe5b38d76d1c870d14
                    - name: update_issue
                      risk: UPDATE
                      action: update
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: update_issue
                        title: Update issue
                        description: Updates the summary of an issue.
                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                              maxLength: 32
                            summary:
                              type: string
                              maxLength: 255
                          required:
                            - issueKey
                            - summary
                          additionalProperties: false
                        annotations:
                          readOnlyHint: false
                          destructiveHint: false
                      definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
      responses:
        '200':
          description: Stored; the body shows the resulting status of every tool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryServer'
              examples:
                registered:
                  value:
                    serverId: mcp-jira
                    system: jira
                    version: 1.4.0
                    tools:
                      - name: get_issue
                        risk: READ_ONLY
                        action: read
                        resourceRefs:
                          - argument: issueKey
                            type: Jira::Issue
                        definition:
                          name: get_issue
                          title: Get issue
                          description: Returns one Jira issue by key.
                          inputSchema:
                            type: object
                            properties:
                              issueKey:
                                type: string
                                description: Issue key, e.g. ABC-123
                                pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                maxLength: 32
                            required:
                              - issueKey
                            additionalProperties: false
                          annotations:
                            readOnlyHint: true
                        definitionHash: sha256:3b556e5421d66b7508742a96b309dc4c404075d02797d8fe5b38d76d1c870d14
                        status: approved
                        approvedInVersion: 1.4.0
                      - name: update_issue
                        risk: UPDATE
                        action: update
                        resourceRefs:
                          - argument: issueKey
                            type: Jira::Issue
                        definition:
                          name: update_issue
                          title: Update issue
                          description: Updates the summary of an issue.
                          inputSchema:
                            type: object
                            properties:
                              issueKey:
                                type: string
                                description: Issue key, e.g. ABC-123
                                pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                maxLength: 32
                              summary:
                                type: string
                                maxLength: 255
                            required:
                              - issueKey
                              - summary
                            additionalProperties: false
                          annotations:
                            readOnlyHint: false
                            destructiveHint: false
                        definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                        status: pending_approval
                        change: new
                        source: ci
                        approvedInVersion: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Manifest conflicts with gateway configuration (system, internalUrl, serverId or credential type), lowers the risk of a tool, or declares environment dev on a gateway in production mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestRejected'
              examples:
                manifest_rejected:
                  value:
                    error: manifest_rejected
                    message: system does not match gateway configuration for mcp-jira
                risk_lowered:
                  value:
                    error: manifest_rejected
                    reason: risk_lowered
                    message: update_issue lowers risk from UPDATE to READ_ONLY
                environment_mismatch:
                  value:
                    error: manifest_rejected
                    reason: environment_mismatch
                    message: manifest of mcp-jira declares environment dev
                credential_type_mismatch:
                  value:
                    error: manifest_rejected
                    reason: credential_type_mismatch
                    message: the gateway asks the broker for token-exchange for opensearch, the manifest accepts user-secret
  /admin/v1/registry/servers/{serverId}/tools/{tool}/pending:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/Tool'
    get:
      tags: [registry]
      operationId: getPendingTool
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Approved and pending entry of a tool, for a diff (admin).
      description: |
        Both entries carry the full MCP definition (CC-005), so a changed description or inputSchema is visible in the diff.
        approvedInVersion and pendingVersion are the manifest versions of the approved and of the pending entry (CC-097).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '200':
          description: Pending change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingTool'
              examples:
                risk_lowered:
                  value:
                    approvedEntry:
                      name: update_issue
                      risk: UPDATE
                      action: update
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: update_issue
                        title: Update issue
                        description: Updates the summary of an issue.
                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                              maxLength: 32
                            summary:
                              type: string
                              maxLength: 255
                          required:
                            - issueKey
                            - summary
                          additionalProperties: false
                        annotations:
                          readOnlyHint: false
                          destructiveHint: false
                      definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                    pendingEntry:
                      name: update_issue
                      risk: READ_ONLY
                      action: update
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: update_issue
                        title: Update issue
                        description: Updates the summary of an issue.
                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                              maxLength: 32
                            summary:
                              type: string
                              maxLength: 255
                          required:
                            - issueKey
                            - summary
                          additionalProperties: false
                        annotations:
                          readOnlyHint: false
                          destructiveHint: false
                      definitionHash: sha256:d466e0905a241d983029dfe36cbaef079907105fac2658b4869cab20e706d8fe
                    pendingHash: sha256:d466e0905a241d983029dfe36cbaef079907105fac2658b4869cab20e706d8fe
                    approvedInVersion: 1.3.0
                    pendingVersion: 1.4.0
                    source: ci
                changed_on_server:
