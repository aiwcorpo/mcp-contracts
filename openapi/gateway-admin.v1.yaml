        `disabledBy` `kill_switch`. A call that was already accepted is not interrupted; a pending confirmation of a switched tool fails at
        the confirmation with `tool_disabled`. The switch is stored durably (it survives a restart) and is lifted only by `DELETE` on the
        same address: a pulled manifest, an approval and a refresh never lift it. System and server are the same thing here
