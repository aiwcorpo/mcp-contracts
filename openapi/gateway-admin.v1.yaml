                      - group: mcp-team-platform
                        scopes: [Jira::Project/PLAT, Notes::Folder/platform]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [policy]
      operationId: putScopeMapping
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Replace the scope mapping (group mcp-platform-admin).
      description: |
        Replaces the whole document. The gateway checks every scope id against the resource types of the registered servers:
        the type must be declared, must have a `scopePattern` and the local part must match it (422 `scope_mapping_rejected`).
        `If-Match` must carry the `ETag` of the document the administrator edited (`412` otherwise, `428` without the header),
        so that two administrators do not overwrite each other. A successful write raises the revision of the policy data;
        servers that see the new `prv` in a token refresh at once. The audit event is `admin_change`.
      security:
        - mtls: []
          bffUserToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeMappingDocument'
            examples:
              one_group:
                value:
                  scopeMapping:
                    - group: mcp-jira-proj-ABC
                      scopes: [Jira::Project/ABC]
      responses:
        '200':
          description: Stored; the body is the new document.
          headers:
            ETag:
              $ref: '#/components/headers/DocumentETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeMappingDocument'
              examples:
                one_group:
                  value:
                    scopeMapping:
                      - group: mcp-jira-proj-ABC
                        scopes: [Jira::Project/ABC]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          description: '`If-Match` is not the ETag of the stored document; read it again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                stale:
                  value:
                    error: precondition_failed
        '422':
          description: A scope does not fit the declared resource types, or a group is listed twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeMappingRejected'
              examples:
                unknown_type:
                  value:
                    error: scope_mapping_rejected
                    reason: unknown_resource_type
                    message: Mystery::Place/x names a type that no registered server declares
        '428':
          description: '`If-Match` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                required:
                  value:
                    error: precondition_required
