      description: |
        Only the fields in the body change. `serverId`, `system` and `adapter` never change (remove the server and add it again), and
        the certificate name is not configurable (see `createServer`). Switching `enabled` to false hides all tools of the server
        and refuses its calls as `tool_disabled`, which is the way to take a server out of service without losing its approvals;
