        proposed: `ca` when the certificate validates for the host, `pinned` otherwise, `plain` for `http`), plus the usual pending
        policies and tools (every tool pending, a `READ_ONLY` one included). The address is checked again at every later connection,
        against the address actually connected to. `credential` is optional: when absent the gateway derives it from the manifest
        (`required`, `acceptedTypes`, `type` the first accepted type); when present it must pass the same checks as `updateServer`
        (`422`, reasons `credential_types_mixed`, `credential_type_not_accepted`) and the manifest must accept its types.
