  /admin/v1/activity/calls:
    get:
      tags: [activity]
      operationId: listActivityCalls
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Tool calls of the current user, one row per call, with filters (without arguments).
      description: |
        One row per call, computed by the gateway from its audit events and from its internal link between a first
        call and its retries with a code (the confirmationId never leaves the gateway, CC-095). The row carries the
        final result and the number of wrong codes; requestId and ts are those of the first request. `sub` is always
        the `sub` of the BFF token, the filters and the retention window (30 days by default, CC-134) always come from the current request, and only the
        caller's own calls are ever returned, also for an administrator: there is no view of other users' calls in 3.0.0.
        Newest first. Page with the `X-Next-Cursor` header: the cursor is opaque, carries only the position (`ts`,
        `requestId`) and is authenticated by the gateway; a
        cursor that was changed, is foreign or has expired is `400` (HMAC-SHA-256 with a gateway key over `sub`, position and issue time, tag of at least 128 bits compared in constant time, valid 15 minutes; `test-vectors/activity-cursor/`), and the gateway never takes `sub`, filters or the window
        from it.
