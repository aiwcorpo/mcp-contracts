  /admin/v1/registry/servers/{serverId}/policies/approve:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [registry]
      operationId: approveServerPolicies
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Approve the pending policies of a server (group mcp-platform-admin).
      description: |
        `policiesHash` must equal the current pending hash, otherwise 409 and nothing changes; it covers the policies and the
        resource type declarations together. The approval sets `approvedPoliciesHash` of that server in the policy data, which is
        the only thing that lets the server evaluate: the starter computes the hash of its own policies and resourceTypes and
        refuses every call (`upstream_unavailable`) when it differs from the approved one or when nothing is approved. Approval
        is allowed even when it makes existing scope mapping entries invalid (a narrower `scopePattern`, a removed type); the
        answer lists the entries that will be ignored, so the administrator sees the effect, and every one is audited when the
        gateway evaluates. The tools of the server follow their own approvals again. The BFF asks for a fresh MFA. The audit
        event is `admin_change` with reason `policies_approved`. If the approved declarations change or free a namespace, the entries of
        the scope mapping for the freed namespace are removed and audited (`scope_mapping_entry_removed`).
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePoliciesRequest'
            examples:
              approve:
                value:
                  policiesHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
      responses:
        '200':
          description: Approved; the mapping entries that the approval makes invalid and that evaluation will therefore ignore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovePoliciesResult'
              examples:
                nothing_ignored:
                  value:
                    ignoredMappingEntries: []
                narrower_pattern:
                  value:
                    ignoredMappingEntries:
                      - group: mcp-jira-proj-ABC
                        scope: Jira::Project/ABCDEFGHIJ
                        reason: invalid_scope
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: policiesHash differs from the pending hash (the policies changed again, or nothing is pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hash_mismatch:
                  value:
                    error: hash_mismatch
  /internal/v1/policy-data:
    get:
      tags: [policy]
      operationId: getPolicyData
      x-allowed-client-cn: ['{registeredServerId}']
      summary: Policy data for a server (internal TLS port).
      description: |
        For servers, not for people. The certificate must come from the internal CA, carry the `clientAuth` extended key usage (next to `serverAuth`), have the CN
        `<serverId>` and the SAN `<serverId>.internal`, and the `serverId` must be a server in the registry; any other certificate is `403`. The answer is the administrator data a server needs to evaluate its
        own policies: the scope mapping reduced to the scopes of the namespace of this server (it never learns the grants of
        another system), `approvedPoliciesHash` (the hash the administrator approved for this server; absent while nothing is
        approved), the allowed AI clients (`azp`, from the configuration of the gateway) and the
        overrides that target this server or all servers (overrides for the gateway are not sent). The data is served with
        an `ETag` (the revision, quoted); a client repeats the call with `If-None-Match` and gets `304` while nothing changed.
        The internal JWT carries the revision as `prv`: a server that sees a newer one than it holds refreshes at once and
        keeps polling at an interval it configures. **Rules that bind the server.** It computes the hash of its own policies and
        resourceTypes and refuses every call (`upstream_unavailable`) when it differs from `approvedPoliciesHash` or when that is
        absent. It never accepts a revision lower than or equal to the one it holds as new data. When `prv` of a token is newer
        than its data it refreshes before evaluating, or refuses. When an override does not validate against its composed
        schema it refuses every call. The reference rule and vectors: `scripts/lib/policy-data-gate.mjs`,
        `test-vectors/policy-data-gate`. The revision is a counter that only rises.
      security:
        - mtls: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the data the server holds.
          schema:
            type: string
            maxLength: 64
          example: '"42"'
      responses:
        '200':
          description: The policy data.
          headers:
            ETag:
              description: The revision of the data, quoted.
              required: true
              schema:
                type: string
                pattern: '^"[0-9]{1,16}"$'
              example: '"42"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyData'
              examples:
                for_a_server:
                  value:
                    revision: 42
                    approvedPoliciesHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
                    scopeMapping:
                      - group: mcp-jira-proj-ABC
                        scopes: [Jira::Project/ABC]
                    allowedClients: [claude-code, claude-ai]
                    overrides:
                      - id: override-no-claude-ai
                        text: 'forbid (principal, action, resource) when { context.client == "claude-ai" };'
        '304':
          description: The server already holds this revision.
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/v1/policy/status:
    get:
      tags: [policy]
      operationId: getPolicyStatus
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Revision of the policy data that each gateway instance serves (admin).
      security:
