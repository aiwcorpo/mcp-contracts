          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyStatus'
              examples:
                two_instances:
                  value:
                    instances:
                      - instanceId: mcp-gateway-0
                        revision: 41
                      - instanceId: mcp-gateway-1
                        revision: 41
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  headers:
    NoStore:
      description: Required on responses carrying the arguments of a pending call (CC-091); intermediaries and clients must not cache them.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
      example: no-cache
    DocumentETag:
      description: Version of the document (quoted opaque token); the next write sends it in If-Match.
      required: true
      schema:
        type: string
        pattern: '^"[A-Za-z0-9_-]{8,128}"$'
      example: '"Zx8Tq2LmWk93vNpA"'
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate from the internal CA; CN=mcp-portal-bff for BFF calls, CN=mcp-registry-ci-<serverId> for registry writes (one certificate per server pipeline).
    bffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User token exchanged in the IdP (RFC 8693) for aud=mcp-gateway-admin. It carries `auth_time` (OIDC claim, seconds since the epoch of the last authentication of the user, which a step-up login renews) and the proof of MFA, `acr` and/or `amr`; the gateway needs it for the freshness check of the operations that widen access (see the description of this API). The IdP mapper that issues the exchanged token must copy `auth_time`, `acr` and `amr`; a token without `auth_time`, or without an `acr` or `amr` that proves MFA, is not fresh (`401 step_up_required`).
  parameters:
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: The ETag of the resource the change is based on; needed to replace, not to create.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9_-]{8,128}"$'
      example: '"Zx8Tq2LmWk93vNpA"'
    IfNoneMatchStar:
      name: If-None-Match
      in: header
      required: false
      description: '`*` to create; the call fails when the resource exists.'
      schema:
        type: string
        const: '*'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the document the change is based on.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9_-]{8,128}"$'
      example: '"Zx8Tq2LmWk93vNpA"'
    OverrideId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OverrideId'
      example: override-block-drop-table
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/ServerId'
      example: mcp-jira
    Tool:
      name: tool
      in: path
      required: true
      description: Server-side tool name (without the system prefix).
      schema:
        $ref: '../schemas/common.schema.json#/$defs/ToolName'
      example: update_issue
    ConfirmationId:
      name: confirmationId
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/ConfirmationId'
      example: cnf_4k9Qe2LxW7tB3mZp
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    StepUpOrUnauthenticated:
      description: Missing or invalid token or client certificate, or the token is not fresh, see Fresh MFA (`step_up_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            step_up_required:
              value:
                error: step_up_required
    PreconditionFailed:
      description: The resource changed since the ETag; read it again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stale:
              value:
                error: precondition_failed
    PreconditionRequired:
      description: '`If-Match` (or `If-None-Match: *` to create) is missing.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            required:
              value:
                error: precondition_required
    ServerRejected:
      description: The settings are inconsistent (7.0.0).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerRejected'
          examples:
            server_id_mismatch:
              value:
                error: server_rejected
                reason: server_id_mismatch
                message: serverId must be mcp-<system>
    KillSwitchStoreUnavailable:
      description: The gateway cannot read or store the emergency switches (fail-closed). A switch is never reported as on when it could not be stored; a call that needs the state of the switches is refused as upstream_unavailable.
      headers:
        Retry-After:
          description: Seconds to wait before repeating the call.
          schema:
            type: integer
            minimum: 1
          example: 10
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unavailable:
              value:
                error: upstream_unavailable
    BadRequest:
      description: Malformed request or schema violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      description: Missing or invalid token or client certificate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    Forbidden:
      description: Caller lacks mcp-platform-admin or uses the wrong client certificate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            access_denied:
              value:
                error: access_denied
    NotFound:
      description: Does not exist or is not visible to the caller (not_found_or_denied).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found_or_denied:
              value:
                error: not_found_or_denied
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C5 does not define.
      required: [error]
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    KillSwitchRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Why the switch is on, free text of the administrator. Kept in the registry and shown in the portal; never part of an audit event and untrusted text for the UI like every administrator text (CC-094 rules). The portal BFF rejects a reason that contains hidden or control characters (text hygiene rules) with `400 invalid_request`, because the administrator types it and such a character is almost certainly a mistake; the gateway keeps its own range check (CC-210).
      additionalProperties: false
    KillSwitch:
      type: object
      required: [scope, serverId, setBy, setAt, reason]
      properties:
        scope:
          type: string
          enum: [server, tool]
        serverId:
          $ref: '../schemas/common.schema.json#/$defs/ServerId'
        tool:
          description: Present exactly when scope is tool.
          $ref: '../schemas/common.schema.json#/$defs/ToolName'
        setBy:
          description: sub of the administrator who put the switch.
          type: string
          minLength: 1
          maxLength: 255
        setAt:
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        reason:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    KillSwitchList:
      type: object
      required: [switches]
      properties:
        switches:
          type: array
          items:
            $ref: '#/components/schemas/KillSwitch'
      additionalProperties: false
    DisabledBy:
      type: string
      enum: [kill_switch, approval, configuration]
      description: Why a tool or server is disabled, present only when disabled is true (CC-194). kill_switch is an emergency switch of an administrator, approval a definition waiting for approval or classification, configuration the gateway configuration or an overrides policy. When more than one applies the first of the list is shown.
    ManifestRejected:
      type: object
      description: 422 of a registration or an approval (CC-133). reason is a known value or absent for the older rejections (a hash that does not match, a rule of the manifest).
      required: [error]
      properties:
        error:
          const: manifest_rejected
        reason:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Known values are policies_invalid, resource_types_invalid and namespace_conflict (7.0.0, see registerServer), risk_lowered, environment_mismatch (CC-138), credential_type_mismatch (CC-159), adapter_mode_mismatch (CC-206; adapter manifest on the channel of the pipeline, or the reverse, or a server not in adapter mode), classification_required (CC-193; an entry with source adapter is approved without risk and action) and classification_not_allowed (CC-193; risk or action sent for an entry that is not from an adapter; CC-227, a risk other than READ_ONLY for an entry from an adapter) and classification_inconsistent (CC-207; risk and action that do not fit each other). A client must show an unknown value as a generic message.
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    Access:
      type: string
      enum: [granted, denied]
    CatalogTool:
      type: object
      required: [name, description, risk, action, access, requiredEntitlements]
      properties:
        name:
          $ref: '../schemas/common.schema.json#/$defs/QualifiedToolName'
        description:
          type: string
          description: definition.description of the approved manifest entry (CC-005, CC-014).
        risk:
          $ref: '../schemas/common.schema.json#/$defs/Risk'
        action:
          $ref: '../schemas/common.schema.json#/$defs/ToolAction'
        access:
          $ref: '#/components/schemas/Access'
        requiredEntitlements:
          description: Groups (C9) that grant this tool according to policy; empty when policy names none.
          type: array
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/GroupName'
        title:
          type: string
          minLength: 1
          description: definition.title of the approved manifest entry (CC-042, CC-082), a short display name for the UI. Absent when the tool has no title; the UI then falls back to description.
        disabled:
          type: boolean
          default: false
          description: True when an administrator disabled the tool or its server (C10 tool_disabled; a hash pending approval counts) (CC-081).
        disabledBy:
          $ref: '#/components/schemas/DisabledBy'
        requiresConfirmation:
          type: boolean
          default: false
          description: 'True when every call needs a confirmation (C11), risk DESTRUCTIVE or a policy requires it. Computed by the gateway (CC-081).'
      additionalProperties: false
    CatalogServer:
      type: object
      required: [serverId, system, version, tools]
      properties:
        serverId:
          $ref: '../schemas/common.schema.json#/$defs/ServerId'
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        version:
          $ref: '../schemas/common.schema.json#/$defs/SemVer'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTool'
      additionalProperties: false
    Catalog:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/CatalogServer'
      additionalProperties: false
    RegistryToolStatus:
      type: string
      enum: [approved, pending_approval]
    RegistryTool:
      allOf:
        - $ref: '../schemas/server-manifest.schema.json#/$defs/ToolEntryFields'
      type: object
      required: [status]
      description: Manifest tool entry (C6) with its approval status. Pending entries are shown when present. risk and action are always present except on a pending entry whose source is adapter (CC-193); an approved adapter tool has the classification of the administrator in them.
      properties:
        classifiedBy:
          description: sub of the administrator who classified the tool; present only for a tool of an adapter that was classified (CC-193).
          type: string
          minLength: 1
          maxLength: 255
        classifiedAt:
          description: When the tool was classified (CC-193).
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        status:
          $ref: '#/components/schemas/RegistryToolStatus'
        change:
          type: string
          enum: [new, changed]
          description: Present exactly when status is pending_approval. new means no approved entry exists, changed means an approved entry exists and differs (CC-097).
        source:
          type: string
          enum: [ci, server, adapter]
          description: Present exactly when status is pending_approval (CC-162, CC-193); same meaning as PendingTool.source.
        riskLowered:
          type: boolean
          description: True when the pending entry has a risk below the risk floor (CC-167). The tool is hidden and refused as tool_disabled, and only an administrator can approve it, with acceptRiskLowering true. Absent means false.
        approvedInVersion:
          description: Version of the manifest at which the approved entry was approved; null for a new tool that has no approved entry. Absent only for an approved tool whose version was not recorded before this field existed (CC-097).
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/SemVer'
            - type: 'null'
      unevaluatedProperties: false
    RegistryServer:
      type: object
      required: [serverId, system, version, tools]
      properties:
        serverId:
          $ref: '../schemas/common.schema.json#/$defs/ServerId'
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        version:
          $ref: '../schemas/common.schema.json#/$defs/SemVer'
        enabled:
          type: boolean
          default: true
          description: False when the server is disabled in gateway configuration or by an overrides policy, or when its held manifest fails the checks at start (CC-159). All tools of a disabled server report disabled=true in the catalog (CC-081, CC-088). Read only here; the emergency switch of a server is a separate resource (CC-194).
        policiesStatus:
          description: approved when the policies of the manifest are the approved ones; pending_approval when they changed or were never approved, and the tools of the server are blocked (7.0.0). Absent for an adapter, which has no policies.
          type: string
          enum: [approved, pending_approval]
        policiesHash:
          description: policiesHash of the approved policies; absent until the first approval.
          $ref: '../schemas/common.schema.json#/$defs/DefinitionHash'
        pendingPoliciesHash:
          description: policiesHash waiting for approval; present exactly with policiesStatus pending_approval.
          $ref: '../schemas/common.schema.json#/$defs/DefinitionHash'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/RegistryTool'
      additionalProperties: false
    AdapterRegistryTool:
      allOf:
        - $ref: '../schemas/server-manifest.schema.json#/$defs/ToolEntryFields'
      type: object
      required: [status]
      description: A tool in the answer to the adapter (CC-207). The same as RegistryTool without classifiedBy and classifiedAt - an adapter is the sidecar of a foreign server and has no business with the identity of administrators. risk and action are present only for a tool that was classified earlier.
      properties:
        status:
          $ref: '#/components/schemas/RegistryToolStatus'
        change:
          type: string
          enum: [new, changed]
        source:
          type: string
          enum: [adapter]
        riskLowered:
          type: boolean
        approvedInVersion:
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/SemVer'
            - type: 'null'
      unevaluatedProperties: false
    AdapterRegistryServer:
      type: object
      required: [serverId, system, version, tools]
      properties:
        serverId:
          $ref: '../schemas/common.schema.json#/$defs/ServerId'
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        version:
          $ref: '../schemas/common.schema.json#/$defs/SemVer'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AdapterRegistryTool'
      additionalProperties: false
    PendingTool:
      type: object
      required: [approvedEntry, pendingEntry, pendingHash, pendingVersion, source]
      properties:
        approvedInVersion:
          description: Version of the manifest at which approvedEntry was approved; null when approvedEntry is null (CC-097).
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/SemVer'
            - type: 'null'
        pendingVersion:
          description: Version of the manifest in which the pending entry appeared (CC-097). For source server it is the version the server reported in initialize, a value the server controls, so the administrator sees it together with source.
          $ref: '../schemas/common.schema.json#/$defs/SemVer'
        riskLowered:
          type: boolean
          description: True when the pending entry has a risk below the risk floor, the highest risk ever reported for the tool (CC-167); approve needs acceptRiskLowering true then. Absent means false.
        source:
          type: string
          enum: [ci, server, adapter]
          description: Where the pending entry comes from (CC-162, CC-193). ci is an entry left by a PUT of the pipeline (the reviewed commit); server is a definition that the running server presented; adapter is an entry that an adapter (the sidecar of a foreign MCP server) presented at startup, never approved automatically and without risk and action until an administrator classifies it. A server entry never replaces a ci entry, see the README, "Rejestr i przypinanie definicji".
        approvedEntry:
          description: Currently approved entry; null for a new tool. For an adapter tool it carries the classification of the administrator.
          oneOf:
            - $ref: '../schemas/server-manifest.schema.json#/$defs/ToolEntry'
            - type: 'null'
        pendingEntry:
          description: The pending entry. Without risk and action when source is adapter (CC-193).
          oneOf:
            - $ref: '../schemas/server-manifest.schema.json#/$defs/ToolEntry'
            - $ref: '../schemas/server-manifest.schema.json#/$defs/AdapterToolEntry'
        pendingHash:
          $ref: '../schemas/common.schema.json#/$defs/DefinitionHash'
      additionalProperties: false
    ApproveRequest:
      type: object
      required: [definitionHash]
      properties:
        definitionHash:
          $ref: '../schemas/common.schema.json#/$defs/DefinitionHash'
        acceptRiskLowering:
          type: boolean
          default: false
          description: Only an administrator (mcp-platform-admin) can set it, and only through this operation; the pipeline (PUT) never lowers a risk, and the portal asks for a fresh MFA first. Sent only when true. On an entry that lowers nothing it is ignored (definition_approved). Without it an entry that lowers the risk floor is 422 risk_lowered; with it the lower risk is approved, the floor becomes that risk and the audit event is admin_change with reason risk_lowered_by_admin (CC-167).
        risk:
          $ref: '../schemas/common.schema.json#/$defs/Risk'
          description: Classification by the administrator (CC-193). Required for an entry with source adapter, which has no risk, and for such an entry only READ_ONLY is accepted (an adapter is read only, CC-227, any other value is 422 manifest_rejected, reason classification_not_allowed); forbidden for any other entry (the same 422). The classification is data of the registry, outside definitionHash; lowering a classification given earlier needs acceptRiskLowering like any lowering (CC-167).
        action:
          $ref: '../schemas/common.schema.json#/$defs/ToolAction'
          description: Cedar action given by the administrator together with risk (CC-193); required and forbidden under the same conditions as risk; for an adapter it fits READ_ONLY, so it is read.
      additionalProperties: false
    ActivityCall:
      type: object
      required: [requestId, ts, tool, result]
      properties:
        requestId:
          description: requestId of the first request of the call (the one that created a pending confirmation, if any).
          $ref: '../schemas/common.schema.json#/$defs/RequestId'
        ts:
          description: Time of that first request.
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        client:
          type: string
          maxLength: 255
          description: Client id (azp), e.g. claude-code; the UI maps it to a display name.
        filter:
          description: Normalized filter of the address the call was made on (CC-174); absent when the address had no filter. Its entries have the syntax of system ids and tool names but are chosen by the client and not checked against the platform's systems and tools (CC-186).
          $ref: '../schemas/common.schema.json#/$defs/EndpointFilterQuery'
        tool:
          $ref: '../schemas/common.schema.json#/$defs/QualifiedToolName'
        risk:
          $ref: '../schemas/common.schema.json#/$defs/Risk'
        resource:
          description: Same shape and limits as resource in the audit event (C8), including the exclusion of control and bidirectional characters in id (CC-031).
          $ref: '../schemas/audit-event.schema.json#/properties/resource'
        result:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          maxLength: 64
          description: |
            Final state of the call. Known values: ok, error, denied_not_granted, denied_filter_scope, denied_policy,
            tool_disabled, credential_required, rate_limited, step_up_required, confirmation_pending, confirmed,
            expired, confirmation_failed, superseded, blocked_by_pending, cancelled. A client must show an unknown value as a generic label.
        wrongCodeCount:
          description: Number of wrong confirmation codes (answers invalid or replayed of the broker) given for this call; present only for calls that needed a confirmation and were not refused as blocked_by_pending. A retry that came too late or found no pending call is not a wrong code.
          type: integer
          minimum: 0
          maximum: 3
        errorCode:
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/ErrorCode'
            - type: 'null'
      additionalProperties: false
    ConfirmationArgument:
      type: object
      required: [name, value, truncated]
      properties:
        name:
          type: string
        value:
          type: string
          description: JSON serialization of the argument value, cut to a gateway limit when truncated is true.
        truncated:
          type: boolean
      additionalProperties: false
    ConfirmationView:
      type: object
      required: [confirmationId, tool, system, arguments, expiresAt]
      properties:
        confirmationId:
          $ref: '../schemas/common.schema.json#/$defs/ConfirmationId'
        tool:
          $ref: '../schemas/common.schema.json#/$defs/QualifiedToolName'
        system:
          description: System the tool acts on; the portal shows it next to the tool (CC-077). Read by the gateway from its own record of the pending call, never from the client.
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        resource:
          description: Main resource of the call from resourceRefs (type, id, parent), computed by the gateway, the same value that goes to the audit event (CC-098); absent when the tool takes no resource identifier. Same limits as in C8, including the exclusion of control and bidirectional characters in id.
          $ref: '../schemas/audit-event.schema.json#/properties/resource'
        arguments:
          description: Arguments sorted by name (fixed order), without confirmation_code.
          type: array
          items:
            $ref: '#/components/schemas/ConfirmationArgument'
        expiresAt:
          description: End of the validity of the pending call (C11, 120 s after creation, not extended by a repeated first call); the portal shows a countdown.
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
      additionalProperties: false
    PolicyStatus:
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          items:
            type: object
            required: [instanceId, revision]
            properties:
              instanceId:
                type: string
              revision:
                $ref: '../schemas/common.schema.json#/$defs/PolicyRevision'
            additionalProperties: false
      additionalProperties: false
    ServerCredentialConfig:
      type: object
      description: How the gateway gets the credential for the server (C3). `type` is the default type of the system that goes into `context.credentialType` (CC-136) and must be one of `acceptedTypes`; `acceptedTypes` never mixes service-account with user types (CC-168).
      required: [required, acceptedTypes, type]
      properties:
        required:
          type: boolean
        acceptedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/CredentialType'
        type:
          $ref: '../schemas/common.schema.json#/$defs/CredentialType'
      additionalProperties: false
    ServerConfig:
      type: object
      description: A server in the registry of the gateway (7.0.0).
      required: [serverId, system, internalUrl, credential, enabled, adapter]
      properties:
        serverId:
          $ref: '../schemas/common.schema.json#/$defs/ServerId'
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        internalUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 255
        credential:
          $ref: '#/components/schemas/ServerCredentialConfig'
        enabled:
          type: boolean
        adapter:
          description: True when the server is served through an adapter (CC-206) and takes its manifest on the adapter channel.
          type: boolean
      additionalProperties: false
    ServerConfigCreate:
      type: object
      required: [serverId, system, internalUrl, credential]
      properties:
        serverId:
          $ref: '../schemas/common.schema.json#/$defs/ServerId'
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        internalUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 255
        credential:
          $ref: '#/components/schemas/ServerCredentialConfig'
        enabled:
          type: boolean
          default: true
        adapter:
          type: boolean
          default: false
      additionalProperties: false
    ServerConfigPatch:
      type: object
      minProperties: 1
      properties:
        internalUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 255
        credential:
          $ref: '#/components/schemas/ServerCredentialConfig'
        enabled:
          type: boolean
      additionalProperties: false
    ServerRejected:
      type: object
      description: 422 of a change of a server. Known reasons are server_id_mismatch (serverId is not mcp-<system>), system_reserved (the system id is one of the reserved ids), credential_types_mixed (service-account next to a user type, CC-168) and credential_type_not_accepted (type is not in acceptedTypes).
      required: [error]
      properties:
        error:
          const: server_rejected
        reason:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    ScopeMappingEntry:
      type: object
      required: [group, scopes]
      properties:
        group:
          $ref: '../schemas/common.schema.json#/$defs/GroupName'
        scopes:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/ResourceScopeId'
      additionalProperties: false
    ScopeMappingDocument:
      type: object
      description: The whole mapping from groups to resource scopes. A group is listed once; a group without an entry grants nothing.
      required: [scopeMapping]
      properties:
        scopeMapping:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/ScopeMappingEntry'
      additionalProperties: false
    ScopeMappingRejected:
      type: object
      description: 422 of a write of the scope mapping. Known reasons are unknown_resource_type (no registered server declares the type), scope_not_grantable (the type has no scopePattern), scope_invalid (the local part does not match the scopePattern) and group_duplicate.
      required: [error]
      properties:
        error:
          const: scope_mapping_rejected
        reason:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    OverrideId:
      description: override-<name>; the prefixes override- and platform- are reserved, so an override cannot replace a platform policy by id.
      type: string
      pattern: '^override-[a-z0-9][a-z0-9-]{0,54}$'
    OverrideTarget:
      description: gateway (the decision on call), all-servers (every server evaluates it) or the serverId of one server.
      type: string
      pattern: '^(gateway|all-servers|mcp-[a-z][a-z0-9]{1,30})$'
    OverrideRequest:
      type: object
      required: [target, text]
      properties:
        target:
          $ref: '#/components/schemas/OverrideTarget'
        text:
          description: Cedar text of exactly one forbid policy.
          type: string
          minLength: 1
          maxLength: 8000
      additionalProperties: false
    Override:
      type: object
      required: [id, target, text, setBy, setAt]
      properties:
        id:
          $ref: '#/components/schemas/OverrideId'
        target:
          $ref: '#/components/schemas/OverrideTarget'
        text:
          type: string
          minLength: 1
          maxLength: 8000
        setBy:
          description: sub of the administrator who wrote it.
          type: string
          minLength: 1
          maxLength: 255
        setAt:
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
      additionalProperties: false
    OverrideRejected:
      type: object
      description: 422 of a write of an override. Known reasons are not_forbid, not_one_policy, id_invalid (not override-<name>), target_mismatch (a gateway override that is not call on Tool, or a server override that mentions them), invalid_policy (does not parse or does not validate against the schema of its target), id_mismatch (the @id of the text is not the id of the override) and target_unknown (a serverId that is not in the registry).
      required: [error]
      properties:
        error:
          const: override_rejected
        reason:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    PendingPolicies:
      type: object
      description: What an administrator approves is the policies and the declarations of the resource types together (policiesHash covers both), so both sides are shown.
      required: [approvedHash, approvedPolicies, approvedResourceTypes, pendingHash, pendingPolicies, pendingResourceTypes, pendingVersion, source]
      properties:
        approvedHash:
          oneOf:
            - $ref: '../schemas/common.schema.json#/$defs/DefinitionHash'
            - type: 'null'
        approvedPolicies:
          description: The approved policies; null for the first registration.
          oneOf:
            - $ref: '../schemas/server-manifest.schema.json#/properties/policies'
            - type: 'null'
        approvedResourceTypes:
          description: The approved declarations; null for the first registration.
          oneOf:
            - type: array
              items:
                $ref: '../schemas/server-manifest.schema.json#/$defs/ResourceTypeDeclaration'
            - type: 'null'
        pendingHash:
          $ref: '../schemas/common.schema.json#/$defs/DefinitionHash'
        pendingPolicies:
          $ref: '../schemas/server-manifest.schema.json#/properties/policies'
        pendingResourceTypes:
          type: array
          items:
            $ref: '../schemas/server-manifest.schema.json#/$defs/ResourceTypeDeclaration'
        pendingVersion:
          description: Version of the manifest in which the pending policies appeared.
          $ref: '../schemas/common.schema.json#/$defs/SemVer'
        source:
          description: Where the pending policies come from, as for a pending tool (ci or server).
          type: string
          enum: [ci, server]
      additionalProperties: false
    ApprovePoliciesResult:
      type: object
      required: [ignoredMappingEntries]
      properties:
        ignoredMappingEntries:
          type: array
          items:
            type: object
            required: [group, scope, reason]
            properties:
              group:
                type: string
              scope:
                type: string
              reason:
                description: undeclared_type, invalid_scope, group_missing or group_duplicate.
                type: string
                pattern: '^[a-z][a-z0-9_]*$'
            additionalProperties: false
      additionalProperties: false
    ApprovePoliciesRequest:
      type: object
      required: [policiesHash]
      properties:
        policiesHash:
          $ref: '../schemas/common.schema.json#/$defs/DefinitionHash'
      additionalProperties: false
    PolicyData:
      type: object
      description: The administrator data a server needs to evaluate its own policies (7.0.0).
      required: [revision, scopeMapping, allowedClients, overrides]
      properties:
        revision:
          $ref: '../schemas/common.schema.json#/$defs/PolicyRevision'
        approvedPoliciesHash:
          description: policiesHash (policies and resourceTypes) that the administrator approved for the requesting server; absent while nothing is approved. The server evaluates only when its own hash equals it.
          $ref: '../schemas/common.schema.json#/$defs/DefinitionHash'
        scopeMapping:
          description: Only the scopes of types in the namespace of the requesting server; groups without one are left out.
          type: array
          items:
            $ref: '#/components/schemas/ScopeMappingEntry'
        allowedClients:
          description: Values of `azp` that may call (MCP_ALLOWED_CLIENTS of the gateway); checked in code before Cedar.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,128}$'
        overrides:
          description: Overrides that target this server or all servers.
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id:
                $ref: '#/components/schemas/OverrideId'
              text:
                type: string
                minLength: 1
                maxLength: 8000
            additionalProperties: false
      additionalProperties: false
