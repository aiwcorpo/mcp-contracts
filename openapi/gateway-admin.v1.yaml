      description: |
        Removes the server and what the gateway holds about it: its manifests, approvals, emergency switches and its
        policy fragment. Its tools disappear from `tools/list` and a call is refused as for an unknown tool; its certificate
        no longer gets policy data. The entries of the scope mapping for the types of its namespace are removed with it, so that a server added later under the
        same namespace does not inherit grants given to the old one; the audit event lists the removed entries. The risk floors of
        its tools (CC-167) are kept, keyed by serverId and tool: a server created again under the same serverId cannot bring a
        former DESTRUCTIVE tool back as READ_ONLY without `acceptRiskLowering` by an administrator. The system in the credential broker is
        removed separately (`deleteAdminSystem`). The audit event is `admin_change`.
