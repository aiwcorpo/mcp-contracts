      summary: Create or replace an emergency override (group mcp-platform-admin).
      description: |
        An override is one `forbid` policy that an administrator adds without a deployment. It cannot grant anything: a
        `permit`, a template or more than one policy is `422 override_rejected`. The id is `override-<name>`; a policy of a
        server or of the platform may not use the prefixes `override-` and `platform-`, and two policies with the same id
        anywhere in the evaluated set are an error, never a merge. `target` says where it applies. `gateway`: the text must be
        `action == Action::"call"` on `resource is Tool`, so it cannot be a policy that blocks nothing. `serverId`: validated
        against the base schema composed with the registered fragment of that server, and it may not mention `Tool` or `call`.
        `all-servers`: validated against the fragment of every registered server (so it can use only what every server has, for
        example `context.client`), and it may not mention `Tool` or `call` either. The override id becomes the policy id; an
        `@id` in the text must be the same. A create sends `If-None-Match: *`, a replace sends `If-Match` with the `ETag` of the
