  /admin/v1/registry/servers/{serverId}/tools/{tool}/approve:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/Tool'
    post:
      tags: [registry]
      operationId: approveTool
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Approve the pending definition of a tool (group mcp-platform-admin).
      description: |
        definitionHash must equal the current pendingHash, otherwise 409 and nothing changes. Approval is the way to accept
        what a deployment through PUT left pending (a new or changed UPDATE or DESTRUCTIVE tool) and a definition that changed
        outside a deployment (CC-133). An entry whose risk is lower than the risk floor (riskLowered true) cannot be approved: 422
        manifest_rejected, unless the administrator says so explicitly with acceptRiskLowering true (the only way to lower a risk; the pipeline never can, CC-167). The approval is audited as admin_change with reason definition_approved, or, when a lowering was accepted, with one event risk_lowered_by_admin in its place (risk = the new risk), the administrator
        as sub and the approved hash as definitionHash.

        **Entries of an adapter (CC-193).** An entry with source adapter has no risk and no action; the body must carry both (`risk`, `action`), otherwise 422
        manifest_rejected with reason classification_required, and a body with them for any other entry is 422 classification_not_allowed. Approval then also
        classifies: the registry stores risk, action, the administrator and the time (`classifiedBy`, `classifiedAt` in the registry listing); the audit event is
        admin_change with reason definition_approved and the new risk. A tool of an adapter that is not classified is hidden and refused as tool_disabled. A changed
        definition of an adapter tool is pending again; the earlier classification is shown to the administrator as a suggestion and is not applied.
      security:
