      summary: Add a server by its address (group mcp-platform-admin).
      description: |
        Adds a server without restarting any component; the body is the address and nothing else that the server can tell
        the gateway itself (CC-249, "The gateway connects to servers" above). Steps, in this order, and the first failure answers (nothing is stored):

        1. `internalUrl` is parsed: `http` or `https`, a host, no user info, no fragment, at most 255 characters, otherwise `400 invalid_request`.
        2. The host is resolved and every resolved address is checked: loopback, link-local (including `169.254.169.254`), unspecified and
           multicast addresses are refused (`422 server_rejected`, reason `address_refused`); the gateway then connects only to an address it checked.
        3. `http` without `allowPlainHttp: true` is `422`, reason `plain_http_not_allowed`.
        4. TLS probe (for `https`): a handshake without a client certificate that accepts any certificate in order to read it; a failure
           to complete a handshake (no TLS, protocol or timeout error) is `422`, reason `tls_handshake_failed`. The leaf certificate is captured: subject, issuer,
           SANs, `notAfter` and the SHA-256 of its DER encoding, and the gateway notes whether it validates as `ca` for that host.
        5. Manifest: `GET /.well-known/mcp-manifest` (C14) with an internal JWT of purpose `manifest`. No answer or a status other than `200` is `422`, reason `manifest_unreachable`; a body that fails
           the checks of "Manifest intake" is `422`, reason `manifest_invalid` with `manifestReason` (for example `environment_mismatch`, `policies_invalid`).
        6. `serverId` is `mcp-<system>` of the manifest. A `system` that is a reserved id (`gateway`, `offboarding`, `portal`, `broker`, `prometheus`, `platform`, `admin`,
           `registry`, `adapter`, `internal`, `ci`; the list is kept so that no server is named like a component) is `422`, reason `system_reserved`; a `serverId` that exists is `409 server_exists`; a namespace
           that another `serverId` owns by approved policies is `422`, reason `namespace_conflict`.

