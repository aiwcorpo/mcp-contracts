openapi: 3.1.0
info:
  title: MCP Gateway Admin API
  version: 7.0.0
  summary: Contract C5 of the MCP platform (catalog, registry, servers, policy data, activity, read-only confirmation preview).
  description: |
    Callers and their authentication:

    - portal BFF: mTLS (CN=mcp-portal-bff) and the user's token exchanged in the IdP for aud=mcp-gateway-admin.
      All "current user" semantics use `sub` of that token.
    - CI: mTLS with client certificate CN=mcp-registry-ci-<serverId>, one certificate per server pipeline (registry writes, CC-161).
    - offboarding (IGA/HR webhook, helpdesk): mTLS with CN=mcp-offboarding, no token (user purge, CC-155).
    - admin operations additionally require group mcp-platform-admin in the user's token.

    Tool names in this API are client-visible names `<system>__<tool>`, except under
    `/admin/v1/registry/servers/{serverId}/tools/{tool}` where `{tool}` is the server-side name from the manifest.
    Endpoints for MCP clients are `<publicBaseUrl>/mcp` (all tools of the user, CC-169) and `<publicBaseUrl>/s/<serverId>/mcp`
    (one system); both take the filter `systems`, `tools`, `access`, `exclude` in the query (CC-170, README "Jeden adres do całej platformy").
    They use a C1 token with aud=mcp-gateway and are not described here because they speak MCP, not REST. The saved links
    `/v/<slug>/mcp` no longer exist (CC-175, CC-177): the gateway answers 404 `not_found_or_denied` with no audit event.
    The portal and the gateway share one public origin behind a reverse proxy (CC-089): `/` web, `/api` BFF, `/mcp`, `/s/`
    and `/.well-known/oauth-protected-resource*` gateway (`/v/` may still be sent to the gateway for its 404). `publicBaseUrl` is configuration, never derived from the
    `Host` or `X-Forwarded-Host` of a request. The gateway answers MCP clients only with `application/json` and
    `text/event-stream` on every route, errors included and whatever `Accept` says (never `text/html`), and does
    not forward the `Cookie` header; the proxy adds `X-Content-Type-Options: nosniff` and `Content-Security-Policy:
    default-src 'none'; sandbox` to every response of these routes (README, "Jedna domena").

    **Servers and policy are runtime data (7.0.0).** The only list of servers is the registry of the gateway in its database,
    changed with `/admin/v1/servers`; no component has a built-in list of systems, servers or resource types. The policies of a
    server are its own (its manifest carries them, `policiesHash` is approved by an administrator like a tool definition);
    the gateway decides `call` with the platform policies of the contracts (`cedar/platform`) and the overrides of
    `/admin/v1/policy/overrides`; the mapping of groups to resource scopes is `/admin/v1/policy/scope-mapping`. Servers read
    all of it from `GET /internal/v1/policy-data`.

    **Policy distribution without signatures (7.0.0).** Signed bundles had two-party control (the pipeline signed, the gateway verified); policy data
    served by the gateway does not. The compensating controls are fresh MFA on the widening operations (below), the audit events of every
    change and the approval of `policiesHash`. As an operational practice, a change of the scope mapping and an approval of policies should
    be reviewed by a second person. The revision of the policy data is `max(previous + 1, current epoch milliseconds)`, so a restore of
    the database never lowers it below what servers already hold.

    **Fresh MFA (7.0.0).** The gateway itself checks the freshness of the admin token: `auth_time` not older than 300 seconds AND proof of MFA in the token: `acr` in a list of MFA levels or `amr` containing one of `mfa`, `otp`, `hwk`, `totp` (both lists are configuration of the receiver); `auth_time` alone is not enough, because a fresh password-only login passes it. A token without either proof is not fresh, and the answer is `401 step_up_required`
    (the BFF asks for the step-up first, but the gateway never relies on that). It applies to the operations that widen access or
    change where traffic goes: `approveServerPolicies`, `putScopeMapping`, `deleteOverride`, `createServer`, `deleteServer` and
    `updateServer` unless the body only sets `enabled: false` (taking a server out of service is never blocked by the check).

    A resource the caller may not see is reported as 404, the same as a missing one (security invariant 8).
    Error bodies for statuses whose body C5 does not define use the generic `Error` shape (CC-012).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://mcp-gateway.internal:8443
    description: Internal admin endpoint (TLS, mTLS required).
tags:
  - name: catalog
  - name: registry
  - name: servers
  - name: activity
  - name: confirmations
  - name: policy
  - name: admin
paths:
  /admin/v1/catalog:
    get:
      tags: [catalog]
      operationId: getCatalog
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Registered servers and tools with the current user's access computed from policy.
      description: |
        When the gateway cannot read the state of the emergency switches (CC-194) the catalog is not computed from a guess: the answer is `503 upstream_unavailable` with `Retry-After`, never a catalog that shows a switched tool as available (fail-closed, CC-224).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/KillSwitchStoreUnavailable'
        '200':
          description: Approved tools of all registered servers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
              examples:
                jira_reader:
                  value:
                    servers:
                      - serverId: mcp-jira
                        system: jira
                        version: 1.4.0
                        tools:
                          - name: jira__get_issue
                            title: Pobranie zgłoszenia
                            description: Returns one Jira issue by key.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements: [mcp-jira-read]
                          - name: jira__update_issue
                            description: Updates the summary of an issue.
                            risk: UPDATE
                            action: update
                            access: denied
                            requiredEntitlements: [mcp-jira-write]
                          - name: jira__delete_issue
                            title: Usunięcie zgłoszenia
                            description: Deletes an issue permanently.
                            risk: DESTRUCTIVE
                            action: delete
                            access: denied
                            requiredEntitlements: [mcp-jira-destructive]
                            requiresConfirmation: true
                      - serverId: mcp-gitlab
                        system: gitlab
                        version: 1.0.0
                        tools:
                          - name: gitlab__get_project
                            description: Returns one GitLab project by path.
                            risk: READ_ONLY
                            action: read
                            access: denied
                            requiredEntitlements: [mcp-gitlab-read]
                            disabled: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /admin/v1/registry/servers:
    get:
      tags: [registry]
      operationId: listRegistryServers
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Registered servers with tools and approval status (admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '200':
          description: Registry content.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistryServer'
              examples:
                jira_pending:
                  value:
                    - serverId: mcp-jira
                      system: jira
                      version: 1.4.0
                      tools:
                        - name: get_issue
                          risk: READ_ONLY
                          action: read
                          resourceRefs:
                            - argument: issueKey
                              type: Jira::Issue
                          definition:
                            name: get_issue
                            title: Get issue
                            description: Returns one Jira issue by key.
                            inputSchema:
                              type: object
                              properties:
                                issueKey:
                                  type: string
                                  description: Issue key, e.g. ABC-123
                                  pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                  maxLength: 32
                              required:
                                - issueKey
                              additionalProperties: false
                            annotations:
                              readOnlyHint: true
                          definitionHash: sha256:3b556e5421d66b7508742a96b309dc4c404075d02797d8fe5b38d76d1c870d14
                          status: approved
                          approvedInVersion: 1.3.0
                        - name: update_issue
                          risk: UPDATE
                          action: update
                          resourceRefs:
                            - argument: issueKey
                              type: Jira::Issue
                          definition:
                            name: update_issue
                            title: Update issue
                            description: Updates the summary of an issue.
                            inputSchema:
                              type: object
                              properties:
                                issueKey:
                                  type: string
                                  description: Issue key, e.g. ABC-123
                                  pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                  maxLength: 32
                                summary:
                                  type: string
                                  maxLength: 255
                              required:
                                - issueKey
                                - summary
                              additionalProperties: false
                            annotations:
                              readOnlyHint: false
                              destructiveHint: false
                          definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                          status: pending_approval
                          change: changed
                          source: ci
                          approvedInVersion: 1.3.0
                        - name: add_comment
                          risk: UPDATE
                          action: update
                          resourceRefs:
                            - argument: issueKey
                              type: Jira::Issue
                          definition:
                            name: add_comment
                            title: Add comment
                            description: Adds a comment to an issue.
                            inputSchema:
                              type: object
                              properties:
                                issueKey:
                                  type: string
                                  description: Issue key, e.g. ABC-123
                                  pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                  maxLength: 32
                                body:
                                  type: string
                                  maxLength: 4000
                              required:
                                - issueKey
                                - body
                              additionalProperties: false
                            annotations:
                              readOnlyHint: false
                              destructiveHint: false
                          definitionHash: sha256:a6d16c1679d3b58d585deb6090032a8b085d4b78a6d9b6cbf6ad7229796524c4
                          status: pending_approval
                          change: new
                          source: ci
                          approvedInVersion: null
                opensearch_disabled:
                  value:
                    - serverId: mcp-opensearch
                      system: opensearch
                      version: 1.0.0
                      enabled: false
                      tools: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/v1/registry/servers/{serverId}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    put:
      tags: [registry]
      operationId: registerServer
      x-allowed-client-cn: ['mcp-registry-ci-{serverId}']
      summary: Register or update a server manifest (CI).
      description: |
        Body is the C6 manifest (schemas/server-manifest.schema.json); `serverId` in the body must equal the path.

        **Identity of the pipeline (CC-161).** The certificate is bound to one server: its CN is `mcp-registry-ci-<serverId>`
        (for example `mcp-registry-ci-mcp-jira`) and the gateway accepts it only for a `PUT` whose path `serverId` makes the
        CN exactly `mcp-registry-ci-` followed by that `serverId`: a full, case-sensitive comparison of the whole CN (never a
        prefix or substring match), on a certificate that has one CN. Any other CN, including the former `mcp-registry-ci`, is `403` and nothing is stored; the
        gateway audits it as authentication with reason client_certificate_rejected (CC-125). A pipeline of one repository
        therefore cannot change the registry entry of another server. A per-server CN was chosen over a SAN carrying the
        serverId because the contract already authorizes by CN (`x-allowed-client-cn`), which needs no second place in
        the certificate to parse and check.

        **Origin of the body (CC-133).** The body is the manifest built from the reviewed commit (the artifact of the
        build stage, `target/mcp-manifest.json`), never one fetched from a running server, and the job that calls this
        operation runs only for the protected branch. Outside dev mode the gateway does not take a manifest from a
        server by itself and never approves one: a manifest fetched from a server (the bootstrap of the dev stack) exists
        only in dev mode (README, "Tryb produkcyjny i tryb dev").

        **What the call approves.** The review of the commit is the approval of the tools that cannot change data: a new or
        changed READ_ONLY tool is approved by this call (status approved, approvedInVersion set to the version of the
        manifest), and an entry whose definitionHash did not change stays as it is. A new or changed UPDATE or
        DESTRUCTIVE tool becomes pending_approval (change new or changed, pendingVersion = the version of the manifest, source ci) and
        is approved only by the approve operation below, by an administrator. A tool missing from the manifest is
        removed. Audit as admin_change with definitionHash: definition_registered (approved by this call),
        definition_submitted (left pending) and tool_removed. A definition that differs from the approved one without a
        deployment is handled by the gateway as described in the README ("Rejestr i przypinanie definicji") and is also
        pending_approval.

        **Rejections (422 manifest_rejected, with reason).** The gateway recomputes every definitionHash from the entry's
        definition (CC-004, CC-005) and rejects the manifest when one differs or when a semantic manifest rule of the README
        fails; a manifest with environment dev on a gateway in production mode (the default) is rejected
        (environment_mismatch, CC-138); so is a manifest whose `credential.acceptedTypes` does not contain a credential
        type that the system allows (credential_type_mismatch, CC-159: every type the broker may return for the system
        must be accepted by the server), or one that mixes service-account with user types (credential_type_mismatch, CC-168). A tool whose risk is lower than the risk floor, the highest risk ever reported
        for it, a pending entry included (CC-167), does not reject the manifest: that one tool becomes pending_approval
        (source ci, change as for any entry: new for a tool that was removed and added again, changed otherwise; riskLowered true) and stays hidden and refused as tool_disabled, and the rest of the
        manifest follows the rules above. Only an administrator can approve it, with acceptRiskLowering true on the approve
        operation (with a fresh MFA in the portal); the floor then falls to the approved risk. The 422 of this call stays
        for the other rejections listed here and for a hash that does not match. At
        start the gateway makes the same checks for the manifests it holds; a held manifest that fails them is not
        replaced: the server is reported with enabled false and its tools are refused as tool_disabled until a manifest
        that passes is registered. The binding serverId -> system/internalUrl comes only from the registry of servers (`/admin/v1/servers`), never from
        the manifest; a manifest that disagrees is rejected with 422 and nothing is stored.

        **Policies (7.0.0).** The manifest carries the policy fragment of the server (`policies`, `policiesHash`) and the
        declarations of its resource types (`resourceTypes`: id and scope patterns, parent, classification). The gateway
        validates them (the base schema `cedar/mcp.cedarschema` and the fragment compose and validate in strict mode, the
        fragment declares nothing outside its one namespace, every entity type has `scopes`, no policy mentions `Action::"call"`
        or `Tool`, the declarations match the schema) and rejects the manifest with 422 and reason `policies_invalid` or
        `resource_types_invalid`; a namespace that another `serverId` already owns is `namespace_conflict`. A namespace belongs to the first `serverId` whose policies
        are approved with it; registration only checks against approved owners and claims nothing, so a manifest that arrives first
        cannot take a namespace before an approval does. When an approval changes or frees the namespace of a server, the mapping
        entries of the freed namespace are removed and audited (`scope_mapping_entry_removed`), as `deleteServer` does. The gateway builds the union of resource types only from
        approved declarations; an exception while building the union or the scope mapping is a deny with an audit event, never a
        partial result. A server
        whose `policiesHash` differs from the approved one is `pending_approval` for its policies: its tools are blocked until
        an administrator approves them with `approveServerPolicies`; the first registration of a server needs the same
        approval. Policies are never taken from a server that is not in the registry.

        **Adapter mode (CC-206).** For a `serverId` that gateway configuration serves through an adapter this operation answers `422` (`adapter_mode_mismatch`), and so does a manifest with `source: adapter`: the manifests of an adapter come only through `submitAdapterManifest`. The certificate is checked before the mode, so this `422` is seen only by the holder of the CN of that `serverId`.
      security:
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/server-manifest.schema.json'
            examples:
              jira:
                value:
                  serverId: mcp-jira
                  version: 1.4.0
                  system: jira
                  internalUrl: https://mcp-jira.internal:8443/mcp/jira
                  credential:
                    required: true
                    acceptedTypes:
                      - user-oauth
                      - user-secret
                  resourceTypes:
                    - type: Jira::Project
                      attributes:
                        - key
                        - category
                      idPattern: ^[A-Z][A-Z0-9_]{1,9}$
                      scopePattern: ^[A-Z][A-Z0-9_]{1,9}$
                      earlyScopeCheck: true
                      classification:
                        attribute: category
                        kind: string
                        required: true
                    - type: Jira::Issue
                      attributes:
                        - key
                      parent: Jira::Project
                      parentAttribute: project
                      idPattern: ^[A-Z][A-Z0-9_]{1,9}-[1-9][0-9]{0,9}$
                  policies:
                    namespace: Jira
                    schema: |
                      namespace Jira {
                        entity Project { key: String, category: String, scopes: Set<ResourceScope> };
                        entity Issue in [Project] { key: String, project: Project, scopes: Set<ResourceScope> };
                        action "read", "update" appliesTo { principal: [User], resource: [Project, Issue], context: RequestContext };
                      }
                    files:
                      - name: read.cedar
                        text: |
                          @id("jira-read")
                          permit (principal in UserGroup::"mcp-jira-read", action == Jira::Action::"read", resource);
                  policiesHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
                  tools:
                    - name: get_issue
                      risk: READ_ONLY
                      action: read
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: get_issue
                        title: Get issue
                        description: Returns one Jira issue by key.
                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                              maxLength: 32
                          required:
                            - issueKey
                          additionalProperties: false
                        annotations:
                          readOnlyHint: true
                      definitionHash: sha256:3b556e5421d66b7508742a96b309dc4c404075d02797d8fe5b38d76d1c870d14
                    - name: update_issue
                      risk: UPDATE
                      action: update
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: update_issue
                        title: Update issue
                        description: Updates the summary of an issue.
                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                              maxLength: 32
                            summary:
                              type: string
                              maxLength: 255
                          required:
                            - issueKey
                            - summary
                          additionalProperties: false
                        annotations:
                          readOnlyHint: false
                          destructiveHint: false
                      definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
      responses:
        '200':
          description: Stored; the body shows the resulting status of every tool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryServer'
              examples:
                registered:
                  value:
                    serverId: mcp-jira
                    system: jira
                    version: 1.4.0
                    tools:
                      - name: get_issue
                        risk: READ_ONLY
                        action: read
                        resourceRefs:
                          - argument: issueKey
                            type: Jira::Issue
                        definition:
                          name: get_issue
                          title: Get issue
                          description: Returns one Jira issue by key.
                          inputSchema:
                            type: object
                            properties:
                              issueKey:
                                type: string
                                description: Issue key, e.g. ABC-123
                                pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                maxLength: 32
                            required:
                              - issueKey
                            additionalProperties: false
                          annotations:
                            readOnlyHint: true
                        definitionHash: sha256:3b556e5421d66b7508742a96b309dc4c404075d02797d8fe5b38d76d1c870d14
                        status: approved
                        approvedInVersion: 1.4.0
                      - name: update_issue
                        risk: UPDATE
                        action: update
                        resourceRefs:
                          - argument: issueKey
                            type: Jira::Issue
                        definition:
                          name: update_issue
                          title: Update issue
                          description: Updates the summary of an issue.
                          inputSchema:
                            type: object
                            properties:
                              issueKey:
                                type: string
                                description: Issue key, e.g. ABC-123
                                pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                maxLength: 32
                              summary:
                                type: string
                                maxLength: 255
                            required:
                              - issueKey
                              - summary
                            additionalProperties: false
                          annotations:
                            readOnlyHint: false
                            destructiveHint: false
                        definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                        status: pending_approval
                        change: new
                        source: ci
                        approvedInVersion: null
                registered_with_lowered_risk:
                  summary: The pipeline reported a risk below the floor for update_issue; the rest of the manifest went through
                  value:
                    serverId: mcp-jira
                    system: jira
                    version: 1.5.0
                    tools:
                      - name: update_issue
                        risk: READ_ONLY
                        action: update
                        resourceRefs:
                          - argument: issueKey
                            type: Jira::Issue
                        definition:
                          name: update_issue
                          title: Update issue
                          description: Updates the summary of an issue.
                          inputSchema:
                            type: object
                            properties:
                              issueKey:
                                type: string
                                description: Issue key, e.g. ABC-123
                                pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                maxLength: 32
                              summary:
                                type: string
                                maxLength: 255
                            required:
                              - issueKey
                              - summary
                            additionalProperties: false
                          annotations:
                            readOnlyHint: false
                            destructiveHint: false
                        definitionHash: sha256:a54246cd697847b72aebc9c8bb91e44e3f13b6ef84b5f0f868fe1eaa78d5045c
                        status: pending_approval
                        change: changed
                        source: ci
                        approvedInVersion: 1.4.0
                        riskLowered: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Manifest conflicts with gateway configuration (system, internalUrl, serverId or credential type), fails a rule, or declares environment dev on a gateway in production mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestRejected'
              examples:
                manifest_rejected:
                  value:
                    error: manifest_rejected
                    message: system does not match gateway configuration for mcp-jira
                environment_mismatch:
                  value:
                    error: manifest_rejected
                    reason: environment_mismatch
                    message: manifest of mcp-jira declares environment dev
                credential_type_mismatch:
                  value:
                    error: manifest_rejected
                    reason: credential_type_mismatch
                    message: the gateway asks the broker for token-exchange for opensearch, the manifest accepts user-secret
  /admin/v1/registry/adapters/{serverId}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    put:
      tags: [registry]
      operationId: submitAdapterManifest
      x-allowed-client-cn: ['mcp-adapter-{serverId}']
      summary: An adapter submits the manifest of its foreign server at startup (CC-206).
      description: |
        The channel of `mcp-server-adapter` (the sidecar of a foreign MCP server, CC-193). The body is the C6 manifest with `source: adapter`;
        `serverId` in the body must equal the path.

        **Identity of the adapter.** The certificate is bound to one server: its CN is `mcp-adapter-<serverId>` (for example
        `mcp-adapter-mcp-jira`), compared as a whole and case-sensitively like the CN of the pipeline (CC-161). It is a different CN from
        `mcp-registry-ci-<serverId>`, so a pipeline cannot use this operation and an adapter cannot use `registerServer`. Another CN is `403` and
        `client_certificate_rejected` in the audit. The answers come in this order (CC-207): the certificate (`403`) first, so that a caller without the right CN learns nothing about the mode of any server; then `serverId` in the body against the path (`400`); then the mode and the `source` (`422`).

        **Adapter mode is gateway configuration.** Which `serverId` is served by an adapter is set in the configuration of the gateway, never by a
        manifest. For a `serverId` in adapter mode this operation is the only way to submit a manifest and `registerServer` answers `422`,
        `manifest_rejected`, reason `adapter_mode_mismatch`; for any other `serverId` this operation answers `422` with the same reason, and so does
        a manifest without `source: adapter` sent here or with it sent to `registerServer`. Nothing is stored in these cases.

        **What the call stores.** Every new or changed tool becomes `pending_approval` (`change` new or changed, `source` adapter, `pendingVersion` the
        version of the manifest) without classification, a READ_ONLY-looking tool included: nothing of an adapter is approved by this call, and an
        unclassified tool is hidden and refused as `tool_disabled`. An entry whose `definitionHash` did not change stays as it is, with its
        classification. A tool missing from the manifest is removed (`tool_removed`) together with its classification: if it returns it is a new, unclassified tool and the administrator classifies it again (CC-207). Audit as `admin_change`: `definition_submitted` for every pending
        entry and `tool_removed`. The administrator classifies and approves with `approveTool` (`risk`, `action`).

        **Rejections.** The same checks as for `registerServer` (hash recomputed without risk and action, semantic rules, binding of serverId to
        system and internalUrl from configuration, credential types) with `422 manifest_rejected`. The environment check applies too.
