                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                              maxLength: 32
                            summary:
                              type: string
                              maxLength: 255
                          required:
                            - issueKey
                            - summary
                          additionalProperties: false
                        annotations:
                          readOnlyHint: false
                          destructiveHint: false
                      definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                    pendingEntry:
                      name: update_issue
                      risk: UPDATE
                      action: update
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
