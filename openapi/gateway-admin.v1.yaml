          description: '`If-Match` is not the ETag of the stored document; read it again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                stale:
                  value:
                    error: precondition_failed
        '422':
          description: A scope does not fit the declared resource types, or a group is listed twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeMappingRejected'
              examples:
                unknown_type:
                  value:
                    error: scope_mapping_rejected
                    reason: unknown_resource_type
                    message: Mystery::Place/x names a type that no registered server declares
        '428':
          description: '`If-Match` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                required:
                  value:
                    error: precondition_required
  /admin/v1/policy/overrides:
    get:
      tags: [policy]
      operationId: listOverrides
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Emergency overrides (admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '200':
          description: Every override, in id order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Override'
              examples:
                one:
                  value:
                    - id: override-block-drop-table
                      target: gateway
                      text: 'forbid (principal, action == Action::"call", resource is Tool) when { resource.name == "drop_table" };'
                      setBy: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
                      setAt: '2026-11-06T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/v1/policy/overrides/{id}:
    parameters:
      - $ref: '#/components/parameters/OverrideId'
    get:
      tags: [policy]
      operationId: getOverride
      x-allowed-client-cn: [mcp-portal-bff]
      summary: One emergency override (admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '200':
          description: The override.
          headers:
            ETag:
              $ref: '#/components/headers/DocumentETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Override'
              examples:
                block_drop_table:
                  value:
                    id: override-block-drop-table
                    target: gateway
                    text: 'forbid (principal, action == Action::"call", resource is Tool) when { resource.name == "drop_table" };'
                    setBy: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
                    setAt: '2026-11-06T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [policy]
      operationId: putOverride
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Create or replace an emergency override (group mcp-platform-admin).
      description: |
        An override is one `forbid` policy that an administrator adds without a deployment. It cannot grant anything: a
        `permit`, a template or more than one policy is `422 override_rejected`. The id is `override-<name>`; a policy of a
        server or of the platform may not use the prefixes `override-` and `platform-`, and two policies with the same id
        anywhere in the evaluated set are an error, never a merge. `target` says where it applies. `gateway`: the text must be
        `action == Action::"call"` on `resource is Tool`, so it cannot be a policy that blocks nothing. `serverId`: validated
        against the base schema composed with the registered fragment of that server, and it may not mention `Tool` or `call`.
        `all-servers`: validated against the fragment of every registered server (so it can use only what every server has, for
        example `context.client`), and it may not mention `Tool` or `call` either. The override id becomes the policy id; an
        `@id` in the text must be the same. A create sends `If-None-Match: *`, a replace sends `If-Match` with the `ETag` of the
        override that was edited (`412` when it changed, `428` without either); a replace needs a fresh MFA (a weaker text widens access like a delete), a create does not. The write raises the revision of the policy
        data. The audit event is `admin_change`.
      security:
        - mtls: []
          bffUserToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/IfNoneMatchStar'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
            examples:
              block_drop_table:
                value:
                  target: gateway
                  text: 'forbid (principal, action == Action::"call", resource is Tool) when { resource.name == "drop_table" };'
      responses:
        '200':
          description: Stored.
          headers:
            ETag:
              $ref: '#/components/headers/DocumentETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Override'
              examples:
                block_drop_table:
                  value:
                    id: override-block-drop-table
                    target: gateway
                    text: 'forbid (principal, action == Action::"call", resource is Tool) when { resource.name == "drop_table" };'
                    setBy: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
                    setAt: '2026-11-06T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The text is not a valid forbid-only override for its target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideRejected'
              examples:
                permit:
                  value:
                    error: override_rejected
                    reason: not_forbid
                    message: an override is forbid only
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [policy]
      operationId: deleteOverride
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Remove an emergency override (group mcp-platform-admin).
      description: '`If-Match` is the `ETag` of the override that was edited; removing a forbid widens access, so the BFF asks for a fresh MFA.'
      security:
        - mtls: []
          bffUserToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /admin/v1/registry/servers/{serverId}/policies:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      tags: [registry]
      operationId: getServerPolicies
      x-allowed-client-cn: [mcp-portal-bff]
      summary: The approved policies and resource type declarations of a server (admin).
      description: |
        What the administrator approved last (the same pair `policiesHash` covers), for example to show the declared resource types
        next to the scope mapping. Nothing approved yet is `approvedHash: null` with null policies and declarations, not `404`; `404`
        is only for a `serverId` that is not in the registry. `GET .../policies/pending` shows what waits for approval.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '200':
          description: The approved policies and declarations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedPolicies'
              examples:
                approved:
                  value:
                    approvedHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
                    approvedResourceTypes:
                      - type: Jira::Project
                        attributes: [key, category]
                        idPattern: ^[A-Z][A-Z0-9_]{1,9}$
                        scopePattern: ^[A-Z][A-Z0-9_]{1,9}$
                        earlyScopeCheck: true
                        classification:
                          attribute: category
                          kind: string
                          required: true
                    approvedPolicies:
                      namespace: Jira
                      schema: |
                        namespace Jira {
                          entity Project { key: String, category: String, scopes: Set<ResourceScope> };
                          action "read" appliesTo { principal: [User], resource: [Project], context: RequestContext };
                        }
                      files: []
                nothing_approved:
                  value:
                    approvedHash: null
                    approvedPolicies: null
                    approvedResourceTypes: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/registry/servers/{serverId}/policies/pending:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      tags: [registry]
      operationId: getPendingServerPolicies
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Policies and resource type declarations of a server waiting for approval, next to the approved ones (admin).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '200':
          description: Approved versus pending policies, for the diff the administrator reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingPolicies'
              examples:
                first_registration:
                  value:
                    approvedHash: null
                    approvedPolicies: null
                    approvedResourceTypes: null
                    pendingResourceTypes:
                      - type: Jira::Project
                        attributes: [key, category]
                        idPattern: ^[A-Z][A-Z0-9_]{1,9}$
                        scopePattern: ^[A-Z][A-Z0-9_]{1,9}$
                        earlyScopeCheck: true
                        classification:
                          attribute: category
                          kind: string
                          required: true
                      - type: Jira::Issue
                        attributes: [key]
                        parent: Jira::Project
                        parentAttribute: project
                        idPattern: ^[A-Z][A-Z0-9_]{1,9}-[1-9][0-9]{0,9}$
                    pendingHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
                    pendingVersion: 1.4.0
                    source: manifest
                    pendingPolicies:
                      namespace: Jira
                      schema: |
                        namespace Jira {
                          entity Project { key: String, category: String, scopes: Set<ResourceScope> };
                          entity Issue in [Project] { key: String, project: Project, scopes: Set<ResourceScope> };
                          action "read", "update" appliesTo { principal: [User], resource: [Project, Issue], context: RequestContext };
                        }
                      files:
                        - name: read.cedar
                          text: |
                            @id("jira-read")
                            permit (principal in UserGroup::"mcp-jira-read", action == Jira::Action::"read", resource);
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/registry/servers/{serverId}/policies/approve:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [registry]
      operationId: approveServerPolicies
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Approve the pending policies of a server (group mcp-platform-admin).
      description: |
        `policiesHash` must equal the current pending hash, otherwise 409 and nothing changes; it covers the policies and the
        resource type declarations together. The approval sets `approvedPoliciesHash` of that server in the policy data, which is
        the only thing that lets the server evaluate: the starter computes the hash of its own policies and resourceTypes and
        refuses every call (`upstream_unavailable`) when it differs from the approved one or when nothing is approved. Approval
        is allowed even when it makes existing scope mapping entries invalid (a narrower `scopePattern`, a removed type); the
        answer lists the entries that will be ignored, so the administrator sees the effect, and every one is audited when the
        gateway evaluates. The tools of the server follow their own approvals again. The BFF asks for a fresh MFA. The audit
        event is `admin_change` with reason `policies_approved`. If the approved declarations change or free a namespace, the entries of
        the scope mapping for the freed namespace are removed and audited (`scope_mapping_entry_removed`).
      security:
        - mtls: []
          bffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePoliciesRequest'
            examples:
              approve:
                value:
                  policiesHash: sha256:12573bd466924c3e35d2a79ca0c6257f4c7663c9d188510593b08dd3867220f8
      responses:
        '200':
          description: Approved; the mapping entries that the approval makes invalid and that evaluation will therefore ignore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovePoliciesResult'
              examples:
                nothing_ignored:
                  value:
                    ignoredMappingEntries: []
                narrower_pattern:
                  value:
                    ignoredMappingEntries:
                      - group: mcp-jira-proj-ABC
                        scope: Jira::Project/ABCDEFGHIJ
                        reason: invalid_scope
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: policiesHash differs from the pending hash (the policies changed again, or nothing is pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hash_mismatch:
                  value:
                    error: hash_mismatch
  /admin/v1/policy/status:
    get:
      tags: [policy]
      operationId: getPolicyStatus
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Revision of the policy data that each gateway instance serves (admin).
      security:
