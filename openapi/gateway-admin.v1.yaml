    post:
      tags: [servers]
      operationId: createServer
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Add a server to the registry (group mcp-platform-admin).
      description: |
        Adds a server without restarting any component. The server has no tools until it registers its manifest
        (`registerServer`, or the manifest the gateway fetches at start) and an administrator approves them.
        **Certificate of the server.** The name to expect is not configurable: the gateway pins the certificate of the server to the
        SAN `<serverId>.internal` and to a leaf CN equal to the `serverId`. The certificate comes from the internal CA and carries both
        the `serverAuth` and the `clientAuth` extended key usage (the server uses `clientAuth` for `GET /internal/v1/policy-data`).
        The `system` must not be a reserved id (`gateway`, `offboarding`, `portal`, `broker`, `prometheus`, `platform`, `admin`,
        `registry`, `adapter`, `internal`, `ci`): `mcp-<system>` is a certificate CN, and a server named like a component would inherit the
        authorization of that component (`422 server_rejected`, reason `system_reserved`). A namespace that another `serverId` holds cannot
        be declared by this one (`namespace_conflict`, see `registerServer`). The audit event is `admin_change`.
