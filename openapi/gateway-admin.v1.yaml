  /admin/v1/confirmations/{confirmationId}:
    parameters:
      - $ref: '#/components/parameters/ConfirmationId'
    get:
      tags: [confirmations]
      operationId: getConfirmation
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Read-only preview of a pending confirmation; owner only, valid session, no fresh MFA.
      description: |
        The preview is optional: the code from the authenticator works without opening it (CC-091). The gateway
        computes everything from its own record of the pending call, never from the client. A GET has no side effect:
        the view is recorded only by the explicit `markConfirmationViewed` call (CC-127), so that a prerender or a
        prefetch of the page cannot set it. Once the view is recorded, a different DESTRUCTIVE operation of the user does
        not supersede this one: it is refused with `confirmation_blocked` until this one is confirmed or the block ends at
        max(expiry, view + 90 s), also when its attempts ran out or it expired earlier (CC-127). When B is created after that block, the gateway first burns the current codes at the broker (`invalidateAuthenticatorCodes`, same per-user step as the creation; if it fails B is not created), because a code typed for A can stay valid for 90 s after A expired. There is no decision endpoint: a confirmation is given by typing the TOTP code in the MCP client, and
        refusing is not typing it (the call expires after 120 s).
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Tool and arguments in a fixed order; long values are truncated and marked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationView'
              examples:
                delete_issue:
                  value:
                    confirmationId: cnf_4k9Qe2LxW7tB3mZp
                    tool: jira__delete_issue
                    system: jira
                    resource:
                      type: Jira::Issue
                      id: ABC-123
                      parent: Jira::Project::ABC
                    arguments:
                      - name: issueKey
                        value: '"ABC-123"'
                        truncated: false
                    expiresAt: '2026-10-26T20:02:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Unknown, expired, superseded by a newer DESTRUCTIVE operation of the user (CC-127; only when the preview had not been opened) or not owned by the caller; one answer for all of them (invariant 8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found_or_denied:
                  value:
                    error: not_found_or_denied
  /admin/v1/confirmations/{confirmationId}/viewed:
    parameters:
      - $ref: '#/components/parameters/ConfirmationId'
    post:
      tags: [confirmations]
      operationId: markConfirmationViewed
      x-allowed-client-cn: [mcp-portal-bff]
      summary: Record that the owner has the preview of a pending confirmation open and visible (CC-127).
      description: |
        Called by the portal after the preview page is rendered and visible, never by a GET and never for a prefetch or
        prerender. Idempotent: the first call sets `previewViewedAt`, later calls change nothing. Owner only. Recording the
        view and the check that a different DESTRUCTIVE operation makes against it are atomic with each other (one
        operation per user), so a race ends with B refused (view first) or A superseded and this call answering 404 (B
        first). The view blocks other DESTRUCTIVE operations as described in `getConfirmation`.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Recorded (or it was recorded before).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Unknown, expired, superseded, not owned by the caller, or attempts exhausted when the call was never viewed (not_found_or_denied); a call that was viewed before its attempts ran out answers 204 again (idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found_or_denied:
                  value:
                    error: not_found_or_denied
        '503':
          description: The gateway cannot record the view because its state store is unavailable (fail-closed). The portal then shows that the protection "first wins after the preview" is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upstream_unavailable:
                  value:
                    error: upstream_unavailable
  /admin/v1/confirmations/{confirmationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ConfirmationId'
    post:
      tags: [confirmations]
      operationId: cancelConfirmation
      x-allowed-client-cn: [mcp-portal-bff]
      summary: The owner cancels a pending confirmation; nothing is approved (CC-128).
      description: |
        Owner only; a valid session is enough, no fresh MFA, because the call removes a pending operation and approves
        nothing. This is not a decision endpoint: a confirmation is still given only by the TOTP code typed in the MCP
        client. The gateway removes the pending call with a compare-and-delete that is ordered with the code check on the
        same record, so a code typed in parallel after the cancel does not confirm the call (the check answers
        `confirmation_cancelled`). The cancel also burns the current TOTP codes of the owner at the broker
        (`invalidateAuthenticatorCodes`, called first; if it fails the answer is `503` and nothing is cancelled), so that a
        code typed for this operation and kept by the agent cannot confirm a new one. The block of "first wins after the preview" (CC-127) ends with it. A later retry of the
        cancelled call gets the C10 error `confirmation_cancelled` (the gateway keeps a tombstone until the original TTL
        ends; no broker call, no attempt or TOTP step spent), the audit event is `confirmation` with
        `reason: cancelled_by_owner`, and the call is `cancelled` in `activity/calls`. Idempotent while the tombstone lives
        (a second cancel is `204` and does not burn the codes again: only the cancel that changes the state calls the broker); cancelling a viewed call whose attempts ran out is allowed (`204`, lifts the block); the cancel works until the call expires (`expiresAt`), after that it is `404`, although the block can last up to 90 s longer; `404 not_found_or_denied` for an unknown, expired, superseded, executed or foreign call.
      security:
        - mtls: []
          bffUserToken: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Cancelled (or cancelled before).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Unknown, expired, superseded, already executed or not owned by the caller (not_found_or_denied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found_or_denied:
                  value:
                    error: not_found_or_denied
        '503':
          description: The broker could not burn the current codes; nothing was cancelled (fail-closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upstream_unavailable:
                  value:
                    error: upstream_unavailable
  /admin/v1/users/{sub}/purge:
    post:
      tags: [admin]
      operationId: purgeUser
      x-allowed-client-cn: [mcp-offboarding]
      summary: Remove everything the gateway keeps about a user (offboarding, CC-155).
      description: |
        Caller: IGA/HR webhook with mTLS CN=mcp-offboarding, no bearer token. Idempotent. Removes the pending
        confirmations of the user and their tombstones, the MCP sessions in Redis and the cached credentials of the user
        (the saved links of 4.x no longer exist, CC-175). The activity records (`/admin/v1/activity`, `activity/calls`) are not removed: they stay
        until the end of their retention, 30 days by default, as evidence (CC-134). Audit: one admin_change event with
        reason user_purged and outcome ok for every call, also when there was nothing to remove and also for a `sub`
        the gateway does not know (the answer is `204` either way) (CC-155). The event carries the `sub` of the purged user and no counts.

        **Accepted window (decision 2026-10-29).** The gateway does not block the `sub` after a purge: a token of an MCP client
        issued before it stays valid until it expires (at most 60 minutes, C1). Within that window a calling user can still use
        a system that needs no connection of the user, such as the service account of Service Desk. Sessions of the portal are
        ended by the back-channel logout of the IdP, and a `purge` repeated after that logout is safe and recommended (a
        flow that was still open can create a connection after the first one). The full offboarding is three independent
        idempotent calls, in any order (recommended: the IdP first, so that tokens stop being renewed): the IdP or IGA
        removes the groups, the broker purges (`POST /v1/admin/users/{sub}/purge` of C4) and the gateway purges.
      security:
        - mtls: []
      parameters:
        - name: sub
          in: path
          required: true
          description: '`sub` of the user from the IdP (C1).'
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
      responses:
        '204':
          description: Everything removed, or nothing existed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Redis did not answer; nothing is guaranteed removed, repeat the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upstream_unavailable:
                  value:
                    error: upstream_unavailable
