openapi: 3.1.0
info:
  title: MCP Portal BFF API
  version: 7.0.0
  summary: Contract C12 of the MCP platform (API of the portal backend-for-frontend).
  description: |
    Used only by the portal frontend, same origin. The session is the cookie `__Host-session`
    (HttpOnly, Secure, SameSite=Lax) created by the OIDC login run by the BFF; the frontend never sees tokens.
    The frontend (Angular) is served from the same origin: portal and gateway share one public domain behind a
    reverse proxy (CC-089): `/` web, `/api` this BFF, `/mcp`, `/s/` and `/.well-known/oauth-protected-resource*`
    the gateway (`/v/` may still be sent to the gateway, which answers 404; the saved links are gone, CC-175, CC-177).
    The proxy removes the `Cookie` header on the gateway routes, never rewrites `X-Request-Id`, and
    the web application defines no route starting with `/api`, `/mcp`, `/s/`, `/v/` or `/.well-known/`. Public URLs
    in responses (`url`, `clientConfigs`) come from the `publicBaseUrl` configuration, never from the request.
    CSRF follows the Angular convention:
    the BFF sets the cookie `__Host-XSRF-TOKEN` (not HttpOnly, Secure, SameSite=Strict, Path=/, no Domain; the
    `__Host-` prefix stops sibling subdomains from planting it, CC-055) and the frontend sends its value in the
    header `X-XSRF-TOKEN` for POST, PUT and DELETE (Angular: `withXsrfConfiguration({cookieName:
    '__Host-XSRF-TOKEN', headerName: 'X-XSRF-TOKEN'})`).

    Secrets go only from the browser to the BFF (`PUT /connections/{system}/secret`); no response contains one,
    except the one-time display of the seed of the TOTP authenticator in the `201` of
    `POST /authenticator/enrollment` (CC-093), shown to the owner after a fresh MFA, `no-store`.
    Error bodies for statuses whose body C12 does not define use the generic `Error` shape (CC-012).
    Operations backed by the broker (C4) or the gateway admin API (C5) answer `503 upstream_unavailable` when
    those (or the IdP token exchange) fail; there are no partial answers (CC-050).

    Limits (CC-156, CC-255). The BFF limits per user (`sub`) the writing of a token (`PUT /connections/{system}/secret`)
    and the operations of the authenticator, so a new session or login does not reset the window; over a limit it answers `429 rate_limited` with `Retry-After` (seconds, at least
    1). The values are configuration, not contract, and no `X-RateLimit-*` header is sent.

    Correlation: the BFF creates a requestId (UUIDv7) per request (a value sent by the client is ignored) and
    sends it to the broker and gateway in `X-Request-Id`, so their audit events and the portal's share one
    requestId (CC-047). Every response of `/api/v1/*`, including redirects and errors, carries it in
    `X-Request-Id`, and `Error.requestId` repeats it; the UI shows its first 8 characters next to an error (CC-087).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin as the portal frontend.
tags:
  - name: auth
  - name: me
  - name: catalog
  - name: connections
  - name: confirmations
  - name: authenticator
  - name: access-requests
  - name: mcp-endpoint
  - name: activity
  - name: admin
paths:
  /api/v1/auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start the OIDC login (or a step-up re-authentication) run by the BFF (CC-023).
      description: |
        Redirects to the IdP (authorization code + PKCE). `state`, `nonce` and the PKCE verifier are bound to the
        browser session that started the login and checked on the IdP callback (the BFF's OIDC redirect URI,
        configuration of the BFF, not part of this API). After the callback the BFF issues a new session id
        (`__Host-session`, protection against session fixation), sets `__Host-XSRF-TOKEN` and redirects to `returnPath`
        (default `/`). With `stepUp=true` the BFF asks the IdP for a fresh MFA authentication (`max_age=0` and the
        MFA `acr_values`) and accepts the result only if `sub` equals the `sub` of the existing session; otherwise
        it ends the session. Open to anonymous callers. Answers with a redirect (302); only an invalid `returnPath` gives 400 with an `Error` JSON body.

        Result of the IdP callback (CC-051): the IdP returns to an internal endpoint of the BFF (its OIDC
        `redirect_uri`, outside this API). On success the browser goes to the validated `returnPath`. On failure it
        goes to `/?loginError=<code>` with a code from `LoginErrorCode` only: `cancelled` (user cancelled,
        `access_denied` from the IdP), `idp_error` (IdP error or failed code exchange), `session_expired` (unknown
        or expired `state`/flow), `step_up_failed` (step-up returned another `sub` or did not reach the MFA level).
        Details from the IdP never appear in the URL.

        The `redirect_uri` registered at the IdP for the BFF's own callback lies under `/api` (for example
        `<publicBaseUrl>/api/v1/auth/callback`, name agreed with the BFF; not an operation of this API) so that the
        reverse proxy routes it to the BFF (CC-089).
      security: []
      parameters:
        - name: returnPath
          in: query
          required: false
          schema:
            $ref: 'credential-broker.v1.yaml#/components/schemas/ReturnPath'
        - name: stepUp
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '302':
          description: To the IdP authorization endpoint. After the IdP callback the browser lands on returnPath or on /?loginError=<code> (x-login-error-code).
          x-login-error-code:
            $ref: '#/components/schemas/LoginErrorCode'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              required: true
              schema:
                type: string
              examples:
                keycloak:
                  value: https://keycloak.internal/realms/corp/protocol/openid-connect/auth?client_id=mcp-portal&response_type=code&scope=openid&state=st-login-1&code_challenge=Zx8-test&code_challenge_method=S256
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the BFF session (CC-023).
      description: Invalidates `__Host-session`, clears the cookies and ends the IdP session when the IdP supports it.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Logged out; the frontend navigates to its start page.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user.
      security:
        - session: []
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Identity from the OIDC login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                user:
                  value:
                    username: jkowalski
                    displayName: Jan Kowalski
                    groups: [mcp-jira-read, mcp-jira-write, mcp-jira-proj-ABC]
                    isAdmin: false
                admin:
                  value:
                    username: anowak
                    displayName: Anna Nowak
                    groups: [mcp-platform-admin, mcp-jira-read]
                    isAdmin: true
                mfa_fresh:
                  value:
                    username: jkowalski
                    displayName: Jan Kowalski
                    groups: [mcp-jira-read, mcp-jira-write, mcp-jira-proj-ABC]
                    isAdmin: false
                    mfaFreshUntil: '2026-10-27T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/catalog:
    get:
      tags: [catalog]
      operationId: getPortalCatalog
      summary: Servers with tools, the user's status per server and the actions the UI may offer.
      description: |
        Built from C5 catalog, C4 connections, C4 systems and C13 requests. Status per server
        (first matching rule wins, CC-021):

        1. no tool of the server is granted and a request for one of its requiredEntitlements is pending: `request_pending`
        2. no tool of the server is granted: `no_access`
        3. the system's default credential type is `service-account` or `token-exchange` (nothing to connect): `connected`
        4. C4 connection `connected` -> `connected`, `expiring` -> `expiring`, `expired`/`revoked`/`error`/`needs_reconnect` -> `reconnect_required`
        5. no connection: `not_connected`

        Actions per status (the BFF returns exactly these, CC-083). "Type" below is the type of the existing connection (`connection.type`) for `expiring` and `reconnect_required`, and `credential.supportedTypes` for `not_connected`:

        - `connected`: `copy_link`, `disconnect` only when `connection` is not null (+ `request_access` when some tool of
          the server is denied); a `service-account` or `token-exchange` system has no connection and no `disconnect`
        - `expiring`: `copy_link`, `add_secret` (user-secret) or `reconnect` (user-oauth), `disconnect`
        - `reconnect_required`: `reconnect` (user-oauth) or `add_secret` (user-secret), `disconnect`
        - `not_connected`: `connect_oauth` and/or `add_secret`, one per type in `credential.supportedTypes`
        - `request_pending`: `view_request`
        - `no_access`: `request_access`

        `request_access` is added to `expiring`, `reconnect_required` and `not_connected` never, whatever the denied tools (CC-110;
        vectors `catalog-actions/`).

        Two rules for requests (CC-113). `request_access` is offered only when the catalog names `requiredEntitlements` for
        a denied tool (without them there is nothing to ask for, so `no_access` then has no action). When the user has a
        pending request for an entitlement that a denied tool needs, `view_request` is returned instead of
        `request_access`, also for a server whose status is `connected`.

        `credential` and `connection` come from one consistent read of C4 (`GET /v1/systems`, `GET /v1/connections`)
        (CC-080).
      security:
        - session: []
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Catalog for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalCatalog'
              examples:
                mixed:
                  value:
                    servers:
                      - serverId: mcp-jira
                        system: jira
                        version: 1.4.0
                        url: https://mcp.aiwcorpo.pl/s/mcp-jira/mcp
                        status: connected
                        actions: [copy_link, request_access, disconnect]
                        credential:
                          supportedTypes: [user-secret, user-oauth]
                          defaultType: user-secret
                          userSecretScheme: Bearer
                          deployment: dc
                        connection:
                          system: jira
                          type: user-secret
                          status: connected
                          backendUser: jkowalski
                          verified: true
                          expiresAt: '2027-01-31T00:00:00Z'
                          connectedAt: '2026-10-01T08:00:00Z'
                          lastUsedAt: '2026-10-26T19:58:00Z'
                        tools:
                          - name: jira__get_issue
                            title: Pobranie zgłoszenia
                            description: Returns one Jira issue by key.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements: [mcp-jira-read]
                          - name: jira__delete_issue
                            description: Deletes an issue permanently.
                            risk: DESTRUCTIVE
                            action: delete
                            access: denied
                            requiredEntitlements: [mcp-jira-destructive]
                            requiresConfirmation: true
                      - serverId: mcp-gitlab
                        system: gitlab
                        version: 1.0.0
                        url: https://mcp.aiwcorpo.pl/s/mcp-gitlab/mcp
                        status: not_connected
                        actions: [connect_oauth, add_secret]
                        credential:
                          supportedTypes: [user-oauth, user-secret]
                          defaultType: user-oauth
                        connection: null
                        tools:
                          - name: gitlab__get_project
                            description: Returns one GitLab project by path.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements: [mcp-gitlab-read]
                      - serverId: mcp-confluence
                        system: confluence
                        version: 1.0.0
                        url: https://mcp.aiwcorpo.pl/s/mcp-confluence/mcp
                        status: request_pending
                        actions: [view_request]
                        credential:
                          supportedTypes: [user-oauth, user-secret]
                          defaultType: user-secret
                          userSecretScheme: Basic
                          deployment: cloud
                        connection: null
                        tools:
                          - name: confluence__get_page
                            description: Returns one Confluence page.
                            risk: READ_ONLY
                            action: read
                            access: denied
                            requiredEntitlements: [mcp-confluence-read]
                states:
                  value:
                    servers:
                      - serverId: mcp-jira
                        system: jira
                        version: 1.4.0
                        url: https://mcp.aiwcorpo.pl/s/mcp-jira/mcp
                        status: expiring
                        actions: [copy_link, add_secret, disconnect]
                        credential:
                          supportedTypes: [user-oauth, user-secret]
                          defaultType: user-secret
                        connection:
                          system: jira
                          type: user-secret
                          status: expiring
                          backendUser: jkowalski
                          verified: true
                          expiresAt: '2026-10-30T00:00:00Z'
                          connectedAt: '2026-10-01T08:00:00Z'
                          lastUsedAt: '2026-10-26T19:58:00Z'
                        tools:
                          - name: jira__get_issue
                            title: Pobranie zgłoszenia
                            description: Returns one Jira issue by key.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements: [mcp-jira-read]
                      - serverId: mcp-gitlab
                        system: gitlab
                        version: 1.0.0
                        url: https://mcp.aiwcorpo.pl/s/mcp-gitlab/mcp
                        status: reconnect_required
                        actions: [reconnect, disconnect]
                        credential:
                          supportedTypes: [user-oauth, user-secret]
                          defaultType: user-oauth
                        connection:
                          system: gitlab
                          type: user-oauth
                          status: revoked
                          backendUser: jkowalski
                          verified: true
                          expiresAt: null
                          connectedAt: '2026-09-15T08:00:00Z'
                          lastUsedAt: '2026-10-20T12:00:00Z'
                        tools:
                          - name: gitlab__get_project
                            description: Returns one GitLab project by path.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements: [mcp-gitlab-read]
                            disabled: true
                      - serverId: mcp-confluence
                        system: confluence
                        version: 1.0.0
                        url: https://mcp.aiwcorpo.pl/s/mcp-confluence/mcp
                        status: no_access
                        actions: [request_access]
                        credential:
                          supportedTypes: [user-oauth, user-secret]
                          defaultType: user-secret
                        connection: null
                        tools:
                          - name: confluence__get_page
                            description: Returns one Confluence page.
                            risk: READ_ONLY
                            action: read
                            access: denied
                            requiredEntitlements: [mcp-confluence-read]
                      - serverId: mcp-servicedesk
                        system: servicedesk
                        version: 1.0.0
                        url: https://mcp.aiwcorpo.pl/s/mcp-servicedesk/mcp
                        status: connected
                        actions: [copy_link]
                        credential:
                          supportedTypes: [service-account]
                          defaultType: service-account
                        connection: null
                        tools:
                          - name: servicedesk__get_ticket
                            description: Returns one service desk ticket.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements: [mcp-servicedesk-read]
                      - serverId: mcp-opensearch
                        system: opensearch
                        version: 1.0.0
                        url: https://mcp.aiwcorpo.pl/s/mcp-opensearch/mcp
                        status: connected
                        actions: [copy_link]
                        credential:
                          supportedTypes: [token-exchange]
                          defaultType: token-exchange
                        connection: null
                        tools:
                          - name: opensearch__search_logs
                            description: Searches log indices.
                            risk: READ_ONLY
                            action: read
                            access: granted
                            requiredEntitlements: [mcp-opensearch-read]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/connections:
    get:
      tags: [connections]
      operationId: listMyConnections
      summary: Connections of the current user (no secret values).
      security:
        - session: []
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Same items as C4 GET /v1/connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'credential-broker.v1.yaml#/components/schemas/Connection'
              examples:
                one:
                  value:
                    - system: jira
                      type: user-secret
                      status: connected
                      backendUser: jkowalski
                      verified: true
                      expiresAt: '2027-01-31T00:00:00Z'
                      connectedAt: '2026-10-01T08:00:00Z'
                      lastUsedAt: '2026-10-26T19:58:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/connections/{system}/oauth:
    parameters:
      - $ref: '#/components/parameters/System'
    post:
      tags: [connections]
      operationId: startConnectOAuth
      summary: Start connecting the account through OAuth; the browser then goes to authorizeUrl.
      description: |
        The BFF calls C4 oauth/start and keeps `flowId` in the session. `returnPath` (relative portal path) is
        where the callback redirects at the end; default `/` (CC-022).
      security:
        - session: []
          csrf: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectOAuthRequest'
            examples:
              from_catalog:
                value:
                  returnPath: /catalog
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Provider authorization URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectOAuthResponse'
              examples:
                gitlab:
                  value:
                    authorizeUrl: https://gitlab.internal/oauth/authorize?client_id=mcp-broker&response_type=code&state=st-7Q2xk9&code_challenge=Zx8-test&code_challenge_method=S256&redirect_uri=https%3A%2F%2Fmcp-portal.internal%2Fapi%2Fv1%2Foauth%2Fcallback
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/oauth/callback:
    get:
      tags: [connections]
      operationId: oauthCallback
      summary: redirect_uri registered at OAuth providers.
      description: |
        The BFF checks that the flow belongs to the current session, calls C4 oauth/complete and redirects to
        `returnPath` with `connected=<system>` appended (`?` when returnPath has no query, `&` otherwise). On
        failure it appends `connectError=<code>` the same way with a code from `ConnectErrorCode` only
        (CC-022, CC-086): `cancelled` when the provider reports `error=access_denied`, `provider_error` for any other
        `error` or a failed exchange, `flow_invalid`. A failure carries `system=<system>` next to `connectError` (CC-111). An error or `503` of the broker while completing the flow gives `connectError=provider_error` (CC-107). Provider details never appear in the URL.
        Without a valid session the browser goes to `/?loginError=session_expired` (the BFF checks the session
        itself). Never returns JSON.
      x-connect-error-code:
        $ref: '#/components/schemas/ConnectErrorCode'
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider when the user cancelled or the provider failed.
          schema:
            type: string
      responses:
        '302':
          description: Back to the portal.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              required: true
              schema:
                type: string
              examples:
                connected:
                  value: /catalog?connected=gitlab
                failed:
                  value: /catalog?connectError=flow_invalid&system=gitlab
                cancelled:
                  value: /catalog?connectError=cancelled&system=gitlab
                no_session:
                  value: /?loginError=session_expired
  /api/v1/connections/{system}/secret:
    parameters:
      - $ref: '#/components/parameters/System'
    put:
      tags: [connections]
      operationId: putMySecret
      summary: Store a PAT / API key. A valid session and the CSRF header are enough (CC-090). The response carries backendUser; the portal shows "Connected as <backendUser>" after the write and in the connections view (CC-101).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'credential-broker.v1.yaml#/components/schemas/PutSecretRequest'
            examples:
              jira_pat:
                value:
                  secret: test-only-jira-pat-0000000000000000
                  expiresAt: '2027-01-31T00:00:00Z'
              basic_pair:
                summary: A system whose userSecretScheme is Basic (login and token)
                value:
                  username: test-only-login
                  secret: test-only-token-0000000000000000
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Validated in the system and stored.
          content:
            application/json:
              schema:
                $ref: 'credential-broker.v1.yaml#/components/schemas/PutSecretResponse'
              examples:
                connected:
                  value:
                    status: connected
                    backendUser: jkowalski
                    verified: true
                    expiresAt: '2027-01-31T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Rejected by the system or belongs to another user.
          content:
            application/json:
              schema:
                $ref: 'credential-broker.v1.yaml#/components/schemas/PutSecretError'
              examples:
                secret_invalid:
                  value:
                    error: secret_invalid
        '429':
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/connections/{system}:
    parameters:
      - $ref: '#/components/parameters/System'
    delete:
      tags: [connections]
      operationId: disconnect
      summary: Disconnect the account.
      description: An unknown system gives 400 invalid_request without calling the broker (CC-054).
      security:
        - session: []
          csrf: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Disconnected.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/confirmations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../schemas/common.schema.json#/$defs/ConfirmationId'
        example: cnf_4k9Qe2LxW7tB3mZp
    get:
      tags: [confirmations]
      operationId: getMyConfirmation
      summary: Read-only preview of a pending confirmation (proxy to C5; tool, system, resource and arguments come from the gateway, never from the client); owner only, a valid session is enough.
      description: |
        Optional (CC-091): the code from the authenticator is accepted without opening this page. The page shows what
        the pending call really is, so a user who opens it sees the operation in a trusted channel and not only in the
        description given by the AI client. No buttons: the confirmation is the code typed in the client. A successful
        call has no side effect (a prefetch or prerender cannot mark the preview as viewed); the view is recorded by
        `markMyConfirmationViewed`.
      security:
        - session: []
      responses:
        '200':
          description: Tool, system, resource and arguments of the pending call.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: 'gateway-admin.v1.yaml#/components/schemas/ConfirmationView'
              examples:
                delete_issue:
                  value:
                    confirmationId: cnf_4k9Qe2LxW7tB3mZp
                    tool: jira__delete_issue
                    system: jira
                    resource:
                      type: Jira::Issue
                      id: ABC-123
                      parent: Jira::Project::ABC
                    arguments:
                      - name: issueKey
                        value: '"ABC-123"'
                        truncated: false
                    expiresAt: '2026-10-26T20:02:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/authenticator:
    get:
      tags: [authenticator]
      operationId: getMyAuthenticator
      summary: State of my authenticator registration (proxy to C4 GET /v1/authenticator); no secret.
      description: |
        `lockedUntil` is shown by the portal as "locked until HH:MM"; there is no unlock action, only the passing of
        time lifts it (CC-091). Removing the registration and registering again does not lift it either.
        `state: disabled` (CC-126) means 20 wrong codes in 24 hours switched the authenticator off: the portal shows
        a banner with the reason and the single action "Register again" (a fresh MFA, then the normal enrollment). That
        is not an unlock of the 15 minute block; the old registration is replaced.
      security:
        - session: []
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: State of the registration of the signed-in user.
          content:
            application/json:
              schema:
                $ref: 'credential-broker.v1.yaml#/components/schemas/AuthenticatorStatus'
              examples:
                active:
                  value:
                    state: active
                    registeredAt: '2026-10-27T09:00:00Z'
                    lastUsedAt: '2026-10-27T09:30:00Z'
                none:
                  value:
                    state: none
                locked:
                  value:
                    state: active
                    registeredAt: '2026-10-27T09:00:00Z'
                    lastUsedAt: '2026-10-27T09:30:00Z'
                    lockedUntil: '2026-10-27T10:00:00Z'
                disabled:
                  value:
                    state: disabled
                    registeredAt: '2026-10-27T09:00:00Z'
                    lastUsedAt: '2026-10-27T09:30:00Z'
                    disabledAt: '2026-10-28T11:00:00Z'
                    disabledReason: daily_failure_limit
        '401':
          $ref: '#/components/responses/Unauthenticated'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
    delete:
      tags: [authenticator]
      operationId: deleteMyAuthenticator
      summary: Remove my registration (proxy to C4 DELETE /v1/authenticator). Needs a fresh MFA in the IdP.
      description: |
        Without a fresh MFA the answer is `401 step_up_required` with `stepUpUrl` (`returnPath` = the registration
        page, CC-048). Idempotent. Lost phone: the user signs in with MFA, removes the registration and registers
        again; if the MFA factor is lost as well, helpdesk calls `resetUserAuthenticator` (C4, CN=mcp-offboarding).
      security:
        - session: []
          csrf: []
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Removed (or there was none).
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/authenticator/enrollment:
    post:
      tags: [authenticator]
      operationId: startMyAuthenticatorEnrollment
      summary: Start the registration (proxy to C4 POST /v1/authenticator/enrollment); shows the seed once. Needs a fresh MFA in the IdP.
      description: |
        The only response of C12 that carries a secret (`secret`, `otpauthUri`; exception to invariant 4, CC-093):
        shown once to the owner after a fresh MFA authentication, `Cache-Control: no-store`, never written to a log,
        audit event or the session (the BFF keeps only `enrollmentId` in the session). The frontend draws the QR code
        locally from `otpauthUri`, keeps the values only in component memory (no storage, URL, tab title, history),
        and clears them when the registration ends or the page is left. Valid for 10 minutes; calling it again
        replaces a pending enrollment. `409 already_registered` when a registration is active (remove it first,
        which needs a fresh MFA too); from `disabled` (CC-126) it is allowed without removing first.
      security:
        - session: []
          csrf: []
      responses:
        '201':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          description: Seed shown once; it cannot be read again.
          content:
            application/json:
              schema:
                $ref: 'credential-broker.v1.yaml#/components/schemas/AuthenticatorEnrollment'
              examples:
                started:
                  value:
                    enrollmentId: enr_8Hq2Zk5LpW9vXc3N
                    otpauthUri: otpauth://totp/MCP%20Platform:jkowalski?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ&issuer=MCP%20Platform&algorithm=SHA1&digits=6&period=30
                    secret: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
                    expiresAt: '2026-10-27T09:10:00Z'
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: A registration is already active; remove it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_registered:
                  value:
                    error: already_registered
        '429':
          headers:
            Retry-After:
              description: Seconds to wait, at least 1.
              schema:
                type: integer
                minimum: 1
              example: 600
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Too many enrollment starts (broker limit, default 10 per hour, CC-151).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  value:
                    error: rate_limited
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/authenticator/enrollment/confirm:
    post:
      tags: [authenticator]
      operationId: confirmMyAuthenticatorEnrollment
      summary: Activate the registration with the first code (proxy to C4 POST /v1/authenticator/enrollment/confirm).
      description: |
        `enrollmentId` must belong to the current session, otherwise `404 not_found_or_denied`. No fresh MFA is
        needed here: the pending enrollment was created under one. `422 invalid_code` (try again) or
        `422 enrollment_invalid` (expired, destroyed after three wrong codes; start again).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'credential-broker.v1.yaml#/components/schemas/AuthenticatorEnrollmentConfirm'
            examples:
              first_code:
                value:
                  enrollmentId: enr_8Hq2Zk5LpW9vXc3N
                  code: '705202'
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Registration active.
          content:
            application/json:
              schema:
                $ref: 'credential-broker.v1.yaml#/components/schemas/AuthenticatorStatus'
              examples:
                active:
                  value:
                    state: active
                    registeredAt: '2026-10-27T09:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Wrong code or the enrollment is no longer valid.
          content:
            application/json:
              schema:
                $ref: 'credential-broker.v1.yaml#/components/schemas/AuthenticatorEnrollmentError'
              examples:
                invalid_code:
                  value:
                    error: invalid_code
                enrollment_invalid:
                  value:
                    error: enrollment_invalid
        '429':
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/confirmations/{id}/viewed:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../schemas/common.schema.json#/$defs/ConfirmationId'
        example: cnf_4k9Qe2LxW7tB3mZp
    post:
      tags: [confirmations]
      operationId: markMyConfirmationViewed
      summary: Record that the preview is open and visible (proxy to C5 markConfirmationViewed, CC-127).
      description: |
        The web app calls it once, only after the preview is rendered and visible (`document.prerendering` is false and
        `document.visibilityState` is `visible`), never during prefetch or prerender, and the BFF rejects the call unless
        `Sec-Fetch-Site` is `same-origin` and forwards no view for a request with `Sec-Purpose: prefetch` (defence in depth; the
        protection is the check in the web app and the CSRF header). Idempotent. Owner only. After it, a different DESTRUCTIVE operation of the
        user is refused with `confirmation_blocked` instead of superseding this one (CC-127). A `404` (the call was
        superseded or expired) is the cue to show "this link is out of date".
      security:
        - session: []
          csrf: []
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Recorded (or recorded before).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/confirmations/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../schemas/common.schema.json#/$defs/ConfirmationId'
        example: cnf_4k9Qe2LxW7tB3mZp
    post:
      tags: [confirmations]
      operationId: cancelMyConfirmation
      summary: Cancel a pending confirmation from the preview ("Anuluj"; proxy to C5 cancelConfirmation, CC-128).
      description: |
        A valid session and the CSRF header are enough, no fresh MFA: the call removes a pending operation and approves
        nothing. It is not a decision endpoint (the confirmation is still only the TOTP code typed in the client). Ends the
        "first wins after the preview" block and makes the next retry of the call fail with `confirmation_cancelled`.
        The gateway also burns the owner's current TOTP codes at the broker, so a code typed for this operation and kept by
        the agent cannot confirm a new one; the user waits for the next code (30 to 60 s). `503` when that fails (nothing is
        cancelled). Idempotent; `404 not_found_or_denied` for a foreign, unknown, expired or superseded call.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Cancelled (or cancelled before).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/access-requests:
    get:
      tags: [access-requests]
      operationId: listAccessRequests
      summary: My access requests from the IGA (C13 requestsOf).
      security:
        - session: []
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Requests and their status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequest'
              examples:
                pending:
                  value:
                    - requestId: REQ-2026-0042
                      entitlement: mcp-confluence-read
                      status: pending
                      createdAt: '2026-10-25T09:00:00Z'
                      requestUrl: https://iga.internal/requests/REQ-2026-0042
                approved:
                  value:
                    - requestId: REQ-2026-0040
                      entitlement: mcp-jira-write
                      status: approved
                      createdAt: '2026-10-20T09:00:00Z'
                      decidedAt: '2026-10-21T11:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    post:
      tags: [access-requests]
      operationId: createAccessRequest
      summary: Request an entitlement (C13 request); result depends on the IGA adapter.
      description: |
        When a request for the entitlement is already pending, the BFF answers 200 with the requestId of that request
        (CC-096): the user wants to reach the request, not to read an error. An adapter without a request flow
        (`keycloak-groups`: a catalog without requests) or an unknown entitlement is `422 not_requestable`.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
            examples:
              confluence_read:
                value:
                  entitlement: mcp-confluence-read
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Either a URL of the IGA form (redirect the browser) or the id of a created request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestResult'
              examples:
                created:
                  value:
                    requestId: REQ-2026-0043
                redirect:
                  value:
                    requestUrl: https://iga.internal/catalog/request?entitlement=mcp-confluence-read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The IGA adapter has no request flow or does not know the entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_requestable:
                  value:
                    error: not_requestable
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /api/v1/access-requests/entitlements:
    get:
      tags: [access-requests]
      operationId: listRequestableEntitlements
      summary: Entitlements of a system that the user can request (C13 catalog, CC-154).
      description: |
        For a request made from a server row, where no single entitlement is obvious: the BFF returns what
        `catalog(system)` of the IGA port gives, limited to entitlements the user can order, and the UI lets the user
        choose before sending. `description` comes from the IGA and is untrusted text (shown as text, never as markup).
        An adapter without a request flow answers `422 not_requestable`.
      security:
        - session: []
      parameters:
        - name: system
          in: query
          required: true
          schema:
            $ref: '../schemas/common.schema.json#/$defs/SystemId'
          example: confluence
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Entitlements the user can request, possibly none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestableEntitlement'
              examples:
                confluence:
                  value:
                    - entitlement: mcp-confluence-read
                      description: Read access to Confluence
                    - entitlement: mcp-confluence-write
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The IGA adapter has no request flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_requestable:
                  value:
                    error: not_requestable
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /api/v1/me/mcp-endpoint:
    get:
      tags: [mcp-endpoint]
      operationId: getMcpEndpoint
      summary: Address of the aggregate MCP endpoint for a filter, with client configuration (CC-175).
      description: |
        Replaces the saved links of 4.x: nothing is stored. The wizard sends the filter chosen by the user as the query
        parameters `systems`, `tools`, `access` and `exclude` (same syntax and limits as the query of `/mcp`, CC-170). The
        BFF receives them as typed parameters of this operation, already decoded by the HTTP layer (a client that sends a comma
        as `%2C`, as the generated Angular client does, delivers `jira,gitlab`), and composes the query itself:
        `name=value` joined with `&`, nothing encoded again (CC-182, `composeQuery` in `scripts/lib/mcp-endpoint.mjs`). A
        value that still contains `%` after decoding (the client sent `%25`) is an invalid filter, as is a value with `&` or `=`.
        The BFF then normalizes the composed query once, with the rules of the gateway (`test-vectors/endpoint-filter/`), so the
        portal has a single source of the canonical address. The answer has the address `<publicBaseUrl>/mcp` plus `?` and the canonical filter
        (no `?` without a filter), ready-made client configurations built from `publicBaseUrl` (never from the request) and
        `toolCount`, the number of tools that the filter leaves visible among the tools of the catalog of the current user that
        are `granted` and not `disabled` (the BFF counts it from `GET /admin/v1/catalog` of C5, flattening `servers[].tools[]`, and no new gateway
        operation is needed). `toolCount` serves the warning about the size of the list; the `tools/list` of the gateway is the authority,
        because it also takes unavailable servers and the policy decision of the moment into account. A query parameter that is not
        one of the four, a repeated one and an invalid value are `400 invalid_request` with `reason: invalid_filter`; the answer
        reveals nothing about the user's tools. A filter naming something that does not exist or that the user cannot call is
        not an error (CC-170, invariant 8). Nothing is audited here: the filter is a convenience and not a permission.
      security:
        - session: []
      parameters:
        - name: systems
          in: query
          required: false
          description: Systems without the `mcp-` prefix, comma separated.
          schema:
            type: string
            maxLength: 512
          example: jira,gitlab
        - name: tools
          in: query
          required: false
          description: Client-visible tool names `<system>__<tool>`, comma separated.
          schema:
            type: string
            maxLength: 512
          example: jira__get_issue
        - name: access
          in: query
          required: false
          description: '`read` leaves READ_ONLY tools, `write` leaves UPDATE and DESTRUCTIVE tools; absent means both.'
          schema:
            type: string
            maxLength: 5
          example: read
        - name: exclude
          in: query
          required: false
          description: Systems or tool names to remove, comma separated; an entry with a double underscore is a tool.
          schema:
            type: string
            maxLength: 512
          example: jira__delete_issue
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Normalized address, client configurations and the number of tools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpEndpoint'
              examples:
                whole_platform:
                  value:
                    url: https://mcp.aiwcorpo.pl/mcp
                    toolCount: 41
                    clientConfigs:
                      claudeCode: claude mcp add --transport http aiwcorpo-mcp "https://mcp.aiwcorpo.pl/mcp"
                      copilot: '{"servers":{"aiwcorpo-mcp":{"type":"http","url":"https://mcp.aiwcorpo.pl/mcp"}}}'
                      codex: "[mcp_servers.aiwcorpo-mcp]\nurl = \"https://mcp.aiwcorpo.pl/mcp\"\n"
                jira_read_only:
                  value:
                    url: https://mcp.aiwcorpo.pl/mcp?systems=jira&access=read
                    filter: systems=jira&access=read
                    toolCount: 9
                    clientConfigs:
                      claudeCode: claude mcp add --transport http aiwcorpo-mcp "https://mcp.aiwcorpo.pl/mcp?systems=jira&access=read"
                      copilot: '{"servers":{"aiwcorpo-mcp":{"type":"http","url":"https://mcp.aiwcorpo.pl/mcp?systems=jira&access=read"}}}'
                      codex: "[mcp_servers.aiwcorpo-mcp]\nurl = \"https://mcp.aiwcorpo.pl/mcp?systems=jira&access=read\"\n"
        '400':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: A query parameter that is not a valid filter (invalid_filter).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidFilter'
              examples:
                invalid_filter:
                  value:
                    error: invalid_request
                    reason: invalid_filter
                    message: The filter is not valid.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /api/v1/activity:
    get:
      tags: [activity]
      operationId: listMyActivity
      summary: My recent tool calls (from gateway audit, without arguments).
      security:
        - session: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Proxy of C5 GET /admin/v1/activity.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/audit-event.schema.json'
              examples:
                recent:
                  value:
                    - ts: '2026-10-26T20:00:00.123Z'
                      requestId: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
                      component: gateway
                      componentId: mcp-gateway
                      event: tool_call
                      sub: 6f1c2a9e-4d4b-4c51-9a53-1e0f0c7d2b11
                      username: jkowalski
                      client: claude-code
                      server: mcp-jira
                      tool: get_issue
                      risk: READ_ONLY
                      decision: allow
                      outcome: ok
                      errorCode: null
                      latencyMs: 42
                      argsLength: 118
        '401':
          $ref: '#/components/responses/Unauthenticated'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/activity/calls:
    get:
      tags: [activity]
      operationId: listMyActivityCalls
      summary: My tool calls, one row per call, with filters (proxy to C5 GET /admin/v1/activity/calls; from gateway audit, without arguments).
      security:
        - session: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: from
          in: query
          required: false
          schema:
            $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        - name: to
          in: query
          required: false
          schema:
            $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        - name: result
          in: query
          required: false
          description: Result group (CC-142). The result of a row comes from the reason of the last event of the call (mapping in CC-165, scripts/lib/activity-calls.mjs). A UI must not offer request_access on the result alone, because the C10 error access_denied carries no requiredEntitlements. ok is result ok. denied covers denied_not_granted, denied_filter_scope, denied_policy, tool_disabled, step_up_required and rate_limited. error covers error and credential_required. confirmation covers every other result, that is pending, confirmed, expired, failed, superseded, blocked-by-pending and cancelled confirmations.
          schema:
            type: string
            enum: [ok, denied, error, confirmation]
        - name: q
          in: query
          required: false
          description: Case-insensitive substring of the qualified tool name or of resource.id. Never matches argument values (they are not stored).
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: cursor
          in: query
          required: false
          description: Opaque value of the X-Next-Cursor header of the previous page.
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Next-Cursor:
              required: false
              schema:
                type: string
