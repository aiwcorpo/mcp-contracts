  /api/v1/admin/registry/servers/{serverId}/tools/{tool}/approve:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/Tool'
    post:
      tags: [admin]
      operationId: approveAdminTool
      summary: Approve a pending tool definition (proxy to C5). The manual way to accept a change made outside a deployment (CC-133).
      description: |
        Plain approve is unchanged. An entry of an adapter (source adapter, CC-193) is approved together with its classification: the body then carries `risk` and `action` (required for such an entry, forbidden for any other: 422 `classification_required` or `classification_not_allowed`; an adapter is read only since 6.3.0, so `risk` other than `READ_ONLY` is also 422 `classification_not_allowed`, CC-227), and the same fresh MFA is required when the classification lowers one given earlier. With acceptRiskLowering true (an entry with riskLowered true, CC-167) the BFF requires a fresh MFA of the administrator, the same mechanism and window as the registration of the Authenticator: without it `401 step_up_required` with `stepUpUrl`. The BFF sends the field only when it is true, so that an older gateway keeps accepting the request.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'gateway-admin.v1.yaml#/components/schemas/ApproveRequest'
            examples:
              approve:
                value:
                  definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
              approve_lower_risk:
                value:
                  definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                  acceptRiskLowering: true
              approve_adapter_tool:
                value:
                  definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                  risk: UPDATE
                  action: update
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Approved.
        '401':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: No valid session, or acceptRiskLowering true without a fresh MFA (step_up_required with stepUpUrl, the return path is the admin page, CC-167).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StepUpRequired'
                  - $ref: '#/components/schemas/Error'
              examples:
                step_up_required:
                  value:
                    error: step_up_required
                    stepUpUrl: /api/v1/auth/login?stepUp=true&returnPath=/admin/registry
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The definition changed again; reload the diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hash_mismatch:
                  value:
                    error: hash_mismatch
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The pending definition lowers the risk floor and acceptRiskLowering was not given, or the definition holds a hidden character (no reason, CC-250); it is not approved (CC-133, CC-167).
          content:
            application/json:
              schema:
                $ref: 'gateway-admin.v1.yaml#/components/schemas/ManifestRejected'
              examples:
                hidden_characters:
                  value:
                    error: manifest_rejected
                    message: update_issue has a control, format or bidirectional character in its definition
                risk_lowered:
                  value:
                    error: manifest_rejected
                    reason: risk_lowered
                    message: update_issue lowers risk from UPDATE to READ_ONLY
                classification_required:
                  value:
                    error: manifest_rejected
                    reason: classification_required
                    message: update_issue comes from an adapter and needs risk and action
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
