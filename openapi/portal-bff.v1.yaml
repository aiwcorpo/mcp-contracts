                              properties:
                                issueKey:
                                  type: string
                                  description: Issue key, e.g. ABC-123
                                  pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                                  maxLength: 32
                                summary:
                                  type: string
                                  maxLength: 255
                              required:
                                - issueKey
                                - summary
                              additionalProperties: false
                            annotations:
                              readOnlyHint: false
                              destructiveHint: false
                          definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                          status: pending_approval
                opensearch_disabled:
                  value:
                    - serverId: mcp-opensearch
                      system: opensearch
                      version: 1.0.0
                      enabled: false
                      tools: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/admin/registry/servers/{serverId}/tools/{tool}/pending:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/Tool'
    get:
      tags: [admin]
      operationId: getAdminPendingTool
      summary: Pending tool change for a diff (proxy to C5).
      security:
        - session: []
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Approved vs pending entry.
          content:
            application/json:
              schema:
                $ref: 'gateway-admin.v1.yaml#/components/schemas/PendingTool'
              examples:
                new_tool:
                  value:
                    approvedEntry: null
                    pendingEntry:
                      name: update_issue
                      risk: UPDATE
                      action: update
                      resourceRefs:
                        - argument: issueKey
                          type: Jira::Issue
                      definition:
                        name: update_issue
                        title: Update issue
                        description: Updates the summary of an issue.
                        inputSchema:
                          type: object
                          properties:
                            issueKey:
                              type: string
                              description: Issue key, e.g. ABC-123
                              pattern: ^[A-Z][A-Z0-9]+-[0-9]+$
                              maxLength: 32
                            summary:
                              type: string
                              maxLength: 255
                          required:
                            - issueKey
                            - summary
                          additionalProperties: false
                        annotations:
                          readOnlyHint: false
                          destructiveHint: false
                      definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
                    pendingHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/admin/registry/servers/{serverId}/tools/{tool}/approve:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/Tool'
    post:
      tags: [admin]
      operationId: approveAdminTool
      summary: Approve a pending tool definition (proxy to C5).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'gateway-admin.v1.yaml#/components/schemas/ApproveRequest'
            examples:
              approve:
                value:
                  definitionHash: sha256:a8f67fd1227b134a398c4ffabfc32ebf9a64dbc15c4e9001b288341990e44aeb
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Approved.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The definition changed again; reload the diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hash_mismatch:
                  value:
                    error: hash_mismatch
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
components:
  headers:
    RequestId:
      description: requestId (UUIDv7) of this request, the same value as in the audit events of the BFF, broker and gateway (CC-047, CC-087). Not a secret; the UI shows its first 8 characters next to an error.
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/RequestId'
      example: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
    NoStore:
      description: Required on responses carrying the authenticator seed or the arguments of a pending call (CC-091, CC-093); intermediaries and clients must not cache them.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
      example: no-cache
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Session cookie set by the BFF after OIDC login (HttpOnly, Secure, SameSite=Lax).
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Value of the __Host-XSRF-TOKEN cookie (not HttpOnly, Secure, SameSite=Strict, Path=/, no Domain) set by the BFF (CC-055). Required for POST, PUT and DELETE.
  parameters:
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/SystemId'
      example: jira
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/ServerId'
      example: mcp-jira
    Tool:
      name: tool
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/ToolName'
      example: update_issue
  responses:
    BadRequest:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: No valid session; the frontend navigates to GET /api/v1/auth/login (CC-023).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    StepUpOrUnauthenticated:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: No valid session, or the operation needs a fresh MFA login (step_up_required with stepUpUrl, CC-010).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/StepUpRequired'
              - $ref: '#/components/schemas/Error'
          examples:
            step_up_required:
              value:
                error: step_up_required
                stepUpUrl: /api/v1/auth/login?stepUp=true&returnPath=/catalog
    CsrfInvalid:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: Missing or wrong X-XSRF-TOKEN header (must equal the XSRF-TOKEN cookie).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            csrf_invalid:
              value:
                error: csrf_invalid
    Forbidden:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: Not an admin (mcp-platform-admin), or CSRF token invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            access_denied:
              value:
                error: access_denied
    NotFound:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: Does not exist or is not visible to the user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found_or_denied:
              value:
                error: not_found_or_denied
    UpstreamUnavailable:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: "The broker, the gateway admin API or the IdP token exchange did not answer or answered with an error the BFF does not pass on (CC-050). No partial data: the catalog is either complete or 503. Upstream bodies are never forwarded."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            upstream_unavailable:
              value:
                error: upstream_unavailable
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C12 does not define.
      required: [error]
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 500
        requestId:
          $ref: '../schemas/common.schema.json#/$defs/RequestId'
      additionalProperties: false
    StepUpRequired:
      type: object
      required: [error, stepUpUrl]
      properties:
        error:
          const: step_up_required
        stepUpUrl:
          type: string
          format: uri-reference
          description: Where the browser goes to re-authenticate with max_age / acr_values; normally GET /api/v1/auth/login with stepUp=true. The returnPath inside it is a default; the frontend may replace it with any portal path that matches ReturnPath (e.g. back to the form), keeping stepUp=true (CC-048).
      additionalProperties: false
    LoginErrorCode:
      type: string
      description: Value of `loginError` in `/?loginError=<code>` after a failed login (CC-051). Closed list.
      enum: [cancelled, idp_error, session_expired, step_up_failed]
    Me:
      type: object
      required: [username, displayName, groups, isAdmin]
      properties:
        username:
          type: string
        displayName:
          type: string
        groups:
          type: array
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/GroupName'
        isAdmin:
          type: boolean
          description: Member of mcp-platform-admin.
        mfaFreshUntil:
          description: Until when the last MFA authentication counts as fresh for step-up protected operations (CC-053). Absent when MFA is not fresh or unknown. Informational only; the BFF still enforces step-up on the operations that need it (registering and removing the authenticator, CC-093; PUT secret does not, CC-090), so the frontend uses it to start step-up before showing a form that needs it.
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
      additionalProperties: false
    CatalogStatus:
      type: string
      enum: [connected, expiring, reconnect_required, not_connected, request_pending, no_access]
    CatalogAction:
      type: string
      enum: [copy_link, connect_oauth, add_secret, reconnect, request_access, view_request, disconnect]
    CatalogCredential:
      type: object
      description: Credential types of the system (C4 GET /v1/systems) (CC-080).
      required: [supportedTypes, defaultType]
      properties:
        supportedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/CredentialType'
        defaultType:
          $ref: '../schemas/common.schema.json#/$defs/CredentialType'
      additionalProperties: false
    ConnectErrorCode:
      type: string
      description: Value of `connectError` appended to returnPath after a failed OAuth connection (CC-022, CC-086). Closed list. cancelled = the user cancelled at the provider (error=access_denied).
      enum: [flow_invalid, provider_error, cancelled]
    PortalCatalogServer:
      type: object
      required: [serverId, system, version, url, status, actions, tools]
      properties:
        credential:
          $ref: '#/components/schemas/CatalogCredential'
        connection:
          description: The current user's connection to the system (C4 GET /v1/connections). null when there is none or when nothing is to be connected (service-account, token-exchange). Never contains a secret value (CC-080).
          oneOf:
            - $ref: 'credential-broker.v1.yaml#/components/schemas/Connection'
            - type: 'null'
        serverId:
          $ref: '../schemas/common.schema.json#/$defs/ServerId'
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        version:
          $ref: '../schemas/common.schema.json#/$defs/SemVer'
        url:
          type: string
          format: uri
          description: Public MCP endpoint <publicBaseUrl>/s/<serverId>/mcp, used by copy_link (CC-021, CC-089).
        status:
          $ref: '#/components/schemas/CatalogStatus'
        actions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CatalogAction'
        tools:
          type: array
          items:
            $ref: 'gateway-admin.v1.yaml#/components/schemas/CatalogTool'
      additionalProperties: false
    PortalCatalog:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/PortalCatalogServer'
      additionalProperties: false
    ConnectOAuthRequest:
      type: object
      properties:
        returnPath:
          $ref: 'credential-broker.v1.yaml#/components/schemas/ReturnPath'
      additionalProperties: false
    ConnectOAuthResponse:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string
          format: uri
      additionalProperties: false
    AccessRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    AccessRequest:
      type: object
      description: Shape of C13 AccessRequest (CC-024).
      required: [requestId, entitlement, status, createdAt]
      properties:
        requestId:
          type: string
        entitlement:
          $ref: '../schemas/common.schema.json#/$defs/GroupName'
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        createdAt:
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        requestUrl:
          type: string
          format: uri
          description: Page of the request in the IGA, when the adapter has one.
      additionalProperties: false
    AccessRequestCreate:
      type: object
      required: [entitlement]
      properties:
        entitlement:
          $ref: '../schemas/common.schema.json#/$defs/GroupName'
      additionalProperties: false
    AccessRequestResult:
      oneOf:
        - type: object
          required: [requestUrl]
          properties:
            requestUrl:
              type: string
              format: uri
          additionalProperties: false
        - type: object
          required: [requestId]
          properties:
            requestId:
              type: string
          additionalProperties: false
    ClientConfigs:
      type: object
      description: Ready-to-paste configuration for supported AI clients.
      required: [claudeCode, copilot, codex]
      properties:
        claudeCode:
          type: string
        copilot:
          type: string
        codex:
          type: string
      additionalProperties: false
    PortalVirtualServer:
      allOf:
        - $ref: '#/components/schemas/VirtualServerFields'
      type: object
      required: [clientConfigs]
      properties:
        clientConfigs:
          $ref: '#/components/schemas/ClientConfigs'
      unevaluatedProperties: false
    VirtualServerFields:
      type: object
      description: Same fields as C5 VirtualServer.
      required: [slug, displayName, tools, url]
      properties:
        slug:
          $ref: '../schemas/common.schema.json#/$defs/VirtualServerSlug'
        displayName:
          type: string
        tools:
          type: array
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/QualifiedToolName'
        resourceDefaults:
          $ref: 'gateway-admin.v1.yaml#/components/schemas/ResourceDefaults'
        url:
          type: string
          format: uri
    PortalVirtualServerCreated:
      type: object
      required: [slug, url, clientConfigs]
      properties:
        slug:
          $ref: '../schemas/common.schema.json#/$defs/VirtualServerSlug'
        url:
          type: string
          format: uri
        clientConfigs:
          $ref: '#/components/schemas/ClientConfigs'
      additionalProperties: false
