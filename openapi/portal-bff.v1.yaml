        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    put:
      tags: [admin]
      operationId: putAdminSystem
      summary: "Create or replace a system in the credential broker (proxy to C4); the client secret is write-only."
      description: |
        Same rules as C4 `putAdminSystem`: every URL is https; `atlassian-dc` needs `product`; `token-exchange` needs `exchangeAudience` and takes no
        `oauth.tokenUrl`; the client secret must be given again when `baseUrl`, `authorizeUrl`, `tokenUrl`, `clientId` or `revokeUrl` changes. A change of
        any of those five invalidates every user connection of the system without sending anything to any endpoint (status `needs_reconnect`,
        shown as `reconnect_required` in the catalog). A create sends `If-None-Match: *`, a replace `If-Match`. A fresh MFA is required.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/IfNoneMatchStar'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'credential-broker.v1.yaml#/components/schemas/SystemAdminRequest'
            examples:
                notes:
                  value:
                      baseUrl: https://notes.internal/api
                      adapter: generic-rest
                      supportedTypes: [user-secret]
                      defaultType: user-secret
                      secretScheme: Bearer
                      whoami:
                        path: /api/me
                        usernameField: username
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/DocumentETag'
          description: Stored; the body is the configuration without secrets.
          content:
            application/json:
              schema:
                $ref: 'credential-broker.v1.yaml#/components/schemas/SystemAdminView'
              examples:
                notes:
                  value:
                      system: notes
                      displayName: Notes
                      baseUrl: https://notes.internal/api
                      adapter: generic-rest
                      supportedTypes: [user-secret]
                      defaultType: user-secret
                      secretScheme: Bearer
                      whoami:
                        path: /api/me
                        usernameField: username
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Rejected; the body says why.
          content:
            application/json:
              schema:
                $ref: 'credential-broker.v1.yaml#/components/schemas/SystemRejected'
              examples:
                default_type:
                  value:
                      error: system_rejected
                      reason: default_type_not_supported
                      message: defaultType must be one of supportedTypes
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
    delete:
      tags: [admin]
      operationId: deleteAdminSystem
      summary: "Remove a system from the credential broker (proxy to C4), with its connections."
      description: |
        Needs `If-Match` (the ETag of the system that was edited) and a fresh MFA (`auth_time` within 300 s and `acr` or `amr` proving MFA; `step_up_required` otherwise); the broker checks the MFA
        freshness of the token itself as well. Deleting an id that has no system is `204` and deletes no secret. Nothing is sent to
        the backend.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/admin/kill-switches:
    get:
      tags: [admin]
      operationId: listAdminKillSwitches
      summary: Active emergency switches of servers and tools (proxy to C5, group mcp-platform-admin, CC-194).
      security:
        - session: []
      responses:
        '200':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The active switches, oldest first.
          content:
            application/json:
              schema:
                $ref: 'gateway-admin.v1.yaml#/components/schemas/KillSwitchList'
              examples:
                one_switch:
                  value:
                    switches:
                      - scope: tool
                        serverId: mcp-jira
                        tool: update_issue
                        setBy: 3c1d6b7e-5a43-4f49-9d4f-0a7b1a1f2c11
                        setAt: '2026-11-03T09:12:44Z'
                        reason: Issue updates corrupt the workflow
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/admin/registry/servers/{serverId}/kill-switch:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    put:
      tags: [admin]
      operationId: putAdminServerKillSwitch
      summary: Switch off every tool of a server (proxy to C5, CC-194).
      description: |
        Emergency switch (A9): no fresh MFA is required, an incident must not wait for a second factor. Takes effect on every gateway
        instance within 5 seconds of the `204`. Lifted only by the `DELETE` below.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'gateway-admin.v1.yaml#/components/schemas/KillSwitchRequest'
            examples:
              incident:
                value:
                  reason: Vendor incident
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The switch is on.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
    delete:
      tags: [admin]
      operationId: deleteAdminServerKillSwitch
      summary: Lift the switch of a server (proxy to C5, CC-194).
      description: |
        Needs a fresh MFA of the administrator (the mechanism and window of the registration of the Authenticator): without it
        `401 step_up_required` with `stepUpUrl`, the return path is the admin page. Idempotent.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The switch is off.
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /api/v1/admin/registry/servers/{serverId}/tools/{tool}/kill-switch:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/Tool'
    put:
      tags: [admin]
      operationId: putAdminToolKillSwitch
      summary: Switch off one tool (proxy to C5, CC-194).
      description: Same rules as for a server, no fresh MFA, effective within 5 seconds, lifted only by the DELETE.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'gateway-admin.v1.yaml#/components/schemas/KillSwitchRequest'
            examples:
              incident:
                value:
                  reason: Issue updates corrupt the workflow
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The switch is on.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
    delete:
      tags: [admin]
      operationId: deleteAdminToolKillSwitch
      summary: Lift the switch of a tool (proxy to C5, CC-194).
      description: Needs a fresh MFA of the administrator like the lift of a server switch. Idempotent. A switch of the whole server stays on.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The switch is off.
        '401':
          $ref: '#/components/responses/StepUpOrUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
components:
  headers:
    DocumentETag:
      description: Version of the document (quoted opaque token); the next write sends it in If-Match.
      required: true
      schema:
        type: string
        pattern: '^"[A-Za-z0-9_-]{8,128}"$'
      example: '"Zx8Tq2LmWk93vNpA"'
    RequestId:
      description: requestId (UUIDv7) of this request, the same value as in the audit events of the BFF, broker and gateway (CC-047, CC-087). Not a secret; the UI shows its first 8 characters next to an error.
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/RequestId'
      example: 0192d1b2-7c3a-7d4e-8f10-2a3b4c5d6e7f
    NoStore:
      description: Required on responses carrying the authenticator seed or the arguments of a pending call (CC-091, CC-093); intermediaries and clients must not cache them.
      required: true
      schema:
        type: string
        const: no-store
      example: no-store
    PragmaNoCache:
      description: For HTTP/1.0 intermediaries.
      required: false
      schema:
        type: string
        const: no-cache
      example: no-cache
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Session cookie set by the BFF after OIDC login (HttpOnly, Secure, SameSite=Lax).
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Value of the __Host-XSRF-TOKEN cookie (not HttpOnly, Secure, SameSite=Strict, Path=/, no Domain) set by the BFF (CC-055). Required for POST, PUT and DELETE.
  parameters:
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: The ETag of the resource the change is based on; needed to replace, not to create.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9_-]{8,128}"$'
      example: '"Zx8Tq2LmWk93vNpA"'
    IfNoneMatchStar:
      name: If-None-Match
      in: header
      required: false
      description: '`*` to create; the call fails when the resource exists.'
      schema:
        type: string
        const: '*'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the document the change is based on.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9_-]{8,128}"$'
      example: '"Zx8Tq2LmWk93vNpA"'
    OverrideId:
      name: id
      in: path
      required: true
      schema:
        $ref: 'gateway-admin.v1.yaml#/components/schemas/OverrideId'
      example: override-block-drop-table
    System:
      name: system
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/SystemId'
      example: jira
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/ServerId'
      example: mcp-jira
    Tool:
      name: tool
      in: path
      required: true
      schema:
        $ref: '../schemas/common.schema.json#/$defs/ToolName'
      example: update_issue
  responses:
    PreconditionFailed:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: The resource changed since the ETag; read it again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stale:
              value:
                error: precondition_failed
    PreconditionRequired:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: '`If-Match` (or `If-None-Match: *` to create) is missing.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            required:
              value:
                error: precondition_required
    BadRequest:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              value:
                error: invalid_request
    Unauthenticated:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: No valid session; the frontend navigates to GET /api/v1/auth/login (CC-023).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                error: unauthenticated
    StepUpOrUnauthenticated:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: No valid session, or the operation needs a fresh MFA login (step_up_required with stepUpUrl, CC-010).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/StepUpRequired'
              - $ref: '#/components/schemas/Error'
          examples:
            step_up_required:
              value:
                error: step_up_required
                stepUpUrl: /api/v1/auth/login?stepUp=true&returnPath=/catalog
    CsrfInvalid:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: Missing or wrong X-XSRF-TOKEN header (must equal the XSRF-TOKEN cookie).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            csrf_invalid:
              value:
                error: csrf_invalid
    Forbidden:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: Not an admin (mcp-platform-admin), or CSRF token invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            access_denied:
              value:
                error: access_denied
    NotFound:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: Does not exist or is not visible to the user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found_or_denied:
              value:
                error: not_found_or_denied
    TooManyRequests:
      headers:
        Retry-After:
          description: Seconds to wait, at least 1.
          schema:
            type: integer
            minimum: 1
          example: 60
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: A limit of the BFF was exceeded (CC-156). Retry-After says how long to wait; no header names a limit or a setting.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rate_limited:
              value:
                error: rate_limited
    UpstreamUnavailable:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      description: "The broker, the gateway admin API, the IGA or the IdP token exchange did not answer or answered with an error the BFF does not pass on (CC-050). No partial data: the catalog is either complete or 503. Upstream bodies are never forwarded."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            upstream_unavailable:
              value:
                error: upstream_unavailable
  schemas:
    Error:
      type: object
      description: Generic error body for statuses whose body C12 does not define.
      required: [error]
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 500
        requestId:
          $ref: '../schemas/common.schema.json#/$defs/RequestId'
      additionalProperties: false
    StepUpRequired:
      type: object
      required: [error, stepUpUrl]
      properties:
        error:
          const: step_up_required
        stepUpUrl:
          type: string
          format: uri-reference
          description: Where the browser goes to re-authenticate with max_age / acr_values; normally GET /api/v1/auth/login with stepUp=true. The returnPath inside it is a default; the frontend may replace it with any portal path that matches ReturnPath (e.g. back to the form), keeping stepUp=true (CC-048).
      additionalProperties: false
    LoginErrorCode:
      type: string
      description: Value of `loginError` in `/?loginError=<code>` after a failed login (CC-051). Closed list.
      enum: [cancelled, idp_error, session_expired, step_up_failed]
    Me:
      type: object
      required: [username, displayName, groups, isAdmin]
      properties:
        username:
          type: string
        displayName:
          type: string
        groups:
          type: array
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/GroupName'
        isAdmin:
          type: boolean
          description: Member of mcp-platform-admin.
        mfaFreshUntil:
          description: Until when the last MFA authentication counts as fresh for step-up protected operations (CC-053). Absent when MFA is not fresh or unknown. Informational only; the BFF still enforces step-up on the operations that need it (registering and removing the authenticator, CC-093; PUT secret does not, CC-090), so the frontend uses it to start step-up before showing a form that needs it.
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
      additionalProperties: false
    CatalogStatus:
      type: string
      enum: [connected, expiring, reconnect_required, not_connected, request_pending, no_access]
    CatalogAction:
      type: string
      enum: [copy_link, connect_oauth, add_secret, reconnect, request_access, view_request, disconnect]
    CatalogCredential:
      type: object
      description: Credential types of the system (C4 GET /v1/systems) (CC-080).
      required: [supportedTypes, defaultType]
      properties:
        supportedTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../schemas/common.schema.json#/$defs/CredentialType'
        defaultType:
          $ref: '../schemas/common.schema.json#/$defs/CredentialType'
        userSecretScheme:
          description: Scheme of `user-secret` for the system (C4 `SystemInfo.userSecretScheme`, CC-222). `Basic`, the form of `add_secret` has the field of the login (`username`) next to the secret; `Bearer` or absent, one token (the contract before 6.3.1 had only this).
          type: string
          enum: [Bearer, Basic]
        deployment:
          description: Kind of installation (C4 `SystemInfo.deployment`, CC-222), information only; it does not decide about the field of the login.
          type: string
          enum: [dc, cloud]
        displayName:
          description: Name of the system for user pages (C4 `SystemInfo.displayName`, CC-243); absent means the portal shows the system id.
          $ref: 'credential-broker.v1.yaml#/components/schemas/SystemDisplayName'
        userSecretVerified:
          description: Whether a user secret of the system is checked with a whoami when it is stored (C4 `SystemInfo.userSecretVerified`, CC-247). False means the secret is stored unverified and the connection will have `verified` false, so the portal warns before the first token; absent means the broker does not tell (treated as verified).
          type: boolean
      additionalProperties: false
    ConnectErrorCode:
      type: string
      description: Value of `connectError` appended to returnPath after a failed OAuth connection (CC-022, CC-086). Closed list. cancelled = the user cancelled at the provider (error=access_denied).
      enum: [flow_invalid, provider_error, cancelled]
    PortalCatalogServer:
      type: object
      required: [serverId, system, version, url, status, actions, tools]
      properties:
        credential:
          $ref: '#/components/schemas/CatalogCredential'
        connection:
          description: The current user's connection to the system (C4 GET /v1/connections). null when there is none or when nothing is to be connected (service-account, token-exchange). Never contains a secret value (CC-080).
          oneOf:
            - $ref: 'credential-broker.v1.yaml#/components/schemas/Connection'
            - type: 'null'
        serverId:
          $ref: '../schemas/common.schema.json#/$defs/ServerId'
        system:
          $ref: '../schemas/common.schema.json#/$defs/SystemId'
        version:
          $ref: '../schemas/common.schema.json#/$defs/SemVer'
        url:
          type: string
          format: uri
          description: Public MCP endpoint <publicBaseUrl>/s/<serverId>/mcp, used by copy_link (CC-021, CC-089).
        status:
          $ref: '#/components/schemas/CatalogStatus'
        actions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CatalogAction'
        tools:
          type: array
          items:
            $ref: 'gateway-admin.v1.yaml#/components/schemas/CatalogTool'
      additionalProperties: false
    PortalCatalog:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/PortalCatalogServer'
      additionalProperties: false
    ConnectOAuthRequest:
      type: object
      properties:
        returnPath:
          $ref: 'credential-broker.v1.yaml#/components/schemas/ReturnPath'
      additionalProperties: false
    ConnectOAuthResponse:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string
          format: uri
      additionalProperties: false
    AccessRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    AccessRequest:
      type: object
      description: Shape of C13 AccessRequest (CC-024).
      required: [requestId, entitlement, status, createdAt]
      properties:
        requestId:
          type: string
        entitlement:
          $ref: '../schemas/common.schema.json#/$defs/GroupName'
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        createdAt:
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        decidedAt:
          description: When the IGA decided the request (approved or rejected). Absent while the request is pending (CC-154).
          $ref: '../schemas/common.schema.json#/$defs/Timestamp'
        requestUrl:
          type: string
          format: uri
          description: Page of the request in the IGA, when the adapter has one.
      additionalProperties: false
    RequestableEntitlement:
      type: object
      required: [entitlement]
      properties:
        entitlement:
          $ref: '../schemas/common.schema.json#/$defs/GroupName'
        description:
          type: string
          maxLength: 500
          description: Text of the IGA catalog, untrusted.
      additionalProperties: false
    AccessRequestCreate:
      type: object
      required: [entitlement]
      properties:
        entitlement:
          $ref: '../schemas/common.schema.json#/$defs/GroupName'
      additionalProperties: false
    AccessRequestResult:
      oneOf:
        - type: object
          required: [requestUrl]
          properties:
            requestUrl:
              type: string
              format: uri
          additionalProperties: false
        - type: object
          required: [requestId]
          properties:
            requestId:
              type: string
          additionalProperties: false
    ClientConfigs:
      type: object
      description: Ready-to-paste configuration for supported AI clients.
      required: [claudeCode, copilot, codex]
      properties:
        claudeCode:
          type: string
        copilot:
          type: string
        codex:
          type: string
      additionalProperties: false
    McpEndpoint:
      type: object
      description: Result of getMcpEndpoint (CC-175).
      required: [url, toolCount, clientConfigs]
      properties:
        url:
          type: string
          format: uri
          description: '`<publicBaseUrl>/mcp` and, when there is a filter, `?` and its canonical form.'
        filter:
          description: Canonical filter (CC-170); absent when no filter was given.
          $ref: '../schemas/common.schema.json#/$defs/EndpointFilterQuery'
        toolCount:
          type: integer
          minimum: 0
          description: Tools of the user's catalog (granted, not disabled) that the filter leaves visible; an estimate, the tools/list of the gateway is the authority.
        clientConfigs:
          $ref: '#/components/schemas/ClientConfigs'
      additionalProperties: false
    InvalidFilter:
      type: object
      description: 400 of getMcpEndpoint for a filter that does not parse (same error and reason as the gateway, CC-170).
      required: [error, reason]
      properties:
        error:
          const: invalid_request
        reason:
          const: invalid_filter
        message:
          type: string
          maxLength: 500
        requestId:
          $ref: '../schemas/common.schema.json#/$defs/RequestId'
      additionalProperties: false
