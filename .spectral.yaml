extends:
  - spectral:oas
functionsDir: spectral-functions
functions:
  - mtlsClientCn
  - cnTemplateParameter
rules:
  # Every operation must state who may call it; an operation without security would be anonymous.
  operation-security-required:
    description: Every operation declares security requirements.
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: security
      function: truthy
  mtls-allowed-client-cn:
    description: Operations secured with mTLS list the allowed client certificate CNs and answer 403 to others.
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      function: mtlsClientCn
  mtls-cn-template-server-id:
    description: A CN template with {serverId} needs a serverId path parameter.
    severity: error
    given: $.paths[*]
    then:
      function: cnTemplateParameter
  operation-operationId: error
  operation-tags: error
  operation-description: off
  # Ownership is described in README; there is no team mailbox to put here.
  info-contact: off
  # Examples drive the generated mocks, so a broken example is a broken mock. Spectral compiles patterns without the
  # Unicode flag, so the \p{...} classes of the audit fields (3.0.2) would be read as literals; test/openapi-examples.test.mjs
  # validates every example with ajv in Unicode mode (the mode of JSON Schema 2020-12) and is the check for examples.
  oas3-valid-media-example: off
  oas3-valid-schema-example: off
