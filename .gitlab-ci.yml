# Same checks as scripts/verify-all.sh. Images are pinned to the versions used locally.
stages:
  - verify
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

node:
  stage: verify
  image: node:24.18.0-bookworm
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

java:
  stage: verify
  image: maven:3.9.12-eclipse-temurin-25
  cache:
    key: maven
    paths: [.m2/repository]
  script:
    - ./mvnw -B verify
  artifacts:
    when: always
    reports:
      junit: java/*/target/surefire-reports/TEST-*.xml

wiremock-smoke:
  stage: verify
  image: docker:28.3.2
  services:
    - docker:28.3.2-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apk add --no-cache bash curl
  script:
    # Ports published by the dind service are reachable through its host name.
    - sed -i 's#http://localhost#http://docker#g' scripts/smoke-wiremock.sh
    - ./scripts/smoke-wiremock.sh

package-jar:
  stage: package
  image: maven:3.9.12-eclipse-temurin-25
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - ./mvnw -B package -DskipTests
  artifacts:
    paths:
      - java/*/target/*.jar

package-npm:
  stage: package
  image: node:24.18.0-bookworm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - npm ci
    - npm run pack
  artifacts:
    paths:
      - release/*.tgz
